kind: size
source: bestiary
entities:
  - name: Small
    fields:
      DESCRIPTION: A small monster is less than a meter tall and cannot block any area. It can easily pass through tiny passages.
  - name: Normal
    fields:
      DESCRIPTION: A normal-sized monster is roughly the size of a human. It can block an area of 2×2 meters (one square on a combat map) and pass through a passage half a meter wide.
  - name: Large
    fields:
      DESCRIPTION: A large monster can block an area of 4×4 meters and pass through a 1-meter-wide passage.
  - name: Huge
    fields:
      DESCRIPTION: A huge monster can block an area of 8×8 meters and pass through a 2-meter-wide passage.
  - name: Swarm
    fields:
      DESCRIPTION: A swarm can range in size from Normal to Huge, but never blocks the area it is in, and can pass through tiny passages.
