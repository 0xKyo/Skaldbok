    - id: sizes-table
      source: bestiary
      name: Sizes
      columns:
        - SIZE
        - DESCRIPTION
      rows:
        - cells:
            - Small
            - A small monster is less than a meter tall and cannot block any area. It can easily pass through tiny passages.
        - cells:
            - Normal
            - A normal-sized monster is roughly the size of a human. It can block an area of 2×2 meters (one square on a combat map) and pass through a passage half a meter wide.
        - cells:
            - Large
            - A large monster can block an area of 4×4 meters and pass through a 1-meter-wide passage.
        - cells:
            - Huge
            - A huge monster can block an area of 8×8 meters and pass through a 2-meter-wide passage.
        - cells:
            - Swarm
            - A swarm can range in size from Normal to Huge, but never blocks the area it is in, and can pass through tiny passages.
