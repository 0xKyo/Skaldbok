"The first time, Windows may ask whether to let \"skaldbok_web\" use the network: allow it on private networks so phones on your Wi-Fi can connect. The players' links, and the rest, are on the web page (Open as GM).": "La primera vez, Windows puede preguntar si deja que \"skaldbok_web\" use la red: permitilo en redes privadas para que los celulares de tu Wi-Fi se puedan conectar. Los links de los jugadores, y lo demás, están en la página web (Abrir como DJ)."
