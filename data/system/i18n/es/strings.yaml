"Could not start the web server: {0}": "No se pudo iniciar el servidor web: {0}"
"A content pack is a folder (or a .zip of one) with a manifest.json and one JSON file per type: creatures, spells, abilities, skills, kin, professions, weapons, armor, gear, tables. The Core pack holds the books' content; homebrew packs add to it and keep their own source (\"Homebrew · name\"). See docs/HOMEBREW.md for the format and docs/examples/frostmarch-tales for a sample.": "Un pack de contenido es una carpeta (o un .zip de una) con un manifest.json y un archivo por tipo: criaturas, hechizos, capacidades, habilidades, razas, profesiones, armas, armaduras, equipo, tablas. El pack Core tiene el contenido de los libros; los packs de homebrew se le suman y mantienen su propia fuente (\"Homebrew · nombre\"). Mirá docs/HOMEBREW.md para el formato (y para traducir un pack) y docs/examples/frostmarch-tales para un ejemplo."
