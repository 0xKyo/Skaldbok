format: 1
rules:
  - id: character-creation
    name: Character Creation
    nav: Reference
    web_hide: true
    sections:
      - name: Intro
        body: |
          The adventurer you play in Dragonbane is called your {{key: player character}}. To create one, take a character sheet (photocopy the one at the end of the book, or download it from the Dragonbane website) and a pencil, and follow these thirteen steps in order:
          1. Choose or roll your kin.
          2. Choose or roll your profession.
          3. Choose or roll your age.
          4. Choose or roll your name.
          5. Roll your [[attributes|attribute]].
          6. Calculate your derived ratings.
          7. Choose your trained skills.
          8. Note your [[heroic ability]].
          9. Choose or roll your weakness (optional).
          10. Choose or roll your gear.
          11. Choose or roll your memento (optional).
          12. Choose or roll your appearance.
          The boxed Core Set also has five pre-generated characters with filled-in sheets, to start right away or as inspiration. Each step below says what to do and where its choices come from (see the links at the end of each one). [[Encumbrance]] and Experience come after the steps: how much a character carries and how it grows.
    source: rulebook
    see:
      - kin
      - professions
      - skills
      - abilities
      - spells
      - weapons
      - armor
      - gear
    children:
      - id: creation-kin
        step: "1"
        name: Kin
        body: |
          Choose your kin, or roll a D12 on the table below. There are six playable kin: human, halfling, dwarf, elf, mallard and wolfkin. Humans are the most common, but you are free to choose any of them.
          Your kin decides three things: your innate ability, the base of your Movement rating (step 6) and the list of six typical names you can pick your name from (step 4). Each kin is described in the Kin entries, whose cards also hold its table of six first names (open the card).
          Each kin has an innate ability that no other kin can learn (mallards have two). Write it down in the Abilities & Spells section of your character sheet. Using an innate ability usually costs [[Willpower Points|wp]] (WP).
          All [[player characters|player character]] can speak, read and write a common language, which for simplicity's sake is called the common tongue. Most creatures the player characters meet know it, but there may be exceptions. Non-human kin often have their own languages that few humans understand. To understand other languages, the Languages skill is used.
          {{table: Kin}}
        see:
          - kin
          - abilities
          - core/skill/languages
      - id: creation-profession
        step: "2"
        name: Profession
        body: |
          Choose your profession, or roll a D10 on the table below. There are ten professions: artisan, bard, fighter, hunter, knight, mage, mariner, merchant, scholar and thief. All [[player characters|player character]] are adventurers, but you learned a thing or two before the game begins.
          Your profession decides: six of your trained skills, which must be chosen from the list of the profession (step 7); the gear you can start with (step 10); your [[heroic ability]] (step 8, mages get magic instead); and it offers typical nicknames (step 4).
          {{table: Profession}}
        see:
          - professions
          - skills
          - abilities
      - id: creation-age
        step: "3"
        name: Age
        body: |
          Choose your age (young, adult or old), or roll a D6: 1–3 young, 4–5 adult, 6 old. Older age means lower [[attributes|attribute]] but more skills. Your age in years depends on your kin and has no mechanical significance.
          Age changes two things: how many trained skills of your own choice you get in step 8 (two, four or six, on top of the six from your profession) and how your attributes are adjusted once you have rolled them in step 6. The adjustments do not stack, and no attribute can go above 18.
          {{table: Effects of Age}}
        see:
          - skills
        young_trained_skills: 6
        young_bonus_skills: 2
        young_attribute_mods:
          AGL: 1
          CON: 1
        adult_trained_skills: 6
        adult_bonus_skills: 4
        old_trained_skills: 6
        old_bonus_skills: 6
        old_attribute_mods:
          STR: -2
          AGL: -2
          CON: -2
          INT: 1
          WIL: 1
      - id: creation-name
        step: "4"
        name: Name and Nickname
        body: |
          Once you have chosen your kin and profession it is time to name your adventurer. Each kin has a list of six typical names: choose or roll (D6) one of them, or make up your own.
          Nickname (optional): a common custom for adventurers, often one that says something about your appearance, personality or personal history. You can choose it now or add one later. A number of typical nicknames are listed by your profession.
        see:
          - kin
          - professions
      - id: creation-attributes
        step: "5"
        name: Attributes
        body: |
          Your adventurer has six attributes that measure their basic physical and mental capabilities, on a scale from 3 to 18 (the higher, the better): Strength (STR), Constitution (CON), Agility (AGL), Intelligence (INT), Willpower (WIL) and Charisma (CHA).
          Roll 4D6 and remove the lowest die: that is a score between 3 and 18. Assign it to the attribute of your choice. Repeat five more times, assigning each score as you roll it, until every attribute has one. When you are done you may swap two scores. Then adjust your attributes for your age (step 3); you can never have more than 18 in an attribute. Once assigned, attributes rarely change during the game.
          Any other method works if everyone in the group agrees.
          {{table: Attributes}}
        sections:
          - name: Starting Scores
            body: "Roll 4D6 and remove the worst die, which gives you a score between 3 and 18. Assign that score to an {{key: attribute}} of your choice. Repeat this process five more times until you have assigned a score to each attribute. You must assign each score as you roll them, but once done you may swap two scores. Then you adjust your attributes based on your age. Note that you can never have more than 18 in an attribute, regardless of your age. Once assigned, your attributes rarely change during the game."
          - name: Other Methods
            body: There are many other ways to determine the [[player characters|player character]]’ attributes, such as rolling for all of them and then distributing the results afterwards or adding up the rolls into a big pool and distributing the points freely. As long as you all agree in the group, you can use any method you prefer
          - name: Abbreviations
            body: |
              - [[HP]] = Hit Points
              - [[WP]] = Willpower Points
              - GM = Gamemaster
              - [[NPC]] = Non-Player Character
      - id: creation-derived-ratings
        step: "6"
        name: Derived Ratings
        body: |
          Calculate these from your [[attributes|attribute]] and your kin:
          Movement: the meters you can run in a round of combat. It starts from your kin (human 10, halfling 8, dwarf 8, elf 10, mallard 8, wolfkin 12) and is modified by your AGL (1–6: −4, 7–9: −2, 10–12: none, 13–15: +2, 16–18: +4).
          [[Damage bonus|Derived Ratings]]: you have two, one for STR-based weapons and one for AGL-based weapons (12 or less: none, 13–16: +D4, 17 or more: +D6).
          Hit Points (HP): your maximum equals your CON (the [[heroic ability]] Robust can raise it).
          Willpower Points (WP): your maximum equals your WIL (the heroic ability Focused can raise it).
          {{table: Movement}}
          {{table: Movement modifier}}
          {{table: Damage Bonus}}
        see:
          - kin
          - abilities
        sections:
          - name: Hit Points (HP)
            body: "This rating determines how much damage you can take. Your maximum number of {{key: HP}} is equal to your CON, but can be increased by the heroic ability Robust. For more information about damage, see chapter 4."
          - name: Willpower Points (WP)
            body: "{{key: Willpower Points | wp}} are used for magic, as well as innate and heroic abilities. Your maximum number of WP is equal to your WIL, but can be increased by the heroic ability Focused."
      - id: creation-skills
        step: "7"
        name: Trained Skills
        body: |
          Choose your trained skills: six from the list of your profession, plus two (young), four (adult) or six (old) of your own choice, from the thirty core skills. A trained skill starts at twice its base chance. Skill levels go from 1 to 18.
          If you play a mage, you also choose a [[school of magic]], which becomes one of your trained skills, and your first spells (see Magic below). You may go back and adjust your trained skills to fit your gear (step 10).
        see:
          - skills
          - professions
          - spells
        sections:
          - name: Base Chance
            body: |
              Every skill is connected to an [[attribute]], which determines your base chance in that skill. The attribute is shown next to each skill on your character sheet. The base chance is a “free” skill level you get automatically.
              {{table: Base Chance}}
          - name: Starting Skill Levels
            body: "In addition to your base chances you start with a number of trained skills: eight, ten or twelve, depending on your age. At the start of the game your level in a trained skill is twice its base chance. Six of your trained skills must be chosen from the list of your profession; the rest (two, four or six, by age) are chosen freely. You can increase your {{key: skill levels | skill level}} during the game."
          - name: Secondary Skills
            body: Beyond the core skills there are secondary skills, such as the schools of magic. In the base game you don't get a base chance in any secondary skill, but future expansions and supplements may modify this.
          - name: Magic
            body: |
              Magic is divided into different schools, and each school is a separate skill. As a newly created mage you must select a school of magic, which then becomes one of your trained skills (based on INT).
              You may choose three rank 1 spells and three [[magic tricks|magic trick]] from your school or general magic (page 57). You can learn more spells, and schools of magic, during the game. For more on magic, see chapter 5.
      - id: creation-heroic-ability
        step: "8"
        name: Heroic Ability
        body: |
          You start the game with one {{key: heroic ability}}, determined by your profession (see its entry in Professions). Some heroic abilities require a minimum [[skill level]], but that does not apply to your starting ability.
          If you play a mage you don't get a heroic ability at the start: your magic makes up for it. If the ability of your profession really doesn't fit the character you want to create, the GM may allow you to choose a different starting ability. You can earn new heroic abilities during play (see Experience).
        see:
          - abilities
          - professions
        sections:
          - name: Mages
            body: If you play a mage, you don’t get any heroic ability at the start of the game – your magic will make up for that disadvantage! You can earn new heroic abilities during play just like other professions, however.
          - name: Alternative Abilities
            body: If you feel that that the heroic ability listed by your profession really doesn’t match the character you want to create, the GM may allow you to choose a different starting ability.
      - id: creation-weakness
        step: "9"
        name: Weakness
        body: |
          Optional. Your character is a capable individual, but even an adventurer has an Achilles heel that can get them into trouble. Roll a D20 on the table below, choose from it, or choose your weakness freely.
          A weakness adds depth and personality to your character and can be used by the GM to create challenges for you. Roleplaying according to your weakness gives you an extra [[advancement mark]] at the end of the session (see Experience).
          {{table: Weakness}}
        optional: true
      - id: creation-gear
        step: "10"
        name: Gear
        body: |
          Write down all the items you carry on your character sheet, one item per row. Weapons at hand, and the armor, helmet and shield you wear, go in their boxes; every other item goes in the Inventory. If it is not on your sheet, you do not have it with you.
          The lists of weapons, armor and other equipment are in Equipment. How much you can carry is in [[Encumbrance]], below.
        see:
          - weapons
          - armor
          - gear
          - professions
        sections:
          - name: Starting Gear
            body: Your profession determines what gear you can choose from at the start of the game. Roll a D6 on the gear table of your profession (1–2 the first set, 3–4 the second, 5–6 the third) or choose one of its three sets. If you want to, you may go back and adjust your trained skills to fit your gear. In addition, you have simple clothes, which do not need to be written down.
          - name: Coins
            body: Monetary transactions are generally made with silver coins. Copper coins are used for smaller transactions and gold for larger ones. Ten copper coins equal one silver, and ten silver coins equal one gold. The coins you get when creating your character can be used to purchase additional starting gear.
      - id: creation-memento
        step: "11"
        name: Memento
        body: |
          Optional. In addition to your other equipment you can have a memento: an item of great sentimental value that you always carry. Choose something suitable or roll a D20 on the table below.
          A memento is always a tiny item with no practical use, but once per game session you can use it to recover an additional [[condition]] during a [[stretch rest]]. If you lose your memento, you may choose a new item you found on your adventures at the end of the session.
          {{table: Memento}}
        optional: true
      - id: creation-appearance
        step: "12"
        name: Appearance
        body: |
          On your character sheet you can write down something about your character's appearance. It does not have to be detailed: one or a few distinct features are enough. Choose for yourself, or make one or more rolls on the table below.
          {{table: Appearance}}
      - name: Experience
        body: Life as an adventurer brings many challenges, and if you survive you are sure to change and maybe even learn a thing or two along the way.
        see:
          - skills
          - abilities
        sections:
          - name: Advancement Marks
            body: |
              When you have rolled a dragon or demon (page 31) when using a skill, tick the check box next to that skill. At the end of the game session, the GM asks you the following questions about the session you just completed. For each question that you can reply “yes” to, and justify your answer, you may place another {{key: advancement mark}} next to an unmarked skill of your choice. The GM has the final word, but should adopt a permissive attitude.
              ✦Did you participate in the game session?
              ✦Did you explore a new location?
              ✦Did you defeat one or more dangerous adversaries?
              ✦Did you overcome an obstacle without using force?
              ✦Did you give in to your weakness (optional rule)?
          - name: Advancement Rolls
            body: After placing your marks, roll a D20 for each of them – if the result exceeds your current [[skill level]], it is increased by one, up to a maximum of 18. Once you have made your advancement rolls, erase the marks and start over in the next game session.
          - name: Teacher
            body: A shift of intense training with a teacher whose skill level is 15 or higher and exceeds your own gives you an additional advancement roll to improve the skill in question. Make the roll immediately, without waiting for the session to end. However, a teacher can only raise a skill level by one – after that you must improve the skill through experience before you can get more help from a teacher. Teachers, especially those with high skill levels, are usually very expensive.
          - name: Magic
            body: A [[school of magic]] that you already know can be improved like any other skill. However, learning new spells and new schools of magic requires special training. For more information, see chapter 5.
          - name: Heroic Abilities
            body: |
              You can earn new [[heroic abilities|heroic ability]] during play in two ways:
              ✦When you increase a skill level to 18, you immediately gain a new heroic ability of your choice. If the skill level is reduced below 18 for any reason, you keep the heroic ability and you will even gain a new ability if the skill level is increased to 18 again.
              ✦After a grand heroic deed, the GM or the adventure can reward you with a heroic ability. This should be a rare event, never more than once per standard-length adventure.
              To earn a new heroic ability, you must meet its skill requirement.
          - name: Overcome Weakness
            body: If you during the session acted in a way that clearly goes against your weakness, you get two advancement marks (instead of one mark for giving into it). You have now also overcome your weakness and must remove it. You must then play a full session without a weakness. After that, you may choose a new weakness, preferably based on something that has occurred in the game.
  - name: Combat & Damage
    nav: Reference
    source: rulebook
    children:
      - name: Rounds & Initiative
        body: Combat is played in rounds, each representing roughly ten seconds. At the start of each round, the first step is to decide who has the initiative – that is, in what order the combatants will act during the round.
        sections:
          - name: Drawing the Initiative
            body: |
              - To determine the {{key: initiative}}, ten cards numbered 1 to 10 are used.
              - Each player taking part in the conflict, voluntarily or otherwise, draws a random card at the beginning of each round, and the GM draws cards for [[NPCs|npc]].
              - The number on the card determines the order in which you act in the round.
              - Your place in the initiative order is called your turn.
              - Place your initiative card by your character sheet so everyone can see the order in which each person acts.
              - The GM puts their card (or cards) in front of them.
              - When all participants have had their turn, the round is over and a new round begins by drawing the initiative again.
          - name: Initiative for NPCs
            body: To make things simple, particularly in large battles, the GM can draw a single initiative card for a group of NPCs. All NPCs in that group act on the same turn in the round. The order among them is decided by the GM.
          - name: Surprise
            body: If you perform an attack that the GM deems surprising to your enemy, you get to choose any initiative card you want in the first round of combat. If several characters participate in the surprise attack, you may all choose a card. The other combatants draw the initiative from the cards that remain. At the start of the second round, everyone draws the initiative as usual.
          - name: Waiting
            body: |
              On your turn in the round, you can choose to wait. This means that you swap initiative cards – and therefore places in the turn order – with another creature whose turn comes after yours. You can swap cards with other [[player characters|player character]] as well as NPCs (or group of NPCs acting on the same turn), and they cannot refuse the trade. However, you cannot swap initiative cards with anyone who has already had their turn, or who themselves chose to wait earlier in the round.
              Monsters: Monsters often have multiple turns in a single round, and therefore draw multiple initiative cards. In that case you decide which card you want, as long as it comes after your current turn in the initiative order. Monsters themselves never choose to wait.
      - name: Actions & Movement
        body: On your turn in the round, you can move and perform one action. You simply explain how you want to move and what action you want to perform. If necessary, you also roll dice to see whether you succeed. You decide whether to move before you act or vice versa. You can even use part of your movement, perform your action, and then finish the movement. You must perform your action and move on your turn – you cannot save any of them for later (but see Waiting on the previous page).
        sections:
          - name: Reactions
            body: |
              Some actions are not performed on your turn, but on the opponent’s. These are called reactions and include things like [[parrying|parry]] or [[dodging|dodge]] attacks. This uses up your own turn in the round, which means that you cannot perform a reaction if you have already had your turn. Flip your [[initiative card|initiative]] after performing a reaction.
          - name: Sneak Attack
            body: |
              * When you sneak up on someone undetected and perform an attack, it is called a sneak attack. It can be done with both ranged and melee weapons, but never during active combat (except with the Backstabbing [[heroic ability]]). First you make a SNEAKING roll. 
              * Moving close enough to attack in melee combat (within 2 meters for most weapons) gives you a [[bane]]. If you fail, the enemy notices you – draw initiative. If you succeed your attack counts as surprising, which means that you can choose any initiative card you want. You also get a [[boon]] on the attack, and the target can neither dodge nor parry. Using a subtle weapon increases the damage by one die (for example 2D8 instead of D8). Sneak attacks are always performed individually, by one attacker against one target.
          - name: Ambush
            body: "* A special kind of sneak attack is an ambush – lying in wait for an enemy and attacking as it passes by. In this case, each victim makes an AWARENESS roll to spot the ambush, with a bane if the attackers are well prepared. All those who fail get the bottom cards (counting from #10 and up), randomly drawn."
          - name: Flip the Initiative Card
            body: "* Once you have had your turn in the round, you can flip the initiative card face down to make it clear to you and everyone else that your turn is over. This means that you cannot perform any reaction (such as parrying an attack) later in the round."
          - name: Terrain
            body: The terrain where the fighting takes place can affect your movement and actions. Maps usually show what type of terrain is found in different areas.
          - name: Combat Maps
            body: Combat can take place entirely in your imagination, with the GM describing the battlefield and specifying the distance between combatants. However, grid maps are a useful tool in combat, as they can be used to keep track of where everyone is. Each square on the map usually represents an area of 2×2 meters. Doors, walls, and ascents are also shown on the map. Complete adventures for Dragonbane include maps of important sites. As a rule, each square on the map can only be occupied by one person at a time, but it is possible to pass through a square where a friendly combatant is positioned. Diagonal movements and attacks are allowed,
          - name: Cramped
            body: |
              There is little space or a low ceiling. All melee weapons except piercing weapons (page 73) and subtle weapons get a bane on all rolls.
              but not if both squares you want to pass between are blocked or occupied by hostile opponents. You can use miniature figures to represent combatants on the map. The boxed Dragonbane Core Set includes a number of illustrated cardboard figures with plastic bases. You can also use painted figures of plastic or metal.
              Five-Foot Squares? If you are used to combat maps with 5×5 foot squares and perhaps even own a bunch of such maps, you can easily use them in Dragonbane – just use the 5×5 foot squares as if they were 2×2 meters. It will not affect anything in the game.
          - name: Rough
            body: |
              The terrain is difficult to traverse. Whenever you move, you must make an ACROBATICS roll (not an action). Failure means that you fall over and lose the rest of your movement this round.
              Dimly Lit: Imposes a bane on all ranged attacks.
      - name: Melee Combat
        body: |
          To attack someone in melee, you generally must be within 2 meters of your target. On the grid map you need to be positioned in a square adjacent to the enemy (including diagonally). When attacking in close combat, you use the skill that covers the type of weapon you are wielding.
          {{table: Demon Roll in Melee}}
          {{table: Melee Combat Actions}}
        sections:
          - name: Weapon
            body: |
              You can have up to three weapons at hand. Write them down in the Weapons section on your character sheet. To attack with a weapon, it must also be drawn. Drawing a weapon kept at hand, or exchanging your drawn weapon for another weapon at hand, is a [[free action]]. Picking up another weapon from the ground or from your inventory costs a regular action.
          - name: Shove
            body: |
              If you hit an enemy with a melee attack and your STR damage bonus is equal to or higher than your opponent’s damage bonus, you can choose to shove the enemy up to 2 meters in any direction (to an adjacent square, if you are using a grid map) in addition to doing damage. This movement does not count toward the enemy’s total movement in the round and does not trigger [[free attacks|free attack]] from anyone. Monsters cannot shove or be shoved.
              time. The STR requirement of a one-handed weapon decreases by 3 if you hold it with both hands.
          - name: Prone Targets
            body: If you are standing up but your enemy is lying on the ground, your attack gets a [[boon]] and inflicts an extra D6 damage.
          - name: Damage Types
            body: "There are three types of damage: slashing, piercing, and bludgeoning. The damage types of various weapons are listed in the weapon tables in chapter 6. Some weapons, such as swords, can inflict both slashing damage and piercing damage – you must state whether you stab or slash before rolling the die. The damage type influences the effectiveness of armor, and monsters can be resistant to certain types of damage."
          - name: Critical Hit
            body: |
              By rolling a dragon when you attack, you score a {{key: critical hit}}. This means that a dragon roll is required to parry or dodge the attack, and that you may choose one of the following effects:
              ✦Roll double the amount of dice for the weapon’s damage, before adding any damage bonus and other bonuses. For example, if you get a critical hit with a broadsword (damage 2D6) and have damage bonus D4, the damage is 4D6+D4.
              ✦You can immediately perform a second attack against another enemy. This additional attack is a free action.
              ✦Armor has no effect against the attack, as it finds a gap or weak spot. This effect can only be chosen if the attack deals piercing damage (optional rule, below).
          - name: Hitting Inanimate Objects
            body: If you hit a non-living object, like a door or a lock, you hit automatically – only roll for damage. Inanimate objects often have an [[armor rating]], however (page 50).
          - name: Parrying
            body: "When hit by an attack in close combat, you can choose to {{key: parry}} the attack with a drawn weapon or shield. Note that you cannot draw a weapon to parry, as free actions can only be performed on your own turn. You must declare that you are going to parry before the attacker rolls for damage. You cannot parry unarmed. It is also impossible to both parry and dodge the same attack. You can parry while prone. When parrying, you roll against your [[skill level]] for the weapon."
          - name: "Parrying: Reaction"
            body: Parrying is a reaction, as it breaks the [[initiative]] order. It replaces your regular turn, and you must immediately flip your initiative card. This means that you cannot parry if you have already had your turn in the round (but see the [[heroic ability]] Defensive).
          - name: Durability
            body: If your parry succeeds, the enemy’s attack hits your weapon or shield, and you suffer no damage. However, if the damage exceeds your weapon’s durability, the weapon is damaged and cannot be used until it is repaired with a CRAFTING roll.
          - name: Shield
            body: If you have a shield drawn, you can parry with it instead of your weapon. There is no skill for shields – instead you can use any STR-based melee skill (i.e. any of them except KNIVES and STAVES) to parry with a shield.
          - name: Piercing Damage
            body: Piercing attacks can never damage a parrying weapon or shield.
          - name: "Parrying: Monsters"
            body: As a rule, [[monster attacks|monster attack]] (page 83) cannot be parried, unless otherwise specified.
          - name: Rolling a Dragon when Parrying
            body: If you roll a dragon when parrying, you immediately perform a counterattack on your opponent – an automatic hit with your weapon that cannot be dodged or parried. This does not apply if the attacker rolled a dragon as well – in that case you need a dragon just to parry, and do not get a counterattack.
          - name: Parry Movement
            body: When successfully parrying an attack, you can move both yourself and the enemy 2 meters (one square) in any direction. These movements follow the usual rules, but do not count toward anyone’s movement in the round and trigger no free attacks from anyone.
          - name: Dodging
            body: "As an alternative to parrying, you can try to {{key: dodge}} when hit by an attack. You cannot parry and dodge the same attack – you must choose one or the other. You can dodge while prone. You must declare that you are dodging before your opponent rolls for damage. Roll for EVADE – on success you evade the attack and take no damage. On a failure, you are hit by the attack."
          - name: "Dodging: Reaction"
            body: Dodging is a reaction and, like parrying, requires that you have not already had your turn in the round. Once you have dodged, your turn in the round is spent and you must flip your initiative card.
          - name: Movement
            body: On a successful dodge you may, if you want, move up to 2 meters in any direction. This movement does not trigger free attacks from anyone.
          - name: "Dodging: Monsters"
            body: As a rule, monster attacks (page 83) can be dodged, unless otherwise specified.
          - name: Special Attacks
            body: |
              In addition to simply trying to hit the enemy, there are a few special attacks that you can use in melee combat. You must always declare that you are using a special attack before rolling the attack. Several special attacks are resolved by [[opposed rolls|opposed roll]]. When rolling for an [[NPC]] without the skill in question, the GM rolls against the default skill level 5 (page 33).
              Find Weak Spot: If your weapon is piercing, you can try to find a gap in the enemy’s armor or [[natural armor]]. You get a bane on the attack, but if it hits, the enemy counts as armorless.
              Topple: You try to topple an enemy to the ground instead of inflicting damage. This is handled with an opposed roll between your skill level in the weapon you are using and the enemy’s EVADE. If your weapon has the toppling feature, you get a boon. The attack counts as an action for you, but not for your opponent. It cannot be dodged or parried. An effective way of using this special attack is to work together with another person – if you topple the opponent, your friend can attack the prone enemy before they can get up.
              Disarm: You try to disarm your enemy instead of inflicting damage. This is handled with an opposed roll between your and the enemy’s skill level in the
              weapons you are using. The attack counts as an action for you, but not for your opponent. It cannot be dodged or parried. If the enemy is holding the weapon with both hands, you get a bane. If you succeed, the weapon lands D6 meters away in a direction of your choice. Picking up a weapon from the ground is an action. Disarm does not work on shields or natural weapons.
              Grapple: You try to grapple a humanoid enemy instead of inflicting damage. This is handled with an opposed roll between your BRAWLING and the enemy’s BRAWLING. The attack counts as an action for you, but not for your opponent. It cannot be dodged or parried. If your attempt fails, you fall to the ground. If it succeeds, both of you fall to the ground and the enemy is trapped in your grip. As long as you maintain your grip the enemy can neither move nor perform any action that requires body movement, except trying to break free. Doing so is an opposed roll between your BRAWLING and the enemy’s BRAWLING. The roll is a free action for the enemy, but not for you. While maintaining your grip, you are also unable to move or perform any action that requires body movement, except break – this counts as an unarmed attack with a boon that cannot be dodged or parried. Releasing the enemy is a free action.
          - name: Melee Tactics
            body: |
              To be successful in melee combat it is important to realize that your most precious resource is your actions – you only get one per round, including reactions such as dodging or parrying. If several [[player characters|player character]] are fighting together, it is often very effective to focus on the same enemy, as that person can only parry or dodge once, which leaves them vulnerable to multiple attacks. But always remember that you too are exposed to attacks after performing your action. The heroic abilities Defensive and Lightning Fast significantly
              increase your ability to defend yourself against multiple opponents. In single combat against an opponent as powerful as yourself, it may be wise to wait and let the enemy strike first. If their attack misses you do not need to parry or dodge, and can then perform your own attack while the enemy is unable to protect themselves. The drawback is that you surrender the initiative to your enemy, who may choose a completely different action than you expected.
      - name: Ranged Combat
        body: |
          To use a ranged weapon, it must first be drawn ([[free action]]), just like in melee. You should preferably be positioned over 2 meters from your target (i.e. not in an adjacent square on the map). Standing 2 meters away or less gives you a [[bane]] on your attack. Roll against the skill for the weapon you are using. For throwing weapons, use the same skill as for melee attacks (such as KNIVES or SPEARS). If the attack hits, the weapon determines which dice you should roll to see how much damage it inflicts. The damage can be increased by [[Damage bonus|Derived Ratings]] and a [[dragon roll|dragon]], and decreased by armor.
          {{table: Demon Roll in Ranged Combat}}
        sections:
          - name: Damage Bonus
            body: You get a damage bonus for ranged weapons, just as in melee. But note that crossbows do not give you a damage bonus.
          - name: Range
            body: The weapon tables on pages 74–75 specify the range of various weapons – that is, the maximum distance (in meters) at which the weapon can be used effectively. You can fire at targets up to twice the listed range, but then you get a bane.
          - name: Critical Hit
            body: |
              Rolling a dragon when performing a ranged attack results in a [[critical hit]], which means that it can only be [[dodged|dodge]] (or [[parried|parry]] with a shield) if the opponent also rolls a dragon. You may also choose one of the following effects:
              ✦Your weapon’s damage is doubled, excluding the damage bonus and other bonuses. Roll twice as many dice as normal and add them up. For example, a critical hit with a longbow inflicts 2D12 damage.
              ✦Armor and [[natural armor]] have no effect against the attack, as it hits a gap or weak spot. This effect can only be chosen if the attack deals piercing damage (optional rule).
          - name: Parry & Dodge
            body: Parrying a ranged attack requires a shield. It works the same way as in melee combat, except that rolling a dragon does not give you a counterattack. You can dodge ranged attacks just like melee attacks.
          - name: Obscured Targets
            body: If your view of the target is partially obscured by an object or person, no matter if it is a friend or foe, you get a bane on your attack. On a grid map you can shoot past a person standing between you and your target, but with a bane. If the target is completely out of sight, perhaps hiding behind a wall, you cannot shoot it at all. If you are playing without a map, the GM decides whether your line of sight is partially or completely blocked.
      - id: combat-damage-damage
        name: Damage
        body: Life as an adventurer is hard and risky. The rewards may be great, but the only thing you know for sure is that you will suffer all sorts of damage along the way. Taking damage reduces your [[hit points|hp]] (HP).
        sections:
          - name: Armor
            body: Wearing leather, chainmail, or plate armor can protect your body from damage. Equipping or unequipping armor counts as an action in combat. The armor you are wearing should be written down in the Armor section on your character sheet and does not count toward your [[encumbrance]]. You can only wear one suit of armor at a time. Some armors can give you a [[bane]] on certain skill rolls or restrict your movement.
          - name: Armor Rating
            body: "An armor’s effectiveness is determined by its {{key: armor rating}}. Whenever you take damage from a physical attack, subtract the armor rating from the damage. If the damage from a melee attack is completely negated, the attacking weapon itself suffers the damage instead, which might break the weapon (see durability on page 46)."
          - name: Helmets
            body: Your armor can be combined with a helmet, which can further increase your armor rating. Equipping or unequipping a helmet counts as an action. Helmets can also give you a bane when using certain skills.
          - name: Damage Types & Armor
            body: |
              If the optional rule for damage types (page 45) is used, the following rules apply:
              ✦Leather and studded leather gain a +2 bonus to their armor rating against bludgeoning damage.
              ✦Chainmail gets a +2 bonus to its armor rating against slashing damage.
              If the type of damage is not stated, the armor has its normal effect.
          - name: Death
            body: If your HP reaches zero, you drop to the ground and risk dying. You cannot move or perform any actions except trying to rally (below).
          - name: Death Roll
            body: "On your turn in each subsequent round, you must make a {{key: death roll}} – a roll against your CON. The death roll cannot be [[pushed|push]] if that optional rule is used. Record the results of your death rolls on your character sheet. After three successful death rolls you recover D6 HP and stop making death rolls. After three failed death rolls, your [[player character]] dies. [[Rolling a dragon|dragon]] counts as two successful death rolls, and [[rolling a demon|demon]] counts as two failures. If the combat ends, keep counting rounds until all death rolls have been made. Any failed death rolls are reset if you survive."
          - name: Zero HP for NPCs
            body: When an [[NPC]] reaches zero HP, no death rolls are made – the GM decides whether the person lives or dies. However, an NPC dies if hit by an instantly killing attack, just like a player character.
          - name: Additional Damage
            body: If you suffer additional damage while at zero HP, it automatically counts as a failed death roll.
          - name: Rally
            body: Another player character within 10 meters and earshot can PERSUADE you to rally and keep fighting despite having zero HP. This counts as an action. If you rally, you can continue acting as normal, but must keep making death rolls as described above. You can even try to rally yourself, rolling against your WIL with a bane (instead of PERSUASION).
          - name: Saving Life
            body: When you have zero HP, another person next to you can save your life with a successful HEALING roll. Without bandages, they get a bane to the roll. This counts as an action. Multiple attempts are allowed. If the roll succeeds, you stop making death rolls and recover D6 HP. You cannot save your own life this way, even if you have rallied (see above). Additional HEALING rolls have no effect once you are no longer at zero HP, except when resting (see page 52). Magic can save lives as well.
          - name: Instant Death
            body: |
              You don’t record negative HP, but if a single attack reduces your HP to a negative score equal to your full HP, your player character dies instantly. Time to honor the fallen adventurer and create a new one!
              {{table: Severe Injuries: Injury}}
      - name: Conditions
        body: |
          In this game you can suffer six different conditions. Each condition gives you a [[bane]] on all rolls against a certain [[attribute]] and skill rolls based on that attribute:
          {{table: Conditions}}
        sections:
          - name: Suffering a Condition
            body: "The most common way to suffer {{key: conditions | condition}} is to [[push your roll|push]] (optional rule, page 32). You must then choose a condition and describe how you get it. You can suffer conditions in other ways as well, for example because of [[monster attacks|monster attack]] or spells."
          - name: Multiple Conditions
            body: If you suffer a condition that you already have, you must choose another condition. If you have all six conditions, you instead lose D6 [[WP]] if you suffer another condition. If you are out of WP, you instead lose D6 [[HP]].
          - name: Healing Conditions
            body: You can heal one condition of your choice during a [[stretch rest]]. A [[shift rest]] heals all conditions.
      - name: Healing & Resting
        body: |
          Lost [[HP]] and [[WP]] are recovered by resting. There are three kinds of rest – round rest, stretch rest, and shift rest. While resting, you cannot perform any actions that require die rolls or WP.
          {{table: Rest Types}}
        sections:
          - name: Round Rest
            body: "A quick rest that lasts just a single round. During a {{key: round rest}} you recover only D6 WP, no HP. You can only have a round rest once per shift."
          - name: Stretch Rest
            body: |
              A short rest that only lasts for one stretch of time. During a {{key: stretch rest}} you heal D6 HP, or 2D6 HP if someone else is tending to you and succeeds with a HEALING roll. The caregiver cannot rest during the same stretch and can only heal one person during the rest.
              During a stretch rest, you also recover D6 Willpower Points and heal a [[condition]] of your choice. If something dramatic interrupts your rest, the effects are lost. You can only have a stretch rest once per shift.
          - name: Shift Rest
            body: "A {{key: shift rest}} lasts one full shift of time and can only take place in a safe location where there are no enemies nearby. During a shift rest you recover all your lost HP and WP and heal all conditions. If a shift rest is interrupted by combat or hard work it has no effect."
          - name: Magic
            body: Spells can allow you to heal HP more quickly than usual.
      - name: Other Hazards
        sections:
          - name: Darkness
            body: In complete darkness you cannot dash (page 43) or hit enemies with ranged attacks. To attack an enemy in melee combat, you must first make an AWARENESS roll (not an action).
          - name: Torches & Lanterns
            body: A torch or lantern lights up 10 meters (five squares) in all directions. Lighting a torch or lantern is an action and requires flint and tinder or a fire to light it with, or the [[magic trick]] IGNITE (page 65). If none of these are available, you can light it with a successful BUSHCRAFT roll, but that takes one stretch of work. A torch or lantern is carried in one hand, which means that you cannot use two-handed weapons or a second one-handed weapon at the same time. A torch can be used as a weapon, and counts as a small wooden club that deals fire damage. Whenever you hit someone with it, you must immediately roll to see whether the flame goes out (below). A torch or lantern can burn for up to a shift of time, but they are unreliable. After each stretch, or whenever the GM wants to heighten the drama, you must roll a die (the type depends on the light source, see page 78). A result of 1 means that the flame goes out.
          - name: Fear
            body: |
              There are many horrifying beasts lurking in the ruins and forests of Dragonbane. Such creatures can perform so-called fear attacks. Fear attacks can also be triggered by magic and other terrifying experiences. When struck by a fear attack you must immediately make a roll against WIL. The roll can be [[pushed|push]] (optional rule) and does not count as an action. Particularly frightening events can give you a [[bane]] on the roll. If the WIL roll fails, you must roll on the fear table on the next page.
              {{table: Fear Table}}
          - name: Poison
            body: |
              {{key: Poisons | poison}} are measured by potency. A weak poison has potency 9, a moderate poison has potency 12, and a strong poison can have potency 15 or even more. Whenever you ingest a poison, the GM makes an [[open opposed roll|opposed roll]] (page 33) between the potency and your CON. If the poison wins, you suffer its full effect. If you win, you only suffer the limited effect of the poison. Poison has no effect on monsters.
              [[NPCs|npc]]: For poison effects on NPCs, roll against their maximum [[HP]], reduced by 2 for each level of the Robust [[heroic ability]].
          - name: Lethal Poison
            body: |
              ✦Full Effect: You take D6 damage per round, on your turn, until you reach zero HP. If you consume an antidote in time the effect is halted.
              ✦Limited Effect: You take D6 damage on your next turn.
          - name: Paralyzing Poison
            body: |
              ✦Full Effect: You become Exhausted and must make a CON roll each turn (not an action). If it fails, you can neither move nor perform actions (not even [[free actions|free action]]) that round. The effect wears off after one stretch or if you are given an antidote.
              ✦Limited Effect: You become Exhausted.
          - name: Sleeping Poison
            body: |
              ✦Full Effect: You become Dazed and must make a CON roll each turn (not an action). If it fails, you fall asleep and remain sleeping for one shift. Being given an antidote or taking at least one point of damage wakes you up.
              ✦Limited Effect: You become Dazed.
          - name: Disease
            body: When you are exposed to a dangerous disease, the GM makes an open opposed roll between the disease’s virulence rating and your CON. If you win, you resist the disease. If not, you fall ill after one day – you become Sickly and lose D6 HP. While sick you cannot heal HP, [[WP]], or [[conditions|condition]]. Make a new roll against the disease every day, where each failure inflicts D6 damage. If you reach zero HP while sick, you die a day later. As soon as you win the opposed roll, you are fully cured – you stop rolling and can heal as usual.
          - name: Healing
            body: If someone tends to you with the HEALING skill while you are sick, that person can make the roll against the disease instead of you. The caregiver rolls for HEALING against the virulence of the disease. An herbal concoction adds a [[boon]] to the roll.
          - name: Falling
            body: Falling on a hard surface inflicts a number of D6s of bludgeoning damage equal to half of the height of the fall in meters, rounded down. A fall of less than two meters inflicts no damage. A successful ACROBATICS roll reduces the number of D6 by half (rounded up). Armor does not protect against falling damage.
          - name: Swimming & Drowning
            body: All [[player characters|player character]] are decent swimmers. In water your movement rate is half your movement rate on land. No ranged attacks can be performed in water, and melee attacks are performed with a bane. More difficult underwater maneuvers, like diving for something, require a
          - name: Hunger
            body: You must eat at least one ration of food (page 103) per day. After one day without food you become famished and cannot heal HP, WP, or conditions except through magic. You also take one point of damage per day that you haven’t eaten. If you reach zero HP while famished, you die from starvation after one day. Once you have eaten a ration of food you are no longer famished and can heal normally again.
          - name: Cold
            body: |
              When the cold is bitter and you do not have enough shelter (according to the GM), you must roll BUSHCRAFT regularly. You usually roll once per shift, but in extreme cold you may have to roll every stretch or even every round. If you don’t have a blanket, you get a bane to the roll, while a fur gives you a boon.
              On failure you lose D6 HP and D6 WP, and can no longer heal these or conditions except through magic. You must then keep making rolls to withstand the cold, with the same effect if you fail. If you reach zero HP while cold, you die when it is time for the next roll. Only when you get warm, if only by a campfire, can you stop making rolls and heal normally again.
          - name: Sleep Deprivation
            body: You need at least one shift of uninterrupted sleep every day. You cannot sleep in armor. After three shifts without sleep you can no longer heal WP or conditions. You heal HP as usual. You also lose D6 WP each shift you remain awake. If you reach zero WP while suffering from sleep deprivation, you collapse and sleep for at least one shift, and cannot be woken. Once you have slept at least one shift, you can heal WP and conditions normally again.
      - name: Riding Animals
        body: A loyal horse or some other mount is a great asset to any adventurer. Different types of pack animals and riding animals are listed on page 81, and their stats are found on page 99.
        sections:
          - name: Saddlebags
            body: The Gear lists specify how many units of weight the animal can carry.
          - name: Movement
            body: While mounted you travel twice as fast as on foot – roughly 30 kilometers per shift (page 7). All [[player characters|player character]] are assumed to be able to get up on a horse and ride slowly, but for more advanced maneuvers a roll for RIDING is required.
          - name: Combat
            body: In order to fight on horseback, your mount must be combat trained. You may then move at your mount’s movement rate instead of your own. On horseback you fight as usual, but all attacks and [[parries|parry]] use the lowest of your RIDING skill and the weapon skill. Also, RIDING replaces EVADE when horseback. If you don’t have a saddle, all rolls get a [[bane]]. Enemies attacking you must choose whether they target you or your mount. Melee attacks from the ground get a bane against you.
          - name: Damage
            body: Mounts heal [[HP]] just like player characters. A mount that reaches zero HP does not make [[death rolls|death roll]], but simply dies.
      - name: Improvised Weapons
        body: |
          Battles are sometimes fought in places where things in the environment can be used in combat – as weapons, for protection, or for movement. These improvised weapons can be lots of different things, but what they all have in common is that they normally can only be used once, after which they are consumed. Using an improvised weapon is an action and can be combined with movement. Examples of improvised weapons can be found at the end of this book, and they are printed on cards in the boxed Dragonbane Core Set.
          At the start of combat, the GM can randomly determine D3 improvised weapons that are available – or simply decide for themselves. The GM can mark an improvised weapon’s exact location on the map, or say that it is available anywhere in the area. Once used, an improvised weapon is consumed. Complete adventures can feature new and unique improvised weapons that are connected to a certain adventure site.
          {{table: Inn}}
          {{table: Cave}}
          {{table: Forest}}
      - name: Treasure
        body: |
          Roll D6 to see which of the tables to use: 1–3: Treasure table 1, 4–6: Treasure table 2.
          {{table: Treasure Table 1}}
          {{table: Treasure Table 2}}
