# The attributes of the game system. Only ids and keys live here: the words (name, short form, description) are in i18n/<lang>.csv under
# the keys written below. Characters, skills and professions refer to an attribute by its id. `aliases` are the codes older files used;
# they are still understood when read, and never written.
format: 2
attributes:
  - id: strength
    name: LOC_ATTRIBUTE_STRENGTH
    abbr: LOC_ATTRIBUTE_STRENGTH_ABBR
    description: LOC_ATTRIBUTE_STRENGTH_DESC
    aliases: [STR]
  - id: constitution
    name: LOC_ATTRIBUTE_CONSTITUTION
    abbr: LOC_ATTRIBUTE_CONSTITUTION_ABBR
    description: LOC_ATTRIBUTE_CONSTITUTION_DESC
    aliases: [CON]
  - id: agility
    name: LOC_ATTRIBUTE_AGILITY
    abbr: LOC_ATTRIBUTE_AGILITY_ABBR
    description: LOC_ATTRIBUTE_AGILITY_DESC
    aliases: [AGL]
  - id: intelligence
    name: LOC_ATTRIBUTE_INTELLIGENCE
    abbr: LOC_ATTRIBUTE_INTELLIGENCE_ABBR
    description: LOC_ATTRIBUTE_INTELLIGENCE_DESC
    aliases: [INT]
  - id: willpower
    name: LOC_ATTRIBUTE_WILLPOWER
    abbr: LOC_ATTRIBUTE_WILLPOWER_ABBR
    description: LOC_ATTRIBUTE_WILLPOWER_DESC
    aliases: [WIL]
  - id: charisma
    name: LOC_ATTRIBUTE_CHARISMA
    abbr: LOC_ATTRIBUTE_CHARISMA_ABBR
    description: LOC_ATTRIBUTE_CHARISMA_DESC
    aliases: [CHA]

# How the attributes are listed in the rules ("{{table: Attributes}}"): the title and the three column headers, as keys.
table:
  title: LOC_TABLE_ATTRIBUTES
  columns: [LOC_TABLE_ATTRIBUTES_NAME, LOC_TABLE_ATTRIBUTES_ABBR, LOC_TABLE_ATTRIBUTES_DESC]
