format: 1
intro:
  sections:
    - name: Intro
      body: Some call magic a gift from the dragons, others a curse from the demons, and still others call it the blessing of the gods or spirits. And it is true that dragons, demons, gods, and spirits influence magic and can guide the mage who wields it, but the reality is that magic is a basic force of nature that exists throughout the physical world as well as beyond it. Gods and demons, dragons and spirits – they are all equally dependent on magic.
    - name: Schools of Magic
      body: "Exploring magic is as much art as it is science. There are different {{key: schools of magic | school of magic}}, each with a unique view on what magic is and how it works. There are said to be more magic schools in the world of Dragonbane, even necromancy and other dark arts, but the three below are the only ones available to [[player characters|player character]] in the core game."
    - name: Skills
      body: Each [[school of magic]] is a separate secondary skill. As a newly created mage you may select one school as a trained skill (based on INT). You don’t get a base chance in magic schools that you are not trained in, even as a mage. You can learn additional schools of magic during the game.
    - name: General Magic
      body: General magic is not a school, but a collection of general spells. You can learn general spells no matter which [[school of magic]] you subscribe to.
    - name: Newly Created Mage
      body: As a newly created mage you may select three rank 1 spells and three [[magic tricks|magic trick]] to start the game with. They must be chosen from your [[school of magic]] or general magic. You also get a [[grimoire]] where all your spells are recorded.
    - name: Requirements
      body: |
        To cast a spell, you must fulfill one or more requirements which are specified in the description of each spell.
        ✦Word: The spell is activated with a chant or power word. It cannot be a whisper.
        ✦Gesture: The spell is activated by making specific hand movements.
        ✦Focus: The spell is activated with an item held in your hand, such as a wand, crystal ball, or amulet.
        ✦Ingredient: The spell is activated using a certain ingredient, which is consumed in the process.
        Some spells have multiple requirements. You cannot cast a spell unless all its requirements are fulfilled.
    - name: Casting Time
      body: Unless otherwise stated, casting a spell always counts as an action in combat. However, there are reaction spells which are performed outside your own turn. Unlike other reactions in combat, such as [[parrying|parry]] and [[dodging|dodge]], reaction spells do not replace your regular action in the round. This means that you can cast as many of them as you want, if you have enough [[WP]]. There are also rituals, which take a stretch of time or even a shift to perform.
    - name: Grimoire
      body: Casting an unprepared spell from your [[grimoire]] takes twice as long, which means that you must spend an extra round, stretch, or shift on preparations. Make the roll when the spell is completed. Reaction spells cannot be cast from your grimoire.
    - name: Range
      body: Each spell has a maximum range. Unlike ranged weapons, spells cannot be used on targets outside their specified range. Personal range means that the spell only affects the person casting it.
    - name: Area of Effect
      body: Some spells affect an entire area. That area is called the area of effect. Unless stated otherwise, the area of effect always starts at the mage casting the spell. Area of effect spells can be [[dodged|dodge]] but not [[parried|parry]], unless stated otherwise. You can exempt one or more targets within the area from the spell’s effects, but you then get a [[bane]] on the roll.
    - name: Sphere
      body: If the range is described as sphere, the spell affects all targets within the chosen area except the mage themself.
    - name: Cone
      body: If the range is described as cone, the spell affects all targets within a cone-shaped area whose width at any given point equals the distance from the source of the spell. The range indicates the length of the cone.
    - name: Duration
      body: |
        Each spell specifies the duration of its effect.
        ✦Instant: The effect occurs instantly and has no lasting effect.
        ✦Round: The effect lasts until your turn in the next round.
        ✦Stretch: The effect lasts for one stretch of time.
        ✦Shift: The effect lasts until the end of the current shift.
        ✦Concentration: The effect ceases if you perform another action, take damage, or fail a WIL roll for resisting fear. If you are interrupted by a sudden disturbance, such as a sound, you must make a WIL roll (not an action) to maintain your concentration.
    - name: Magic Items
      body: |
        Magic items may contain one or more spells that can be activated even by non-mages. Unless stated otherwise, it takes a successful roll against LANGUAGES or any [[school of magic]] to identify the spells and be able to use them.
        [[Willpower Points|wp]]: Using the spells inside a magic item still costs WP. Some magic items can store WP which you can use instead of your own. Read more on page 62.
    - name: Failure, Dragons and Demons
      body: If the roll for casting a spell fails, the spell has no effect, but you still spend your [[WP]]. You are free to describe how the failure manifests itself in the story, as long as it has no mechanical effect.
    - name: Rolling a Dragon
      body: |
        [[Rolling a Dragon|dragon]] when you cast a spell means that your target must roll a dragon to resist, [[parry]], or [[dodge]] the spell, and that you may choose one of the following effects:
        ✦The damage or range of the spell is doubled.
        ✦The spell does not cost any [[WP]].
        ✦You can immediately cast another spell, but get a [[bane]] on the roll.
    - name: Rolling a Demon
      body: If you roll a Demon, you cannot [[push the roll|push]]. There is also a risk of something going terribly wrong – see the optional rule for magical mishaps below.
    - name: Magical Mishap
      body: |
        A magical mishap occurs if you roll a Demon (20) when casting a spell. Roll on the table on page 60.
        {{table: Magical Mishaps}}
    - name: Learning Magic
      body: You can learn new spells from a teacher or [[grimoire]]. You must have a [[skill level]] in the relevant [[school of magic]], or any school of magic for general spells.
    - name: Prerequisites
      body: Some spells have a prerequisite that must be met in order to learn them. It is usually a [[school of magic]] or knowing another spell.
    - name: Teachers
      body: The easiest (but often most expensive) way to learn a spell is from a teacher who already knows it. The lesson takes one shift, but you cannot activate the new spell until the end of the game session. You must then use an [[advancement mark]] (page 29) for the school to learn the new spell instead of trying to increase your [[skill level]] in the school. Make a roll against INT, with a [[boon]]. On success you learn the spell, otherwise you do not.
    - name: Grimoires
      body: If you are lucky, you can find spells in other mages’ [[grimoires|grimoire]]. You can learn them on your own. This works the same way as with a teacher, but you roll against LANGUAGES instead of INT, without the [[boon]].
    - name: Schools of Magic
      body: You can learn additional [[schools of magic|school of magic]] by first acquiring the [[heroic ability]] Magic Talent (page 38), and then studying under a teacher with a [[skill level]] in the school for at least a week. At the end of the week you make a roll against INT. On a success you get your base chance (INT) as the skill level in the school. On failure you may try again after another week of study. Even non-mages can learn magic this way.
    - name: Spell List
      body: The following pages list all [[magic tricks|magic trick]] and spells in the Dragonbane core game. First up is General Magic, followed by the three schools of Animism, Elementalism, and Mentalism.
    - name: Magic Tricks
      body: "{{key: magic trick}}{{key: magic tricks}}Magic tricks are easier to learn than real spells. It takes one stretch to learn a new trick from a teacher or [[grimoire]]. No [[advancement mark]] or roll is required."
  entities:
    - name: Casting
      kind: rule
      category: Casting Spells
      legacy_key: "#42"
      fields:
        Description: To cast a spell you must spend [[Willpower Points|wp]] (WP) and roll against your [[skill level]] in the relevant school. Any school can be used to cast general spells. If the roll succeeds, the spell has the intended effect, as per its description. Otherwise, it has no effect. You can [[push the roll|push]] if this optional rule is used. [[Magic tricks|magic trick]] succeed automatically and always cost 1 WP.
    - name: Rank
      kind: rule
      category: Casting Spells
      fields:
        Description: Spells are divided into ranks. These have no mechanical effect, but indicate how complex and powerful spells are. As a mage you start the game with only rank 1 spells, but you can learn higher rank spells during the game.
    - name: Prepared Spells
      kind: rule
      category: Casting Spells
      fields:
        Description: Spells are complicated, and the maximum number of spells you can hold prepared in your memory at the same time is equal to your base chance for INT. When you have reached your limit and want to prepare another spell, you need to replace a spell. To prepare spells, you need to study them in a [[grimoire]]. This takes a shift of time, regardless of the number of spells. It can be done during a [[shift rest]]. You can only prepare spells that you have learned (page 61). Mark your prepared spells with an X on your character sheet.
    - name: Grimoire
      kind: rule
      category: Casting Spells
      fields:
        Description: |
          Most mages have a {{key: grimoire}}, and newly created mages automatically get one. In the grimoire, you record all the spells you know. Recording one spell takes a shift of time. You can record unreadied spells. Once you have learned more spells than can be held prepared, your grimoire becomes crucial. In an emergency, you can cast spells directly from the grimoire, but it takes twice as long as normal (see below). Grimoires from other mages are also an effective way to learn new spells, should you not have a teacher. 
          If you lose your [[grimoire]], you cannot prepare the spells you kept in it. To be able to use the unprepared spells again, you first need to get a new grimoire and record these spells in it.
    - name: Magic Tricks
      kind: rule
      category: Casting Spells
      fields:
        Description: "So-called {{key: magic tricks | magic trick}} are minor, relatively harmless spells. They are often the first thing a mage learns, as these simple spells train their minds to handle magical power. Each school has its own magic tricks. The limit on prepared spells (above) does not apply to magic tricks. Your magic tricks are always prepared. All magic tricks require a gesture (below) to be cast."
    - name: Zero WP
      kind: rule
      category: Casting Spells
      fields:
        Description: Some spells can drain [[WP]] from another person. Hitting zero WP has no other effect than prohibiting the use of abilities that require WP.
    - name: Power Level
      kind: rule
      category: Casting Spells
      fields:
        Description: The power level of a spell indicates how much power you charge it with. The power level ranges from 1 to 3. Casting a spell costs 2 [[WP]] per power level. In other words, normal spells always cost at least 2 WP, and [[magic tricks|magic trick]] always cost 1 WP. Some spells do not use power level – these always cost 2 WP.
    - name: Power from the Body
      kind: rule
      category: Casting Spells
      fields:
        Description: If you have just one or zero [[WP]] left, you can draw power from your body if need be. But this is harmful, potentially even lethal. Roll a die of your choice (D4, D6, D8, D10, D12, or D20) before casting the spell – the result indicates how many WP you gain and must use straight away, but you also take the same amount of damage. WP not used immediately are lost. The damage is applied after the spell is cast. Power from the body cannot be used for healing spells.
    - name: Magic and Metal
      kind: rule
      category: Casting Spells
      fields:
        Description: Metal has an anti-magical effect, which means that you cannot use magic if you are wearing metal armor or have a metal weapon at hand (page 45). This includes partially metal items such as axes, spears, studded leather, and arrows (but not staves, clubs, or slings). Items in your inventory do not count.
    - name: Rank
      kind: rule
      category: Casting Spells
      fields:
        Description: To
    - name: Rank
      kind: rule
      category: Casting Spells
      fields:
        Description: To
