format: 1
intro:
  sections:
    - name: Intro
      body: Described below are a number of [[heroic abilities|heroic ability]]. All [[player characters|player character]] except mages get one heroic ability each at the start of the game, and you can earn new ones as described on page 29. Note that some heroic abilities require a minimum [[skill level]] to be learned. Some cost [[Willpower Points|wp]] to activate, others do not. Unless stated otherwise, it is possible to combine multiple abilities in the same action, e.g. Assassin and Dragonslayer, but you must pay the WP cost for each ability you wish to use. Some heroic abilities require optional rules. If you are playing without these optional rules, those heroic abilities should not be used.
