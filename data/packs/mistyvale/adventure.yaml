      - id: the-isle-of-mist/conclusion
        title: Conclusion
        kind: section
        page: 118
        body: "If Azrahel Koth is slain, the corrosive mist over the island dissipates as its existence was bound to his dark soul. The demon sorcerer may be defeated and the player characters earn another heroic ability each, but many questions remain unanswered as they leave the labyrinth beneath Mirror Lake. What is Sathmog planning, what should Um-Durman be used for, and who exactly was the dragon emperor Eledain? Are the dragons involved somehow? If you want to hint at the answers to these epic questions, you can read or act out the text in the sidebar to the right as the player characters re-emerge into the daylight after the final battle. Some of these threads will be explored further in future expansions of Dragonbane."
        sections:
          - id: the-isle-of-mist/conclusion/what-happens-next
            title: "What Happens Next?"
            kind: section
            page: 118
            body: "By defeating Azrahel Koth, the player characters have eliminated a serious threat to Outskirt. They will probably have built up quite a reputation in both the village and the more remote parts of the valley. Presumably hailed as local heroes, they will be approached by people from far and wide who need help with various problems. Perhaps they are appointed Earls of the Misty Vale and set to mediate between orcs, humans, and other kin? This is something you can develop into your own adventures. The wild card in all of this is of course Sathmog, who still plots his revenge from beyond this world. His servants are legion, licking their wounds until they are ready to fulfill their unholy oaths of vengeance against Eledain as well as the player characters. The knights of Eledain are another cause for concern, and what is the situation with the dragons of the Dragonfang Peaks? Have the player characters inadvertently managed to upset the delicate balance between dragons and demons?"
            images:
              - images/art/the-isle-of-mist-conclusion-what-happens-next.jpg
          - id: the-isle-of-mist/conclusion/meeting-the-dragon
            title: Meeting the Dragon
            kind: sidebar
            page: 118
            body: "The first thing you notice as you step out into the daylight is that the demonic mist has been driven from the area. You gaze out over a bleak and barren island, surrounded by the black waters of Mirror Lake and littered with twisted bodies. Then you see the dragon – a majestic creature with shimmering green scales and enormous wings. It is perched on a rock some twenty meters in front of you, staring at you with cold, reptilian eyes. Feeling small and insignificant, you are gripped by a strong impulse to bow before the winged beast. “I thank you, friends,” rumbles the dragon in a thunderous, commanding voice: “You have saved the light and the cleansing fire. The three-tongued one was stopped at the threshold of his world, and Um-Durman is once again in safe hands.” The dragon spreads its mighty wings and takes to the air with a few swift beats. It leaves you with a final message before disappearing from view – a telepathic hiss that seems to fill your souls and demand that you bow to a higher power: “The time of the great cleansing is nigh. Eledain awaits his sword. He awaits his faithful servants. He will summon you when the time is right.” Finally, the dragon disappears into the sky before the player characters have time to react."
