title: The Misty Vale
source: adventure
chapters:
  - id: introduction
    title: Introduction
    number: 1
    kind: chapter
    page: 5
    body: "Welcome to the Adventure Book for Dragonbane! On these pages you will find no fewer than eleven complete adventures, which together form the epic campaign The Secret of the Dragon Emperor. Except for the Isle of Mist (page 102) which is the campaign finale, the adventures can be played in any order, and you do not even need to play all of them. Each can be played as a stand-alone adventure if that is what you prefer. Before the adventures you will find the opening scene of the campaign, a detailed description of the Outskirt village in the Misty Vale where the adventures take place, and a chapter with random encounters that can take place during journeys in the valley. Enjoy!"
    sections:
      - id: introduction/preamble
        title: Preamble
        kind: section
        page: 5
        sections:
          - id: introduction/preamble/for-the-gms-eyes-only
            title: For the GM’s Eyes Only
            kind: sidebar
            page: 5
            body: This book is for the Gamemaster’s eyes only. If you intend to enjoy these adventures as a player, stop reading now, otherwise you will ruin the suspense for yourself and the rest of the gaming group.
          - id: introduction/preamble/the-misty-vale
            title: The Misty Vale
            kind: section
            page: 5
            body: "The adventures in this book take place in the Misty Vale, a fabled place that for centuries remained beyond human reach. According to legend, the valley was once the heart of a powerful dragon-worshiping empire. But this great civilization fell into ruin and the valley was overrun by orcs. The Misty Vale is surrounded by high mountains – the Kummer Mountains in the south and the Dragonfang Peaks in the north. Remnants of an ancient road system can sometimes be seen in hollows and passes between the mountaintops. But getting down into the valley is a hazardous enterprise that requires skilled pathfinders and"
            keywords:
              - Misty Vale
          - id: introduction/preamble/adventure-cards
            title: Adventure Cards
            kind: sidebar
            page: 5
            body: |
              Each adventure site is presented on an adventure card included in the box. Hand these cards to the players when they hear about the place from an NPC.
              brave swordsmen. The dangers are many and the paths treacherous. The valley spans roughly 150 kilometers in both length and width. It was named the Misty Vale because of the impenetrable haze that often lies thick over the area. The terrain mainly consists of dense old-growth forests, but near the Kummer River are two large lakes and a vast wetland known as the Haunted Marshes. Around Outskirt, which in recent years has emerged in the southern part of the valley, there are rolling hills and partially cultivated plains. Fragments of the imperial roads that long ago connected the different parts of the region can be seen in the valley as well, with crumbling and overgrown paving stones occasionally peeking from between moss and ferns. Cracked stone pillars and strange milestones – with jagged, horned crowns at the top – also rise out of the terrain at regular intervals.
          - id: introduction/preamble/the-map
            title: The Map
            kind: sidebar
            page: 5
            page_end: 7
            body: The large full-color map included in the box shows the Misty Vale in all its glory. The PCs can acquire the map in the opening scene of the campaign. On the next spread is a GM version of the map that shows where the different adventures take place. Note that Deepfall Breach, which you can explore while playing Dragonbane solo, is also marked on the map.
      - id: introduction/the-misty-vale
        title: The Misty Vale
        kind: map
        page: 7
        images:
          - images/maps/introduction-the-misty-vale.jpg
          - images/maps/introduction-the-misty-vale-2.jpg
      - id: introduction/history
        title: History
        kind: section
        page: 8
        body: |
          A thousand years ago, the vile demon Sathmog came to our world. His prophet was a village priest named Azrahel Koth. The demon whispered dark secrets in his ear until his magic grew so powerful that he could open a rift between the worlds and allow his dark master to take physical form. With Azrahel Koth as his herald, Sathmog proclaimed a demonic realm in the world of humans that lasted two centuries. It was a time of darkness and evil, but also one of incredibly rapid human expansion at the expense of the elder kin – dwarves, elves, giants, and halflings. As time passed, the opposition to Sathmog grew, until one day a young hero named Eledain managed to summon the ancient dragons charged with guarding the world from demonic influence. Mounted on dragonback, with the elder kin as his allies, Eledain finally defeated the demon. The beast was banished on a hill in the depths of the forest, but as his final act he cast a curse which he said would spread a sickness throughout the world and one day be its undoing.
          Azrahel Koth was captured, but since his master had made him immortal, Eledain’s knights could not slay him no matter how hard they tried. Instead, he was imprisoned in a crypt under an island in a lake in a remote valley, guarded by warriors sentenced to remain at their posts until the end of their days.
        sections:
          - id: introduction/history/eledains-empire
            title: Eledain’s Empire
            kind: section
            page: 8
            body: "Eledain founded a new empire, based on the worship of dragons and their cleansing fire. His realm expanded, cities were built, and paved roads spread through the wilderness. Soon the elder folk grew weary of humanity’s advance, and many left. The dwarves burrowed themselves into the mountain and built a new realm underground. In the autumn of his life, Eledain started to distrust and fear the dragons who had carried him to victory against Sathmog. To secure his power, the dragon emperor sacrificed part of his soul to forge Um-Durman, a magical sword with the power to slay dragons and demons alike. Finally, the humans would be free and independent of primeval beings. When Eledain eventually passed away the sword was hidden in a crypt, as the dragon priests believed the weapon to be too dangerous to be used except in extreme emergencies. Opening the crypt required a special key: a statuette split into four pieces, one for each direction ruled by the dragon emperor. After Eledain’s death, a power struggle broke out between his sons, and the empire took a tyrannical turn. All protests against the dragon knights’ rule were severely punished and the realm was beset by strife. Finally, the dragons turned their backs on the empire, which collapsed shortly thereafter. Savage orcs invaded much of the region and many humans were forced into exile. All that remained from Eledain’s reign were the fading words of monks and knights who continued to worship the Immaculate Flame. But legend has it that part of the dragon empire survived across the sea in the far east."
            keywords:
              - Dragon Emperor
              - Eledain
            images:
              - images/art/introduction-history-eledains-empire.png
          - id: introduction/history/azrahel-koth
            title: Azrahel Koth
            kind: section
            page: 9
            body: |
              Centuries passed and the stories of Sathmog, Eledain, and Um-Durman became myth and legend. But Sathmog did not forget. Trapped between the worlds he dreamed of revenge, and his growing anger made him stronger. Eight hundred years after his banishment, the demon had grown powerful enough to awaken his servant Azrahel Koth from his magical slumber. His demonic influence turned his captors into undead thralls, who ventured into the Misty Vale and forcibly recruited living souls into Azrahel Koth’s growing band of servants.
              Azrahel Koth could still not leave his prison, so he summoned monstrous beasts and his power spread across the region. His evil affected nature itself and a thick mist settled over the valley. The orcs in the area feared these demonic forces and decided to leave, which cleared the way for humans and other kin to repopulate the region, unaware of the mist’s origin. Several of these humans fell under Sathmog’s demonic influence. Azrahel Koth’s goal is to become free and then to let Sathmog into the world once more, defeat the dragons once and for all, and reestablish his master’s rule.
      - id: introduction/current-situation
        title: Current Situation
        kind: section
        page: 9
        body: "A decade has now passed since humans started returning to the Misty Vale, as they call it due to the thick haze that covers the valley – drawn by rumors and legends of hidden riches and lost knowledge from the old dragon-worshiping empire. Equally significant was that the dwarves of the Kummer Mountains, who for centuries have traded with human settlements, reported that the ferocious orcs who long dominated the Misty Vale seemed to be withdrawing. Many adventurers fastened swords to their belts and made their way to the mysterious valley, but settlers with pickaxes and ox-drawn carts were also attracted to the legendary site."
        sections:
          - id: introduction/current-situation/outskirt-village
            title: Outskirt Village
            kind: section
            page: 9
            body: "The village of Outskirt emerged as a result of the influx of humans in recent years. It is a humble settlement of fifty or so newly built houses clustered around an old temple ruin. There are roughly 200 permanent residents, most of them humans, as well as many adventurers, hunters, and other wanderers who use the settlement as a base for journeys in the Misty Vale. The inhabitants of Outskirt are bold and adventuresome, filled with a pioneering spirit and determination to retake the vale and all its hidden secrets and riches. But only a few know that the settlement rests on the ruins of an ancient temple that was once the heart of a draconic empire – the final resting place of the sword Um-Durman."
          - id: introduction/current-situation/the-dragon-statuette
            title: The Dragon Statuette
            kind: section
            page: 9
            body: "Many unwary adventurers in the Misty Vale fell victim to Azrahel Koth’s power, and his cultists quickly grew in number. When he heard the legend of Um-Durman, the demon sorcerer realized that the sword could kill him, but that it was also the key to his freedom and a mighty weapon against the dragons. Azrahel Koth knows that Um-Durman is buried beneath the temple ruin in Outskirt Village and that it takes a special key to unlock the entrance – the statuette of black volcanic stone that depicts the former dragon emperor Eledain. According to ancient writings, the statuette has been split into four pieces – one for each direction ruled by Eledain – which must be assembled in order to open the gate to Um-Durman."
            sections:
              - id: introduction/current-situation/the-dragon-statuette/the-four-piece-statuette
                title: The Four-Piece Statuette
                kind: sidebar
                page: 10
                body: |
                  The statuette of Emperor Eledain is roughly half a meter tall and sculpted from black volcanic rock. It depicts a warrior emperor in full plate armor and a great helm with an ornate, draconic visor. On the top of the helmet is the same horn-like crown as those on the milestones in the Misty Vale. Eledain is holding a scepter in one hand while the other grasps a mighty longsword with the tip pointing down at the pedestal. The statuette is split into four pieces, which are depicted on the large map of the Misty Vale. Each piece counts as a quarter of an item in the player characters’ inventory.
                  ✦The first piece is the pedestal, the lower legs, and the bottom half of the imperial longsword, whose tip merges with the pedestal.
                  ✦The second piece consists of the statuette’s thighs, waist, left side of the torso, and left arm, including the scepter.
                  ✦The right side of the torso, the right arm, and the upper part of the longsword make up the third piece of the statuette.
                  ✦The fourth and final piece is the head and its crowned helmet.
                  The four pieces fit together perfectly. When placed against each other, they are drawn together by an invisible force and can no longer be separated. The fully assembled statuette counts as a regular item (weight 1) and radiates a pulse of heat from within. To open the entrance to Um-Durman, the statuette must be placed in a purpose-built niche inside the village’s old temple ruin, which is described in detail under location #8 in the chapter on Outskirt Village
          - id: introduction/current-situation/the-demon-cultists
            title: The Demon Cultists
            kind: section
            page: 9
            body: Azrahel Koth has many corrupted servants looking for the four-piece statuette. One of them was Drigel Weatherman, the dying cultist whom the player characters encounter in the opening scene of the campaign (page 11). Weatherman found a piece of the statuette in the Kummer Mountains just before the start of the adventure and was on his way back to deliver it to his master. Another cultist is Leanara, Azrahel Koth’s eyes and ears in Outskirt. She can act as a source of information and quest giver for the player characters, but also serves as Azrahel Koth’s spy and assassin. Read more about Leanara on page 15. All demon cultists in the Misty Vale have the black mark of Sathmog branded somewhere on their bodies, usually on the forearm, hidden under clothes. The mark is a stylized demon’s head with two sharp horns (see the illustration above).
            images:
              - images/art/introduction-current-situation-the-demon-cultists.jpg
          - id: introduction/current-situation/the-orcs
            title: The Orcs
            kind: section
            page: 10
            body: |
              Azrahel Koth is not the only one looking for the sword Um-Durman. The presence of his demonic servants has caused the valley’s orcs to become concerned and several clans have banded together under Chieftain Maladûk to drive out the followers of Sathmog. Maladûk knows the legend of Um-Durman and realizes that Azrahel Koth will never be defeated if he gets his hands on this ancient weapon. The chieftain has withdrawn with her elite warriors to await the final battle, but has also sent orc patrols and goblin wolfriders to track down the four pieces of the statuette. All creatures who serve Maladûk have the mark of two crossed meat hooks burned into their right shoulder.
              Sunlight: Due to the thick haze covering the Misty Vale, orcs and goblins can move freely outdoors in the daytime without suffering damage (page 90 and 95 in the Rulebook).
          - id: introduction/current-situation/the-keepers-of-the-immaculate-flame
            title: The Keepers of the Immaculate Flame
            kind: section
            page: 10
            body: "A third faction looking for the statuette and Um-Durman is the Keepers of the Immaculate Flame, a religious order of monks and knights who worship the dragon emperor Eledain. They see themselves as heirs of the ancient dragon knights and seek to reestablish Eledain’s empire, based on the principle of the cleansing fire. The Keepers of the Immaculate Flame abhor demons – particularly Sathmog, whom their scriptures describe as the root of all evil. Their goal is to find Um-Durman and bring the sword for safekeeping to the head of their order beyond the Misty Vale. What not even the order knows is that Azrahel Koth’s return has also caught the attention of the ancient dragons of the Dragonfang Peaks…"
            sections:
              - id: introduction/current-situation/the-keepers-of-the-immaculate-flame/the-legend-of-um-durman
                title: The Legend of Um--Durman
                kind: sidebar
                page: 11
                body: |
                  It is important that the player characters hear the legend of Um-Durman at an early stage. Have an NPC tell them the story below – Annabella/Leanara (page 21) would be a good choice, but other alternatives are Alfilia Shadowleaf, Dranath, Maladûk, or the she-spider Saak’shal. The legend is also found on an adventure card.
                  The sword Um-Durman was forged by the dragon emperor Eledain eight hundred years ago, when the world was a battlefield for dragons and demons. It is the blade of life, made to maintain the balance between order and chaos.
                  It is a weapon for the free and unbound against the ancient evils. But in the wrong hands, Um-Durman becomes a weapon of tyranny – an instrument of demonic darkness or draconic fire.
                  After Eledain’s death, the sword was buried in a crypt that can only be opened with a special key: a statuette split into four pieces, one for each direction under Eledain’s rule.
                  The truth is that what is today known as the Misty Vale was the heart of Eledain’s empire – and Um-Durman’s crypt is hidden under the old temple ruin in Outskirt Village.
                  But opening the crypt requires the four pieces of the statuette. They have been missing for centuries, sought by Eledain’s servants as well as the followers of the demon prince Sathmog. They can likely be found somewhere among the ruins of the Misty Vale.
            keywords:
              - Immaculate Flame
              - Keepers
            images:
              - images/art/introduction-current-situation-the-keepers-of-the-immaculate-flame.jpg
      - id: introduction/course-of-events
        title: Course of Events
        kind: section
        page: 11
        body: The Secret of the Dragon Emperor is a series of adventures set in the Misty Vale. The campaign has a pre-written opening scene and a finale where the adventurers will face Azrahel Koth and his army of demonic servants in the maze beneath the Isle of Mists. In between, the player characters may explore the valley and take on the adventures in any order. As GM, you decide in which adventures the four pieces of the dragon statuette can be found. That means you also control how long the campaign will be, without steering the players in a particular direction.
        sections:
          - id: introduction/course-of-events/the-adventure-cards
            title: The Adventure Cards
            kind: section
            page: 11
            body: "The players should be free to choose which adventures they want to play, but you can influence the selection by informing them of a few adventures at a time. You do this by using the adventure cards in the box. Each card contains a rumor about an adventure site, which can be relayed by a suitable NPC. We suggest that you give the players 2–3 rumors to choose from and add more as the campaign progresses."
          - id: introduction/course-of-events/the-opening-scene
            title: The Opening Scene
            kind: section
            page: 11
            body: "The story begins when the player characters find a dying man on their way to the Misty Vale through the Drakmar Pass. Before drawing his final breath, he hands them a bloodstained bundle and mentions what he calls “the secret of the dragon emperor.” Afterwards they are attacked by a patrol of goblins who have come for the bundle, which contains a piece of the dragon statuette. The dying man also has a map of the Misty Vale."
          - id: introduction/course-of-events/outskirt-village
            title: Outskirt Village
            kind: section
            page: 11
            body: "After the opening scene the player characters arrive in Outskirt. The cultist Leanara (page 21) tries to trick them into finding the missing statuette pieces for her. The player characters can also encounter Alfilia Shadowleaf from the Keepers of the Immaculate Flame, the mystic Dranath, and others who know about the legend of the dragon emperor’s statuette and other things in the valley. During the rest of the campaign, Outskirt will be an important place for the player characters – a place where they will return to recover between adventures, purchase gear, or seek information. This book therefore contains a detailed description of Outskirt, starting on page 14."
          - id: introduction/course-of-events/riddermound
            title: Riddermound
            kind: sidebar
            page: 11
            body: If you are not sure which adventure to start with, we recommend Riddermound (page 33). It is relatively short and simple and is a good introduction for new players. You decide whether a piece of the dragon statuette can be found there.
          - id: introduction/course-of-events/um-durman
            title: Um-Durman
            kind: section
            page: 12
            body: Having found all four pieces of the statuette, after many hardships and exciting adventures, the player characters can finally enter the crypt under the temple ruin in Outskirt and get their hands on Um-Durman. This will likely involve a confrontation with Leanara and her lackeys. If the player characters succeed, each of them is rewarded by a heroic ability of their choice.
          - id: introduction/course-of-events/the-isle-of-mist
            title: The Isle of Mist
            kind: section
            page: 12
            body: "With Um-Durman in their possession the player characters can reach the Isle of Mist in the north and finally confront Azrahel Koth. This is because the island is shrouded in a corrosive mist which can only be cleared by using the sword. Defeating the demon sorcerer will put a stop to Sathmog’s evil plans – for now – and earn each player character another heroic ability of their choice. But will it also upset the balance between dragons and demons?"
          - id: introduction/course-of-events/demonic-omens
            title: Demonic Omens
            kind: table
            page: 12
            table: Demonic Omens
    images:
      - images/art/introduction.png
  - id: opening-scene
    title: Opening Scene
    number: 2
    kind: chapter
    page: 13
    body: The Drakmar Pass is a narrow passage through the Kummer Mountains. Its ancient but still discernible road makes it an important route for adventurers, settlers, and others seeking their fortune in the Misty Vale. However, the influx of travelers has also attracted brigands and the occasional beast to the mountain pass.
    sections:
      - id: opening-scene/the-situation
        title: The Situation
        kind: section
        page: 13
        body: "Drigel Weatherman, one of Azrahel Koth’s human servants, has been looking for the dragon emperor statuette for some time, and carries a map to facilitate the search. A few days before the start of the adventure he made his first find – the pedestal of the legendary artifact, found in an abandoned mine beneath the Kummer Mountains. But Weatherman’s happiness was short-lived. On the way to Outskirt village and Leanara, he was spotted by goblins patrolling the area. The goblins know nothing about Um-Durman but have orders from the chieftain Maladûk to keep an eye out for a precious relic split into four smaller pieces. They have been told that this relic is sought by many, both living and undead, and so the bundle Weatherman was hauling around caught their attention. Weatherman managed to flee the initial confrontation but was badly wounded by a poisoned arrow. The player characters find him on the verge of death, and he sees in them his last chance to bring the relic to Leanara. But the goblins are drawing closer – just as Weatherman hands over his mysterious bundle, the first arrow comes whizzing through the air."
      - id: opening-scene/on-to-the-misty-vale
        title: On to the Misty Vale
        kind: section
        page: 13
        body: |
          When the adventure begins, the player characters have been traveling for days through the high and rugged Kummer Mountains, trying to find a way down to the Misty Vale. Begin the session by reading or acting out the text below:
          The ancient and narrow pass runs through the mountains like an axe gash. Steep, moss-covered slopes rise to the snow-laden peaks that can occasionally be glimpsed through the veils of cloud. Somewhere ahead lies the Misty Vale, the legendary place where the empires of old stored their wealth and magical artifacts. It is the rumor of these treasures that has brought you here – the vast riches and arcane secrets hidden among the ruins on the other side of the mountains. And you are not the first to be lured by such temptations. Since the orcs started leaving the area, about a decade ago, a growing stream of settlers and adventurers have made their way to the Misty Vale. But you know the way is treacherous and fraught with peril. The old imperial roads have crumbled and the mountains are teeming with danger. The Drakmar Pass, where you now find yourself, is particularly infamous. The dwarves of the Kummer Mountains have warned that the humans’ return has attracted brigands and ravenous beasts to the area. Your fears come true when you suddenly hear a disconcerting whimper. You see a figure lying in the middle of the rocky trail, only twenty or so meters ahead of you. The figure is wearing a simple gray robe and clutching a dark bundle to his chest. As the whimper turns into a rattling wheeze, you realize the person is gravely wounded.
      - id: opening-scene/black-arrow-in-master-weatherman
        title: Black Arrow in Master Weatherman
        kind: section
        page: 14
        body: "Weatherman is found at point #1 on the map. If the player characters move closer, they see his pale, panic-stricken face and notice that one of his thighs is pierced by a thick, black arrow. If they examine the wound, it takes no skill roll to conclude that the arrow is poisoned. Purple-blue streaks branch out from the wound and can also be seen on Weatherman’s face. Suddenly he sits up straight and hands his bundle to the player character with the highest CHA, staring wide-eyed at them and saying in a breathy, fading voice: “Quick, take it! Leanara will understand… message from Master Weatherman… must find all four pieces… the secret of the dragon emperor! ”"
        keywords:
          - Weatherman
      - id: opening-scene/the-ambush
        title: The Ambush
        kind: section
        page: 14
        body: "The next moment, goblin scouts attack from point #2 and #3 on the map. They are as many as the player characters, evenly split between the two positions. They fire their short bows before charging at the adventurers with their melee weapons raised. If the players are actively looking around, each can make an AWARENESS roll to notice the attack in time and then draw the initiative as usual. All those who fail get the bottom cards (counting from #10 and up), randomly drawn. All the goblin scouts act on the same turn."
        sections:
          - id: opening-scene/the-ambush/the-worg-rider
            title: The Worg Rider
            kind: section
            page: 14
            body: "The second round is when the goblin’s worg riding commander attacks, having previously been hidden behind the boulder at #4. His attack is surprising, and he automatically gets initiative card #1 this round."
            images:
              - images/art/opening-scene-the-ambush-the-worg-rider.jpg
          - id: opening-scene/the-ambush/scouts
            title: Scouts
            kind: npc
            page: 15
            body: "The chattering goblin scouts are unsightly creatures with stinking breath and ill-fitting leather armor. They all bear the black mark of Maladûk on their right shoulder. The scouts all act on the same turn in combat."
            creatures:
              - core/monster/adventure-scouts
          - id: opening-scene/the-ambush/the-worg-rider-2
            title: The Worg Rider
            kind: monster
            page: 15
            body: The goblin commander is armed with a scimitar and a long spear and rides a bloodthirsty worg. The worg rider counts as a monster in combat and acts on a separate turn.
            creatures:
              - core/monster/adventure-the-worg-rider
      - id: opening-scene/drakmar-pass
        title: Drakmar Pass
        kind: map
        page: 14
        images:
          - images/maps/opening-scene-drakmar-pass.jpg
      - id: opening-scene/the-end-of-combat
        title: The End of Combat
        kind: section
        page: 15
        body: The goblins flee when the worg rider dies. The fight is supposed to be an introduction to the combat rules of Dragonbane. Should things go badly for the player characters, Jory or Hardy from Outskirt (page 14) can come to their rescue.
      - id: opening-scene/the-map-and-the-statuette
        title: "The Map & the Statuette"
        kind: section
        page: 15
        body: |
          Weatherman draws his final breath before the player characters can ask further questions. The bundle turns out to contain two remarkable objects: a map and a piece of a black statuette.
          ✦The map shows the Misty Vale and is included in this box. Hand it to the players now. Note that the four pieces of the statuette are depicted in the corners of the map.
          ✦The statuette piece is a pedestal, lower legs, and the bottom part of a sword, likely from a basalt statuette of a humanoid warrior.
      - id: opening-scene/clues
        title: Clues
        kind: section
        page: 15
        body: "If the players notice the statuette pieces on the map, you can confirm that this piece looks just like the one in the lower left corner of the map. The characters have now also heard the names Weatherman and Leanara, as well as a cryptic reference to “the secret of the dragon emperor.” By searching the dead man’s body, they can also find the black symbol of Sathmog branded on Master Weatherman’s left forearm. They can follow up on these leads later, for example by asking around among the guests at the Three Stags inn at Outskirt."
    images:
      - images/chapters/opening-scene.jpg
  - id: outskirt
    title: Outskirt
    number: 3
    kind: chapter
    page: 16
    body: |
      TThe village Outskirt has developed around a crumbling temple ruin from the golden age of the dragon emperors. Most of the buildings are simple log cabins or rough timber houses, constructed in the last decade by adventurers, settlers, and fortune hunters.
      Outskirt is a place far away from honor and probity, filled with dreams and adventure, where every rumor and kind smile may lead you to glory, wealth, and everlasting fame – or to a sudden and excruciating death.
    sections:
      - id: outskirt/arrival
        title: Arrival
        kind: section
        page: 16
        body: |
          After the opening scene, the player characters will probably head directly to Outskirt. It takes roughly a day’s march to get there. Even if they go somewhere else first, they will likely end up in Outskirt sooner or later. The vegetation thickens into dense forest as the player characters descend toward the Misty Vale. Luckily, they can simply follow the remains of the same old path winding its way through the mountains and down into the forest, which means it takes no BUSHCRAFT roll to find their way to Outskirt. Here and there are weathered milestones protruding from the terrain, some of them decorated with stylized, archaic crowns. A few kilometers from Outskirt the forest thins out and opens into cultivated fields. Soon the player characters are squelching along muddy wagon tracks. Read or act out the following text to the players as they approach Outskirt:
          The wagon tracks give way to a paved road that cuts through the high grain fields. Countless smells invade your senses: manure, smoke, and rotting vegetables, but also freshly baked bread and grilled meat. The road leads to a settlement surrounded by a palisade, with lots of small houses with smoking chimneys visible beyond its sharpened logs. The village gate is closed and flanked by two low but sturdy towers of stone with crenellations and pointed wooden roofs. Drawing closer, you hear the stern voice of a man barking at you from one of the towers: “Halt, strangers! State your names and business or turn back to the forest – this is a place of peace and decency.”
          The tower is location #2a, and the man in the tower is Hardy (page 19). He wants to know their names and why they have come to Outskirt. If they answer his questions and assure him that they come in peace, the gate creaks open. Should the player characters ask questions, Hardy firmly refers them to Vagnhild at the Three Stags inn.
      - id: outskirt/the-situation
        title: The Situation
        kind: section
        page: 17
        body: |
          Outskirt is the hub for the adventures that make up The Secret of the Dragon Emperor. It is a place where the player characters can upgrade their gear and purchase new weapons, hone their skills, and recover between excursions. But it is also a place where you can plant clues which the players characters must find to progress the story. When the characters arrive in Outskirt, it is important that they quickly learn about the legend of the dragon emperor’s statuette and the sword Um-Durman (page 8), so they are drawn into the adventure. Having gained clues in the opening scene, they will likely ask around the village, and there are several people who can tell them the myth. For example:
          ✦Leanara/Annabella: Secret Sathmog cultist at the Three Stags (page 21).
          ✦Alfilia Shadowleaf: Eledain knight at the Three Stags (page 22).
          ✦Dranath: Mystic at the Chapel of Eledain (page 26).
        sections:
          - id: outskirt/the-situation/the-dragon-temple
            title: The Dragon Temple
            kind: section
            page: 17
            body: "Outskirt is built around an ancient temple where the dragon emperor Eledain and his descendants are buried. Little of the building remains today, but in a crypt beneath the ruined walls rests Um-Durman – the magical sword coveted by Eledain’s nemesis, Sathmog. Opening the entrance down to the legendary weapon requires the fully assembled statuette of Eledain, which must be placed in a certain niche. Read more under location #8."
          - id: outskirt/the-situation/the-demon-cultist
            title: The Demon Cultist
            kind: section
            page: 17
            body: |
              In Outskirt they will meet Leanara, the Sathmog-worshiping demon cultist mentioned by Master Weatherman in the opening scene. She has received two orders from Azrahel Koth: to monitor the temple ruin and keep an eye on adventures visiting Outskirt. Leanara can usually be found at the Three Stags inn (#2) where she works as a maid under the name of Annabella. She communicates with Azrahel Koth through messages delivered to the Isle of Mist by demonic bats. She has a handful of lesser cultists at her command, led by the bitter mallard warrior Quasimund. The player characters are immediately watched by Leanara. She identifies them as competent adventurers and a potential way to Um-Durman. If the player characters start asking questions about “Leanara” or “the secret of the dragon emperor”, she quickly makes herself known. Even if they are passive, Leanara will approach them under a suitable pretext. Leanara’s plan is to let the player characters find the statuette pieces and the entrance to Um-Durman, before taking the sword from them and bringing it to Azrahel Koth. She does not reveal her connection to Sathmog, but tries to trick the player characters by feeding them important information mixed with lies and half-truths. She tells them the legend of Um-Durman and then continues:
              “I’m part of a sacred organization called the Truth Society, which strives to bring ancient artifacts and lost knowledge back to humankind. You strike me as capable adventurers. Would you help me find the lost statuette pieces and open the crypt of Eledain? Our order is not rich, but we can offer you 50 gold coins per piece – and the honor of fighting for a good cause. But beware – an order of dragon-worshiping knights is also looking for Um-Durman. They seek to reestablish the old draconic empire and enslave everyone living in the Misty Vale.”
              If the player characters accept this quest, Leanara tells them about one or more adventure sites where pieces of the statuette may be found (page 17). Should the player characters expose and neutralize Leanara before finding Um-Durman, it is instead Quasimund who arranges the ambush in the temple area. Read more on page 27.
            sections:
              - id: outskirt/the-situation/the-demon-cultist/stubborn-players
                title: Stubborn Players
                kind: sidebar
                page: 17
                body: "If the players turn down Leanara’s quest and only want to go treasure hunting in the Misty Vale, let them have their way for a while. It is a long campaign and there are several NPCs out there who can put them on the right track, including orc chieftain Maladûk (page 46) and the she-spider Saak’shal (page 65). Increasing demonic omens (page 10) should motivate them as well."
          - id: outskirt/the-situation/random-events
            title: Random Events
            kind: table
            page: 18
            table: "Outskirt: Random Events"
          - id: outskirt/the-situation/more-about-the-village
            title: More About the Village
            kind: section
            page: 18
            body: Apart from the Three Stags inn and about fifty timber residences, Outskirt consists of a shop, a mill, and a smithy. The old temple area has become home to a mystic who makes a living dispensing healing magic and predicting the future. Outskirt has no village council, but innkeeper Vagnhild acts as the informal leader of the settlement. Her establishment is where the villagers gather for discussions and deliberations, and it is Vagnhild who coordinates the guards along the palisade.
          - id: outskirt/the-situation/rumors-in-outskirt
            title: Rumors in Outskirt
            kind: section
            page: 18
            body: The rumors on the next page can be used to provide information about the adventure sites where the player characters can find pieces of the dragon emperor statuette. Many NPCs in Outskirt can relay these rumors as tips on places to explore. The rumors can be chosen or randomly selected. In the box you will also find them on playing cards that you can hand to the players.
            sections:
              - id: outskirt/the-situation/rumors-in-outskirt/rumors
                title: Rumors
                kind: table
                page: 19
                table: "Outskirt: Rumors"
      - id: outskirt/outskirt
        title: Outskirt
        kind: map
        page: 20
        images:
          - images/maps/outskirt-outskirt.jpg
      - id: outskirt/locations
        title: Locations
        kind: section
        page: 21
        sections:
          - id: outskirt/locations/1-palisade
            title: Palisade
            number: "1"
            kind: location
            page: 21
            body: |
              A crude palisade of sharpened logs winds its way around the settlement. It is not very high, maybe the height of one and a half men. Several large gaps can be seen between the logs.
              ✦Guards: The palisade area is patrolled around the clock by three villagers, in addition to the guard captain at the South Gate (#2a). One of them is always manning one of the towers at the North Gate (#2b) while the others walk back and forth along the palisade.
              ✦Random Event #1 and #5 can occur here.
          - id: outskirt/locations/2a-south-gate
            title: South Gate
            number: 2a
            kind: location
            page: 21
            body: A low, double-gated entrance is flanked by two round towers of stone. There is a paved road leading south.
            sections:
              - id: outskirt/locations/2a-south-gate/armed-villagers
                title: Armed Villagers
                kind: npc
                page: 21
                body: "The village guard follows a rotating schedule, organized by Vagnhild (#4). All villagers participate in the defense plan."
                creatures:
                  - core/monster/adventure-armed-villagers
                keywords:
                  - Armed Villagers
                images:
                  - images/people/outskirt-locations-2a-south-gate-armed-villagers.jpg
              - id: outskirt/locations/2a-south-gate/continued
                title: Continued
                kind: text
                page: 21
                body: |
                  ✦Captain Hardy: The captain of the guard resides in one tower; the other is used as a briefing room and gathering place for the guard patrols. Hardy can usually be found in one of the towers.
                  ✦Random Event #1 and #5 can occur here.
              - id: outskirt/locations/2a-south-gate/hardy
                title: Hardy
                kind: npc
                page: 21
                body: "Hardy is a battle-hardened war veteran in his 40s, with shoulder-length hair and a broken nose. He is the strong, silent type, but does have a sentimental side that tends to come out after a few mugs of mead at the inn. Sometimes Hardy heads out in the wilds to drive off goblins, bandits, and other potential troublemakers. During these expeditions he is often accompanied by Jory – son of Master Ulvar who runs the village shop (#5) – whom Hardy regards as his future successor."
                creatures:
                  - mistyvale/monster/hardy
                keywords:
                  - Hardy
                images:
                  - images/people/outskirt-locations-2a-south-gate-hardy.jpg
            keywords:
              - South Gate
          - id: outskirt/locations/2b-north-gate
            title: North Gate
            number: 2b
            kind: location
            page: 22
            body: |
              A low gateway is flanked by two round towers of stone with pointed wooden roofs. A well-trodden path leads out through the gate and snakes off through the terrain.
              ✦Lookout: There is always a villager standing guard in one of the towers. He or she watches the surrounding area, and is always equipped with a large horn. At the first sign of danger, the guard blows the local warning signal: three short horn blasts followed by one long blare. During emergencies the number of guards is increased to four, two in each tower.
              ✦Random Event #1 and #5 can occur here.
            keywords:
              - North Gate
          - id: outskirt/locations/3-the-village-square
            title: The Village Square
            number: "3"
            kind: location
            page: 22
            body: |
              The inn, the smithy, and the shop all face an open space where a weathered statue rises from the earth. It is a strange relic from a bygone era, which seems to depict a warrior in antiquated armor.
              ✦The Dragon Emperor: Time has not been kind to the statue. Both arms have fallen off, but one can still make out a helmet with a horn-like crown. With a successful MYTHS & LEGENDS roll, the player characters recognize the statue as the dragon emperor Eledain, who is said to have ruled this part of the world many centuries ago. They also notice great similarities between the statue and the four-piece statuette on Weatherman’s map.
              ✦Random Event: All random events on page 16 can occur here.
          - id: outskirt/locations/4-the-three-stags
            title: The Three Stags
            number: "4"
            kind: location
            page: 22
            body: |
              An impressive two-story building with a massive, thatched roof and half-timbered walls. Outside the door hangs a red sign that says “The Three Stags – Beer, bed, and food at heavenly prices”. Cheery voices spill out onto the street, along with the smell of roasted boar.
              ✦Common Room: The Three Stags is the village watering hole. From early morning to well after midnight there are D12+1 villagers and visitors sitting in the common room – eating, drinking, gossiping, and warming their joints by the great fireplace. Delicious meat stews and homemade beer or mead are served at normal inn prices (page 80 in the Core Rulebook).
              ✦Vagnhild: As they enter, the player characters are welcomed by Vagnhild. Although she rumbles authoritatively, she is quite cheerful and friendly and gives each of them a tankard of mead on the house. She offers to answer questions about the area and can relay rumors about adventure sites in the Misty Vale (page 17). She also tells them the following: – Large bats have lately been seen flying over the rooftops. Hardy has tried to shoot down several of them but has so far been unsuccessful. – A mystic named Dranath has settled in the temple area. He is an inexhaustible source of knowledge about the past and a skillful healer.
              ✦Lodging: Upstairs there are ten beds divided between two double rooms and a dormitory. The prices are the same as in the Core Rulebook.
              ✦Investigations: It is hard to imagine a better place to seek information about the Misty Vale. Clues the player characters may have missed in other places can easily be placed here, perhaps in the form of a rumor or a merry song.
            sections:
              - id: outskirt/locations/4-the-three-stags/vagnhild
                title: Vagnhild
                kind: npc
                page: 22
                page_end: 23
                body: Vagnhild is an authoritative but jovial woman in her 40s. She keeps her graying hair in bulky braids and wears a thick leather apron. Vagnhild used to be a mercenary and always carries a warhammer on her belt.
                creatures:
                  - mistyvale/monster/vagnhild
                keywords:
                  - Vagnhild
                images:
                  - images/people/outskirt-locations-4-the-three-stags-vagnhild.jpg
              - id: outskirt/locations/4-the-three-stags/continued
                title: Continued
                kind: text
                page: 23
                body: |
                  ✦Leanara: The Sathmog cultist Leanara spends most of her time at the Three Stags, where she has taken on the role of a perky, seemingly trustworthy maid named Annabella. She will not wait long to contact the player characters, as described on page 15.
                  ✦Quasimund’s Scum: The guests in the common room often include the drunken mallard Quasimund and his band of brutes (as many as the player characters). They drink mead and exchange tall tales while glaring suspiciously at the other guests. All of them have sold their souls to Sathmog and obey Leanara’s every command.
              - id: outskirt/locations/4-the-three-stags/leanara-annabella
                title: Leanara/Annabella
                kind: npc
                page: 23
                body: "Leanara has served Sathmog ever since her family was killed by fanatical Eledain knights. She is a haggard woman of indeterminate age, but with kind eyes and deep dimples. Leanara has lost everything and will gladly lay down her life if that is what it takes to thwart the servants of Eledain – including the player characters."
                creatures:
                  - mistyvale/monster/leanara-annabella
                keywords:
                  - Leanara/Annabella
                  - Annabella
                  - Leanara
                images:
                  - images/people/outskirt-locations-4-the-three-stags-leanara-annabella.jpg
              - id: outskirt/locations/4-the-three-stags/continued-2
                title: Continued
                kind: text
                page: 23
                body: |
                  ✦Alfilia Shadowleaf: Also at the inn is a knight from the Keepers of the Immaculate Flame, Alfilia Shadowleaf – a sworn enemy of Sathmog and his cohorts, but like them she seeks Um-Durman. She is quiet and sullen and throws suspicious glances at Quasimund and his thugs. Read more on page 22.
                  ✦Bats: Player characters who search the inn and succeed with a SPOT HIDDEN roll will find a cage with D3 sleeping bats hanging outside a window on the second floor. If they hide and keep an eye on the window, they will see Leanara fetch one of the bats within one shift. With a successful SNEAKING roll, the player characters can follow her to the temple area, where she releases the bat after attaching a small piece of paper to its leg.
              - id: outskirt/locations/4-the-three-stags/quasimund
                title: Quasimund
                kind: npc
                page: 23
                body: The mallard Quasimund is a failed fortune hunter who regularly frequents the Three Stags. He has a bitter and violent side which tends to come out when he drinks too much mead. He has sold his soul to Sathmog for a few pieces of silver and half a keg of mead.
                creatures:
                  - mistyvale/monster/quasimund
                keywords:
                  - Quasimund
                images:
                  - images/people/outskirt-locations-4-the-three-stags-quasimund.jpg
              - id: outskirt/locations/4-the-three-stags/quasimunds-scum
                title: Quasimund’s Scum
                kind: npc
                page: 24
                body: Quasimund’s Scum are the dregs of Outskirt, drunken wrecks of settlers and adventurers who lost everything in their pursuit of riches. Like Quasimund they have sold their souls to Sathmog and are always willing to give their lives for the supreme darkness. They attack as a group, at least equal in number to the player characters.
                creatures:
                  - core/monster/adventure-quasimund-s-scum
                keywords:
                  - Quasimund’s Scum
                images:
                  - images/people/outskirt-locations-4-the-three-stags-quasimunds-scum.jpg
              - id: outskirt/locations/4-the-three-stags/alfilia-shadowleaf
                title: Alfilia Shadowleaf
                kind: npc
                page: 24
                body: The knight Alfilia Shadowleaf is sent by the Keepers of the Immaculate Flame. She is looking for the keys to Um-Durman, while at the same time trying to prevent the sword from ending up in the hands of Azrahel Koth. As her base she has chosen the Three Stags, where she is often seen in the large common room. Read more about what Alfilia knows in the sidebar on the next page.
                creatures:
                  - mistyvale/monster/alfilia-shadowleaf
                sections:
                  - id: outskirt/locations/4-the-three-stags/alfilia-shadowleaf/what-alfilia-knows
                    title: What Alfilia Knows
                    kind: sidebar
                    page: 25
                    body: |
                      Alfilia Shadowleaf is grumpy and quiet, but if the player characters gain her trust – for example by showing a statuette piece and succeeding with a PERSUASION roll – she can tell them the legend of the dragon emperor’s statuette and provide the following clues:
                      ✦Sathmog has reawakened one of his ancient servants, the demon sorcerer Azrahel Koth, to find the sword Um-Durman.
                      ✦Azrahel Koth is probably in his crypt beneath Mirror Lake. He seems to be bound to that unholy place but has many spies and servants in the Misty Vale.
                keywords:
                  - Alfilia Shadowleaf
                  - Alfilia
                images:
                  - images/people/outskirt-locations-4-the-three-stags-alfilia-shadowleaf.jpg
              - id: outskirt/locations/4-the-three-stags/demonic-bats
                title: Demonic Bats
                kind: monster
                page: 24
                body: Through Azrahel Koth, Leanara has gained command of a swarm of demonically controlled vampiric bats. Some are kept in a cage, but most of them are scattered in the area around Outskirt. The swarm arrives two rounds after being telepathically summoned by Leanara. For stats, see page 99 in the Rulebook.
                creatures:
                  - core/monster/adventure-demonic-bats
            keywords:
              - The Three Stags
              - Three Stags
          - id: outskirt/locations/5-master-ulvars
            title: Master Ulvar’s
            number: "5"
            kind: location
            page: 24
            body: |
              This is an oblong, windowless log building. On the roof there are goats feeding on the unkempt grass. Above the entrance hangs a grained wooden sign saying “Master Ulvar’s” in curling letters.
              ✦Master and Son: The shop is run by the proud Master Ulvar with assistance from his indolent and disinterested son Jory.
              ✦Gear: The shop does not sell weapons, shields, or armor, but most other Common items listed in chapter 6 of the Rulebook can be purchased from Master Ulvar.
            sections:
              - id: outskirt/locations/5-master-ulvars/master-ulvar
                title: Master Ulvar
                kind: npc
                page: 25
                body: Master Ulvar is a tall, red-faced man in his 50s with an impressive drooping mustache. He has hands the size of hams and speaks with a booming voice that makes his mustache quiver.
                creatures:
                  - mistyvale/monster/master-ulvar
                keywords:
                  - Master Ulvar
                  - Ulvar
                images:
                  - images/people/outskirt-locations-5-master-ulvars-master-ulvar.jpg
              - id: outskirt/locations/5-master-ulvars/continued
                title: Continued
                kind: text
                page: 25
                body: |
                  ✦On the mist-shrouded island in Mirror Lake is the entrance to Azrahel Koth’s unholy resting place. But the island is inaccessible to living creatures, as the mist is demonic and sucks the life out of anything that comes near.
                  ✦Alfilia Shadowleaf has made several failed attempts to get past the mist around the mysterious island. She suspects it would take powerful anti-demonic magic to break through it – such as the sword Um-Durman.
                  ✦She is convinced that Azrahel Koth has several spies in Outskirt. She has seen demonic bats flying over the rooftops, and thinks they are being used for secret communication between the crypt under the Isle of Mist and someone in Outskirt.
              - id: outskirt/locations/5-master-ulvars/jory
                title: Jory
                kind: npc
                page: 25
                body: "Jory is Master Ulvar’s beloved son and designated successor at the shop. Unfortunately, young Jory has little interest in shopkeeping. He would rather be a warrior like Hardy, Jory’s greatest role model in life – and according to persistent rumors, Jory’s real father. The mother is unknown, but there is talk of a half-orcish woman who left for the mountains some years ago."
                creatures:
                  - mistyvale/monster/jory
                keywords:
                  - Jory
                images:
                  - images/people/outskirt-locations-5-master-ulvars-jory.jpg
            keywords:
              - Master Ulvar’s
          - id: outskirt/locations/6-smithy
            title: Smithy
            number: "6"
            kind: location
            page: 26
            body: |
              A large log building with an open front. The glow of a hearth can be glimpsed through the smoke, and from the hooks in the ceiling hang all kinds of weapons and armor pieces. Heavy hammer blows and a melodic, dwarven rumble is pouring out into the village square.
              ✦The Twins: The smithy is run by Okald and Badinor, dwarven twins from the Kummer Mountains who chose to settle down among the adventurers in Outskirt after a difficult inheritance dispute. The extraverted Okald handles the customers while Badinor prefers to toil in the smithy with the hammer as his only company.
              ✦Weapons: All Common and Uncommon weapons, shields, and armor listed in chapter 6 of the Rulebook can be purchased from Badinor and Okald. Rare items can be ordered and be ready in a week. The twins can also repair damaged weapons and armor, usually for half the original purchase price
            sections:
              - id: outskirt/locations/6-smithy/okald
                title: Okald
                kind: npc
                page: 26
                body: Okald is a heavily tattooed dwarf woman with a thick braided beard and a formidable underbite. She is happy and friendly and likes to tell stories of her wild years in the mountains, where she wrestled with basilisks, out-ate cave trolls, and hunted dragonspawn in abandoned mines.
                creatures:
                  - mistyvale/monster/okald
                keywords:
                  - Okald
                images:
                  - images/people/outskirt-locations-6-smithy-okald.jpg
              - id: outskirt/locations/6-smithy/badinor
                title: Badinor
                kind: npc
                page: 26
                body: "Badinor is a surly, taciturn dwarf who feels more comfortable around rocks than living creatures. He speaks to the minerals in their own language, and sometimes he even sings – both to his rock and to malleable metal pieces – in an ancient tongue that not even Okald understands. Nevertheless, Badinor is a skillful blacksmith who has the respect of everyone in the village."
                creatures:
                  - mistyvale/monster/badinor
                keywords:
                  - Badinor
                images:
                  - images/people/outskirt-locations-6-smithy-badinor.jpg
          - id: outskirt/locations/7-the-mill
            title: The Mill
            number: "7"
            kind: location
            page: 26
            body: |
              At the edge of the village is a small windmill whose sails rotate slowly in the wind. The mill is connected to a log house where piglets, chickens, and carefree toddlers run around in the fenced yard. An almost irresistible scent of freshly baked bread surrounds the idyllic place.
              ✦Mr. and Mrs. Chubbycheeks: Spouses Semolina and Baryton Chubbycheeks run the village mill. They are halflings and live in the adjoining cottage with their nine children and countless pets.
              ✦Field Rations: The spouses also run a humble bakery where the player characters can buy freshly baked bread for only 3 silver coins per daily ration.
            sections:
              - id: outskirt/locations/7-the-mill/semolina-chubbycheeks
                title: Semolina Chubbycheeks
                kind: npc
                page: 27
                body: Semolina is an unusually muscular halfling with thick upper arms and a flour-stained apron. She keeps the mill wheels turning and produces the flour needed to keep the villagers’ hunger at bay.
                creatures:
                  - mistyvale/monster/semolina-chubbycheeks
                keywords:
                  - Semolina Chubbycheeks
                  - Semolina
                images:
                  - images/people/outskirt-locations-7-the-mill-semolina-chubbycheeks.jpg
              - id: outskirt/locations/7-the-mill/continued
                title: Continued
                kind: text
                page: 27
                body: |
                  Um-Durman.” At the bottom of the niche is a depression. Placing the fully assembled statuette in this depression opens the entrance to the hidden chapel (location #10). When that happens, the ground in front of the niche collapses with a loud crash and reveals a rough-hewn stairway of stone leading down into the dark. A player character standing by the niche must succeed with an EVADE roll or fall four meters and take damage as per the rules on page 53 in the Rulebook.
                  ✦Nocturnal Visits: If the player characters visit the temple during nighttime, they will see Leanara on the first night. She sneaks into the temple area and releases one of her bats, which flutters off over the rooftops with an unpleasant squeak. She then spends about an hour searching the area, seemingly without success, before returning to the Three Stags.
                  ✦Random Event: All random events on page 16 can occur here.
              - id: outskirt/locations/7-the-mill/baryton-chubbycheeks
                title: Baryton Chubbycheeks
                kind: npc
                page: 27
                body: Baryton is a plump but elegant halfling with handsome curls and a winning smile. He is responsible for stock-keeping and sales, as well as baking the bread. He is always stressed, worrying that their resources might not be enough to feed their numerous offspring.
                creatures:
                  - mistyvale/monster/baryton-chubbycheeks
                keywords:
                  - Baryton Chubbycheeks
                  - Baryton
                images:
                  - images/people/outskirt-locations-7-the-mill-baryton-chubbycheeks.jpg
          - id: outskirt/locations/8-the-temple-area
            title: The Temple Area
            number: "8"
            kind: location
            page: 27
            body: |
              A hill in the middle of the village with weathered pillars and the remains of a circular wall. At the crest stands a magnificent but crumbled temple. It is a peaceful place that exudes a sense of bygone glory and ancient mystery.
              ✦The Temple: The circular main building is in disrepair, but the ceiling is covered with a huge symbol. A successful MYTHS & LEGENDS roll reveals that it is a stylized crown of the same kind as those on the milestones in the Misty Vale
              ✦Entrance to the Crypt: There is a small niche hewn into one of the wall segments around the temple. The player characters can find it if they look in exactly the right place or succeed with a SPOT HIDDEN roll. Carved into the niche are archaic runes which can be read with a successful LANGUAGES roll: “Eledain – Emperor of the World – Master of Dragons – Keeper of
          - id: outskirt/locations/9-dranaths-hut
            title: Dranath’s Hut
            number: "9"
            kind: location
            page: 28
            body: |
              A simple dwelling with a grass roof and walls of stacked granite. A connecting garden is surrounded by a low fence. Herbal-smelling smoke billows out of an opening in the roof.
              ✦Dranath: In the smoke-filled hut lives the mystic Dranath. He serves some local gods associated with fire, earth, and vegetation. He spends most of his time meditating but earns his living as a healer.
            sections:
              - id: outskirt/locations/9-dranaths-hut/dranath
                title: Dranath
                kind: npc
                page: 28
                body: Dranath is wrinkled as a shriveled prune and does not have a single hair on his body. He wears a sack-like garment and goes barefoot regardless of the weather. Despite his asceticism, Dranath can be tempted with sweets, and a mug of mead is usually enough to loosen his tongue.
                creatures:
                  - mistyvale/monster/dranath
                keywords:
                  - Dranath
                images:
                  - images/people/outskirt-locations-9-dranaths-hut-dranath.jpg
              - id: outskirt/locations/9-dranaths-hut/continued
                title: Continued
                kind: text
                page: 28
                body: |
                  ✦Healing Magic: Dranath can treat the player characters’ injuries with HEAL WOUND at the price of 5 gold coins per power level.
                  ✦Clues: If the player characters ask the right questions and succeed with a PERSUASION roll or offer him mead or sweets, Dranath can tell them the following: – The legend of Um-Durman (page 9). – A thousand years ago the Misty Vale was ruled by a warlock named Azrahel Koth who served the demon prince Sathmog. Azrahel Koth resided in an unholy fortress on the mist-shrouded island in Mirror Lake. His remains are said to rest in a labyrinthine burial chamber beneath the island. – Azrahel Koth was defeated by the hero Eledain with the help of ancient dragons. Eledain then declared himself emperor of a dragon-worshiping empire that would rule all of the known world. The temple ruin in Outskirt originates from that empire. – A mysterious woman is sneaking around the temple area at night, seemingly looking for something she lost. Dranath has heard her speak in an ancient language to another creature, which responded with a squeak and flew off.
                  ✦Teacher: For a fee of 3 gold coins per shift, Dranath can teach the player characters his skills and spells (page 29 in the Rulebook).
            keywords:
              - Dranath’s Hut
          - id: outskirt/locations/10-the-crypt-of-um-durman
            title: The Crypt of Um-Durman
            number: "10"
            kind: location
            page: 28
            page_end: 29
            body: |
              A tomb-like shrine with empty torch holders on the walls. The darkness is dense, but on a stone altar in the middle of the room you can see a jeweled greatsword, a golden goblet, and an open book. Water from a fountain in the wall pours down into a small font. Menacing statues of knights in horned great helms are placed in the corners.
              ✦Darkness: It is pitch black down here, so the adventurers will need a light source.
              ✦Magical Trap: Touching the sword without first reciting the prayer from Eledain’s prayer book and taking a sip of water from Eledain’s goblet triggers a LIGHTNING BOLT at power level 1. Another LIGHTNING BOLT is triggered for each round of continued contact until the trap’s CHARGE of 20 WP is depleted (each LIGHTNING BOLT uses 4 WP as it is indoors).
              ✦Eledain’s Prayer Book: The hefty tome is open at a page with ancient but clear letters. Reading them requires a successful LANGUAGES roll: “Hail, Emperor of the World – Lord of Light – Punisher of Impurity – Eledain Forever, in the Depths of Our Pure Hearts.”
              ✦Eledain’s Goblet: The golden goblet is decorated with a stylized crown of the kind that can be seen here and there in the Misty Vale.
              ✦Um-Durman: The sword on the altar is of course the much-sought blade Um-Durman, a mastercrafted weapon with beautiful ornaments and a jeweled hilt (see image below). Um-Durman is a greatsword with STR requirement 13, durability 18, and a special version of ENCHANT WEAPON with PERMANENCE – whenever the sword hits a dragon or demon, the attack automatically counts as a dragon roll.
            sections:
              - id: outskirt/locations/10-the-crypt-of-um-durman/leanaras-betrayal
                title: Leanara’s Betrayal
                kind: section
                page: 29
                body: "If the player characters act on behalf of Leanara – or have shared information from their investigations with her – she arranges an ambush outside the entrance and attacks the moment they"
                images:
                  - images/art/outskirt-locations-10-the-crypt-of-um-durman-leanaras-betrayal.jpg
              - id: outskirt/locations/10-the-crypt-of-um-durman/the-crypt-of-um-durman
                title: The Crypt of Um-Durman
                kind: map
                page: 29
                images:
                  - images/maps/outskirt-locations-10-the-crypt-of-um-durman-the-crypt-of-um-durman.jpg
              - id: outskirt/locations/10-the-crypt-of-um-durman/heroic-ability
                title: Heroic Ability
                kind: sidebar
                page: 29
                body: |
                  If the player characters manage to retrieve the sword Um-Durman in the crypt and defeat the cultists, each of them is rewarded with a heroic ability of their choice after the end of the session.
                  emerge from the chapel. She sends a swarm of her demonic bats at the group, while Quasimund comes charging in with his thugs. Leanara throws herself at the player character carrying Um-Durman, with her poisoned knife in hand.
            keywords:
              - The Crypt of Um-Durman
              - Crypt of Um-Durman
              - Um-Durman
