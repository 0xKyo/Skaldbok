  - id: riddermound
    title: Riddermound
    number: 5
    kind: chapter
    page: 35
    body: "Deep in the vast forests of the Misty Vale lies a burial mound called the Riddermound. It is a feared place, haunted by the wight of a powerful knight in the dragon emperor’s service – but the barrow wight is also said to be watching over hidden treasures. Riddermound is a short and relatively simple adventure and a good introduction for new players."
    sections:
      - id: riddermound/the-situation
        title: The Situation
        kind: section
        page: 35
        body: "The old barrow called Riddermound is located in the eastern reaches of the Iron Forest, about two days’ march from Outskirt. The player characters can find their way here via rumors in the town (page 17 and the adventure cards). It’s a possible location of a piece of the dragon statuette – if so, it will be in the sarcophagus in room #9. When the player characters arrive to the barrow (point #1 on the map), the mound has already been opened by a goblin expedition sent by the orc chieftain Maladûk. These grave robbers have all been killed or routed – except for poor Grub in room #5 – but not before provoking the wrath of the wight and some of the lesser undead who inhabit this gloomy realm of shadows. The wight is still on the hunt for grave robbers. It moves back and forth through the mound, slowly but relentlessly – filled with anger over the goblins’ audacity. The wight is described in detail under Tomb of the Dragon Knight (room #9), but it can pass through closed portcullises and doors and thereby show up anywhere. Try to create a suspenseful atmosphere of being hunted, like in a horror film, before the confrontation. Use the wight to unsettle the player characters as they sneak around in the dark. They can hear its heavy, dragging footsteps, the rattling of chainmail, and the loud thuds of its morningstar scraping the walls."
        sections:
          - id: riddermound/the-situation/map-and-locations
            title: "Map & Locations"
            kind: sidebar
            page: 35
            body: "The map on page 35 shows all locations inside the burial mound. You can draw the mound for the players room for room on a whiteboard or a sheet of paper or print the map out and cut the rooms apart to be shown one by one. The descriptions of the rooms all follow the same template. First comes a text in italics that can be read aloud to the players as they enter the room. This is followed by bullet points of the most important things found in the room. Bullet points written in italics are hidden at first glance – to find them, the player characters must look in the right place and make a SPOT HIDDEN roll."
          - id: riddermound/the-situation/random-events
            title: Random Events
            kind: table
            page: 36
            table: "Riddermound: Random Events"
          - id: riddermound/the-situation/leaving-the-mound
            title: "Leaving the Mound?"
            kind: table
            page: 36
            table: "Leaving the Mound?"
      - id: riddermound/locations
        title: Locations
        kind: section
        page: 36
        sections:
          - id: riddermound/locations/1-the-burial-mound
            title: The Burial Mound
            number: "1"
            kind: location
            page: 36
            body: |
              A hill crowned by tall standing stones rises in a glade in the middle of the forest. The place is strangely quiet. However, you notice a faint but ominous odor – a putrid stench like that of rotten vegetables.
              ✦Stone Slab: A roughly hewn, square-shaped slab of stone, 2×2 meters in size, is embedded in the earth at the top of the hill. It has been slightly moved from its original position, and a small gap on one side reveals some form of cavity underneath it. The stone slab is heavy, but pushing it aside requires no die roll.
              ✦Tracks and Droppings: Clear footprints can be seen in the grass of the hill. A player character who succeeds with a BUSHCRAFT roll also identifies small piles of wolf droppings and goblin excrement. The odor is coming from the latter.
          - id: riddermound/locations/riddermound
            title: Riddermound
            kind: map
            page: 37
            images:
              - images/maps/riddermound-locations-riddermound.jpg
          - id: riddermound/locations/2-shaft
            title: Shaft
            number: "2"
            kind: location
            page: 37
            body: |
              An underground shaft opens beneath the stone slab. No bottom can be seen. A musty smell of stale air and dried-up corpses rises from the depths.
              ✦Long Fall: It is five meters to the bottom of the shaft. Each player character must make an ACROBATICS roll to climb down. A rope gives a boon to the roll. On a failure the player character falls as per the rules on page 53 in the Rulebook.
              ✦Vaulted Cave: If the player characters drop a torch or similar light source into the shaft, they can see that it leads down into a vaulted, earthen cave with some form of doorway in the north wall
            images:
              - images/art/riddermound-locations-2-shaft.png
          - id: riddermound/locations/3-antechamber
            title: Antechamber
            number: "3"
            kind: location
            page: 37
            body: |
              A dome-shaped chamber with a floor of beaten earth. In the darkness far above, the opening to the surface looks like a faintly glowing square. In the north wall is a set of double oak doors with iron fittings. A silvery symbol stretches across both doors, which are flanked by statues of knights in antiquated armor.
              ✦Forced Oak Door: The goblins have already forced open the oak door, which is slightly ajar when the player characters arrive.
              ✦Stylized Crown: A successful MYTHS & LEGENDS roll identifies the symbol on the door as a stylized crown from the ancient time when the Misty Vale was ruled by a mighty dragon-worshiping kingdom.
              ✦Tracks In the Dirt: Lots of footprints and drag marks can be seen in the dirt floor.
              ✦Sleeping Bats: A cauldron of vampiric bats hangs in clusters from the chamber’s ceiling. Detecting them requires a passive AWARENESS roll, which in turn makes it possible to SNEAK past them. If this fails, the bats attack. For stats, see page 99 in the Rulebook.
              ✦Goblin Poison Dagger: A player character who makes a SPOT HIDDEN roll finds a curved goblin dagger in the dirt. The blade is coated with lethal viper venom with potency 9.
              ✦NORTH: Double doors leading to the mound tunnels (#4).
          - id: riddermound/locations/4-mound-tunnels
            title: Mound Tunnels
            number: "4"
            kind: location
            page: 38
            body: |
              A dark, damp tunnel through packed earth that branches off in different directions. The air is chilly and filled with musty smells. Slithering roots, worms, and centipedes are hanging like stalactites from the ceiling and make the ground slippery.
              ✦Random Event: Roll D12 on the table on page 34 for each full stretch the characters spend here.
              ✦NORTH: Opening to the guardhouse (#7).
              ✦EAST: Damp earthen tunnel to the family crypt (#6).
              ✦SOUTH: Double doors to the antechamber (#3).
              ✦WEST: Damp earthen tunnel to the servants’ crypt (#5).
          - id: riddermound/locations/5-servants-crypt
            title: Servants’ Crypt
            number: "5"
            kind: location
            page: 38
            body: |
              A dark and damp chamber. Dug-out burial niches cover the walls from floor to ceiling. Broken skeletons, moldered rags, and shards of crushed pottery can be seen all over the place.
              ✦Vandalized: The crypt has clearly been visited by grave robbers. Skeletons have been dragged onto the floor, jars have been crushed and clothes slashed.
              ✦Locked Portcullis: A portcullis blocks the passage to the Lady’s hall (#8). A broken key is stuck in the lock and the portcullis is impossible to unlock. It has armor rating 10 but can be forced by inflicting 30 points of damage or casting a spell such as PILLAR, but such noise will immediately attract the barrow wight.
              ✦Hidden Goblin: Hiding behind the skeletal remains in one of the burial niches closest to the floor is a hyperventilating goblin named Grub. The player characters must search the niches specifically or make a SPOT HIDDEN roll to discover this last surviving member of Maladûk’s expedition.
              ✦Random Event: Roll D12 on the table on page 34 for each full stretch the characters spend here.
              ✦NORTH: Damp earthen tunnel that turns east toward the Lady’s hall (#8), blocked by a locked portcullis.
              ✦SOUTH: Damp earthen tunnel that turns east toward the mound tunnels (#4).
              Grub’s Help: Poor Grub is scared out of his wits, and his only aim is to get out of the mound alive. His first impulse is to run, but if the player characters can PERSUADE him to calm down, he is willing to help them. Having observed the wights movements, he can inform them that it moves unhindered through the mound but seems unwilling to pass through the oak door leading out to the antechamber (#3). Grub has also taken a rusty iron ring with three large iron keys, two intact and one broken, from the guardhouse
              (#7). The rest of the broken key is stuck in the door in #5. The other two go to the portcullises in #6 and #7. Only the lock in #6 can be opened with the key.
            sections:
              - id: riddermound/locations/5-servants-crypt/grub
                title: Grub
                kind: npc
                page: 38
                page_end: 39
                body: "Grub the goblin is a pitiful sight: dirty, wild-eyed, and panting hysterically. He wears battered and broken leather armor and reeks of fear and goblin bodily fluids."
                creatures:
                  - mistyvale/monster/grub
                keywords:
                  - Grub
                images:
                  - images/people/riddermound-locations-5-servants-crypt-grub.jpg
              - id: riddermound/locations/5-servants-crypt/continued
                title: Continued
                kind: text
                page: 39
                body: |
                  ✦Locked Portcullis: An iron portcullis blocks the passage to the Lady’s hall (#8). It can be opened with one of the intact keys from Grub’s iron ring, but it requires a successful SLEIGHT OF HAND roll – on failure the key breaks. The portcullis has armor rating 10 and can be forced open by inflicting 30 points of damage or casting a spell such as PILLAR, but such noise will immediately attract the wight.
                  ✦Trap: A trapdoor is hidden under a thin layer of earth in front of the barred portcullis. Spotting it requires searching the floor and making a SPOT HIDDEN roll. If this does not happen, the first character to approach the portcullis will fall through the trapdoor. The character falls into a pit with sharp wooden stakes at the bottom and takes 3D6 piercing damage. A successful EVADE roll halves the damage (rounding up).
                  ✦Random Event: Roll D12 on the table on page 34 for each full stretch the characters spend here.
                  ✦NORTH: Damp earthen tunnel that turns west toward the Lady’s hall (#8), blocked by an iron portcullis.
                  ✦SOUTH: Damp earthen tunnel that turns west toward the mound tunnels (#4).
          - id: riddermound/locations/6-family-crypt
            title: Family Crypt
            number: "6"
            kind: location
            page: 38
            body: |
              A dark chamber with a packed dirt floor. Seven simple sarcophagi of stone are lined up along the walls. Several of them are open, and two skeletons have been thrown onto the ground.
              ✦Vandalized: Three of the seven sarcophagi have been opened and plundered by the goblins.
              ✦Treasures: If the player characters examine the unopened sarcophagi, they will find four individually buried skeletons – several of them child-sized – dressed in the moldered remnants of beautiful ceremonial garments. They all wear gilded headbands worth 5 gold coins each, as well as jeweled rings worth 3 gold apiece.
          - id: riddermound/locations/7-guardhouse
            title: Guardhouse
            number: "7"
            kind: location
            page: 39
            body: |
              A small room with a floor of beaten earth. The flickering light of a torch streams through a black iron portcullis in the far wall. Two mummified guards with rusted chainmail and long spears flank the barred gate.
              ✦Rusted Portcullis: The barred door is completely rusted out and impossible to open even with the key from Grub in #5. It has armor rating 10 and can be forced open by inflicting 30 points of damage or casting a spell such as PILLAR, but such noise will immediately attract the wight.
              ✦Weapons and Armor: The mummified guards do not come alive, even if the player characters take their weapons and items. The rusty chainmail crumbles immediately if touched, but each guard has a long spear.
              ✦Random Event: Roll D12 on the table on page 34 for each full stretch the characters spend here.
              ✦NORTH: Rusty portcullis blocks the passage to the Lady’s hall (#8).
              ✦SOUTH: Opening to the mound tunnels (#4).
          - id: riddermound/locations/8-the-ladys-hall
            title: The Lady’s Hall
            number: "8"
            kind: location
            page: 39
            page_end: 40
            body: |
              A small room with an oak table in the middle and burning torches on the walls. A mummified woman in gilded chainmail is sitting at the far end of the table. An iron-fitted oak door behind the mummy bears an ancient symbol in glittering silver.
              ✦The Lady: The mummified woman is the dragon knight’s wife. She guards the entrance to her husband’s final resting place and wakes as a ghost if the player characters try to open the oak door to #9 or touch the warhammer Fiendcrusher. She then demands that they leave the burial mound in peace. She speaks in an ancient tongue that can only be understood with a successful LANGUAGES roll. If the player characters persist in stealing the hammer or opening the door, her face contorts into a horrifying grimace before she attacks. If the player characters refrain from doing so, they may instead listen to the Lady’s rather incomprehensible speech. The words for “dragon” and “empire” are mentioned repeatedly, as are the name Eledain, something about the struggle between corruption and the cleansing fire.
              ✦The Fiendcrusher: The mummified woman’s claw-like hands rest on a magnificent light warhammer set with jewels (mastercrafted with STR requirement 7 and durability 15). The warhammer is magical and glows red whenever the bearer is within 10 meters of a demon.
              ✦The Chainmail: The gilded chainmail is light and flexible (armor rating 4, only gives bane to SNEAKING rolls).
              ✦Stylized Crown: A player character who makes a MYTHS & LEGENDS roll can see that the symbol on the iron-fitted oak door is a stylized crown just like the one in the antechamber (#3).
              ✦Torches: The torches burn with magical fire which automatically goes out if they are removed from the burial mound.
              ✦Random Event: Roll D6+3 on the table on page 34 for each full stretch the characters spend here.
              ✦NORTH: Iron-fitted oak door to the tomb of the dragon knight (#9).
              ✦EAST: Damp earthen tunnel to the family crypt (#6), blocked by an iron portcullis.
              ✦SOUTH: Iron portcullis to the guardhouse (#7).
              ✦WEST: Damp earthen tunnel to the servants’ crypt (#5), blocked by an iron portcullis.
            sections:
              - id: riddermound/locations/8-the-ladys-hall/the-lady
                title: The Lady
                kind: monster
                page: 39
                body: The Lady is a translucent, faintly blue shimmering phantom of a tall warrior maiden in full-length chainmail and a gilded headband. Her face looks sad and dignified, but when she attacks it contorts into a terrifying death mask with empty eye sockets. The Lady is a ghost with stats as per page 87 in the Rulebook.
                creatures:
                  - core/monster/adventure-the-lady
                keywords:
                  - The Lady
                  - Lady
                images:
                  - images/people/riddermound-locations-8-the-ladys-hall-the-lady.jpg
            keywords:
              - The Lady’s Hall
              - Lady’s Hall
          - id: riddermound/locations/9-tomb-of-the-dragon-knight
            title: Tomb of the Dragon Knight
            number: "9"
            kind: location
            page: 40
            body: |
              In the middle of a burial chamber with torches on the walls stands a podium with an ornate sarcophagus of stone. The floor, ceiling, and walls are all made of stone bricks. A painting of a ridden dragon can be seen on the far wall.
              ✦The Opened Sarcophagus: The stone coffin has been opened from the inside with tremendous force, and pieces of the shattered lid lie scattered on the floor.
              ✦Dragon Statuette/Demon Crown: One of the pieces of the dragon statuette (page 8) can be found in the sarcophagus, if you chose to place it here. If not, the player characters can instead find a gilded crown imbued with a spell which halves all damage from attacks by demons (rounding up). This effect is explained by the runes on the crown, which can be read with a successful LANGUAGES roll.
              ✦Tomb Trap: A successful SPOT HIDDEN roll reveals that the statuette/crown is connected to a mechanism that could be a trap. And sure enough – if anyone removes the artifact without carefully replacing it with an item of equal weight (normal item), requiring a successful SLEIGHT OF HAND roll, twenty blades shoot out from the sarcophagus in all directions. Everyone within 2 meters must succeed with an EVADE roll or take 2D6 piercing damage.
              ✦The Wight: If the player characters have not already defeated the wight, or it has risen again, it attacks them here.
              ✦Fresco: The dragon in the mural on the back wall has a knight on its back, wearing the same exact gear and horned helmet as the barrow wight.
              ✦Inscription: Ancient runes are engraved on the wall beside the fresco. A player character who makes a LANGUAGES roll can make out something about “the Emperor’s gift” and a “holy wrath” that will consume all who dare touch said gift.
              ✦Random Event: Roll D4+4 on the table on page 34 for each full stretch the characters spend here.
              ✦SOUTH: Iron-fitted oak door to the Lady’s hall (#8).
            sections:
              - id: riddermound/locations/9-tomb-of-the-dragon-knight/the-wight
                title: The Wight
                kind: monster
                page: 40
                body: "The wight is a huge warrior in antiquated plate mail and a horned great helm. The open visor reveals a grim skeleton face with empty eye sockets. It moves slowly and heavily through the mound to the awful sound of scraping metal. The wight is protected by ancient draconic magic inside the mound. It takes damage as per the rules, but if defeated inside the gate in the antechamber (#3), it will rise again in room #9 within one shift (exactly when is up to you). The wight has stats as per page 98 in the Rulebook. It has armor rating 8 and wields a morningstar."
                creatures:
                  - core/monster/adventure-the-wight
                images:
                  - images/people/riddermound-locations-9-tomb-of-the-dragon-knight-the-wight.jpg
    keywords:
      - Riddermound
    images:
      - images/chapters/riddermound.jpg
  - id: bothilds-lode
    title: Bothild’s Lode
    number: 6
    kind: chapter
    page: 41
    body: At the end of a deep ravine on the fringes of the foggy Kummer Mountains lies Bothild’s Lode, an abandoned and flooded dwarven mine, where one dwarf’s greed two hundred years ago unleashed an underground horror and sealed the fates of hundreds of her kinsfolk.
    sections:
      - id: bothilds-lode/the-situation
        title: The Situation
        kind: section
        page: 41
        body: "The story of Bothild’s desperate search for riches in the mine that bore her name is widely known. Bothild spurred her workers to dig deeper and deeper, until they finally broke through to a huge, underground mass of water. The mine was flooded, and a terrible beast was let loose. Some say Bothild knocked on the gates of the netherworld. The player characters can learn about Bothild’s Lode through rumors (page 17 and the adventure cards). The site is a possible location for one of the four statuette pieces (page 8), which in that case is found inside the sarcophagus in room #10. Furthermore, the orc chieftain Maladûk has now made Bothild’s Lode her unlikely fortress during the escalating conflict with Azrahel Koth – something the player characters can find out by questioning goblins or orcs from her clan during their travels in the Misty Vale (see random encounters in chapter 4). However, the player characters do not need this information to play Bothild’s Lode. When the player characters arrive, Maladûk is holding a war council with her subordinates. An encounter with the player characters can end in different ways, depending on the players’ actions. Meanwhile, the White Death, the monstrous sea serpent let in by Bothild’s foolishness, slithers through the flooded tunnels of the mine. Let it show up from time to time – splashing in the water, lunging at someone, and disappearing again – to constantly keep the player characters on their toes. Then there is the constant presence of the many dwarven spirits, the strongest of whom is Bothild’s ghost, who can also know where to find a piece of Eledain’s statuette. But in exchange for this information, she demands that the player characters first eliminate the White Death."
        sections:
          - id: bothilds-lode/the-situation/leaving-the-mine
            title: "Leaving the Mine?"
            kind: sidebar
            page: 41
            body: If the player characters leave the mine to take a shift rest, roll a D6 per shift on the table on page 107 in the Rulebook.
          - id: bothilds-lode/the-situation/random-events
            title: Random Events
            kind: table
            page: 42
            table: "Bothild’s Lode: Random Events"
          - id: bothilds-lode/the-situation/the-water-in-the-mine
            title: The Water in the Mine
            kind: sidebar
            page: 42
            body: |
              Large parts of the mine are filled with water, which allows the White Death to move freely. It also limits the player characters’ movements and creates tactical challenges. Since the water is freezing, the player characters must make a BUSHCRAFT roll to resist cold (page 54 in the Rulebook) for each stretch they spend in it. The water has three different depths, which are indicated on the map.
              ✦Shallow Water: Here the cold water reaches no higher than the player characters’ chests. Dashing is impossible, but otherwise they can move normally.
              ✦Deep Water: The player characters must swim to cross the water. In some places they can see the bottom. See the rules for swimming and drowning on page 53 in the Rulebook.
              ✦Bottomless Water: There is no visible bottom beneath the surface – only darkness. Can only be crossed by swimming.
          - id: bothilds-lode/the-situation/the-white-death
            title: The White Death
            kind: monster
            page: 43
            body: A deathly pale, rough-scaled sea serpent with a thick, wide body and a flat head with milky eyes and three curved horns. The beast emerges silently from the water before letting out a terrible, guttural roar that reeks of centuries of death as it attacks. The White Death can be lured to the surface by lowering a suitable prey into the water. In its belly rests Bothild’s mastercrafted battle axe Bothild’s Broadaxe (STR Requirement 10, durability 12), adorned with runes that recount its owner’s exploits.
            creatures:
              - core/monster/adventure-the-white-death
            keywords:
              - The White Death
              - White Death
          - id: bothilds-lode/the-situation/continued
            title: Continued
            kind: text
            page: 43
            body: "Tail: If an attack aimed at the White Death’s tail (rolled with a bane) draws blood (inflicts at least one point of slashing or piercing damage), roll D6 whenever the sea serpent is about to attack. If the result is 4–6, the beast hits itself instead of a player character. A BEAST LORE roll can make the player characters aware of this weak spot of sea serpents."
      - id: bothilds-lode/locations
        title: Locations
        kind: section
        page: 42
        sections:
          - id: bothilds-lode/locations/1-the-gates-of-bothild
            title: The Gates of Bothild
            number: "1"
            kind: location
            page: 42
            body: |
              The ravine ends in a rock wall where a stone gate, no doubt magnificent in its day, now hangs wearily on broken hinges. A faint light seeps through the gate whose beautiful runes have been destroyed by vandals.
              ✦The Gate: When the gate to Bothild’s Lode was sealed, its inscriptions were removed as well. The word “lode” has been erased and replaced with “folly”. Further insults carved by dwarven vandals can be read with a successful LANGUAGES roll: “White Death’s Triumph,” “Greed’s Price,” “Glittergrubber’s Folly.”
              ✦Scouts: The gate is watched by goblins from the garrison’s lookout posts (#6). The player characters can make a SNEAKING roll if they approach the gate carefully. If everyone succeeds, they slip in unnoticed. If they are discovered, the goblins will sound the alarm – read more under #2.
              ✦EAST: The stone gate leads to the entrance hall (#2).
            keywords:
              - The Gates of Bothild
              - Gates of Bothild
              - Bothild
          - id: bothilds-lode/locations/2-entrance-hall
            title: Entrance Hall
            number: "2"
            kind: location
            page: 43
            body: |
              There are deep wheel tracks in the stone floor of the gently sloping corridor, created by centuries of heavy and precious cargo. Just inside the broken stone gate is a portcullis, wedged half open. At the end of the corridor is a gate above which the ceiling glitters like a starry sky.
              ✦Outer Gate: Inside the gate it is easy to see that both doors have been torn off their hinges and the mechanism that once controlled them is destroyed. The gate cannot be closed.
              ✦Reliefs: The walls are decorated with partially vandalized reliefs of Bothild’s exploits and the dwarves’ work in the mine.
              ✦Inner Gate: If the scouts have raised the alarm (see #1), the inner gate is closed when the player characters get there. The gate is stiff but can be pushed open with a successful STR roll with a bane (others can help). The player characters can also PERSUADE the goblins at Bothild’s Square (#3) to let them in (also with a bane). If the alarm has not been raised, the inner gate is ajar.
              ✦Ambush: Bothild had the ceiling decorated with crystals to create the illusion of a starry sky, which conceals the arrow slits of the garrison (#6). If the alarm has been raised, or if the player characters make a lot of noise, the guards in the garrison will attack. They are as many as the player characters and attack with surprise. Let player characters who are actively watching the ceiling roll AWARENESS to see the holes in the ceiling and notice movement up there. The first guard pours a cauldron of boiling, stinking goblin stew through the hole. Any player character in the room who has not explicitly said they are sticking to the walls is hit and takes D10 damage. The attack can be dodged, but not parried. Then the other guards fire their short bows. They attack with a boon, while the player characters get a bane on attacks against them. Only ranged combat is possible. The player characters can escape the ambush by pushing open the gate to #3 or PERSUADING the goblins to let them in.
              ✦EAST: Stone gate to Bothild’s Square (#3).
              ✦WEST: Broken stone gate that leads out of the mine (#1).
          - id: bothilds-lode/locations/the-gate-area
            title: The Gate Area
            kind: map
            page: 44
            images:
              - images/maps/bothilds-lode-locations-the-gate-area.jpg
          - id: bothilds-lode/locations/3-bothilds-square
            title: Bothild’s Square
            number: "3"
            kind: location
            page: 44
            body: |
              The night sky stretches out and disappears upwards as the corridor gives way to a large open room. There is a big headless statue with a double-headed axe raised towards the ceiling. The air is cold and dank, and a dreamy haze rests over the room.
              ✦Goblins: There is a group of goblins, twice as many as the player characters. If the player characters PERSUADED them to let them in, the goblins will lead the way to Maladûk in the blast furnace (#11). If combat breaks out and the player characters gain the upper hand, the goblins retreat to the stables (#5) and then to the garrison (#6).
              ✦Statue: The statue Bothild erected of herself was destroyed when the gate to Bothild’s Lode was sealed after the disaster. The head is long gone. A keen observer will notice four long, thin braids over the chest.
              ✦Reliefs: See the entrance hall (#2).
              ✦NORTH: Door to the cart stalls (#4).
              To the Mine 3
              ✦EAST: Broken stone door to the mine tunnels (#7). Above the door it says “Bothild’s Domain” in Dwarvish (LANGUAGES for non-dwarves).
              ✦SOUTH: Opening to the stables (#5).
              ✦WEST: Opening to the entrance hall (#2).
            sections:
              - id: bothilds-lode/locations/3-bothilds-square/the-goblins
                title: The Goblins
                kind: npc
                page: 45
                body: "The goblin scouts are chattering, unsightly creatures with stinking breath and ill-fitting leather armor. They all bear the black mark of Maladûk on their right shoulder."
                creatures:
                  - core/monster/adventure-the-goblins
            keywords:
              - Bothild’s Square
          - id: bothilds-lode/locations/4-cart-stalls
            title: Cart Stalls
            number: "4"
            kind: location
            page: 44
            page_end: 45
            body: |
              Wide stalls separated by meter-high stone walls line the north wall of the room. Vandalized reliefs of dwarves loading carts with gleaming silver ingots can be seen on the walls. A dying fire of broken cart parts smolders in the center of the room.
              ✦Reliefs: The silver ingots are real, but thin, and have for some reason been left alone by the goblins. They can be removed quietly with SLEIGHT OF HAND (one action) or loudly by inflicting 10 points of damage (armor rating
              5). Rolling a demon triggers random event #9. There are seven ingots in total, and they are worth 50 silver each.
              ✦Carts: A number of broken carts are stored here. Parts of them can be used as rafts for crossing the deeper waters of the mine.
              ✦Random Event: Roll D4+4 on the table on page 40 for each full stretch that the player characters spend here (only random events #7 and #8 can occur).
              ✦WEST: Curved stone staircase leading up to the garrison (#6).
              ✦SOUTH: Opening to Bothild’s Square (#3).
          - id: bothilds-lode/locations/5-stables
            title: Stables
            number: "5"
            kind: location
            page: 45
            body: |
              There is a pungent smell of wet fur and dung. The walls are decorated with soiled images of dwarves leading horse-drawn carts through dramatic landscapes. Something glints in the darkness of the old stables, and a deep growl is heard.
              ✦Worgs: The stables are now home to the goblins’ worgs. They are half as many as the player characters (rounded up). The worgs don’t attack unless provoked but will protect the goblins (if they retreat) as well as the worg cubs (see below).
              ✦Worg Cubs: In one of the stalls are three worg cubs. The player characters can find them with a successful SPOT HIDDEN roll or by specifically looking in the stalls.
              ✦Reliefs: A successful MYTHS & LEGENDS roll allows the player characters to identify one of the Misty Vale’s adventure sites in the mosaics. The mosaic grants a boon on the BUSHCRAFT roll for leading the way to the site.
              ✦WEST: Curved stone staircase leading up to the garrison (#6).
              ✦NORTH: Door to Bothild’s Square (#3).
            sections:
              - id: bothilds-lode/locations/5-stables/worgs
                title: Worgs
                kind: monster
                page: 45
                creatures:
                  - core/monster/adventure-worgs
          - id: bothilds-lode/locations/6-the-garrison
            title: The Garrison
            number: "6"
            kind: location
            page: 45
            body: |
              This large room is divided by two rows of half-moon shaped, knee-high pedestals. There are evenly spaced holes in the stone floor, as well as a wide channel leading to a large, sizzling cauldron hanging over a fireplace along the east wall. The room reeks of sulfur and rancid meat.
              ✦Goblins: The goblins in the garrison are as many as the player characters. If the player characters manage to PERSUADE them, the goblins can put down their weapons and take them to Maladûk.
              ✦The Skyfire: The cauldron over the fireplace contains a stinking, boiling hot goblin stew that can be poured on intruders in the entrance hall through holes in the floor. Read more under #2.
              ✦The Gates: The remains of the mechanical wonders which allowed the dwarves to open and close the inner and outer gates as well as the portcullises are still here, but nothing works anymore.
              ✦Random Event: Roll D4+4 on the table on page 40 for each full stretch that the player characters spend here (only random events #7 and #8 can occur).
              ✦NORTH: Curved stone staircase leading down to the cart stalls (#4).
              ✦SOUTH: Curved stone staircase leading down to the stables (#5).
          - id: bothilds-lode/locations/7-mine-tunnels
            title: Mine Tunnels
            number: "7"
            kind: location
            page: 46
            body: |
              The tunnel is cold, damp, and smells musty. The ceiling is high, and tiny droplets of water form a ghostly haze that makes it hard to see more than a few meters ahead. Dwarven artwork on the walls bears witness to the former grandeur of this place.
              ✦Random Event: Roll D12 on the table on page 40 for each full stretch that the player characters spend here.
          - id: bothilds-lode/locations/8-the-glimmershaft
            title: The Glimmershaft
            number: "8"
            kind: location
            page: 46
            body: |
              The tunnel ends in an arched gateway. Beyond it is a flooded shaft. A huge chain runs from the ceiling into the water below. Ancient runes glitter above the gateway, and over the water floats a pale, blurred figure, almost as if it were part of the underground fog.
              ✦Bothild’s Ghost: The ghost is terribly bored and complains to the player characters. She also says the mine holds hidden treasures and a piece of the dragon emperor’s statuette (if that is the case) but will not tell them where unless they first avenge her death. Once the player characters have defeated the White Death (and can prove it by bringing back a trophy or Bothild’s axe), she reveals how the door to Bothild’s Rest (#10) can be opened (if they have not offended her). However, she does not mention the traps inside the mausoleum. Bothild’s ghost will attack the player characters if they aggravate her too much but will not leave this place.
              ✦The Runes: The runes (LANGUAGES) form the word “Glimmershaft,” the rich vein of silver that was depleted far too quickly and thus indirectly led to the catastrophe.
              ✦SOUTH: Opening to the mine tunnels (#7).
            sections:
              - id: bothilds-lode/locations/8-the-glimmershaft/bothilds-ghost
                title: Bothild’s Ghost
                kind: monster
                page: 46
                body: The ghost is a blurred echo from the moment of Bothild’s death at the jaws of the White Death. The gaping wound between her neck and shoulder draws all attention from other details, such as the short, scraggly hair, the razor-sharp fringe, and the rat tail-like temple braids. She has also adopted a raspy, hissing voice for dramatic effect. She hates orcs and goblins too much to ever share her secret with them. Bothild has the stats of a ghost as per page 87 in the Rulebook.
                creatures:
                  - core/monster/adventure-bothild-s-ghost
                keywords:
                  - Bothild’s Ghost
                images:
                  - images/people/bothilds-lode-locations-8-the-glimmershaft-bothilds-ghost.jpg
            keywords:
              - The Glimmershaft
              - Glimmershaft
          - id: bothilds-lode/locations/9-antechamber
            title: Antechamber
            number: "9"
            kind: location
            page: 46
            body: |
              The half-submerged rock chamber is illuminated by the glittering stars reflected on the water. A stylized portrait of a female dwarf with a raised axe and a silver apple in her hands adorns a door of stone whose arch is inscribed with glittering runes. Three severed hands are lying on the floor in front of the door.
              ✦Door to Bothild’s Rest: The writing around the door reads “Honor, Wealth, Mother”, which can be translated with LANGUAGES. The axe, the silver apple, and Bothild in the portrait are pressure plates that can be pressed, which the player characters realize if they do just that (and thereby trigger the axe trap, see below) or succeed with a SPOT HIDDEN roll. The door is locked and can be opened by speaking the three words in the order they are written while pressing the reliefs of the axe, the silver apple, and Bothild herself, in that order.
              ✦Severed Hands: The three hands are in different stages of decay. The oldest is practically mummified. They seem to have belonged to a dwarf, a human, and a goblin.
              ✦Axe Trap: Pressing the plates in the wrong order, or without speaking the correct words, triggers an axe trap in the ceiling. It inflicts 2D8 slashing damage but can be dodged with a successful EVADE. The axe trap can be triggered multiple times.
              ✦Opening: Partially underwater in the east corner of the room (a player character must look in that exact spot or roll SPOT HIDDEN) is a large crack where water has seeped through. It leads to another part of the mine tunnels (#7).
              ✦Random Event: Roll D12 on the table on page 40 for each full stretch that the player characters spend here.
              ✦WEST: Opening to the mine tunnels (#7).
              ✦EAST: Stone door to Bothild’s Rest (#10).
          - id: bothilds-lode/locations/the-mine
            title: The Mine
            kind: map
            page: 47
            images:
              - images/maps/bothilds-lode-locations-the-mine.jpg
          - id: bothilds-lode/locations/10-bothilds-rest
            title: Bothild’s Rest
            number: "10"
            kind: location
            page: 47
            body: |
              It smells of damp, algae, and emptiness as the door slides open. A sarcophagus is standing upright in the far corner of the room, behind an altar of white stone inscribed with half-finished runes. The dwarf woman from the door is also seen on the lid of the sarcophagus. The floor is made up of tiles with stylized mouths, eyes, hands, and feet, and littered with masonry tools.
              ✦Traps: Bothild wanted to rest undisturbed and therefore filled her mausoleum with a series of traps, but only a few were completed in time. –Dart Trap: The north and south walls are decorated with half a dozen portraits of Bothild where the eyes or mouth are holes for darts. A person examining the wall can notice the holes with SPOT
              Shallow Water
              Deep Water
              Bottomless Water
              HIDDEN. The trap is triggered if someone steps on a floor tile with a mouth or eye and inflicts 2D6 piercing damage. The darts can be dodged (with a bane) or parried with a shield. –Spear Trap: A player character who examines the altar without touching it can roll SPOT HIDDEN to notice that its base seems to be movable. The altar balances on an axle. If someone touches it, it tilts to the side as eight sharp spears shoot out from all sides of the altar. The spears inflict 2D8 piercing damage on everyone within 2 meters. The trap can be dodged, with a bane.
              ✦Sarcophagus: The sarcophagus that was supposed to be Bothild’s final resting place can easily be opened. It contains treasures equivalent to four treasure cards and a piece of the dragon statuette – if you decided it should be here.
              ✦Random Event: Roll D4+4 on the table on page 40 for each full stretch that the player characters spend here (only random events #7 and #8 can occur).
              ✦WEST: A heavily ornamented stone door leads out to the antechamber (#9).
            keywords:
              - Bothild’s Rest
          - id: bothilds-lode/locations/11-forge
            title: Forge
            number: "11"
            kind: location
            page: 48
            body: |
              A brick furnace covered in glittering runes stretches from the floor to the ceiling, spreading its light throughout the vast mountain hall. It smells of burnt flesh and hair. In the middle of the room, gathered around a mine cart, is a group of orcs engaged in a heated argument.
              ✦Maladûk: The orc chieftain is currently discussing her next move with her officers Uth-Kardan and Kothatuk. The three of them are protected by goblin scouts, as many as the player characters.
              ✦The Boars: The orcs have a wild boar roasting in the furnace and another two hanging next to it. The boars would make good bait for the White Death.
              ✦SOUTHWEST: A cave opening leads out into the mine tunnels (#7).
            sections:
              - id: bothilds-lode/locations/11-forge/malad-k
                title: "Maladûk"
                kind: npc
                page: 48
                body: "The broad-jawed, broader-shouldered Maladûk is an impressive sight with her large fangs and numerous trophies of vanquished foes covering her body. She paints herself in deep red colors and speaks with a calm that conceals her determination and explosive brutality"
                creatures:
                  - mistyvale/monster/malad-k
                keywords:
                  - "Maladûk"
                images:
                  - images/people/bothilds-lode-locations-11-forge-malad-k.jpg
              - id: bothilds-lode/locations/11-forge/continued
                title: Continued
                kind: text
                page: 48
                body: "✦NORTH: A large cave opening leads out to a hidden cleft in the Kummer Mountains. This is where Maladûk and her men entered."
              - id: bothilds-lode/locations/11-forge/officers
                title: Officers
                kind: npc
                page: 48
                creatures:
                  - core/monster/adventure-officers
              - id: bothilds-lode/locations/11-forge/meeting-malad-k
                title: "Meeting Maladûk"
                kind: section
                page: 48
                body: "Whether the player characters show up alone or accompanied by goblins, Maladûk and her subordinates react by drawing their weapons. They demand to know who the characters are and what they are doing here. Maladûk is very suspicious, and it takes a PERSUASION roll to placate her. If the roll succeeds, Maladûk can be reasoned with. If the characters are looking for the dragon statue and explain this to Maladûk, she proposes an alliance against Azrahel Koth. The orc chieftain can tell them about Bothild’s ghost in room #8 and the antechamber (#9) of her tomb, in case the characters have not been there, and warn them of the White Death. Maladûk can also tell them the legend of Um-Durman (page 9) and pass on rumors about several adventure sites where parts of the dragon statuette may be found. An alliance with Maladûk can also prove useful in the final battle against Azrahel Koth – read more on page 115. If the roll fails, Maladûk demands that the player characters drop their weapons and let themselves be taken captive for further questioning, which may well result in violence. If the characters allow themselves to be interrogated and answer truthfully, they can make another attempt to PERSUADE Maladûk each shift. While being interrogated, the player characters are not allowed to rest, sleep, or eat, and suffer a condition each shift. In the unlikely event that the player characters kill Maladûk, they will have lost an important potential ally. The orcs of the Misty Vale will splinter into lots of smaller clans squabbling with each other, many of them harboring a burning hatred towards Maladûk’s killers…"
                sections:
                  - id: bothilds-lode/locations/11-forge/meeting-malad-k/no-campaign
                    title: "No Campaign?"
                    kind: section
                    page: 48
                    body: "If you are playing Bothild’s Lode as a standalone adventure with no ties to the campaign The Secret of the Dragon Emperor, Maladûk and her retinue have simply come to Bothild’s Lode to claim its hidden treasure. They are not keen on sharing it."
    keywords:
      - Bothild’s Lode
      - Bothild’s
    images:
      - images/chapters/bothilds-lode.jpg
  - id: temple-of-the-purple-flame
    title: Temple of the Purple Flame
    number: 7
    kind: chapter
    page: 49
    body: The Temple of the Purple Flame is a demonic temple from the time of Sathmog’s reign (page 6) and was called Korash-Bal in the old language. For centuries it has sat overgrown and abandoned in the Magna Woods. But a portal to Sathmog’s world still stands ajar, and the demon cultists are not the only ones in search of its secrets.
    sections:
      - id: temple-of-the-purple-flame/the-situation
        title: The Situation
        kind: section
        page: 49
        body: |
          The player characters can hear of the Temple of the Purple Flame in Outskirt. The name is widely known because of the murals on the building’s exterior, but almost no one has ventured inside the gates. The temple is said to hold untold treasures and forbidden knowledge, but also to be guarded by an ancient evil. This is a possible location for one of the four pieces of the dragon statuette (page 8), which in that case can be found in the demonic realm (#12). Sathmog has recently sent a group of cultists to investigate the temple. If you are playing The Secret of the
          Dragon Emperor, their goal is to find one of the statuette pieces. Otherwise, they are just looking for lost knowledge in general. Three of the cultists went through the portal in the bowels of the temple while the others were struck by fear and waited outside. When two of them returned from the demonic realm, horrifically twisted, the others chose to flee while the former stayed behind in the innermost chamber of the temple. The player characters can encounter the fleeing cultists in various parts of the temple. Furthermore, the demonic influence of the other world has caused an unnatural and chaotic increase in animals and plants in and around the temple. The doors are open, but it is also possible to climb the wall into the herb garden (#4) if the characters investigate the area surrounding the temple.
        sections:
          - id: temple-of-the-purple-flame/the-situation/leaving-the-temple
            title: "Leaving the Temple?"
            kind: sidebar
            page: 49
            body: If the player characters leave the temple to take a long rest, roll D6 per shift on the table on page 107 in the Rulebook.
          - id: temple-of-the-purple-flame/the-situation/random-events
            title: Random Events
            kind: table
            page: 50
            table: "Temple of the Purple Flame: Random Events"
          - id: temple-of-the-purple-flame/the-situation/demon-cultists
            title: Demon Cultists
            kind: npc
            page: 50
            body: "A group of cultists, as many as the player characters, are on their way out of the temple. There used to be five more of them – one died in the trapdoor in the altar room (#5), three went through the portal (#11), of whom one never returned and two returned changed, and one died in the conflict with them before the others managed to escape. The surviving cultists are wounded, terrified and desperate. They have lost several torches and food rations and just want to get out of the temple. They all wear black robes. One cultist has a key to the door of the staircase in the guardroom (#6). They know there is supposed to be a bone mask that protects its wearer from demonic influence somewhere in the temple. They see it as a holy relic but have not been able to find it. They are not necessarily hostile to the player characters, especially if the characters are friendly and helpful. Their loyalty to Sathmog and the cult has dwindled a bit over the course of the mission. They may reveal that Annabella in Outskirt is a member of their cult."
            creatures:
              - core/monster/adventure-demon-cultists
            images:
              - images/people/temple-of-the-purple-flame-the-situation-demon-cultists.jpg
          - id: temple-of-the-purple-flame/the-situation/murderous-briars
            title: Murderous Briars
            kind: monster
            page: 51
            body: The demonic energies leaking out of the portal have caused the briars around the temple to grow huge and develop an appetite for fresh meat. Anyone who gets too close risks being attacked. The briars lack consciousness and act on instinct alone.
            creatures:
              - core/monster/adventure-murderous-briars
            keywords:
              - Murderous Briars
          - id: temple-of-the-purple-flame/the-situation/continued
            title: Continued
            kind: text
            page: 51
            body: "Combustible: Takes double damage from fire attacks. Resistance: Takes half damage from piercing and bludgeoning weapons."
          - id: temple-of-the-purple-flame/the-situation/continued-2
            title: Continued
            kind: text
            page: 51
            body: |
              ✦NORTH: Open doors to the vestibule (#2).
              ✦NORTHWEST: A crumbled wall overgrown with enormous briars. Trees can be glimpsed behind it. Climbing the wall requires an ACROBATICS roll with a boon, but the briars are alive and will attack the player characters. See above. On the other side of the wall is the herb garden (#4).
      - id: temple-of-the-purple-flame/locations
        title: Locations
        kind: section
        page: 50
        creatures:
          - core/monster/adventure-demon-cultists
        sections:
          - id: temple-of-the-purple-flame/locations/1-outside-the-temple
            title: Outside the Temple
            number: "1"
            kind: location
            page: 50
            body: A large and impressive but severely dilapidated stone temple. Its towers and spires have collapsed and much of the building is covered with abundant vegetation dominated by huge briars with formidable thorns. The stone gate stands slightly ajar. The remains of murals with a pattern of violet flames can be seen on the walls beside the gate.
            keywords:
              - Outside the Temple
          - id: temple-of-the-purple-flame/locations/2-vestibule
            title: Vestibule
            number: "2"
            kind: location
            page: 51
            body: |
              This large vestibule has a high ceiling and is dominated by heavy, hexagonal stone pillars. The dim light from outside falls on flaking murals of demonic monsters tearing vanquished dragons to shreds in a landscape lit by a violet sun.
              ✦Random Event: Roll D12 on the table on page 48 for each full stretch that the player characters spend here.
              ✦NORTH: Stone double door to the altar room (#5), slightly ajar.
              ✦WEST: A short corridor to the courtyard (#3) through which sunlight enters.
              ✦SOUTH: Open stone doors to the outside of the temple.
          - id: temple-of-the-purple-flame/locations/3-courtyard
            title: Courtyard
            number: "3"
            kind: location
            page: 51
            body: |
              A large open garden without a roof. It is overgrown with huge briars, blossoming ornamental trees, and unkempt grass along the paths. The scent of flowers is soothing.
              ✦Giant Blueberries: Knee-high blueberry bushes hang heavy with 4D6 berries the size of eyeballs. Each berry is a tiny item but counts as a full meal – however, anyone who eats them gets a bit groggy and suffers the Dazed condition.
              ✦Random Event: Roll D12 on the table on page 48 for each full stretch that the player characters spend here.
              ✦WEST: Opening to the herb garden (#4), hidden behind some trellises covered in twining vines. Can be discovered if the player characters look in exactly the right place or roll SPOT HIDDEN.
              ✦NORTHEAST: Half-broken wooden double door to the altar room (#5).
              ✦SOUTHEAST: Short corridor to the vestibule (#2).
              ✦NORTH: Opening to a short corridor leading to the guardroom (#6), hidden behind briars along the wall. Can be discovered if the player characters look in exactly the right place or roll SPOT HIDDEN.
          - id: temple-of-the-purple-flame/locations/4-herb-garden
            title: Herb Garden
            number: "4"
            kind: location
            page: 52
            body: |
              A smaller part of the garden, hidden behind low walls and overgrown trellises. It is dominated by lush plants, herbs, and spices. Bumblebees are buzzing. A person in natural-colored clothes is pulling weeds.
              ✦Hafarmal: The person is Hafarmal, an old elf who has come to the garden to harness the growth-stimulating power seeping out of the portal. The tobacco he grows is particularly potent.
              ✦SOUTHWEST: The wall is damaged and overgrown with climbable vines and leads out of the temple.
              ✦EAST: Overgrown passage to the courtyard (#3).
            sections:
              - id: temple-of-the-purple-flame/locations/4-herb-garden/hafarmal
                title: Hafarmal
                kind: npc
                page: 52
                body: "Dressed in natural-colored clothes, including a robe and cloak. Has a hoarse voice and is constantly smoking a pipe. Unbeknownst to himself, his eyes have been turned completely black by his proximity to the portal. Hafarmal can heal injured player characters and knows about the secret passage in the north wall of the courtyard (#3). Hafarmal has encountered the cultists and does not like them disturbing the peace. He is aware of the portal in the cellar (#11) and knows how to close it but wants it to stay open. He can be PERSUADED to change his mind."
                creatures:
                  - mistyvale/monster/hafarmal
                keywords:
                  - Hafarmal
                images:
                  - images/people/temple-of-the-purple-flame-locations-4-herb-garden-hafarmal.jpg
          - id: temple-of-the-purple-flame/locations/5-altar-room
            title: Altar Room
            number: "5"
            kind: location
            page: 52
            page_end: 53
            body: |
              A passage opens into a large, spacious room under a domed ceiling. There is a high altar in the northern part of the room. The air smells dry and dusty. Light streams down from an opening in the center of the dome, where creeping vines have broken through.
              ✦Trapdoor: In the south passage is a trapdoor that is slightly ajar. The player characters notice it if they explicitly examine the floor or move carefully and succeed with a SPOT HIDDEN roll. Anyone who falls through the trapdoor takes 3D6 bludgeoning damage and ends up in the sacrificial pit (#7).
              ✦The Altar is carved from a block of greenish-black stone. Reliefs on each side show demons battling dragons under a violet sun.
              ✦The Bone Mask: If the four suns on the altar, one on each side, are pressed simultaneously, a hatch opens in the altar. The player characters notice that the suns can be pressed if they try, or if they examine the altar and roll a successful SPOT HIDDEN. In the compartment behind the hatch is a frightful-looking mask of yellowed bone. The mask protects the wearer with PROTECTOR (power level 2) and PERMANENCE. It draws WP from its wearer, who must also succeed with a WIL roll to remove it. One attempt is allowed each shift.
              ✦Gong: There is a gong of patinated brass hanging on the west wall. Hitting the gong may attract cultists or wandering monsters – roll on the Random Events table.
              ✦Random Event: Roll D12 on the table on page 48 for each full stretch that the player characters spend here.
              ✦SOUTH: Half-open stone gate to the vestibule (#2).
              ✦EAST: Narrow door to a worn spiral staircase leading down to the vaulted hall (#8).
              ✦SOUTHWEST: Half-broken wooden double door to the courtyard (#3).
              ✦WEST: Iron door to the guardroom (#6).
          - id: temple-of-the-purple-flame/locations/the-temple
            title: The Temple
            kind: map
            page: 53
            images:
              - images/maps/temple-of-the-purple-flame-locations-the-temple.jpg
          - id: temple-of-the-purple-flame/locations/6-guardroom
            title: Guardroom
            number: "6"
            kind: location
            page: 53
            page_end: 54
            body: |
              A dark, enclosed space with a high ceiling. It smells strongly of iron and rust. Vines have crept in through cracks in the wall.
              ✦Skeleton: The remains of a large six-legged beast are bound in shackles, attached to the wall by thick chains. A successful BEAST LORE roll suggests that the skeleton does not come from any natural animal in the known world. The player characters have never seen anything like it.
              ✦Random Event: Roll D12 on the table on page 48 for each full stretch that the player characters spend here.
              ✦Oil Lamp: An oil lamp has tipped onto the floor, but is still half-full and can be lit.
              ✦EAST: Iron door to the altar room (#5).
              ✦SOUTH: Short corridor to the courtyard (#3).
              ✦WEST: A locked door to a narrow spiral staircase leading down to the crossroads (#9). The door can be picked or smashed open (armor rating 10, 30 HP). One of the cultists has the key.
          - id: temple-of-the-purple-flame/locations/the-undercroft
            title: The Undercroft
            kind: map
            page: 54
            images:
              - images/maps/temple-of-the-purple-flame-locations-the-undercroft.jpg
          - id: temple-of-the-purple-flame/locations/7-sacrificial-pit
            title: Sacrificial Pit
            number: "7"
            kind: location
            page: 54
            body: |
              A dark pit with roughly carved stone walls. Several humanoid skeletons in varying degrees of decay lie scattered on the floor, but they are moving. A recently deceased corpse is lying in the middle of the room. The air reeks of death.
              ✦Skeletons: The skeletons have been raised by the reopening of the portal. They are the remains of human sacrifices whom the ancient demon cultists threw into the pit after ceremonies at the altar. When the dead speak to them, the player characters must make a WIL roll to resist their fear. The skeletons are conscious, miserable, and vengeful – they want the temple destroyed and/or the portal closed so they may rest in
            sections:
              - id: temple-of-the-purple-flame/locations/7-sacrificial-pit/skeletons
                title: Skeletons
                kind: npc
                page: 55
                body: Like skeletons in the Rulebook, but conscious. They are unarmed.
                creatures:
                  - core/monster/adventure-skeletons
          - id: temple-of-the-purple-flame/locations/8-vaulted-hall
            title: Vaulted Hall
            number: "8"
            kind: location
            page: 55
            body: |
              A vast and dark hall. Pillars and low arches make it hard to see even with a light source. Water drips down from the ceiling and forms puddles along the uneven floor tiles. A scratching sound is heard from further in the hall. It smells of wild animals and droppings.
              ✦Manticore: A manticore prowls the room. Enlarged and twisted by the energies of the demon world, it is too big to leave through any of the room’s exits.
              ✦EAST: A narrow door to a worn spiral staircase leading up to the altar room (#5).
              ✦SOUTH: Low iron door to the sacrificial pit (#7). It has rusted shut and must be pried open, which makes lots of noise. The door has armor rating 6 and 30 HP.
              ✦WEST: A half-open iron door leads to the crossroads (#9).
              ✦NORTHWEST: A large iron gate with a relief of a violet flame leads to the portal (#11).
            sections:
              - id: temple-of-the-purple-flame/locations/8-vaulted-hall/manticore
                title: Manticore
                kind: monster
                page: 55
                body: The manticore has stats as per the Rulebook, but with 56 HP and Ferocity equal to the number of player characters minus one (minimum 1).
                creatures:
                  - core/monster/adventure-manticore
          - id: temple-of-the-purple-flame/locations/9-crossroads
            title: Crossroads
            number: "9"
            kind: location
            page: 55
            body: |
              There are chains on the floor, attached to the wall. You smell a musky scent, like that of wild animals. Vines have crept in through cracks in the stone along the south wall.
              ✦The chains are mostly broken, with only one shackle still intact. The key is lying next to it.
              ✦Random Event: Roll D12 on the table on page 48 for each full stretch that the player characters spend here.
              ✦EAST: Half-open iron door to the vaulted hall (#8).
              ✦WEST: A narrow spiral staircase leads up to the guardroom (#6).
              ✦NORTH: Behind the chains’ bracket is a hidden door to the portal (#11). The player characters find it if they look in that exact place, or if they search the room and roll a successful SPOT HIDDEN.
              ✦SOUTH: Hidden behind the vines is a secret door to the treasure chamber (#10).
          - id: temple-of-the-purple-flame/locations/10-treasure-chamber
            title: Treasure Chamber
            number: "10"
            kind: location
            page: 55
            body: |
              A chamber with a low ceiling. Part of the ceiling has collapsed, and the floor is covered with stones and gravel.
              ✦Treasure: Among the stones on the floor, the player characters can find treasures equivalent to three treasure cards and an old worn grimoire containing FETCH, FLICK, DISPEL, MAGIC SHIELD, IGNITE, HEAT/ CHILL, GUST OF WIND, FIRE BLAST, TIDALWAVE, and SALAMANDER.
              ✦NORTH: Door to the crossroads (#9).
          - id: temple-of-the-purple-flame/locations/11-the-portal
            title: The Portal
            number: "11"
            kind: location
            page: 55
            body: |
              An ornate chamber with murals and lavishly decorated columns along the walls. The rock seems half-molten, semi-organic, like the inside of a fossil monster. On a marble altar burns a violet fire. Two tall figures with axes are standing at the altar. The north wall, behind the altar, vibrates like a mirror of water.
              ✦The Fire burns without fuel. The light it gives off is not very bright, but anyone touching the flames suffers D6 points of damage. The fire can be extinguished with DISPEL (power level 3), which in turn closes the portal. If the player characters do not know that spell, Hafarmal can be persuaded to help them. Otherwise, the portal remains open for now.
              ✦Cultists: The people at the altar are the two cultists who went through the portal and returned. Speaking in raspy voices, they ask if the player characters have also been summoned by Sathmog and offer them the opportunity to go through the portal to become part of his realm.
              ✦The Portal: Behind the altar, surrounded by ornaments that could be the spine of an unknown beast, a view opens up of a semi-organic city under a purple sky that moves with the observer, projected at skewed angles. It is possible to go through the portal to the demonic realm (#12).
              ✦Murals: The paintings on the walls depict demonic beasts and priests with dark auras sacrificing bound dragons under a violet sun
              ✦SOUTHEAST: Iron door to the vaulted hall (#8).
              ✦SOUTH: Narrow door to the crossroads (#9).
              ✦NORTH: Portal to the demonic realm (#12).
            sections:
              - id: temple-of-the-purple-flame/locations/11-the-portal/twisted-cultists
                title: Twisted Cultists
                kind: npc
                page: 56
                body: The twisted cultists are over two meters tall and unnaturally thin, and their iron armor has fused with their bodies. Their eyes are completely black, and they are surrounded by a purple aura.
                creatures:
                  - core/monster/adventure-twisted-cultists
                images:
                  - images/people/temple-of-the-purple-flame-locations-11-the-portal-twisted-cultists.jpg
              - id: temple-of-the-purple-flame/locations/11-the-portal/continued
                title: Continued
                kind: text
                page: 56
                body: "Demonic Toughness: When a twisted cultist reaches zero HP for the first time, it rises again on its next turn, now with D6 HP and a demonic wrath that increases its damage bonus to +D6."
          - id: temple-of-the-purple-flame/locations/12-the-demonic-realm
            title: The Demonic Realm
            number: "12"
            kind: location
            page: 56
            body: |
              An oily black maze of semi-organic shapes. Violet and purple suns shine in an orange sky, casting their light on towering structures without exterior walls. Too many dimensions, too many angles and corners. A cacophony of voices, too faint to make out what is being said. The pungent smell of blood and decay.
              ✦Sathmog’s Realm: There is no map of the demon prince’s city, as its geometry cannot be understood by creatures from our world. Once a player character has entered the demon city, it takes a number of WIL rolls to find their way out again, and failed rolls have negative effects. Even if several characters go through the portal at the same time, they must walk through the demon city alone. The wearer of the bone mask from the altar room (#5) gets a boon on their rolls. See the tables to the right. Time moves at a different pace in the demon city, so a lot of time may have passed in the real world by the time a player character returns. If too many rolls fail, the character may be stuck here forever. A character who has visited the demon city may suffer permanent demonic alterations.
            sections:
              - id: temple-of-the-purple-flame/locations/12-the-demonic-realm/successful-wil-rolls
                title: Successful WIL Rolls
                kind: table
                page: 56
                table: Successful WIL Rolls
              - id: temple-of-the-purple-flame/locations/12-the-demonic-realm/failed-wil-rolls
                title: Failed WIL Rolls
                kind: table
                page: 56
                table: Failed WIL Rolls
              - id: temple-of-the-purple-flame/locations/12-the-demonic-realm/demonic-alterations
                title: Demonic Alterations
                kind: table
                page: 56
                table: Demonic Alterations
    keywords:
      - Temple of the Purple Flame
    images:
      - images/chapters/temple-of-the-purple-flame.jpg
  - id: tower-of-sighs
    title: Tower of Sighs
    number: 8
    kind: chapter
    page: 57
    body: "Out of the cold mists of the Haunted Marshes rises the ruins of a mighty tower, built at the time of the Dragon Empire as an outpost against the wilderness. After the fall of the empire, the tower served as a meeting place for warring orc clans, until a terrible massacre made them abandon the site. Now the tower is haunted by the sighing and wailing spirits of slain orcs. No one in their right mind ever goes there – not until word of a great treasure spreads through the Misty Vale. The treasure, however, is not what it is rumored to be…"
    sections:
      - id: tower-of-sighs/the-situation
        title: The Situation
        kind: section
        page: 57
        body: "In the days of the old draconic empire, the Tower of Sighs was located on an island in a shallow lake. In a cave on the island was a spring whose waters made it impossible to tell lies. The knights of Eledain built a watchtower on top of the spring and set up a temple in the cave. At the altar in front of the spring, the knights swore oaths to the emperor and the empire. After the collapse of the empire, the temple fell into disrepair and came to be used as a neutral meeting place for various orc clans who had heard tales of the Truth Temple in the tower’s cellar. When one clan decided to lure their enemies into a trap, a violent battle broke out and a fire spell destroyed large parts of the tower. Several orc leaders were trapped in the cave and died of starvation. Since then, the place has been haunted by the restless spirits of the dead. Long afterwards, the broken tower was found by the wandering giant Glam-Glam. He set up a lair on the ruined ground floor and took to hunting and pillaging in the area. He was recently joined by a gang of bandits who had heard rumors of a treasure in the tower’s cellar. The bandits and their leader Ursic offered Glam-Glam a share of their loot if he would remove the stones blocking the way to the cellar. The giant accepted but is more cunning than the bandits think. He has been dragging out the clearing work and getting the bandits to share their stolen goods. That way, he does not have to plunder the land himself and incur the wrath of the peasants. Ursic has started thinking about killing the giant and clearing the last blocks of stone from the entrance themselves. But her bandits need help to defeat Glam-Glam. Rumors in Outskirt speak of a treasure in a ruin in the Haunted Marshes, and there are whispers of brigands plaguing the swamp (page 17). The Tower of Sighs is a possible location for one of the four pieces of the dragon statuette (page 8) – if so, it can be found in the forgotten temple (#3)."
        sections:
          - id: tower-of-sighs/the-situation/encounter-in-the-swamp
            title: Encounter in the Swamp
            kind: section
            page: 57
            page_end: 58
            body: |
              The player characters can encounter the bandits even before they reach the Tower of Sighs. You can also replace this encounter with a regular random encounter in the Haunted Marshes (page 31). The Haunted Marshes is a vast wetland full of buzzing insects, croaking toads, and squawking marsh birds. Low trees with spidery aerial roots form a forest crisscrossed by channels and muddy paths. Suddenly, two voices are heard from amongst the thickets.
              “We won’t make it to the tower before dark and you’re walking so slowly,” says one. The other replies, “Ursic will kill us if we don’t get back tonight. Can’t you carry the keg now? It’s so darn heavy.”
              The voices belong to two young men in light leather armor. The player characters can roll SNEAKING and follow the bandits to the Tower of Sighs. If they fail, or deliberately make themselves known, the two bandits draw their swords and position themselves back-to-back. The bandits defend themselves if attacked but would rather negotiate. Their names are Rilke and Feder. Feder asks where the player characters are headed and wonders if they would be interested in a profitable proposition. He says they belong to a small “adventuring party” that has gotten a whiff of treasure in a tower. The problem is that the treasure is guarded by a giant, a treacherous figure who at first offered to help dig up the treasure but is now only delaying the work. The expedition’s leader, Ursic One-Ear, has been talking about hiring help to slay the giant. Are the player characters interested? Feder and Rilke can introduce them to Ursic, who will surely give them a share of the treasure in exchange for their help. If the player characters accept, Feder and Rilke can lead them straight to the island with the Tower of Sighs. Otherwise, they will have to find the way on their own.
      - id: tower-of-sighs/tower-of-sighs
        title: Tower of Sighs
        kind: map
        page: 58
        images:
          - images/maps/tower-of-sighs-tower-of-sighs.jpg
          - images/art/tower-of-sighs-tower-of-sighs-2.jpg
      - id: tower-of-sighs/locations
        title: Locations
        kind: section
        page: 59
        sections:
          - id: tower-of-sighs/locations/1-the-island-and-the-bandit-camp
            title: The Island and the Bandit Camp
            number: "1"
            kind: location
            page: 59
            body: |
              A great rock surrounded by low trees rises from the swamp. At the top of the cliff is a large tower of red stone. The narrow staircase that once led up to the entrance has been razed and there are gaping holes in the side of the building. The wind carries sighs and bloodcurdling wails from the tower.
              ✦Tower of Sighs: The tower is the highest point in the swamp and can be seen from afar. By now the wails of the undead have made the bandits very nervous.
              ✦Bandit Camp: Ursic and the other bandits (as many as the characters but at least three, in addition to Ursic, Feder and Rilke) are in the camp with two tents and a small fire, between the tower and the grove where the path reaches the island.
              ✦The Giant in the Tower: Glam-Glam is sleeping on the ground floor of the tower.
            sections:
              - id: tower-of-sighs/locations/1-the-island-and-the-bandit-camp/discussions
                title: Discussions
                kind: section
                page: 59
                body: If the player characters are accompanied by Feder and Rilke, or if they come alone but in peace, Ursic invites them to sit down. She offers them a third of the giant’s treasure if they help drive him away. With a successful BARTERING roll, she can agree to share it equally. However, she will let the player characters take all the risks and betray them once the treasure is retrieved.
              - id: tower-of-sighs/locations/1-the-island-and-the-bandit-camp/bandits
                title: Bandits
                kind: npc
                page: 59
                body: Ursic’s bandits are a worn-out bunch, scared and nervous after a long stay on the Isle of Sighs. They are getting tired of Ursic’s obsession with the treasure and morale is low.
                creatures:
                  - core/monster/adventure-bandits
                images:
                  - images/people/tower-of-sighs-locations-1-the-island-and-the-bandit-camp-bandits.jpg
              - id: tower-of-sighs/locations/1-the-island-and-the-bandit-camp/ursic-one-ear
                title: Ursic One-Ear
                kind: npc
                page: 59
                body: A tall, red-haired woman in her forties. She is missing her left ear and has an ugly scar on her neck, as if she has narrowly escaped the gallows. If the player characters are willing to fight Glam-Glam, Ursic will negotiate with them, but intends to betray them so she will not have to share the treasure. If the player characters ignore the bandits, she will keep them in the tower and attack them later if they get out. Read more under Aftermath on page 59.
                creatures:
                  - mistyvale/monster/ursic-one-ear
                keywords:
                  - Ursic One-Ear
                  - Ursic
                images:
                  - images/people/tower-of-sighs-locations-1-the-island-and-the-bandit-camp-ursic-one-ear.jpg
            keywords:
              - The Island and the Bandit Camp
              - Island and the Bandit Camp
          - id: tower-of-sighs/locations/2-tower-of-sighs
            title: Tower of Sighs
            number: "2"
            kind: location
            page: 60
            body: |
              This must once have been a mighty fortress, four stories high and built of red stone. The roof is flat and surrounded by battlements, but the tower is badly damaged. One broken wall is wide open and blackened with soot. There are stones scattered across the ground around it, as if a huge fireball once blasted through the wall. Up close one can hear distinct sighs that make one’s blood run cold.
              ✦Ground Level: The ground floor of the tower is covered in broken masonry. In one corner Glam-Glam has set up a sleeping area with branches and animal skins. There are clean-picked bones from cows and pigs, but also some assorted valuables (draw two treasure cards).
              ✦The Giant: This is where Glam-Glam is usually found, sleeping. The player characters can get past him with a successful SNEAKING roll, otherwise he wakes up.
              ✦Staircase: In the middle of the ground floor is the entrance to the basement. A spiral staircase once ran through the tower’s center – the way up has collapsed, and the way down is blocked by a massive boulder. That is where the sighs are coming from.
            sections:
              - id: tower-of-sighs/locations/2-tower-of-sighs/glam-glam-the-giant
                title: Glam-Glam the Giant
                kind: monster
                page: 60
                body: |
                  The giant is completely focused on survival, something he knows will become more difficult as more settlers arrive in the valley. He works in the tower with a powerful spear, which he also uses as a weapon. Glam-Glam has the stats of a giant as per page 88 in the Rulebook. If the player characters disturb him, Glam-Glam gets angry and shoos them out, but he is not really looking for a fight. A successful PERSUASION, BLUFFING, or BARTERING roll makes him willing to talk. He is fed up with the bandits and suggests that the player characters take their place. He offers to open the way down to the cellar and the treasure – if they catch a boar for him first. The giant’s plan is to drag this out as long as possible and have the player characters perform various chores for him. For him to finally give in and clear the cellar stairs, the player characters must offer Glam-Glam something significant in exchange, such as a job and a home in Outskirt.
                  ✦The Way to the Cellar: The boulder must be removed in order to enter the cellar. The easiest way is to get Glam-Glam to do it. Otherwise, it must be chipped away, which takes at least a shift of hard work and of course wakes up the giant. Pickaxes, chisels, and sledgehammers can be found on the second floor.
                  ✦Rope Ladder: There is a rope ladder hanging at the entrance of the tower. It leads up to the collapsed upper floors and onto the roof.
                  ✦Upper Floors: The rope ladder goes up through a hole in the floor to the second and third levels. There is nothing of interest there except some loot the bandits have tucked away (the equivalent of two treasure cards) in a locked chest. It must be picked or smashed open (armor rating 5, 20 HP). The latter wakes the giant. Leaning against a wall are various stone-working tools – pickaxes, digging bars, and sledgehammers.
                  ✦Roof: On the roof are two simple benches. The bandits sometimes keep a lookout here.
                creatures:
                  - core/monster/adventure-glam-glam-the-giant
                keywords:
                  - Glam-Glam the Giant
                  - Glam-Glam
            images:
              - images/art/tower-of-sighs-locations-2-tower-of-sighs.jpg
          - id: tower-of-sighs/locations/3-the-forgotten-temple
            title: The Forgotten Temple
            number: "3"
            kind: location
            page: 61
            body: |
              When the last stone is rolled aside, the sighs stop. Everything turns still and silent. An owl hoots far away in the swamp. A translucent figure steps into the light.
              ✦Staircase Down: Under the last boulder on the ground floor is a spiral staircase, carved into the rock.
              ✦Temple Hall: After fifty steps the staircase opens into a square room. The bare rock walls were once covered with tapestries, but now only threads and dust remain.
          - id: tower-of-sighs/locations/the-forgotten-temple
            title: The Forgotten Temple
            kind: map
            page: 61
            images:
              - images/maps/tower-of-sighs-locations-the-forgotten-temple.jpg
          - id: tower-of-sighs/locations/aftermath
            title: Aftermath
            kind: section
            page: 61
            body: If the player characters made a deal with Ursic to fight the giant, they will be betrayed. Ursic was expecting to find a great treasure of gold under the tower and thinks the characters are lying. The situation may deteriorate into violence. However, if the player characters have an arrangement with Glam-Glam, he can come to their rescue.
    keywords:
      - Tower of Sighs
    images:
      - images/chapters/tower-of-sighs.jpg
  - id: oracle-cave
    title: Oracle Cave
    number: 9
    kind: chapter
    page: 62
    body: "A child has been abducted from Outskirt and the trail leads to the Oracle Cave, a winding cave system beneath the Iron Forest. Few ever venture there due to rumors that an ancient horror dwells in its depths – some age-old creature from before humanity’s arrival in the Misty Vale that is said to possess hidden knowledge. People call the place the Oracle Cave."
    sections:
      - id: oracle-cave/the-situation
        title: The Situation
        kind: section
        page: 62
        body: "The player characters can hear about the disappearance of young Roric and the Oracle Cave through rumors in Outskirt (page 17 and the adventure cards). The place is a possible location for one of the four pieces of the dragon statuette (page 8), which in that case is found in the she-spider’s lair (room #10). Roric is a little boy of six who has been abducted from Outskirt. He was playing outside the family farm when he was taken by brigands, who brought him to the Iron Forest. There they were ambushed by giant spiders who captured the bandits and the boy and brought them to the old she-spider Saak’shal – the one that people in the Misty Vale call the Oracle. When the player characters arrive at the Oracle Cave, they should not have figured out that there are giant spiders involved. Ideally, this should only become clear after they find spiderwebs down in the caves. This is a deep cave system, and the player characters will need a light source in each room unless they want to feel their way through total darkness."
        sections:
          - id: oracle-cave/the-situation/random-events
            title: Random Events
            kind: table
            page: 63
            table: "Oracle Cave: Random Events"
          - id: oracle-cave/the-situation/leaving-the-cave
            title: "Leaving the Cave?"
            kind: sidebar
            page: 63
            body: If the player characters leave the cave to take a long rest, roll D6 per shift on the table on page 107 in the Rulebook.
      - id: oracle-cave/locations
        title: Locations
        kind: section
        page: 62
        sections:
          - id: oracle-cave/locations/1-entrance
            title: Entrance
            number: "1"
            kind: location
            page: 62
            body: |
              A dark hole, wide enough for several people to walk next to each other, gaping straight down into the earth. The cold of the underground flows from the opening.
              ✦Primitive Altar: Small wooden bowls filled with fruits and pieces of dried meat have been lined up on a rock just inside the entrance – small offerings from locals to appease the oracle. Occasionally, the she-spider
              Saak’shal emerges from her lair and answers questions in return.
              ✦Blood Trails: If the player characters examine the floor or roll SPOT HIDDEN in the cave, they find several trails of blood in the tunnel – from both animals and humanoids.
              ✦NORTH: A natural opening in the rock wall leads to the cave tunnel (#2).
          - id: oracle-cave/locations/2-cave-tunnel
            title: Cave Tunnel
            number: "2"
            kind: location
            page: 63
            body: |
              The tunnel runs deep into the rock and slopes steeply downwards. It is cold, damp, and pitch black. The cave walls are dripping with moisture and there is a musty smell of algae.
              ✦Random Event: Roll D10 on the table above for each full stretch the player characters spend in a tunnel.
              ✦NORTH, SOUTH: Tight openings to narrow passageway (#3).
          - id: oracle-cave/locations/3-narrow-passageway
            title: Narrow Passageway
            number: "3"
            kind: location
            page: 63
            body: |
              This passageway is so narrow that you must crawl and climb to get through. The tunnel seems to go on forever into the darkness.
              ✦Narrow Passage: Passing through a narrow tunnel requires an ACROBATICS roll. A player character who leaves all their items (not counting any weapons in their hands) gains a boon on the roll. On failure, the character gets stuck and suffers a condition of their choice. Another ACROBATICS roll can be made each stretch. Others can help.
              ✦Random Event: Roll D10 on the table above for each full stretch the player characters spend in a narrow tunnel.
          - id: oracle-cave/locations/4-the-fork
            title: The Fork
            number: "4"
            kind: location
            page: 63
            body: |
              The tunnel opens into a larger space with two paths ahead. There is a dark figure lying on the floor.
              ✦Dead Orc: The figure is the corpse of a massacred orc who was devoured by the offspring of Saak’shal. Their arms and legs are torn off, and in some places the bones have been picked clean.
              ✦The Mark of Maladûk: If the player characters search the corpse or roll SPOT HIDDEN, they find valuables equivalent to one treasure card and scraps of armor branded with the mark of Maladûk (page 8).
              ✦Random Event: Roll D10 on the table above for each full stretch the player characters spend here.
              ✦NORTH, EAST: Tunnels to the underground river (#5). A rushing sound is heard.
              ✦WEST: Opening to the cave tunnel (#2).
            keywords:
              - The Fork
              - Fork
          - id: oracle-cave/locations/oracle-cave
            title: Oracle Cave
            kind: map
            page: 64
            images:
              - images/maps/oracle-cave-locations-oracle-cave.jpg
          - id: oracle-cave/locations/5-underground-river
            title: Underground River
            number: "5"
            kind: location
            page: 64
            body: |
              The tunnel is crossed by raging black water that disappears into the darkness to the east. The passage continues on the other side of the river, which is about four meters wide.
              ✦Treacherous Crossing: The river’s current is strong and its water freezing (BUSHCRAFT roll to resist cold). Swimming across requires a SWIMMING roll with a bane. Those who fail are swept away to the underground lake (#6) and must make another SWIMMING roll to avoid drowning. Player characters can try to jump across the river (page 43 in the Rulebook), use magic, or cross by other means. Make sure to reward resourceful players.
          - id: oracle-cave/locations/6-underground-lake
            title: Underground Lake
            number: "6"
            kind: location
            page: 65
            body: |
              An underground lake spreads out like a cold, black mirror. The darkness makes it hard to see where the cave ends and the lake begins.
              ✦The Eel Beast: Something lurks beneath the surface. A hungry sea serpent dwells in the lake and attacks anyone who gets in the water. A player character watching the lake for a while can roll AWARENESS to notice something moving in the water.
              ✦Slippery Rocks: The edges of the lake are dark and slippery. A player character wishing to pass the lake without getting wet must roll ACROBATICS (not an action) to avoid falling in. The same applies to characters trying to get out of the water. One attempt is allowed per round.
            sections:
              - id: oracle-cave/locations/6-underground-lake/the-eel-beast
                title: The Eel Beast
                kind: monster
                page: 65
                body: The sea serpent in the lake looks like a large, pale eel. Its glistening body is fast and strong and would like nothing more than to wrap itself around the player characters’ legs and drag them into the deep.
                creatures:
                  - core/monster/adventure-the-eel-beast
                keywords:
                  - The Eel Beast
                  - Eel Beast
              - id: oracle-cave/locations/6-underground-lake/continued
                title: Continued
                kind: text
                page: 65
                body: |
                  ✦Random Event: Roll D10 on the table on page 61 for each full stretch the player characters spend here.
                  ✦NORTH: Tunnel to the offspring’s lair (#9).
                  ✦EAST: Tunnel to the relic cave (#7).
                  ✦SOUTH: Tunnel to the underground river (#5). A rushing sound is heard.
                  ✦WEST: Opening to a narrow passageway (#3).
          - id: oracle-cave/locations/7-the-relic-cave
            title: The Relic Cave
            number: "7"
            kind: location
            page: 65
            body: |
              Along the walls of the cave lie old swords and armor covered in dust and dirt. Yellowed bones and blankly glaring skulls can be seen here and there.
              ✦The Weapons: Most of the gear is broken beyond repair, but the player characters can find a broadsword, a flail, a chainmail, and an open helmet that are still in usable condition. A successful MYTHS & LEGENDS roll reveals that these are ancient relics, likely from the draconic empire of Eledain.
              ✦Treasures: If the player characters search the cave and succeed with a SPOT HIDDEN roll, they find valuables equivalent to one treasure card among the dirt on the floor.
              ✦Random Event: Roll D10 on the table on page 61 for each full stretch the player characters spend here.
              ✦EAST: Narrow passageway (#3) leading directly to the keep (#12).
              ✦SOUTH: Tunnel to the underground lake (#6).
              ✦WEST: Tunnel to the spiderlings’ lair (#8).
          - id: oracle-cave/locations/8-the-spiderlings-lair
            title: The Spiderlings’ Lair
            number: "8"
            kind: location
            page: 65
            body: |
              The tunnel opens into a cramped cave chamber whose walls, floor, and ceiling are covered in thick white webs. Suddenly a swarm of spiders bursts out of every nook and cranny of the room – the smallest are the size of a fist, the largest as big as well-fed cats.
              ✦The Spawn of Saak’shal: In this lair dwell the youngest offspring of the old she-spider Saak’shal – a swarm of spiderlings (see page 64 for stats). They attack instantly.
              ✦Relics: If the player characters search the cave and succeed with a SPOT HIDDEN roll, they find valuables equivalent to one treasure card among the dirt on the floor.
            sections:
              - id: oracle-cave/locations/8-the-spiderlings-lair/spiderlings
                title: Spiderlings
                kind: monster
                page: 66
                creatures:
                  - core/monster/adventure-spiderlings
              - id: oracle-cave/locations/8-the-spiderlings-lair/continued
                title: Continued
                kind: text
                page: 66
                body: "Resistant: The spiderlings attack as a swarm and are handled as a single creature. The swarm takes half damage (rounded up) from attacks with physical weapons, including magical ones. Fire has the normal effect."
          - id: oracle-cave/locations/9-the-offsprings-lair
            title: The Offspring’s Lair
            number: "9"
            kind: location
            page: 66
            body: Hanging from the damp ceiling of the cave are half a dozen white cocoons of cobwebs, each the size of a full-grown human.
            sections:
              - id: oracle-cave/locations/9-the-offsprings-lair/the-she-spiders-offspring
                title: The She-Spider’s Offspring
                kind: monster
                page: 66
                body: |
                  In this lair dwell the older offspring of the ancient female – giant spiders with stats as per page 89 in the Rulebook. They are half as many as the player characters, rounded up.
                  Lurking in dark crevices, they wait for the player characters to start exploring the room before they attack. The attack counts as an ambush (page 43 of the Rulebook) and the player characters get a bane on their AWARENESS rolls.
                  ✦Cocoons: The she-spider’s offspring have gathered dead humans and orcs in thick web cocoons to be eaten later. The bodies have no visible injuries as they were killed by spider venom, which a successful HEALING roll can reveal. Player characters who examine the corpses can find valuables equivalent to one treasure card.
                creatures:
                  - core/monster/adventure-the-she-spider-s-offspring
                keywords:
                  - The She-Spider’s Offspring
                  - She-Spider’s Offspring
              - id: oracle-cave/locations/9-the-offsprings-lair/the-surviving-brigand
                title: The Surviving Brigand
                kind: npc
                page: 66
                body: |
                  Suddenly, the body inside one of the cocoons wakes up and cries out in terror. All player characters must make a WIL roll to resist fear. But the “corpse” is alive – it is one of the brigands who abducted Roric. He begs the player characters to cut him loose. “Please, before they come back! I’ll do anything! Don’t leave me here!” If the bandit is freed, he will break any promises and escape at the first opportunity. If pressed, he admits to having participated in the abduction of Roric, but claims it was not his idea.
                  ✦SOUTH: Tunnel to the spiderlings’ lair (#8).
                  ✦WEST: Tunnel to the she-spider’s lair (#10).
                creatures:
                  - core/monster/adventure-the-surviving-brigand
                keywords:
                  - The Surviving Brigand
                  - Surviving Brigand
          - id: oracle-cave/locations/10-the-she-spiders-lair
            title: The She-Spider’s Lair
            number: "10"
            kind: location
            page: 66
            page_end: 67
            body: |
              The dim light barely illuminates what appears to be a vast cave chamber. The far wall is covered in cobwebs from which a small cocoon is dangling. You see the outline of something very large moving in the shadows, and then a faint voice speaks inside your heads, as if whispering in both ears at once.
              “Little creatures… Why have you invaded our home?” Out of the abyss climbs a hideously large spider, thick as two fat horses and with just as many legs. The spider braces itself against the walls as she looms over you.
              ✦Saak’shal: The ancient she-spider has inhabited the caves beneath the Iron Forest since long before the first humans arrived in the Misty Vale. Realizing that the player characters must be capable to have made it this far, she wants to know who they are and what they are doing here. Saak’shal can read their minds and snarls at them if they lie. She does not really want to fight but defends herself ferociously if attacked.
            sections:
              - id: oracle-cave/locations/10-the-she-spiders-lair/the-she-spider-saakshal
                title: The She-Spider Saak’shal
                kind: monster
                page: 67
                body: Saak’shal is an ancient spider with cloudy gray eyes whose edges are covered with crusts of old pus and dirt (it is possible to SNEAK past her). She moves jerkily but quickly and is almost twice the size of normal giant spiders. She performs the same monster attacks as them (page 89 in the Rulebook), but with an extra die of damage.
                creatures:
                  - core/monster/adventure-the-she-spider-saak-shal
                keywords:
                  - The She-Spider Saak’shal
                  - She-Spider Saak’shal
                  - Saak’shal
              - id: oracle-cave/locations/10-the-she-spiders-lair/continued
                title: Continued
                kind: text
                page: 67
                body: |
                  ✦Legends: Saak’shal knows all there is to know about the Misty Vale and can pass on the legend of Um-Durman (page 9) as well as the rumors about the other adventure sites (page 17).
                  ✦The She-Spider’s Treasure: At the bottom of the cave are countless treasures that Saak’shal has amassed over the years. The entire treasure is equivalent to six treasure cards but cannot be accessed without killing the ancient spider.
                  ✦EAST: Tunnel to the woven bridge (#11).
                  ✦SOUTH: Tunnel to the offspring’s lair (#9).
              - id: oracle-cave/locations/10-the-she-spiders-lair/roric
                title: Roric
                kind: npc
                page: 67
                body: |
                  The terrified child is hanging in the cocoon of cobweb behind the she-spider, saved for later as a particularly delicious treat. It is possible to SNEAK over there if Saak’shal is distracted, but she reacts with violent fury if she notices it.
                  ✦Negotiation: If the player characters explain that they are looking for young Roric and/or a piece of Eledain’s dragon statuette, Saak’shal offers them a deal – they will get what they want if they first kill a group of orcs who have settled in another part of the cave (location #12, the keep). She will keep her promise if they carry out the mission.
                  ✦The Statuette Piece: If you want to place a piece of Emperor Eledain’s statuette here (page 8), Saak’shal reveals that she has it. Even if there is no statuette piece, the old she-spider can tell the player characters where to find one, in exchange for them carrying out her mission.
                creatures:
                  - mistyvale/monster/roric
                keywords:
                  - Roric
                images:
                  - images/people/oracle-cave-locations-10-the-she-spiders-lair-roric.jpg
                  - images/people/oracle-cave-locations-10-the-she-spiders-lair-roric-2.jpg
            images:
              - images/art/oracle-cave-locations-10-the-she-spiders-lair.jpg
          - id: oracle-cave/locations/11-woven-bridge
            title: Woven Bridge
            number: "11"
            kind: location
            page: 68
            body: |
              The tunnel opens into a seemingly bottomless shaft. A dark abyss gapes before you. Thick cobwebs form a bridge to the other side where a passage continues into the mountain.
              ✦The Cobweb Bridge: The bridge of cobwebs sways under the weight of the player character. Describe how the thick, sticky web is all that separates them from the chasm below. The web is strong and will not give way but climbing over the bridge is difficult and requires a successful ACROBATICS roll. On failure the victim slides toward the abyss but can save themselves with EVADE. Each of the other player characters on the bridge also gets one attempt to catch the falling person with ACROBATICS. If all attempts fail, the victim falls 12 meters into an underground lake and takes 3D6 falling damage.
              ✦EAST: Passageway to the keep (#12).
              ✦WEST: Passageway to the she-spider’s lair (#10).
          - id: oracle-cave/locations/12-the-keep
            title: The Keep
            number: "12"
            kind: location
            page: 68
            body: |
              The passage turns into a steep stairway in a narrow, carved tunnel that leads sharply upward. After a few minutes of arduous ascent, the tunnel opens to reveal a small keep with an extensive view of the Iron Forest. Orcish grunts can be heard from the lookout on the other side of a wall.
              ✦The Keep: The outpost dates back to the old draconic empire, which a successful MYTHS & LEGENDS roll can reveal.
              ✦Agra and the Orcs: The orc warrior Agra and her patrol of orcs (as many as the player characters) have been in the Iron Forest for a few days, trying to find pieces of Eledain’s statuette for their chieftain Maladûk. They came to the keep from the forest and have sent some scouts into the cave, but none have returned. Now they are discussing their next move. Agra reacts violently if she spots the player characters, but she can be reasoned with (PERSUASION or BLUFFING). If the player characters are allied with Maladûk and convince Agra of this, she is willing to cooperate.
              ✦No Campaign? If you are playing The Oracle Cave separately, with no connection to the The Secret of the Dragon Emperor campaign, Agra is only here to find the cave’s hidden treasures.
              ✦SOUTH: Stairway down to the Iron Forest.
              ✦WEST: Tunnel to the woven bridge (#11).
            sections:
              - id: oracle-cave/locations/12-the-keep/agra
                title: Agra
                kind: npc
                page: 68
                body: "Agra is a large, muscular, and scarred orc. She has spent most of her life fighting and is feverishly loyal to Maladûk. She hopes to prove her competence and conviction by finding the dragon emperor’s statuette."
                creatures:
                  - mistyvale/monster/agra
                keywords:
                  - Agra
                images:
                  - images/people/oracle-cave-locations-12-the-keep-agra.jpg
              - id: oracle-cave/locations/12-the-keep/orc-warriors
                title: Orc Warriors
                kind: npc
                page: 68
                creatures:
                  - core/monster/adventure-orc-warriors
                keywords:
                  - Orc Warriors
    keywords:
      - Oracle Cave
    images:
      - images/chapters/oracle-cave.jpg
  - id: trolls-spire
    title: Troll’s Spire
    number: 10
    kind: chapter
    page: 69
    body: On a mountaintop in the Misty Vale rises the ruins of Troll’s Spire, an ancient tower from Eledain’s dragon-worshiping empire. By day the ruins are embraced by blooming roses of red and black, and by night the tower glitters like a silver spire in the moonlight. It is said that there are wraiths and trolls guarding treasures from ages past.
    sections:
      - id: trolls-spire/the-situation
        title: The Situation
        kind: section
        page: 69
        body: |
          During Eledain’s reign, sorcerers would come to Troll’s Spire to gaze at the night sky and catch falling stars. From these star stones they extracted strong metals and bright, beautiful jewels which were used for all sorts of magical purposes.
          When the dragon realm was ravaged by internal strife, a vault was built in the tower’s basement to protect precious artifacts. But when the empire finally collapsed, the tower also fell into disrepair and was eventually forgotten. Magical rose bushes were all that lived and thrived there. Some years ago, a troll named Harga settled in the tower to learn more about healing herbs, poisons, and potions. Unfortunately, the tower was already home to someone else – an angry flock of harpies roosting on the roof. The troll and the harpies have been sworn enemies ever since. After a number of brazen thefts, Harga has barricaded herself in the tower and set up a few traps to scare off intruders. Troll’s Spire is a possible location for one of the four pieces of the dragon statuette (page 8), which in that case is found in the crypt (location #8).
        sections:
          - id: trolls-spire/the-situation/random-events
            title: Random Events
            kind: table
            page: 70
            table: "Troll’s Spire: Random Events"
          - id: trolls-spire/the-situation/leaving-the-tower
            title: "Leaving the Tower?"
            kind: sidebar
            page: 70
            page_end: 71
            body: |
              If the player characters leave the tower to take a long rest, roll D6 per shift on the table on page 107 in the Rulebook.
              ✦Rake: Harga has placed a rake among the debris on the floor, hoping someone will step on it. The first player character who enters the room triggers the trap and must roll EVADE not to get hit and take D6 bludgeoning damage. The player characters notice the rake if they move carefully into the room and succeed with a SPOT HIDDEN roll.
              ✦Skeleton Trap: The table setting is a trap. A thin rope is strung from the jugs and plates to a sack in the ceiling. If the player characters touch these items, a skeleton armed with shield and scimitar comes crashing down. Everyone in the room must make a WIL roll to resist fear. The skeleton is held together by strings and is completely harmless, but let the players draw the initiative anyway and describe how they respond to this threat. The skeleton does nothing. The trap can be avoided if the player characters examine the table or ceiling and succeed with a SPOT HIDDEN roll.
              ✦Random Event: Roll D6 on the table above for each full stretch the player characters spend here.
              ✦NORTH: Stairs leading up to Harga’s laboratory (#5).
              ✦EAST: Door to a privy. The stench is palpable – it takes a CON roll to avoid being Dazed.
              ✦SOUTH:Slightly open door to the kitchen (#4). When
              ✦WEST: Door to a simple bedroom,
      - id: trolls-spire/locations
        title: Locations
        kind: section
        page: 69
        sections:
          - id: trolls-spire/locations/1-the-red-gate
            title: The Red Gate
            number: "1"
            kind: location
            page: 69
            body: |
              Before you stands a crumbling tower from a bygone age. The ruins are wrapped in a crimson and black cloak of roses and sharp thorns, and the sweet scent of the flowers lies heavy on your senses. The entrance is blocked by a massive gate of red oak. The tower has a few windows, but none at ground level.
              ✦The Roses: The roses bloom all year round, nourished by magical energies. The player characters must make a CON roll each round they come within one meter of the roses and become Dazed on failure. The effect can be avoided by holding their breath (page 53 of the Rulebook).
              ✦Occupants: If the player characters peer toward the top of the tower and succeed with an AWARENESS roll, they see movement on the roof and in the windows of the laboratory (#5).
              ✦NORTH: Door to the tower’s hallway (#2). The door is locked from the inside (40 HP, armor rating 12).
              ✦UP: With a successful ACROBATICS roll, a player character can climb the rose bushes to the kitchen (#4) on the second floor. The climber is exposed to the scent of the roses and takes D6 piercing damage from the sharp thorns. It is not possible to climb higher than the second floor.
            keywords:
              - The Red Gate
              - Red Gate
          - id: trolls-spire/locations/2-hallway
            title: Hallway
            number: "2"
            kind: location
            page: 70
            body: |
              The hallway is full of rubble and debris from the collapsed walls and upstairs floor of the tower. Large flies are buzzing lazily in the still, humid air.
              ✦Ambrosius the Toad: Harga’s guard toad Ambrosius is hiding in his nest among the stones in the western corner and attacks the player characters if they examine the rubble.
              ✦Random Event: Roll D6 on the table above for each full stretch the player characters spend here.
              ✦NORTH: Staircase leading up to the next floor’s abandoned residence (#3).
              ✦SOUTH: Door out of the tower (#1). It is bolted but can be easily opened from the inside.
              ✦WEST:Under the toad’s nest in the western corner is a hatch down to the tower’s crypt. The player characters will find it if they look in that exact spot or search the room and succeed with a SPOT HIDDEN roll. On the hatch is an ornate symbol (Eledain’s dragon symbol, which a MYTHS & LEGENDS roll can reveal) and an iron ring to open it with, which requires a STR roll with bane. The hatch can also be smashed open (20 HP, armor rating 10). Beneath the hatch a short spiral staircase leads down to the iron door (#7).
            sections:
              - id: trolls-spire/locations/2-hallway/ambrosius-the-toad
                title: Ambrosius the Toad
                kind: monster
                page: 71
                body: "The horned toad Ambrosius is the size of a dog and the result of Harga’s experiments. He guards against intruders, but also takes care of the flies that were interfering with the troll’s magical research. Ambrosius keeps still and quiet; only when he has eaten can he be heard croaking contentedly."
                creatures:
                  - core/monster/adventure-ambrosius-the-toad
                keywords:
                  - Ambrosius the Toad
                images:
                  - images/people/trolls-spire-locations-2-hallway-ambrosius-the-toad.jpg
              - id: trolls-spire/locations/2-hallway/continued
                title: Continued
                kind: text
                page: 71
                body: "Play Dead: If Ambrosius loses half his HP, he rolls over on his back and plays dead. He attacks again when the opportunity arises."
          - id: trolls-spire/locations/the-first-floor
            title: The First Floor
            kind: map
            page: 71
            images:
              - images/maps/trolls-spire-locations-the-first-floor.jpg
          - id: trolls-spire/locations/3-abandoned-residence
            title: Abandoned Residence
            number: "3"
            kind: location
            page: 70
            page_end: 71
            body: |
              The room is dominated by a huge fireplace and an ancient table of red oak. On the table are four clay jugs and two wooden plates. The floor is covered with broken furniture and other debris. There are four doorways out of the room, one in each direction.
              the door opens, a bucket is emptied over the person opening it. The bucket is full of itching powder that Harga has made and makes the victim Angry. The trap can only be avoided if the first person to enter the kitchen actively examines the door and rolls a successful SPOT HIDDEN before opening it.
              now empty and deserted.
          - id: trolls-spire/locations/4-kitchen
            title: Kitchen
            number: "4"
            kind: location
            page: 72
            body: |
              What was probably once the kitchen has been stripped of all utensils. An open window is covered with red rose bushes and a sweet stench invades your nostrils.
              ✦Random Event: Roll D6 on the table on page 68 for each full stretch the player characters spend here.
              ✦NORTH: Door ajar to the abandoned residence (#3). A bucket is placed on top of the door (unless the trap in room #3 has been triggered).
          - id: trolls-spire/locations/the-second-floor
            title: The Second Floor
            kind: map
            page: 73
            images:
              - images/maps/trolls-spire-locations-the-second-floor.jpg
          - id: trolls-spire/locations/5-hargas-laboratory
            title: Harga’s Laboratory
            number: "5"
            kind: location
            page: 72
            body: "The room is cluttered with bottles, flasks, pots, jugs, mortars and pestles, ladles, dried herbs, and glass beakers containing parts of various monsters – everything you could possibly need to make all sorts of strange potions. Smoke from the fire in the center of the room rises through several cracks in the ceiling. Up there you can see the open sky through red and black roses."
            sections:
              - id: trolls-spire/locations/5-hargas-laboratory/meeting-harga
                title: Meeting Harga
                kind: sidebar
                page: 72
                body: |
                  Harga defends herself if attacked but does not really want to fight. Instead, she offers the player characters a deal. There are great treasures in a crypt beneath the tower and Harga says she can take them there – in exchange for a small favor. A pack of screeching harpies has settled on the roof of the tower, and Harga wants the player characters to drive the creatures away or kill them. The harpies have stolen a key to the crypt. If the player characters retrieve it, Harga promises to show them the way to the treasure.
                  Over Moon, Under Ground: During the conversation, Harga hums an old verse: “Over moon, under ground, fall the stars.” The player characters may have heard it before (random encounter #8). If the player characters ask about the verse, she waves it off and says it is just an old rhyme that got stuck in her head.
                  Consequences: If the player characters kill or drive away at least half of the harpies on the roof (#6) and find the key in their nest, Harga keeps her word and shows the way to the hatch in the hallway (#2). If they killed Ambrosius, Harga gets a bit surly but does not seem too concerned. What Harga knows but does not tell them is that the crypt (#8) is a trap – there are dangerous undead down there, and it takes cunning to get out. Harga hopes that the player characters will die in the crypt, so she can come back later and grab the treasures herself.
                  Combat? The player characters might just kill Harga. In that case it becomes much harder for them to find the crypt and make it back alive.
              - id: trolls-spire/locations/5-hargas-laboratory/harga
                title: Harga
                kind: npc
                page: 72
                page_end: 73
                body: Harga is a very small old troll who reeks of smoke and wears a headscarf and a tunic of multi-layered fabric. She does not use monster attacks but is handled as a regular NPC. Harga can sell potions to the player characters at the price listed in the Rulebook (page 79). If they pay her well, Harga can also teach them her skills and magic.
                creatures:
                  - mistyvale/monster/harga
                keywords:
                  - Harga
                images:
                  - images/people/trolls-spire-locations-5-hargas-laboratory-harga.jpg
              - id: trolls-spire/locations/5-hargas-laboratory/continued
                title: Continued
                kind: text
                page: 73
                body: |
                  ✦Harga: The troll has made the ancient laboratory her own over many long years and it very much reflects her personality. When the player characters arrive, she is scared and hides among the rubble. If they stay a while and start poking around, she makes herself known: “What are you doing in my house? Leave at once, or I’ll make you disappear for good!”
                  ✦Potions and Other Items: Among the bottles, the player characters can find five doses of herbal concoction (boon on rolls for resisting disease), three doses each of lethal, paralyzing, and sleeping poison (all with potency 12), four doses of healing potion (heals 2D6 HP), two doses of a potion with the same effect on the user as the ELEVATE spell (power level 1), an hourglass, some parchment, a quill, five rations of food, and Harga’s grimoire which contains all her spells. The player characters can find these if they search the laboratory for one stretch.
                  ✦NORTH: Stairs leading down to the abandoned residence (#3).
                  ✦UP: Hole in the ceiling to the harpies’ nest (#6).
            keywords:
              - Harga’s Laboratory
          - id: trolls-spire/locations/the-third-floor
            title: The Third Floor
            kind: map
            page: 73
            images:
              - images/maps/trolls-spire-locations-the-third-floor.jpg
          - id: trolls-spire/locations/6-the-harpies-nest
            title: The Harpies’ Nest
            number: "6"
            kind: location
            page: 74
            body: |
              The top of the tower lies open to the sky. The sweet stench of roses is almost overwhelming. Huge black and red rose bushes cling to the walls. In the middle you see a shallow pool of dirty rainwater with big, dark feathers floating on the surface.
              ✦Roses: Up here it is impossible to avoid the scent of the roses. The player characters must make a CON roll each round and become Dazed on failure. The effect can be avoided by holding their breath (page 53 in the Rulebook).
              ✦Harpies: The three harpies Thistle, Prickle, and Thorn are hiding among the rose bushes, ready to ambush anyone who comes up here.
              ✦Nest: The harpies have their nest deep in the rose bushes. Finding it requires a SPOT HIDDEN roll. Each roll takes one round and exposes the player characters to the scent of the roses. The nest contains the key to the iron door (#7) and valuables equivalent to three treasure cards.
              ✦DOWN: Hole in the floor to Harga’s laboratory (#5).
            sections:
              - id: trolls-spire/locations/6-the-harpies-nest/thistle-prickle-and-thorn
                title: Thistle, Prickle, and Thorn
                kind: monster
                page: 74
                body: "The harpies roosting atop the tower are the three sisters Thistle, Prickle, and Thorn – cunning creatures who use their home as a lookout when searching for prey. They live safely among the rose bushes, happily bathing in the pool of rainwater and perfuming themselves with rose nectar. They are immune to the scent of roses. They have stats as harpies as per the Rulebook, page 92. If two of them are killed, the last one will retreat to the highest point of the tower and may attack again."
                creatures:
                  - core/monster/adventure-thistle-prickle-and-thorn
                keywords:
                  - Thistle, Prickle, and Thorn
                  - and Thorn
                  - Prickle
                  - Thistle
          - id: trolls-spire/locations/the-roof
            title: The Roof
            kind: map
            page: 74
            images:
              - images/maps/trolls-spire-locations-the-roof.jpg
          - id: trolls-spire/locations/7-iron-door
            title: Iron Door
            number: "7"
            kind: location
            page: 74
            body: |
              A black iron door blocks the way. The lock is shaped like a stylized dragon’s head.
              ✦The Iron Door: Made of iron that fell from the sky. Can be opened with the key in the harpies’ nest (#6). The lock is magical and must be DISPELLED with power level 3 before it can be picked or opened with LOCK/OPEN. Breaking down the door is very difficult (100 HP, armor rating 20).
          - id: trolls-spire/locations/8-crypt
            title: Crypt
            number: "8"
            kind: location
            page: 74
            page_end: 75
            body: |
              A great circular hall lies before you. At its center stands a stone pedestal with a case at the top. Through the dust on the floor, you see a beautiful mosaic of four scenes divided into equal sizes. Two of the scenes show magnificent dragons and the other two show hideous monsters. There are three dark alcoves to the north, south and east.
              ✦Total Darkness: The player characters need a light source in order to see anything in the crypt.
              ✦The Mosaic: The four parts of the floor mosaic are pressure plates. If the total weight placed on plates A and D (the demons) differs from that of B and C (the dragons), the mechanism is activated and two rounds later an undead guardian in the northern alcove wakes up and attacks. If the weight changes again without achieving balance between dragons and demons, another guardian wakes up. Let the players figure out how to balance the
              weight and reward their ingenuity. One method is for two characters of roughly the same weight (in your estimation) to step on separate plates (of different types) at exactly the same time, which requires an ACROBATICS roll (with a boon) from both of them.
              ✦Undead Guardians: In each of the three alcoves stands a mighty skeleton champion, put here to guard Eledain’s treasures forever. They are awakened by an imbalance of weight in the floor mosaic or if someone tries to break down the iron door. Once awake, they raise their weapons with a rattle and fight until they are defeated, or the player characters leave the tower.
              ✦The Pedestal: The wooden case on the pedestal is beautifully decorated with the symbols of the dragon empire, which a successful MYTHS & LEGENDS roll can reveal. The case is open and contains two large octagonal sapphires worth 50 gold coins each and other valuables equivalent to three treasure cards. If you chose to place a piece of the dragon statuette in Troll’s Spire, it is here as well.
              ✦WEST: The iron door (#7). Once the player characters have entered the crypt, the iron door slides shut and cannot be opened. There is no keyhole on this side, and the door cannot be unlocked or opened with LOCK/ OPEN. The door can be broken (100 HP, armor rating 20), but it takes time and wakes up all three skeleton champions. This side of the iron door is adorned with a beautiful relief of stars and planets. At the top is the
            sections:
              - id: trolls-spire/locations/8-crypt/undead-guardians
                title: Undead Guardians
                kind: npc
                page: 75
                creatures:
                  - core/monster/adventure-undead-guardians
                keywords:
                  - Undead Guardians
              - id: trolls-spire/locations/8-crypt/continued
                title: Continued
                kind: text
                page: 75
                body: "Resistance: All piercing damage is reduced by half (rounded up). Immunity: Skeletons are immune to fear and PERSUASION."
          - id: trolls-spire/locations/the-crypt
            title: The Crypt
            kind: map
            page: 75
            images:
              - images/maps/trolls-spire-locations-the-crypt.jpg
          - id: trolls-spire/locations/ending
            title: Ending
            kind: sidebar
            page: 75
            body: "To get out of the crypt, the player character is greatly helped by recalling the rhyme “Over moon, under ground, fall the stars.” If the players cannot figure out how to get out, you can have Harga rescue them (she can open the door from the other side with DISPEL and LOCK/OPEN). It is unintentional – Harga thinks the player characters are dead and comes to loot the crypt. She can also appear just as the player characters exit the crypt on their own. Harga may attack the player characters if they are badly wounded. Otherwise, she flees and vows revenge."
    keywords:
      - Troll’s Spire
  - id: dead-eyes-cave
    title: Dead Eyes Cave
    number: 11
    kind: chapter
    page: 76
    body: On a lonely cliff in the eastern Kummer Mountains lies the Dead Eyes Cave. It is a place shunned by all, where nothing grows and from which no seeing creature ever returns, for a basilisk has claimed it as its lair. The basilisk has recently attacked a farm and could pose a serious threat to Outskirt.
    sections:
      - id: dead-eyes-cave/the-situation
        title: The Situation
        kind: section
        page: 76
        body: "The basilisk has attacked Hildi’s farm southeast of Outskirt, killing nearly everyone there – except Hildi herself and her niece Gunhill. The player characters can hear about this in Outskirt (see the rumor table on page 17 and the adventure cards). The basilisk then retired to its lair on Mount Oculus. The mountain is so named because it resembles an eye. Because of the basilisk’s breath, almost nothing grows in its vicinity. The basilisk rests at the bottom of the cave but can slither out through a number of narrow shafts and crannies. Gunhill, Hildi’s niece, has gone to the cave intent on killing the beast. Cultists in the service of Azrahel Koth have also made their way to the cave in search of pieces of the dragon statuette (or other treasures if you are not playing The Secret of the Dragon Emperor). If a piece of the statuette is placed here, it can be found in the basilisk’s lair (room #6)."
        sections:
          - id: dead-eyes-cave/the-situation/encounter-with-hildi
            title: Encounter with Hildi
            kind: sidebar
            page: 76
            body: On the way to Mount Oculus, about an hour’s walk from the cave, the player characters pass Hildi’s farm. Hildi is the only one at the farm during the beast’s attack that survived, and several fresh graves can be seen in the nearby field. Hildi is blind but describes what she heard and smelled. People and animals screamed as a horrible stench filled the air. She tried to escape but got stopped by the beast and was sure she was going to die, but it left her and the chicken coop alone. She heard it slither off in the direction of the mountain and thinks it came from the cave at the top. Hildi also says that her niece Gunhill, who was out hunting at the time of the attack, has now gone to the cave to kill the beast. Hildi begs the player characters to look for Gunhill.
            keywords:
              - Hildi
            images:
              - images/art/dead-eyes-cave-the-situation-encounter-with-hildi.jpg
          - id: dead-eyes-cave/the-situation/random-events
            title: Random Events
            kind: table
            page: 77
            table: "Dead Eyes Cave: Random Events"
          - id: dead-eyes-cave/the-situation/leaving-the-cave
            title: "Leaving the Cave?"
            kind: sidebar
            page: 77
            page_end: 78
            body: |
              If the player characters leave the cave to take a long rest, roll D6 per shift on the table on page 107 in the Rulebook.
              VIPER
              A thick viper, almost two meters long, coiled in a nest in the rock wall. It has a black pattern, glowing yellow eyes, and fangs dripping with venom. Mechanically, the snake is handled as an animal (page 99 in the Rulebook), not a monster.
              Movement: 8 HP: 16
              Skills: Evade 15
              Attack: Bite (skill level 14, damage D6 + lethal poison with potency 15)
      - id: dead-eyes-cave/locations
        title: Locations
        kind: section
        page: 77
        sections:
          - id: dead-eyes-cave/locations/1-outside-the-cave
            title: Outside the Cave
            number: "1"
            kind: location
            page: 77
            body: |
              A thick mist blankets the top of Mount Oculus. In the middle of the rock formation that gave the mountain its name, where the pupil would be, is the cave entrance. It is pitch black in there and a musty smell emanates from the opening.
              ✦Carcasses: The ground is littered with the bloody, torn-apart remains of prey dragged here from Hildi’s farm. They seem to have belonged to large animals. A player character who succeeds with a BEAST LORE roll recognizes them as the carcasses of sheep and horses.
              ✦NORTH: Path to the cave entrance (#2).
            keywords:
              - Outside the Cave
          - id: dead-eyes-cave/locations/2-cave-entrance
            title: Cave Entrance
            number: "2"
            kind: location
            page: 77
            body: |
              Inside, the cave is dark and cool. The mist from outside covers the floor and the musty smell is even stronger. The walls consist of rough, mossy stones.
              ✦Dead Cultist: Inside the cave entrance lies a dead Sathmog cultist in black clothes. His eyes have been torn out and his body is completely stiff. Player characters who examine the corpse can find the mark of Sathmog on his forearm and two large bite marks on his neck.
              ✦Trail on the Ground: A player character who investigates the cave and succeeds with SPOT HIDDEN, or specifically looks for tracks, finds the trail of something large that has been dragged north from here (toward #3).
              ✦Random Event: Roll D8 on the table to the right for each full stretch the player characters spend here.
              ✦NORTH: Damp and dark tunnel to the snake pit (#3).
              ✦SOUTH: Passage out of the cave (#1).
              ✦WEST: Tunnel to the cultist camp (#4). The flickering light of a fire can be seen from there.
          - id: dead-eyes-cave/locations/3-snake-pit
            title: Snake Pit
            number: "3"
            kind: location
            page: 77
            body: |
              The musty smell grows into a pungent stench in this cave. The floor slopes down towards a pit whose bottom seems to be moving in a slithering fashion. Now you realize that the entire floor is covered with snakes. The only way north is a narrow ledge along the rock wall.
              ✦Snakes: Climbing past the snake pit requires an ACROBATICS roll. On failure the player character falls in and must roll against WIL to resist fear. The victim immediately suffers D6 piercing damage from snake bites and an additional D6 damage on each subsequent turn. Armor has no effect. Climbing out of the pit requires another ACROBATICS roll.
          - id: dead-eyes-cave/locations/4-cultist-camp
            title: Cultist Camp
            number: "4"
            kind: location
            page: 78
            body: |
              In the middle of this cave is a campfire whose smoke makes its way through cracks in the ceiling. The light from the fire falls on skulls and bones scattered all over the floor, and on a group of people dressed in black around the fire, all wearing blindfolds. On the floor next to them is a cage with what looks like chickens inside.
              ✦The cultists are as many as the player characters. Since they are blindfolded, the player characters get a boon on SNEAKING past them. If the player characters are detected, the cultists attack immediately.
              ✦Chickens: The cultists have brought two chickens in a cage because basilisks fear these birds (page 78).
              ✦The Sword: A person searching among the bones can find a mastercrafted broadsword with a SPOT HIDDEN roll.
              ✦Random Event: Roll D8 on the table on page 75 for each full stretch the player characters spend here.
              ✦EAST: Passage to the snake pit (#3).
              ✦SOUTH: Damp tunnel to the cave entrance (#2).
            sections:
              - id: dead-eyes-cave/locations/4-cultist-camp/demon-cultists
                title: Demon Cultists
                kind: npc
                page: 78
                body: "To protect themselves against the basilisk, the cultists have blindfolded themselves. Consequently, they act as if in complete darkness (page 52 in the Rulebook) and must roll AWARENESS before each attack. They have already lost a member of their group and are very afraid but dare not flee – failing their task will incur the wrath of Azrahel Koth, who they fear even more than the beast. They are now considering their next move. They know they are facing a deadly basilisk and may reveal this to the player characters if pressed. They all wear black robes."
                creatures:
                  - core/monster/adventure-demon-cultists-2
                images:
                  - images/people/dead-eyes-cave-locations-4-cultist-camp-demon-cultists.jpg
          - id: dead-eyes-cave/locations/5-gunhills-camp
            title: Gunhill’s Camp
            number: "5"
            kind: location
            page: 78
            body: |
              A cave chamber with several large boulders. The floor is covered with loose stones and the northern wall consists of a great pile of fallen rocks. By the eastern wall is a blanket and what looks like a backpack.
              ✦Bear Trap: A bear trap has been set up at the entrance. The player character who goes first triggers the trap, which inflicts D8 slashing damage unless the victim succeeds with an EVADE roll. The player characters can notice the trap in time if they move very carefully into the room and succeed with SPOT HIDDEN.
              ✦Gunhill: Hildi’s niece has made camp here and hides behind a boulder as the player characters approach. As soon as someone triggers the bear trap, she jumps out with sword drawn and blindfold in place. Hildi is suspicious – she has heard the cultists and thinks the player characters are part of their group but can be calmed down with a PERSUASION roll.
              ✦Random Event: Roll D8 on the table on page 75 for each full stretch the player characters spend here.
              ✦NORTH: Behind the pile of fallen rocks is the basilisk’s lair (#6). Clearing the rocks takes a stretch and requires a successful STR roll (multiple attempts are allowed), but the basilisk on the other side will notice. There is a hidden passage through the rocks which can be accessed with an ACROBATICS roll, and Gunhill knows about it. The hidden passage can also be found with a SPOT HIDDEN roll.
              ✦SOUTH: Dark tunnel to the snake pit (#3).
            sections:
              - id: dead-eyes-cave/locations/5-gunhills-camp/gunhill
                title: Gunhill
                kind: npc
                page: 79
                body: "Hildi’s niece has come here in the hope of stopping the monster. Her long hair is streaked with foul-smelling dirt and there are scratches on her body. She is stubborn, thirsts for revenge, and will do anything to kill the basilisk. She is blindfolded and whispers when she speaks. Gunhill has seen the basilisk and can describe it if the player characters gain her trust. She wears a blindfold because she saw the cultist in room #2 drop dead after staring into the creature’s eyes. She also saw another cultist scare the beast away using a chicken. After talking to Gunhill, the player characters can figure out that the beast is a basilisk with a BEAST LORE roll. Gunhill can also show them the hidden passage through the rocks."
                creatures:
                  - mistyvale/monster/gunhill
                keywords:
                  - Gunhill
                images:
                  - images/people/dead-eyes-cave-locations-5-gunhills-camp-gunhill.jpg
            keywords:
              - Gunhill’s Camp
          - id: dead-eyes-cave/locations/dead-eyes-cave
            title: Dead Eyes Cave
            kind: map
            page: 79
            images:
              - images/maps/dead-eyes-cave-locations-dead-eyes-cave.jpg
          - id: dead-eyes-cave/locations/6-the-basilisks-lair
            title: The Basilisk’s Lair
            number: "6"
            kind: location
            page: 80
            body: |
              A large, dark cavern filled with a stench so strong it burns your nostrils. The ground is covered with skeletal remains and rotting, torn-out eyes. In the middle of the room sits a terrible creature, a cross between a snake and a rooster of inordinate size.
              ✦The Basilisk: This is the beast’s nest, and it attacks as soon as it detects the player characters. It does this automatically if they come through the rocks, but characters using the hidden passage can make a SNEAKING roll to remain undetected.
              ✦Treasures: Scattered among the bones on the floor behind the basilisk are valuables equivalent to three treasure cards. If a piece of the dragon statuette is placed in this adventure, it is here as well.
              ✦SOUTH: Opening to Gunhill’s camp (#5).
            sections:
              - id: dead-eyes-cave/locations/6-the-basilisks-lair/the-basilisk
                title: The Basilisk
                kind: monster
                page: 80
                body: "The basilisk in the Dead Eyes Cave is unusually large – a terrifying beast with a reptilian body, a rooster’s head, and huge, murderous claws."
                creatures:
                  - core/monster/adventure-the-basilisk
              - id: dead-eyes-cave/locations/6-the-basilisks-lair/continued
                title: Continued
                kind: text
                page: 80
                body: "Afraid of Chickens: Basilisks are terrified of chickens. Their Ferocity decreases by one (to a minimum of 1) if such a bird can be seen within 10 meters, and they dare not attack a person who carries a hen or rooster. A player character can recall this weakness with a successful BEAST LORE roll."
              - id: dead-eyes-cave/locations/6-the-basilisks-lair/blindfolded
                title: Blindfolded
                kind: sidebar
                page: 80
                body: "If the player characters blindfold themselves (as Gunhill and the cultists did), they are immune to the basilisk’s gaze (monster attack #6), but also act as if in complete darkness (page 52 in the Rulebook)."
    keywords:
      - Dead Eyes Cave
    images:
      - images/chapters/dead-eyes-cave.jpg
  - id: fort-malus
    title: Fort Malus
    number: 12
    kind: chapter
    page: 81
    body: |
      The ruins of Fort Malus have been hidden since the fall of the great dragon Empire. According to legend, they are home to an enchanted apple tree that bears fruit of the purest gold, planted by the last
      Baron Stoneoak. Now dragon knights of the Keepers of the Immaculate Flame (page 8) have found their way to Fort Malus in search of its precious treasures.
    sections:
      - id: fort-malus/the-situation
        title: The Situation
        kind: section
        page: 81
        body: "The dragon knights Tylos, Isadelia, Niklion have been traveling the Misty Vale, trying to find ruins from the time of the dragon empire and reclaim them in the name of Eledain. They are accompanied by a band of adventurers who serve as their guards and henchmen. When their group recently found the legendary Fort Malus, someone was already there – the demon cultists Blutuld and Ossiar who were looking for pieces of the dragon statuette (page 8). The dragon knights captured Blutuld and put him in irons, while Ossiar managed to escape. Fort Malus was a disappointment to the dragon knights. They did find the mythical apple tree in the courtyard, but it bore only a handful of apples. The fruits were golden in color and delicious in flavor, but not of actual gold as the stories had told. Beneath the keep was a locked cellar – perhaps that was where the real treasures were kept? Inscribed on the cellar door was an Elvish poem which the three knights could not read, so Tylos left Fort Malus in search of a suitable translator. He eventually found the elf Iliel in the Iron Forest, and when she would not cooperate, Tylos forced her to come with him to Fort Malus where she too was shackled. Now her two companions Aldonil and Orifin are looking for her (see random encounter #11 on page 30). Having been interrogated and no longer serving any purpose, Blutuld was burned at the stake. Since Iliel refused to cooperate, the dragon knights had their henchmen dig their way down through the floor, while Tylos left Fort Malus once again to find more “volunteers” to help (see random encounter #9 on page 30). Niklion oversees the digging while Isadelia works on Iliel. Blutuld’s comrade Ossiar is hiding in the surrounding forest, hoping to rescue his friend. Some treasures can indeed be found behind the magically sealed cellar door (room #10) – including one of the four pieces of the dragon statuette (page 8) if you chose to place it here – but also a nature spirit named Rotlaug, who was enslaved by House Stoneoak to give life to the magical apple tree. The fruits were never of real gold, but they are numerous and so satiating that a single apple is enough food for a whole day. Over the centuries in the vault, Rotlaug has withered along with the apple tree – but also plotted his terrible revenge…"
        sections:
          - id: fort-malus/the-situation/leaving-the-fort
            title: "Leaving the Fort?"
            kind: sidebar
            page: 81
            body: If the player characters leave the fort to take a long rest, roll D6 per shift on the table on page 107 in the Rulebook.
          - id: fort-malus/the-situation/random-events
            title: Random Events
            kind: table
            page: 82
            table: "Fort Malus: Random Events"
      - id: fort-malus/locations
        title: Locations
        kind: section
        page: 82
        sections:
          - id: fort-malus/locations/1-surrounding-area
            title: Surrounding Area
            number: "1"
            kind: location
            page: 82
            body: |
              It is dark under the storm clouds that cover the Misty Vale. Raindrops and leaves perform a rustling, splashing dance in the gusty wind. Also joining in are the cones of light beaming at the forest from the top of the wall, from lanterns carried by guards peering outward but longing inward, to the warmth of the keep.
              ✦The Cultist: Ossiar has come to Fort Malus to free his imprisoned friend. He sneaks up and eavesdrops on the player characters’ conversation and can then be discovered with a (passive) AWARENESS roll. If spoken to, he makes himself known. The same happens if he is not detected, but only after he has heard enough to understand that the player characters are not allied with the knights.
            sections:
              - id: fort-malus/locations/1-surrounding-area/negotiation
                title: Negotiation
                kind: section
                page: 82
                body: "Ossiar claims to be an explorer and wants help freeing his friend Blutuld from two ruthless knights – the friend can be recognized by a scar running from his forehead down his cheek over his left eye. Ossiar can arrange a diversion that gives the player characters a boon on SNEAKING into the courtyard. With a successful PERSUASION roll, he can also be convinced to participate in a joint attack on the fortress."
              - id: fort-malus/locations/1-surrounding-area/ossiar
                title: Ossiar
                kind: npc
                page: 82
                body: Ossiar poses as a timid explorer but is a fanatical follower of Sathmog. His only goal is to free Blutuld, with or without the player characters’ help. Ossiar has the mark of Sathmog tattooed on his forearm. If the player characters confront him about this, he tries to run away.
                creatures:
                  - mistyvale/monster/ossiar
                keywords:
                  - Ossiar
                images:
                  - images/people/fort-malus-locations-1-surrounding-area-ossiar.jpg
          - id: fort-malus/locations/fort-malus
            title: Fort Malus
            kind: map
            page: 83
            images:
              - images/maps/fort-malus-locations-fort-malus.jpg
          - id: fort-malus/locations/2-the-wall
            title: The Wall
            number: "2"
            kind: location
            page: 84
            body: |
              The wall around Fort Malus is as tall as three full-grown humans – cracked, weathered, and covered in vines, but still sturdy. Two large cracks, probably big enough to get through, can be seen in the northern and eastern walls.
              ✦Sneaking: Reaching the wall undetected requires a SNEAKING roll. Under cover of darkness, the roll is made with a boon. Through the cracks, the player characters get a view of the courtyard with the bonfire and see light shining from the two sheds (#7 and #8) and the keep (#9). Getting in through the cracks is easy.
              ✦Guards: Two adventurers are patrolling the top of the wall. They have orders to attack any creature approaching from the outside, and if someone calls out it, until no further forward movement is possible. DISPEL has no effect.
            sections:
              - id: fort-malus/locations/2-the-wall/the-adventurers
                title: The Adventurers
                kind: npc
                page: 84
                body: "The dragon knights have hired a band of adventurers to help with the excavation and guard the fortress. Perhaps it would be more accurate to call them raiders, and cold-blooded ones at that. They were promised a fifth of the allegedly plentiful loot and they are not leaving without it! The guards are as many as the player characters, but at least two and no more than four."
                creatures:
                  - core/monster/adventure-the-adventurers
                images:
                  - images/people/fort-malus-locations-2-the-wall-the-adventurers.jpg
          - id: fort-malus/locations/attack
            title: "Attack!"
            kind: sidebar
            page: 84
            body: |
              If the player characters want to attack the castle directly, they have a tough battle ahead of them. Two adventurers are patrolling the top of the wall. In the event of an attack, they immediately raise the alarm and are joined by the other adventurers in the next round, and the two dragon knights in the round after that.
              to them, they immediately sound the alarm and await reinforcements. They are only looking outward, so player characters in the courtyard will not be detected as long as they do not make any noise.
              ✦Climbing: Climbing the wall requires an ACROBATICS roll. Once at the top, it takes another SNEAKING roll to avoid being spotted by the guards.
          - id: fort-malus/locations/3-gatehouse
            title: Gatehouse
            number: "3"
            kind: location
            page: 84
            body: |
              The fortress’s five meter high and equally wide double gate of bronze must once have been an impressive sight. Now its surface is as green as the moss that has taken hold along the edges. The outline of a coat of arms – a tree with golden apples – is barely visible. The gate is slightly ajar.
              ✦Gate: The patinated double gate is ajar, simply because it can no longer be closed. Opening it enough to slip through requires a roll against STR, but this triggers a jarring squeak that is noticed by anyone currently outside.
              ✦Coat of Arms: A MYTHS & LEGENDS roll reveals that the coat of arms on the gate belongs to House Stoneoak, which was powerful in the days of the dragon empire.
            keywords:
              - Gatehouse
          - id: fort-malus/locations/4-the-bonfire
            title: The Bonfire
            number: "4"
            kind: location
            page: 84
            body: |
              A bed of embers smokes and smolders in the courtyard. The fire must have been huge, a real bonfire.
              ✦The Bed of Embers measures three meters in diameter and is still hot. Anyone rummaging around in the smoldering ashes must make a BUSHCRAFT roll or take D3 fire damage.
              ✦The Skull: A person who digs through the charcoal finds a human skull. An examination of the skull combined with a successful HEALING roll reveals an injury to the bone – a gash running from the forehead down under the left eye.
              ✦Random Event: Roll D6 on the table on page 80 for each full stretch the player characters spend here.
          - id: fort-malus/locations/5-the-stone-tree
            title: The Stone Tree
            number: "5"
            kind: location
            page: 84
            page_end: 85
            body: |
              A half-dead tree behind a meter-high stone wall. It does not look like much – a sprawling, bone-dry crown covered in wrinkled bark, bare but for a handful of small, yellow-red fruits. The surrounding wall is overgrown with thorns so dense that the circle of marble at its top is barely visible.
              ✦The Tree: Anyone who examines the tree up close and succeeds with a BUSHCRAFT roll can see that the tree is withered, but small pale green buds on some of the lower branches show that it is still alive.
              ✦The Fruits: D4 scattered fruits hang from the branches. They look like small apples, golden in color and delicious. One golden apple is enough food for an entire day but counts as a tiny item in terms of encumbrance.
              ✦The Marble Circle: Carved into the marble surface at the top of the wall are ancient letters which can be read with LANGUAGES: “The golden tree will be forever in the care and possession of House Stoneoak; such is the agreement with the tree’s keeper and soul, Rotlaug, bound to this place in perpetuity.”
              ✦Random Event: Roll D6 on the table on page 80 for each full stretch the player characters spend here.
            keywords:
              - The Stone Tree
              - Stone Tree
          - id: fort-malus/locations/6a-and-6b-storage-shed
            title: "6A & 6B Storage Shed"
            kind: section
            page: 85
            body: |
              Darkness and silence are all that can be sensed from the dilapidated shed. The doorless entrance gapes like a monster’s maw, waiting for delicious visitors.
              ✦Random Event: Roll D6+1 on the table on page 80 for each full stretch the player characters spend in here.
          - id: fort-malus/locations/7-iliels-cell
            title: Iliel’s Cell
            number: "7"
            kind: location
            page: 85
            body: |
              A lantern lights up the interior of the small shed. Light seeps out through cracks in the brickwork and where the centuries-old roof tiles have fallen in. As you approach the moss-covered facade, you hear tense, hissing voices – no words can be made out, at least not until you are just outside.
              ✦Eavesdropping: Getting close enough to eavesdrop without being detected requires a SNEAKING roll. If it succeeds, two female voices are heard – one irritated and threatening, the other defiant. A few words can be made out: Isadelia:“Why refuse? If [mumble] just translate [mumble] on the cellar door, you are free to get your [mumble] out of here!” Iliel:“No, let me go [mumble] If you [mumble] nicely, I might [mumble] you. But [mumble] coercion and threats, never!”
              ✦Isadelia: Shortly after the dialogue above, Isadelia turns around and slams open the door. If the player characters are in her line of sight, she spots them immediately, but if they stick to the shadows, they remain undetected
              – she locks the door behind her and strides purposefully towards the keep (#9) without looking back.
              ✦The Symbol: Isadelia has the symbol of Eledain fully visible on her cloak and cloak buckle. The player characters can identify it with a MYTHS & LEGENDS roll.
              ✦The Door: The door to the shed is old and leaky, but the heavy lock works and picking it requires a SLEIGHT OF HAND roll. It is possible to break the door (10 HP, Armor Rating 6), but not without alerting the enemy.
              ✦The Roof: It is also possible to enter from the roof, thanks to the many missing roof tiles. It takes an ACROBATICS roll to get up and in without accident; on failure the climber suffers a four-meter fall. If Isadelia is still in the shed, it also takes a successful SNEAKING roll to avoid detection.
              ✦Iliel: If the player characters enter, a proud and imposing elven woman rises to her feet. Her ankles are shackled, and her hands tied behind her back. She offers to tell them everything she knows in exchange for her freedom.
              ✦Random Event: Roll D6+1 on the table on page 80 for each full stretch the player characters spend in here.
            sections:
              - id: fort-malus/locations/7-iliels-cell/iliel
                title: Iliel
                kind: npc
                page: 85
                body: "If the player characters free her, Iliel explains that she was taken to Fort Malus against her will by what she believes to be dragon knights. They want her to translate the ancient writing on a door in the keep. Another prisoner was held in the adjacent building – she does not know who it was, but judging by the sounds, smells, and agonized screams that reached her a few hours ago, she assumes that the person is dead."
                creatures:
                  - mistyvale/monster/iliel
                keywords:
                  - Iliel
                images:
                  - images/people/fort-malus-locations-7-iliels-cell-iliel.jpg
            keywords:
              - Iliel’s Cell
          - id: fort-malus/locations/8-blutulds-cell
            title: Blutuld’s Cell
            number: "8"
            kind: location
            page: 86
            body: |
              The door to the larger shed is wide open and a faint light spills out onto the grass. Otherwise, it looks just like the building next to it, with its mossy stone facade and broken roof.
              ✦Knapsack: Blutuld’s knapsack is still here, next to the shackles that previously held him. It contains a sleeping fur, a field kitchen, and a shovel, as well as a nine-hole ocarina shaped like a grinning demonic rooster.
            keywords:
              - Blutuld’s Cell
          - id: fort-malus/locations/9-the-keep
            title: The Keep
            number: "9"
            kind: location
            page: 86
            body: |
              How high it once was is impossible to say, but now the ground floor is all that remains of the keep. Light seeps out through tall, narrow window openings partly covered by creeping vines, and the patinated bronze door is closed. The noise of pickaxes hitting stone echoes from inside, sometimes accompanied by the impatient shouts of a gruff male voice.
              ✦The Door: The bronze door is barred from the inside. It is very difficult to break down (80 HP, armor rating 18) and any attempt to do so is heard by everyone nearby.
              ✦Backdoor: The smaller door leading the other way, to a small courtyard with a dry well, does not close all the way. However, it takes a successful SNEAKING roll for it to be opened without a revealing squeak.
              ✦Through the Roof: In the southeast corner of what used to be floor on the second level, the stairway opening still remains. Since the weathered facade is easy to climb, the ACROBATICS roll is made with a boon.
              ✦The Dragon Knights: Unless someone has sounded the alarm, both dragon knights can usually be found in the great hall of the keep. They are not very alert but will attack any intruder on sight. However, both Isadelia and Niklion do leave the hall from time to time, which could be a good moment for the player characters to strike – together they pose a serious challenge in combat.
            sections:
              - id: fort-malus/locations/9-the-keep/the-dragon-knights
                title: The Dragon Knights
                kind: npc
                page: 86
                body: "The young and ambitious knights Isadelia and Niklion are exploring Fort Malus on their own initiative. They want to reestablish Eledain’s empire and hope to find a gold treasure that they can offer to the dragons of the Dragonfang Peaks. The goal is all that matters – if the player characters seem more capable than her current guards, Isadelia offers them the job instead."
                creatures:
                  - core/monster/adventure-the-dragon-knights
                images:
                  - images/people/fort-malus-locations-9-the-keep-the-dragon-knights.jpg
              - id: fort-malus/locations/9-the-keep/continued
                title: Continued
                kind: text
                page: 86
                body: |
                  Abilities Isadelia: Defensive, Double Slash, Veteran
                  Abilities Niklion: Lightning Fast, Veteran
                  Gear Isadelia: Longsword (skill level 16, damage 2D8), large shield, sleeping fur, D8 gold coins
                  Gear Niklion: Heavy warhammer (skill level 16, damage 2D10), sleeping fur, D8 gold coins
                  The Crystals: The knights also carry four of the crystals needed to open the door to the keep’s cellar (all except the yellow one). Which of them has the crystals is up to you, depending on what is most appropriate
                  ✦Secret Compartment: Anyone who searches the knapsack and succeeds with a SPOT HIDDEN roll finds a secret compartment in its leather hem. Hidden inside is a small silver coin with the symbol of Sathmog on one side.
                  ✦Random Event: Roll D6+1 on the table on page 80 for each full stretch the player characters spend in here.
              - id: fort-malus/locations/9-the-keep/the-price-of-digging
                title: The Price of Digging
                kind: table
                page: 86
                table: The Price of Digging
              - id: fort-malus/locations/9-the-keep/the-inscription
                title: The Inscription
                kind: sidebar
                page: 87
                body: |
                  The drop is east of the heart, but not in the center The heart is not by the leaf, but just east of the sun The sun is neither in the far west nor the far east The moon is next to the drop alone The leaf is west of the heart
                  The Correct Order: Leaf/Green, Sun/Yellow, Heart/Red, Drop/Blue, Moon/Off-White
                  ✦The Adventurers: The adventurer or adventurers who are not guarding the wall are digging their way through the floor on the orders of the dragon knights. There is a sledgehammer and a pickaxe in the room. Player characters who find the door’s riddle as unsolvable as the dragon knights can keep digging. See the sidebar “The Price of Digging”.
                  ✦Cellar Door: The massive ironclad cellar door is patinated, but not as much as the door to the keep. It has no normal lock and cannot be picked or opened with UNLOCK. Breaking it down is almost impossible (100 HP, armor rating 25). The best way to open it is to decipher the inscription and place the crystals in the correct order.
                  ✦The Inscription: On the upper part of the cellar door there is an inscription in an ancient language, and below it a tree with a leafy crown. A closer look reveals five horizontal indentations at chest height, each one round and about the size of a silver coin. A bright yellow crystal lens has already been placed in the leftmost indentation but is easily removed. It takes a LANGUAGES roll to decipher the text – see the sidebar above.
          - id: fort-malus/locations/10-cellar
            title: Cellar
            number: "10"
            kind: location
            page: 87
            body: "Once the crystal coins are placed in the right order, the whole door flares up with an inner light that shines through the lenses with blinding intensity. The door slides open by itself. The musty smell of the darkness beyond the threshold mixes with an acrid, pungent stench. A croaking, chuckling voice says: “Rotlaug is free! Make way, time to make things grow.”"
            sections:
              - id: fort-malus/locations/10-cellar/rotlaug
                title: Rotlaug
                kind: monster
                page: 87
                body: |
                  The nature spirit Rotlaug is as crooked as a dwarf birch, with skin as rough and pale as the bark of a birch tree. His face is dominated by a wide, toothless mouth. His nose is like a small bud and his eyes like tiny peppercorns. As for his goals in life, he has only two: to be free and take revenge for all his years in captivity (see below).
                  ✦The Cellar: A crypt with a stone floor (about 6×6 meters) and a low ceiling. Almost everything that was down here has crumbled into dirt.
                  ✦Treasures: Most of House Stoneoak’s fortune was eaten up by the conflicts that marked the final years of the empire, but in a cracked urn the player characters can find valuables equivalent to four treasure cards. If a piece of the dragon statuette was placed in this adventure, it is here as well.
                creatures:
                  - core/monster/adventure-rotlaug
                keywords:
                  - Rotlaug
              - id: fort-malus/locations/10-cellar/rotlaugs-revenge
                title: Rotlaug’s Revenge
                kind: section
                page: 87
                body: "If Rotlaug is freed, he walks out into the courtyard, surrounded by the swarming hornets who have awaited their master’s return, and unleashes all his life-giving power. He becomes part of the apple tree, which quickly grows many times larger and attacks Fort Malus – its branches and roots crashing into the ruins as they cling to the walls and ceilings. Meanwhile, grass shoots up between growing cracks in floors and foundations. Wildflowers sprout, bud, and bloom all over the courtyard. If one or both of the dragon knights are still around when this happens, they try to stop Rotlaug, but are soon crushed by vengeful roots. The adventurers flee for their lives. If any player character tries to stop or harm Rotlaug, they too are attacked by ferocious branches and roots, which counts as a monster attack that inflicts 3D8 bludgeoning damage. Rotlaug cannot be defeated in combat by any means available to the player characters. A few minutes later, Rotlaug’s revenge is complete – Fort Malus has been turned into an overgrown ruin, hard to distinguish from the forest that surrounds it. If there are treasures left in the ruin’s cellars, the player characters can still access them. At the center of the ruin sits the now enormous apple tree, with 4D6 golden apples ready to be plucked. An additional 4D6 fruits can be harvested every autumn."
                images:
                  - images/art/fort-malus-locations-10-cellar-rotlaugs-revenge.jpg
          - id: fort-malus/locations/cellar
            title: Cellar
            kind: map
            page: 87
            page_end: 88
    keywords:
      - Fort Malus
    images:
      - images/chapters/fort-malus.jpg
  - id: the-village-of-the-day-before
    title: The Village of the Day Before
    number: 13
    kind: chapter
    page: 88
    sections:
      - id: the-village-of-the-day-before/the-situation
        title: The Situation
        kind: section
        page: 88
        page_end: 89
        body: "In the winter of his life, the dragon emperor’s loyal sorcerer Kato the Curious, charged in vain with securing immortality for his master, decided to try to cheat death himself. To this end he made a deal with the demon Ix, a servant of Sathmog, in exchange for treason on Kato’s part. Kato, who was close to Eledain’s court, sowed lies and discord that contributed to the empire’s downfall. His contract with Ix was as complex as it was convoluted, written on a long scroll of tanned skin in a demonic language whose grammar and vocabulary relied on ambiguous phrasing to allow for ironic consequences in contracts with mortals. Instead of making Kato immortal, Ix fulfilled his part of the bargain by trapping his tower and the village of Blackridge in a sphere of disjointed time where the last hour of the sorcerer’s life constantly repeats itself. Coincidentally, this is also the final hour for all the villagers of Blackridge, as Kato’s betrayal had just come to the emperor’s attention and a flight of dragons had been sent to obliterate the wizard’s tower and the village as punishment and as a warning to others. The dragons approaching in v-formation can be seen from Blackridge throughout the time loop, getting closer and closer, until the dragon riders order the village’s destruction and jets of flame erupt from the dragons’ mouths. The cycle begins anew at the moment of Kato’s death. Anyone who dies a violent death in the time loop wakes up exactly where they were when it began. The sphere around Blackridge can be entered from the outside, but once a person crosses the event horizon it is impossible to escape. The villagers relive the same hour over and over with no memory of the repetitions, while the player characters and other outsiders retain their memories from one cycle to the next. Numerous adventurers have ventured into Blackridge over the years, lured by rumors of treasure. They all found themselves trapped with no means of escape, forced to live out their lives inside the sphere. Although the time loop constantly resets, it is possible for outsiders to die of old age. The lives in question tend to be short. The unbalanced diet, strange sleep cycle, distorted sense of time, stress, and severe mental strain usually lead to a relatively quick death in the grip of madness. Few survive the first two years. To complete the adventure, the player characters must figure out what is going on and master the time loop’s peculiar mechanisms, make it all the way up to Kato’s chamber at the top of the tower, and either destroy the artifact that maintains the sphere – the parchment scroll which forms the contract between Ix and Kato – or make a deal with the demon prince for free passage out of there. This adventure is a possible location for one of the four pieces of the dragon statuette (page 8), which in that case is found at the top of the tower (location #11)."
        sections:
          - id: the-village-of-the-day-before/the-situation/the-time-loop
            title: The Time Loop
            kind: sidebar
            page: 89
            body: |
              In the dragon empire, each day was measured in units of 96 dontes, based on the number of teeth with which all dragons are born. At the center of Kato’s tower is a sundial which can be seen from any unobstructed location in Blackridge. One donte equals one stretch. Each cycle of the time loop spans four dontes – that is, one hour for the player characters. As GM you can track time in the game by measuring real time with a suitable tool – for example, the hour-long cycle for the player characters could equal 15 minutes for the players. You can track time secretly during the first cycle, and openly during all subsequent ones. Alternatively, you as GM can simply decide how fast the cycle’s hour passes.
              The cycle begins around 5 pm, in early autumn. Towards the end of the cycle, the sky grows increasingly dark, and the dragons’ roars get louder and louder, eventually becoming deafening at nightfall. The fire of a dozen dragons suddenly erupts in the darkness, and the entire population of Blackridge perishes in the blaze – including the player characters. The player characters then wake up unscathed in the place where they crossed the event horizon, and the next cycle begins. However, experiencing many cycles will slowly break them down– whenever a new cycle begins, each player character suffers a condition of their choice. With time running out, there is little opportunity for recovery, except in the time pocket at Mormel’s Monument (location #8).
      - id: the-village-of-the-day-before/locations
        title: Locations
        kind: section
        page: 89
        sections:
          - id: the-village-of-the-day-before/locations/1-barricade
            title: Barricade
            number: "1"
            kind: location
            page: 89
            body: |
              In a valley between two hills, the road is blocked by a barricade that seems to be a mixture of orc palisades, dwarven structures, elven ironwork, thorny hedges of the kind grown by halflings, and other things of indeterminate origin. Texts in unknown languages have been painted on the various parts of the barricade.
              ✦Old Construction: With a successful MYTHS & LEGENDS roll, the player characters realize that parts of the barricade are very old – many of the peoples who left their mark here have not been seen in the region for hundreds of years.
              ✦Warnings: Player characters who succeed with a LANGUAGES roll find that all the texts on the barricade are warnings urging visitors to turn back immediately.
              ✦Climbing: Climbing the barricade requires an ACROBATICS roll. Anyone who fails still makes it across but suffers D4 piercing damage.
              ✦Razing: The barricade has armor rating 12 and 100 HP.
          - id: the-village-of-the-day-before/locations/the-village-of-the-day-before
            title: The Village of the Day Before
            kind: map
            page: 89
            images:
              - images/maps/the-village-of-the-day-before-locations-the-village-of-the-day-before.jpg
          - id: the-village-of-the-day-before/locations/2-the-event-horizon
            title: The Event Horizon
            number: "2"
            kind: location
            page: 90
            body: |
              Before you the air shimmers with all the colors of the rainbow. You glimpse a village on the other side of the barrier, but the view is too blurred to make out any details. Near the shimmering barrier stands a particularly well-dressed mallard with a book in his hands.
              ✦The Barrier: A player character who touches the barrier feels a tickling sensation. If the characters continue forward, they pass smoothly through the barrier – now their first cycle in Blackridge begins, and this is where they wake up if they die (page 87).
              ✦The Scholar: The mallard at the barrier is the scholar Canutus Boetii. He can explain that various peoples who lived here for centuries built the barricade to prevent visitors from crossing the magical barrier around Blackridge.
            sections:
              - id: the-village-of-the-day-before/locations/2-the-event-horizon/dragon-droppings
                title: Dragon Droppings
                kind: section
                page: 90
                body: "If the player characters want more information and succeed with a PERSUASION or BLUFFING roll, Canutus tells them that he has tested various substances for their effect on the magical barrier and is happy to demonstrate the only one that had any effect at all. From a box he takes out some dry grains and sprinkles them on the barrier. They start to glow before accelerating to great speed and disappearing from view. Canutus says the grains are some of the rarest things he owns – guano draconis, fossilized dragon droppings retrieved from the lair of a long dead dragon. If the player characters force or push Canutus through the event horizon, he gets very angry and refuses to help them."
              - id: the-village-of-the-day-before/locations/2-the-event-horizon/canutus-boetii
                title: Canutus Boetii
                kind: npc
                page: 90
                body: Canutus Boetii is an academic who has been experimenting on the event horizon. In addition to helping the player characters, he can teach them his skills for a suitable fee.
                creatures:
                  - mistyvale/monster/canutus-boetii
                keywords:
                  - Canutus Boetii
                  - Canutus
                images:
                  - images/people/the-village-of-the-day-before-locations-2-the-event-horizon-canutus-boetii.jpg
              - id: the-village-of-the-day-before/locations/2-the-event-horizon/continued
                title: Continued
                kind: text
                page: 90
                body: |
                  ✦Dragon Pole: If the player characters ask about the pole sticking out of the tower and succeed with BEAST LORE, they realize that it is a landing spot for visiting dragons. What is strange is that such things have not been built on rooftops since the days of the dragon empire.
                  ✦The Approach of the Dragons: If the player characters are actively looking around, you can have them make an AWARENESS roll. Whoever succeeds sees some kind of flying creatures approaching from the horizon in V-formation. At the moment, they are too far away to be identified.
          - id: the-village-of-the-day-before/locations/3-the-edge-of-the-village
            title: The Edge of the Village
            number: "3"
            kind: location
            page: 90
            body: |
              Having passed through the shimmering barrier, you find yourself on the edge of a small village. A flock of sheep amble around a bit further away. A simple path leads to the village, which consists of a few modest houses centered around a tall, black tower. On the other side of the village is a rocky outcrop with what looks like large reliefs carved into the stone. No matter what time of year or day it was outside the barrier, it is late afternoon and autumn in here. The air is cool, the trees dressed in autumn colors, the light fading. Crows are circling above the tower. What looks like a large flagpole, but horizontal, sticks out from its top.
              ✦The Event Horizon: Behind the player characters is the Misty Vale as it was seven centuries ago. The barricade of rubble can no longer be seen, nor can the shimmering barrier. The event horizon, despite its invisibility, cannot be crossed in the opposite direction. Things slow down around anyone approaching
          - id: the-village-of-the-day-before/locations/4-village-square
            title: Village Square
            number: "4"
            kind: location
            page: 91
            body: |
              The village square is small and paved with stones whose different colors form the image of a rearing dragon. The tall black tower rises nearby, casting its shadow over the place. A farmer with a walking stick waddles up to you, eager to talk.
              ✦Farmer Rax is upset that his flock has strayed from its paddock after part of the fence gave way. He is keen to ask the newcomers if they happened to see the animals on their way here and offers one of his wife’s freshly baked plum pies as payment for helping him catch the runaway sheep.
              ✦Tracking the Flock: The player characters can track down Farmer Rax’s missing sheep with a successful HUNTING & FISHING roll. In that case they see a ram and seven ewes dart through the dung heap (location #10), chased by Rax’s herding dog. Immediately thereafter, they all take to the air.
            sections:
              - id: the-village-of-the-day-before/locations/4-village-square/the-grim-fate-of-the-sheep
                title: The Grim Fate of the Sheep
                kind: section
                page: 91
                body: Shortly before the end of the time cycle, a ram and seven ewes come flying at high speed a couple of meters above the square. One by one, they crash into the facade of the Blazing Breath Inn. They are followed closely by a speckled sheepdog flying at the same speed. The collisions cause some damage to the inn, and the animals themselves burst like balloons stuffed with ground meat. It is not a pretty sight and causes such a commotion in the square that the wails of the onlookers drown out the wingbeats of the approaching dragons. Before long the village and all its inhabitants are cremated. If the players ask where the flying animals came from, a successful AWARENESS roll can reveal that they came from the direction of the tower.
              - id: the-village-of-the-day-before/locations/4-village-square/what-the-villagers-know
                title: What the Villagers Know
                kind: sidebar
                page: 91
                body: "The inhabitants of Blackridge speak an archaic but perfectly understandable version of the common tongue. Any NPC the player characters encounter can tell them that the village is called Blackridge, mention a year more than seven centuries before the player characters’ time, and explain that the village is a fief granted to Kato the Curious, a powerful wizard who enjoys the special trust of dragon emperor Eledain who rules this land, and that Kato got his widely recognized nickname because he “likes to look inside people.” If the player characters start talking about time capsules and such, they just shake their heads."
          - id: the-village-of-the-day-before/locations/5-the-blazing-breath
            title: The Blazing Breath
            number: "5"
            kind: location
            page: 91
            body: |
              The village square is dominated by a large but dilapidated building in the shadow of the tower. Several windows have been boarded up. Above the door hangs a badly painted sign which, with a little imagination, can be assumed to portray a jet of fire spewed from a dragon’s mouth.
              ✦Ukka and Thorendil: There are about ten guests at the inn. All of them are ordinary villagers, except two – a burly orc and a lanky man playing dice at a table. During the first time cycle they are very quiet, only making cryptic comments like “you better make yourselves at home” and “this table is ours, remember that.”
            sections:
              - id: the-village-of-the-day-before/locations/5-the-blazing-breath/subsequent-cycles
                title: Subsequent Cycles
                kind: section
                page: 91
                body: "Ukka and Thorendil are outsiders who have been stuck in the time sphere for the last ten months. But they do not mention this, or what is about to happen – the dragon attack and the restarting of the cycle – during the player characters’ first cycle. During subsequent cycles they are less secretive and can be made to reveal everything they know with PERSUASION or BLUFFING rolls. Offering them a strong drink adds a boon to the roll. They both believe the secret of the time sphere is hidden at the top of the tower, along with the unseen Kato, but the staircase leading there is too long to climb before the time cycle resets. Both have tried several times, but despite running as fast as they could they never made it more than halfway."
              - id: the-village-of-the-day-before/locations/5-the-blazing-breath/ukka-and-thorendil
                title: Ukka and Thorendil
                kind: sidebar
                page: 91
                body: "Ukka was sent here by Maladûk to find pieces of the dragon emperor’s statuette (or the treasures in Kato’s tower, if you are not playing The Secret of the Dragon Emperor). Thorendil is an ambitious sorcerer’s apprentice who shortly afterwards was sent by Azrahel Koth for the same purpose. During their first few cycles they fought each other as sworn enemies, before realizing the futility of killing each other repeatedly with nothing to show for it. After that they embarked on a stormy romance that ended in mutual bitterness after only a few weeks. Since then, they have agreed that the most tolerable way to spend their time is playing dice at the Blazing Breath while becoming increasingly intoxicated. There they are burned to death with each new cycle, only to wake up at the edge of the village (on the opposite side from the player characters) and immediately head back to the inn."
              - id: the-village-of-the-day-before/locations/5-the-blazing-breath/ukka
                title: Ukka
                kind: npc
                page: 92
                body: "Ukka rules her own clan under Maladûk and accepted the mission to strengthen her position in the orc hierarchy. Her dream is to gather enough support to challenge Maladûk to single combat, but now she has fallen into deep despair, certain that the outside world goes on without her and that all her ambitions have come to nothing. She is big and burly and in poor mental health. Towards the end of the cycle, she becomes very talkative and sentimental if any player character seems willing to listen."
                creatures:
                  - mistyvale/monster/ukka
                keywords:
                  - Ukka
                images:
                  - images/people/the-village-of-the-day-before-locations-5-the-blazing-breath-ukka.jpg
              - id: the-village-of-the-day-before/locations/5-the-blazing-breath/thorendil
                title: Thorendil
                kind: npc
                page: 92
                body: Thorendil is a careerist who, by volunteering to search for the Dragon Emperor’s statuette, hopes to compensate for lacking the patience required to study black magic in a serious way. He is tall and skinny, with yellowish skin due to the damage his liver has taken from his time in Blackridge. His restless nature is tortured by the conditions of the time sphere, and his manic episodes become more severe with every cycle and depending on how long it has been since he last slept. During these episodes he often bursts into hysterical laughter that soon turns into crying spells.
                creatures:
                  - mistyvale/monster/thorendil
                keywords:
                  - Thorendil
                images:
                  - images/people/the-village-of-the-day-before-locations-5-the-blazing-breath-thorendil.jpg
              - id: the-village-of-the-day-before/locations/5-the-blazing-breath/continued
                title: Continued
                kind: text
                page: 92
                body: "✦Inhabitants: The houses are home to a small number of families who live a simple existence in the shadow of the tower. The families tend to be large and poor, and the children take every opportunity to beg."
            keywords:
              - The Blazing Breath
              - Blazing Breath
          - id: the-village-of-the-day-before/locations/6-raxs-farm
            title: Rax’s Farm
            number: "6"
            kind: location
            page: 92
            body: |
              One of the village’s few farms is larger than the others. Next to the farmhouse is a small grove of plum trees that shows signs of harvest, such as baskets and ladders leaning against the trees. A nearby paddock with a partially broken fence stands empty. A trail of hoof prints leads away from there.
              ✦Malyn: Rax, his wife Malyn, and their seven sons farm the land around Blackridge and keep livestock. Malyn has used the freshly picked plums to bake a huge pie. It has just been taken out of the oven and left to cool on a windowsill. Only Malyn and her youngest boy are there, as the others are out searching for the missing sheep (see location #3).
            keywords:
              - Rax’s Farm
          - id: the-village-of-the-day-before/locations/7-dwellings
            title: Dwellings
            number: "7"
            kind: location
            page: 92
            body: Around the square are a handful of humble dwellings. Dirty children are glaring at you.
          - id: the-village-of-the-day-before/locations/8-mormels-monument
            title: Mormel’s Monument
            number: "8"
            kind: location
            page: 92
            page_end: 93
            body: |
              Someone has carved reliefs into a rock on the outskirts of the village. A closer look reveals that they show an unusually large dwarf in various situations, accompanied by dwarven writing.
              ✦The Reliefs: A successful MYTHS & LEGENDS roll (boon for dwarves) reveals that the reliefs depict the legendary dwarf warrior Mormel the Tall and several
              of his great deeds – such as Mormel’s triumph over the Penraclian Lindworm, his famous Five Feats and, most impressively, his tragic courting of the elven princess Siri, also immortalized in numerous plays and poems. In the lower part of the relief are some notes that read: “Do NOT go near the east side of the tower without a nose clip” and “Gorm likes plums.”
            sections:
              - id: the-village-of-the-day-before/locations/8-mormels-monument/the-time-pocket
                title: The Time Pocket
                kind: section
                page: 93
                body: "At the site of the monument, a circle about 20 meters in diameter, an anomaly has emerged in Ix’s spell – a kind of temporal backwash, where time stands completely still and is not affected by the cycles. The player characters can realize this with a (passive) AWARENESS roll – the outside world looks completely frozen, which the player characters can use to rest and recover without the time cycle moving forward. Until now, the only person to take advantage of this was Mormel the Tall, who came to Blackridge a few hundred years ago as part of a bet. He built a camp here and made a decent life for himself that lasted two decades, until he lost his mind, wandered off in the time sphere, and finally died of natural causes. With nothing else to do, he spent his static time carving a monument to himself and his life’s work into a rock formation."
            keywords:
              - Mormel’s Monument
          - id: the-village-of-the-day-before/locations/9-the-tower
            title: The Tower
            number: "9"
            kind: location
            page: 93
            body: |
              The tower rises nearly 50 meters from the ground and is made of ominous black basalt. On the side facing the square is a sundial, and on the east side is a protruding bar of polished steel with what looks like a feeding trough. The tower door is a sturdy old thing clad in steel plates and studs, with skillfully crafted, dragon-shaped hinges. There is no door handle on the outside. A bell in the form of a gaping dragon’s maw with a clapper for a tongue is mounted next to it.
              ✦The Tower Guardian: If the player characters ring the bell, the door is opened by Gorm – the tower guardian. When he sees the guests, he suddenly gets distracted, sniffs the air, and as his eyes cross and drool starts running down his chin, his face takes on a blissful expression. (This is caused by the sweet scent of Malyn’s plum pie, but let the players figure it out for themselves.) Gorm lets out a deep sigh as he remembers his task and asks what business the player characters have at the tower. Gorm will not let anyone in without a bribe in the form of plums, followed by a successful PERSUASION or BLUFFING roll. Fighting him is certainly possible, but at the cost of precious time. Gorm blocks the door and there is no way to get past him, even for player characters covered in dragon dung (page 92).
              ✦Stairs: Beyond the hallway is a spiral staircase so long it is difficult to reach the top before the end of the cycle. It takes five successful ACROBATICS rolls to make it in time. As soon as a roll fails, the cycle ends and the dragons attack, no matter how much time has passed for the players. Observant player characters may notice notches in the walls where previous adventurers marked their personal records. The floors of the tower are taken up by Kato’s reference library, laboratories, and rooms where he vivisects all kinds of creatures in his pursuit of eternal life. The place reeks of rotten flesh. If the player characters make a stop here, they must make a roll against WIL to resist fear, but with a successful SPOT HIDDEN they can find surgical instruments and books that give boons on HEALING rolls when performing surgery.
              ✦Climbing: Climbing the outside of the tower requires five successful ACROBATICS rolls (one every ten meters) with a bane. On failure, the player character falls, likely to their death.
            sections:
              - id: the-village-of-the-day-before/locations/9-the-tower/gorm
                title: Gorm
                kind: monster
                page: 93
                body: Gorm is an aged cave troll wearing a livery of black and scarlet velvet. His belt is full of various scalpels, severed hands and legs, whole heads, and other trophies from uninvited guests who disturbed the peace. Gorm has stats as a troll, as per page 97 in the Rulebook.
                creatures:
                  - core/monster/adventure-gorm
                keywords:
                  - Gorm
                images:
                  - images/people/the-village-of-the-day-before-locations-9-the-tower-gorm.jpg
              - id: the-village-of-the-day-before/locations/9-the-tower/the-way-to-the-top
                title: The Way to the Top
                kind: sidebar
                page: 94
                body: "The most sensible way for the player characters to reach Kato’s topmost chamber is to bribe Gorm with Malyn’s plum pie and use dragon droppings to make it all the way up in time. One or both of these ingredients can be moved to the temporal backwash around Mormel’s monument (#8) and thus be saved from one cycle to the next."
          - id: the-village-of-the-day-before/locations/10-dung-heap
            title: Dung Heap
            number: "10"
            kind: location
            page: 94
            body: |
              On the east side of the tower, under the protruding bar at its top, is a large heap of stinking sludge. The smell is so pungent it makes your eyes water. All vegetation near the dung heap has been reduced to putrid slime.
              ✦The dung heap is the droppings of many a visiting dragon that has landed on the bar above and eaten while its owner visited Kato. Guano draconis is a highly alkaline substance that has had a corrosive effect on the surrounding landscape. The area is generally shunned by the villagers.
            sections:
              - id: the-village-of-the-day-before/locations/10-dung-heap/dragon-droppings
                title: Dragon Droppings
                kind: section
                page: 94
                body: "As Canutus Boetii may have demonstrated to the player characters (see location #2), the dragon droppings are interfering with the artificial time inside the event horizon. This means that objects affected by the droppings can move very fast. Player characters who smear themselves with dragon dung perceive the world around them in slow motion. This gives them plenty of time to reach the top of the tower before the cycle ends. As GM, you may then stop keeping track of time. However, the effect of the dragon droppings only lasts for a short while and wears off just as the player characters reach the top of the tower."
              - id: the-village-of-the-day-before/locations/10-dung-heap/the-flock-of-sheep
                title: The Flock of Sheep
                kind: section
                page: 94
                body: "Near the end of the time cycle, farmer Rax’s (location #4) runaway sheep are chased here by the sheep dog he let loose. In a panic, they run straight through the dung pit with the dog right behind them. Then the animals accelerate to such a high speed that they take to the air, flying a good distance before crossing the square and meeting a terrible end as they crash into the inn."
                images:
                  - images/art/the-village-of-the-day-before-locations-10-dung-heap-the-flock-of-sheep.jpg
          - id: the-village-of-the-day-before/locations/11-the-tower-room
            title: The Tower Room
            number: "11"
            kind: location
            page: 94
            body: You enter a large chamber at the top of the tower, filled with all sorts of books, boxes, and other strange objects. On the floor lies an old man, dressed in a long wizard’s robe. Next to him sits a naked human-like creature whose skin glows like the surface of the sun, hard to look at without being of the guests are cheerful and talkative but respond evasively to questions about missing people. If stats are needed, use the table on page 105 in the Rulebook.
            sections:
              - id: the-village-of-the-day-before/locations/11-the-tower-room/negotiation
                title: Negotiation
                kind: section
                page: 95
                body: "Ix asks why the player characters have come and is happy to answer all their questions. The demon stops time by snapping his fingers, so the conversation can continue without a time limit. Ix addresses each character individually, praising their merits and qualities. The demon will not let the player characters burn the contract on the floor but offers them free passage out of the time sphere (with whatever treasures they can find in the tower room) in exchange for “a favor” at some point in the future. Ix refuses to explain exactly what this entails and will not back down from his condition under any circumstances. If the player characters accept, the world around them fades away and they find themselves standing outside the event horizon just as their own former selves vanish into it. The mallard Canutus Boetii stares at them with a terrified look on his face, pinches his nose at the sulfurous stench that surrounds them, and runs off in a panic."
              - id: the-village-of-the-day-before/locations/11-the-tower-room/burning-the-letter
                title: Burning the Letter
                kind: section
                page: 95
                body: "The player characters can try to burn the letter by distracting Ix. This requires a successful BLUFFING or PERFORMANCE roll by one player character and a successful SNEAKING by another. The letter is destroyed in the flames, but the only effect is that Kato does not wake up at the start of the next cycle – he is finally at peace. The player characters are still trapped in the time loop, and Ix gets so angry about losing his object of torment that he lets time progress normally again, which places the characters at great risk of death by dragon fire and may trigger combat with Ix. It is possible to negotiate with Ix even after burning the letter, but probably not until the next cycle. Now the demon demands that someone take Kato’s place – either a player character or another outsider such as Ukka or Thorendil (in addition to the favor from anyone who is allowed to leave the time sphere). Getting Ix to back down from his new demand requires a PERSUASION roll with a bane."
              - id: the-village-of-the-day-before/locations/11-the-tower-room/combat
                title: Combat
                kind: section
                page: 95
                body: If a fight breaks out with Ix, the time cycle continues, which means that the player characters must defeat the demon before the dragons attack. If they do, the time sphere spell is broken and the player characters suddenly find themselves in the burned-out ruins of Kato’s tower, seven hundred years later. The treasures from the tower room remain in the ruins, but now it takes a successful SPOT HIDDEN roll to find them. Ix is not gone for good, as this was only one aspect of it. The demon will never forget what was done to him, and eventually takes revenge if the opportunity presents itself.
                images:
                  - images/art/the-village-of-the-day-before-locations-11-the-tower-room-combat.jpg
              - id: the-village-of-the-day-before/locations/11-the-tower-room/kato-the-curious
                title: Kato the Curious
                kind: npc
                page: 94
                page_end: 95
                body: |
                  Kato is very old and in a bad way, as the demon Ix just told him that his tower is about to be attacked by dragons and explained the fine print of the contract he signed. Kato has had a stroke and spends the time cycle trying to crawl to the spot in front of the fireplace where Ix placed his contract. But he can never get there in time. At the end of the cycle, he is badly burned by dragon fire, and then the cycle begins anew. Other than imploring the player characters to burn the contract, Kato is incapable of communication.
                  ✦The Demon Ix: One aspect of Ix – it has several – is sitting cross-legged on the stone floor to watch Kato’s final moments of humiliation and torment. This is how the demon gets its nourishment. Ix reacts with curiosity when the player characters show up and defends himself if they act aggressively. See more below.
                  ✦Treasures: The room contains treasures equivalent to five treasure cards, as well as Kato’s grimoire which contains the spells TRANSFER, MAGIC SEAL, CHARGE, STONE SHIELD, FIREBIRD, GNOME, and SALAMANDER. If a piece of the dragon statuette was placed in this adventure, it is here as well, hidden in a box.
                creatures:
                  - mistyvale/monster/kato-the-curious
                keywords:
                  - Kato the Curious
                  - Kato
              - id: the-village-of-the-day-before/locations/11-the-tower-room/the-demon-ix
                title: The Demon Ix
                kind: monster
                page: 96
                creatures:
                  - core/monster/adventure-the-demon-ix
                keywords:
                  - The Demon Ix
                  - Demon Ix
                  - Ix
              - id: the-village-of-the-day-before/locations/11-the-tower-room/continued
                title: Continued
                kind: text
                page: 96
                body: "Immunity: Ix takes no damage from fire, even magical fires. Vulnerability: Ix hates the cold and wet and takes double damage from spells such as FROST and TIDAL WAVE."
          - id: the-village-of-the-day-before/locations/the-tower-room
            title: The Tower Room
            kind: map
            page: 94
            images:
              - images/maps/the-village-of-the-day-before-locations-the-tower-room.jpg
          - id: the-village-of-the-day-before/locations/aftermath
            title: Aftermath
            kind: sidebar
            page: 95
            body: "Player characters who make a deal with Ix will be in the demon’s debt – a relationship that can be exploited for various purposes. Ix senses the player characters’ potential and would not want to see his investment wasted, and may therefore come to the player characters’ aid in times of danger when you deem it appropriate. However, their pact with Ix will make cooperation with draconic powers more difficult in the future, and sooner or later the aforementioned favor will be called in. If the player characters defeat Ix in combat, an ambush has been prepared outside the tower ruins by Ukka and Thorendil, who now remember their respective missions and are determined to get their hands on the dragon statuette (or other treasures), which they believe to be in the player characters’ possession (whether that is the case or not). If they defeat the player characters, they will immediately turn on each other."
    keywords:
      - The Village of the Day Before
      - Village of the Day Before
      - Blackridge
    images:
      - images/chapters/the-village-of-the-day-before.jpg
  - id: roads-end-inn
    title: Road’s End Inn
    number: 14
    kind: chapter
    page: 97
    body: Rumors speak of the Road’s End Inn a bit east of Outskirt. Several of its guests are said to have vanished without a trace, including a small child, and most recently a shepherd named Antelia. Her family is beside themselves with worry.
    sections:
      - id: roads-end-inn/the-situation
        title: The Situation
        kind: section
        page: 97
        body: The person responsible for the disappearances is Stare, an old soothsayer from the Haunted Marshes who was falsely accused of abducting a child. Together with her three dogs, she was locked in a root cellar under an inn by the child’s parents and the innkeeper, who thought Stare would eventually confess. Instead, she died from anger and starvation. In revenge, Stare has cursed the inn from beyond the veil, trapping its guests and twisting the building into a nightmare version of itself at night. Most of the victims do not realize they are captives. The player characters could arrive at the Road’s End Inn by chance or because they are searching for the shepherd Antelia (see rumors in Outskirt, page 17). The building, located where the highway ends and the treacherous paths of the Haunted Marshes begin, is shrouded in fog. The simple lanterns by the door glow invitingly through the haze. Unlike the other adventures in this book, a piece of the dragon emperor’s statuette cannot be found here.
        sections:
          - id: roads-end-inn/the-situation/random-events
            title: Random Events
            kind: table
            page: 97
            table: "Road’s End Inn: Random Events"
          - id: roads-end-inn/the-situation/bone-shambler
            title: Bone Shambler
            kind: monster
            page: 98
            body: A damaged skeleton shambling around on broken bones. This undead monstrosity thrives in damp ruins and can silently climb up walls and hang from ceilings, where it waits to ambush its victims.
            creatures:
              - core/monster/adventure-bone-shambler
            keywords:
              - Bone Shambler
          - id: roads-end-inn/the-situation/continued
            title: Continued
            kind: text
            page: 98
            body: "Resistance: Bone shamblers only take half damage from piercing weapons."
          - id: roads-end-inn/the-situation/continued-2
            title: Continued
            kind: text
            page: 98
      - id: roads-end-inn/locations
        title: Locations
        kind: section
        page: 98
        sections:
          - id: roads-end-inn/locations/1-dining-room
            title: Dining Room
            number: "1"
            kind: location
            page: 98
            page_end: 99
            body: |
              About twenty guests are chatting, eating, and gambling. Behind the counter stands a high-spirited halfling. The atmosphere and the smell of meat roasting in the fireplace make it impossible not to feel welcome.
              ✦The Innkeeper: The halfling Helemi runs things from behind the counter with a smile on her face. She is helpful, but dodges questions about missing guests.
              ✦The food and drink are good and cheap – half the price listed in the Rulebook. Helemi is particularly proud of the house beer and the delicious pork loin. She is happy to offer the player characters a taste.
              ✦The guests include humans, halflings, and the occasional dwarf. Some halflings invite the player characters to a game of dice (page 76 in the Rulebook). Most
              You wake up in separate beds in an oblong dormitory. It is cold, as if someone opened the window and let the night air in while you slept. Only the moonlight filtering through a large western window illuminates the room. There is a large tapestry hanging on the eastern wall, and to the north is a wooden door. In a black rocking chair in one of the corners sits a person of diminutive stature.
              ✦Gear: Each player characters’ gear is found at the end of their bed.
              ✦Tapestry: On the eastern wall hangs a large tapestry of an old woman who seems to be watching the player characters wherever they are in the room. This is Stare.
              ✦Window: Crooked trees battling gale-force winds can be seen through the western window. A high mountain looms in the distance, with a fire flickering at the summit. A player character who succeeds with a MYTHS & LEGENDS roll realizes that the view is wrong – there are no mountains in that direction. The window cannot be opened or broken, not even by magical means.
              ✦Rocking Chair: The person in the rocking chair is Stig Stonehilt, fast asleep. He can be woken but is paralyzed and cannot get up. In a tired voice, Stig explains that the player characters, like himself, are trapped in an illusion created by someone he calls “Old Hag Stare.” Stig says she is hiding somewhere in the illusion, and begs the player characters to free him.
              ✦NORTH: A heavy, creaky oak door. A single torch illuminates a long stone staircase leading down to the storeroom (#3). The player characters can take the torch with them.
            sections:
              - id: roads-end-inn/locations/1-dining-room/helemi
                title: Helemi
                kind: npc
                page: 98
                creatures:
                  - mistyvale/monster/helemi
                keywords:
                  - Helemi
              - id: roads-end-inn/locations/1-dining-room/antelia
                title: Antelia
                kind: npc
                page: 98
                body: "One of the guests is Antelia, the missing shepherd. The player characters can learn this by asking Helemi or the guests. She invites the player characters to sit down and brushes aside any questions about her disappearance. “Missing? Oh no, I just walked a bit deeper into the Greatwood than usual. My family worries a lot, that’s all.”"
                creatures:
                  - mistyvale/monster/antelia
                keywords:
                  - Antelia
              - id: roads-end-inn/locations/1-dining-room/grunn-and-edda
                title: Grunn and Edda
                kind: npc
                page: 98
                body: Only two of the guests, a young couple, look unhappy. They sit at a table by themselves, drinking in silence. They can reveal their names, but other than that they have no answers to the player characters’ questions.
                creatures:
                  - mistyvale/monster/grunn-and-edda
                keywords:
                  - Grunn and Edda
                  - Grunn
                  - Edda
              - id: roads-end-inn/locations/1-dining-room/stig-stonehilt
                title: Stig Stonehilt
                kind: npc
                page: 98
                body: |
                  One of the guests, an impressive-looking dwarf, asks to sit with the player characters. He tells them stories of mining in the Kummer Mountains and of hideous monsters he defeated. Stig is partly aware of the curse, but unable to talk about it. He makes contact with the player characters now in order to talk to them later, at night (see room #2).
                  ✦The Curse: The player characters suddenly notice that something is wrong. The walls and ceiling seem to contract inward. Immediately thereafter, everything goes black. Stare’s curse is putting the player characters to sleep – they can do nothing to prevent this, and the same thing happens the moment they try to leave the inn. Then they wake up in room #2 at the twisted version of the inn.
                creatures:
                  - mistyvale/monster/stig-stonehilt
                keywords:
                  - Stig Stonehilt
                  - Stig
          - id: roads-end-inn/locations/3-storeroom
            title: Storeroom
            number: "3"
            kind: location
            page: 99
            body: |
              The air is stale in this cluttered, windowless room. On a wooden table is a toolbox and on the dusty floor are several chests, most of them forced open. The eastern wall is adorned with a burgundy curtain with shimmering gold patterns.
              ✦Chests: One of the chests contains valuables equivalent to one treasure card.
              ✦Toolbox: The box is locked, and it takes a successful SLEIGHT OF HAND roll to get it open. It is also possible to break the box (25 HP, armor rating 6), but whoever strikes it is hit by a spike that inflicts D6 piercing damage.
              ✦Dagger: In the toolbox is a strange, ornate dagger whose tip is badly worn. The dagger deals 2D8 damage against Stare but works normally against anyone else.
              ✦Random Event: Roll on the table on page 95 for each full stretch the player characters spend here.
              ✦NORTH: Door to chaotic mosaic (#5).
              ✦SOUTH: Long stone staircase to the dormitory (#2).
              ✦EAST: Behind the curtain is a dirt tunnel (#4).
            images:
              - images/art/roads-end-inn-locations-3-storeroom.jpg
              - images/art/roads-end-inn-locations-3-storeroom-2.jpg
          - id: roads-end-inn/locations/4-dirt-tunnel
            title: Dirt Tunnel
            number: "4"
            kind: location
            page: 99
            body: |
              This dirt tunnel is full of stale darkness, and passing through it feels like being trapped in a coffin. Your footsteps squelch through a rot-black sludge of wet earth. Further ahead, you hear a shuffling sound.
              ✦Cobwebs: The remains of a giant spider are lying on the ground halfway down the tunnel. Its web is still intact, spun from wall to wall. The player character who goes first must make an AWARENESS roll (with a bane unless the person is carrying a light source) to avoid getting caught in the web, which attracts as many bone shamblers as there are player characters. Anyone caught in the web is unable to move or perform actions that require body movement. Breaking free requires a successful STR roll with a bane (action). Others can help.
              ✦Random Event: Roll on the table on page 95 for each full stretch the player characters spend here.
              ✦NORTH: Locked door, which can be picked or broken down (10 HP, armor rating 5), leading to the playroom (#6).
              ✦NORTHWEST: Side door leading to the chaotic mosaic (#5).
              ✦SOUTHWEST: Behind a curtain is the storeroom (#3).
          - id: roads-end-inn/locations/5-chaotic-mosaic
            title: Chaotic Mosaic
            number: "5"
            kind: location
            page: 99
            body: |
              The mosaic on the floor of this room forms a chaotic pattern of different colors. The ceiling is several meters high with narrow windows that you cannot reach. From the ceiling hangs a large oil lamp that lights up the room.
              ✦Three Statues: Along the western wall stand three statues of mourning women. One of them is praying, one is covering her face, and the third is pointing at the floor, toward the floor trap.
              ✦Trap: In the room there is a hidden trap door with a five-meter drop. A player character actively looking for traps can notice it with a successful SPOT HIDDEN. Among the bones at the bottom of the trap is a golden ring. The ring looks elegant and emits a faint glow – its wearer will have a use for it in the ritual chamber (#9).
              ✦Random Event: Roll on the table on page 95 for each full stretch the player characters spend here.
              ✦NORTH: Open archway to the underground pond (#7).
              ✦SOUTH: Door to the storeroom (#3).
              ✦EAST: Door to the dirt tunnel (#4).
            images:
              - images/art/roads-end-inn-locations-5-chaotic-mosaic.jpg
          - id: roads-end-inn/locations/the-inn
            title: The Inn
            kind: map
            page: 100
            images:
              - images/maps/roads-end-inn-locations-the-inn.jpg
          - id: roads-end-inn/locations/the-twisted-inn
            title: The Twisted Inn
            kind: map
            page: 100
            images:
              - images/maps/roads-end-inn-locations-the-twisted-inn.jpg
          - id: roads-end-inn/locations/6-playroom
            title: Playroom
            number: "6"
            kind: location
            page: 101
            body: |
              In the middle of the room is a cradle. Some wooden toys lie scattered on the floor, as if discarded by a child who grew tired of playing with them. There is a painting on the wall. Warmth emanates from the dying embers of a fireplace.
              ✦The painting depicts a man and a woman with a toddler, a small boy, standing in front of a run-down shack with a wild forest behind them. If the players ask if they recognize anyone in the painting, they realize that the man and woman are the unhappy couple in the dining room, if they have met them (Grunn and Edda, see room #1). You can also let them make a passive AWARENESS roll to realize this.
              ✦Doll: In the cradle lies a porcelain doll that looks a lot like the child in the painting. If the player characters take the doll with them, it comes to life in the ritual chamber (#9). Underneath the doll is a bone flute (tiny item). The flute starts playing melancholic tunes whenever the bearer comes within 10 meters of an undead creature.
              ✦Random Event: Roll on the table on page 95 for each full stretch the player characters spend here.
              ✦SOUTH: Door with a key in its lock, leading to the underground tunnel (#4).
              ✦WEST: Door to the underground pond (#7).
          - id: roads-end-inn/locations/7-underground-pond
            title: Underground Pond
            number: "7"
            kind: location
            page: 101
            body: |
              Beautiful trickling sounds are heard from a pond. The drops hitting the surface of the water sound like a sad creature playing the harp. One detail disturbs the harmony – the occasional croak echoing off the walls.
              ✦Pond: Water flowing from a hole in the wall creates a small waterfall down to a pond filled with lily pads. There are several large frogs as well.
              ✦Box: Player characters examining the pond notice a sealed box about four meters beneath the surface. The box contains valuables equivalent to two treasure cards.
              ✦Frogs: The frogs are completely harmless, but stubbornly get in the way if anyone wades out into the water. It takes a successful EVADE roll not to become Angry.
              ✦Random Event: Roll on the table on page 95 for each full stretch the player characters spend here.
              ✦NORTH: Creaky door to the gallery (#8).
              ✦SOUTH: Open archway to the chaotic mosaic (#5).
              ✦EAST: Door to the playroom (#6).
          - id: roads-end-inn/locations/8-gallery
            title: Gallery
            number: "8"
            kind: location
            page: 101
            body: |
              This large hall exudes tranquility. It is empty save for the eight paintings hanging on the walls. Moonlight streams down through a dome in the ceiling.
              ✦Glass Dome: A cloudless night sky can be seen through the glass dome in the ceiling, bathing the whole gallery in moonlight and starlight.
              ✦Paintings: The paintings are sparsely painted in ocher, green, dark red, and black. They depict temples from the time of the Dragon Empire, which the player characters can realize with a MYTHS & LEGENDS roll. Each painting counts as a normal item and is worth 50 silver coins. A player character who examines the paintings and succeeds with a SPOT HIDDEN roll notices that one of the paintings in the background shows a family using a large outdoor oven to bake bread. These are the same people depicted in the painting in the playroom (#6).
              ✦Gas Trap: If four or more paintings are removed, lethal gas (Potency 9) spews out from tiny holes in the floor.
              ✦Reflection: A sense of peace washes over the player characters if they choose to simply enjoy the art. The player characters can take an extra stretch rest here, in addition to the one they normally get each shift.
              ✦NORTH: Short stone staircase leading up to a blackened portal and the ritual chamber (#9). A player character who has passed through the portal cannot return the same way.
              ✦SOUTH: Creaking door to the underground pond (#7).
            images:
              - images/art/roads-end-inn-locations-8-gallery.jpg
          - id: roads-end-inn/locations/9-ritual-chamber
            title: Ritual Chamber
            number: "9"
            kind: location
            page: 102
            page_end: 103
            body: |
              A chain rattles in the darkness. You see a pair of glowing eyes and the sickly gleam of decaying teeth. A pulsing smell of sulfur assaults your nostrils as the figure approaches and finally attacks with a chilling shriek.
              ✦Darkness: The chamber is pitch black, and no fire can live in Stare’s presence. Torches and lanterns go out. See the rules for darkness on page 52 in the Rulebook – before each attack, a player character must succeed with an AWARENESS roll (not action).
              ✦The Ring: Stare immediately attacks the player characters. However, she will not target a person wearing the ring from room #5.
              ✦The Doll: If the player characters brought the doll from the playroom (#6), it slowly begins to move. It says nothing but keeps looking at the hag. The doll does not deal any damage, but the sight of it makes Stare excited and increases her Ferocity by one. Destroying the doll counts as an action.
              ✦Stare’s Shriek: During combat, Stare lets out wild screams that can give the player characters clues about how to overcome this threat, such as “Release me!”, “My dogs, my dogs!”, “It wasn’t me who took the boy!”, and “Helemi killed me!”
              ✦The Chain: Stare is chained to the wall. The player characters can free her by breaking the chain (20 HP, armor rating 9), but Stare keeps attacking until they succeed. They can also use the chain to gain a boon on their AWARENESS rolls for finding Stare in the darkness before each attack, but they must figure this out for themselves.
              ✦If Stare is Freed: If the player characters break the chain, Stare snatches the doll, by force if necessary, and disappears through the blackened portal. The player characters cannot follow her. Light sources can then be lit in the room.
              ✦If Stare Dies: If Stare is killed, the curse is lifted, but the player characters must still find their way out of the illusion via the graveyard (#10). If the doll has come alive, it now returns to its original lifeless state.
              ✦SOUTH: The blackened portal can no longer be entered by the player characters, as it has turned to stone.
              ✦EAST: A jammed, ironclad oak door leads out to the graveyard (#10).
            sections:
              - id: roads-end-inn/locations/9-ritual-chamber/stare
                title: Stare
                kind: monster
                page: 102
                body: The player characters can only see Stare’s recessed eyes and what might generously be called teeth. She is chained to the wall but can reach any part of the chamber.
                creatures:
                  - core/monster/adventure-stare
                keywords:
                  - Stare
              - id: roads-end-inn/locations/9-ritual-chamber/continued
                title: Continued
                kind: text
                page: 102
                body: "The Doll: If the doll was brought from the playroom (#6), Stare’s Ferocity increases by one. Immunity: All fire goes out in the room where Stare is held."
            images:
              - images/art/roads-end-inn-locations-9-ritual-chamber.jpg
          - id: roads-end-inn/locations/10-graveyard
            title: Graveyard
            number: "10"
            kind: location
            page: 103
            body: |
              In the fog and the dark, you see the gravestones of people and animals laid to rest here. Three of the graves are open. The graveyard is surrounded by a low wall. Cold and silence reign, as if the place has been cleared of life and forgotten. A gust of wind suddenly rustles the old oak and pine trees.
              ✦Stone Wall: Beyond the wall is nothing but a dark, bottomless abyss. The only way out is through the gate.
              ✦Stare’s Curse: The graveyard is the final manifestation of the curse, which is lifted forever when the player characters pass through the gate.
              ✦Bone: There is a sharpened femur sticking out of the moist earth. It can be used both as a knife and as a light club.
              ✦Open Graves: Near the open graves, which are three meters deep, are a shovel and large piles of dirt – In the first grave lies a tied-up dwarf. Once freed, he immediately rushes out of the gate in a wild panic. – In the next grave lies the missing shepherd Antelia. Grateful but terrified, she accompanies the group out of the graveyard. – Witch hounds, as many as the player characters, emerge from the third grave, and they attack. One witch hound shows up each round. They can be killed or stopped by filling in the grave. This requires a total of three rolls against STR (each roll is an action). The shovel adds a boon to the roll.
              ✦Gate: Only when they have passed the three open graves do the player characters notice a gate a bit further ahead, hidden behind some bushes. Passing through the gate, they find themselves at the end of a road. Farther away they see the inn, in its normal form. Some birds are squawking. The sun is about to rise.
            sections:
              - id: roads-end-inn/locations/10-graveyard/witch-hound
                title: Witch Hound
                kind: monster
                page: 103
                body: These frothing beasts, with yellow bloodshot eyes, will not stop until their victim is torn to pieces. They are Stare’s old dogs, which she could not be without even after her death.
                creatures:
                  - core/monster/adventure-witch-hound
                images:
                  - images/people/roads-end-inn-locations-10-graveyard-witch-hound.jpg
          - id: roads-end-inn/locations/aftermath
            title: Aftermath
            kind: sidebar
            page: 103
            body: If the curse is lifted from the inn, all guests are now free to leave. Player characters who go back there will meet Stig Stonehilt along with the young dwarf from the grave, who turns out to be his son. Stig thanks the characters from the bottom of his heart and gives them a reward equivalent to two treasure cards. The player characters can also confront Helemi, Grunn, and Edda. They quickly break down and admit that they locked Stare in the cellar because they thought she had kidnapped the couple’s son, Kale. They swear that they never meant for Stare to die. The player characters are free to handle the situation as they see fit.
    keywords:
      - Road’s End Inn
    images:
      - images/chapters/roads-end-inn.jpg
  - id: the-isle-of-mist
    title: The Isle of Mist
    number: 15
    kind: chapter
    page: 104
    body: On the mist-shrouded island in the middle of Mirror Lake is the entrance to the underground labyrinth where Azrahel Koth awaits the latest news about the sword Um-Durman. The ancient demon sorcerer cannot leave his tomb without the sword in his hand. Venturing into the mist, and down into the darkness, is the only way to stop his plans and prevent Sathmog’s demonic influence from spreading across the Misty Vale.
    sections:
      - id: the-isle-of-mist/the-situation
        title: The Situation
        kind: section
        page: 104
        body: "The player characters can hear about the Isle of Mist in Outskirt (page 17 and the adventure cards) or elsewhere. Alfilia Shadowleaf, the mystic Dranath, and Maladûk’s orcs all know the place. They also learn about the deadly mist that surrounds the island – without the sword Um-Durman, the player characters will likely not survive a visit. The cave complex beneath the Isle of Mist was originally built as a treasure chamber at the time of Sathmog’s demonic empire (page 6). Catacombs were dug under the natural cave system that already existed on the island. Once Sathmog had been banished from the world, the dragon emperor Eledain used the Isle of Mist as a prison for the demon’s immortal herald Azrahel Koth. Eledain’s mages granted a band of warriors eternal undeath to guard Azrahel Koth until the end of time. The entire island was then shrouded in a corrosive, everlasting mist. For eight hundred years, not a single intruder could break through the Isle of Mist’s defenses – instead, the threat came from within. Strengthened by Sathmog’s growing anger outside the world, Azrahel Koth finally awoke from his cursed sleep. Still trapped in the crypt because of the corrosive fog, he enslaved the undead warriors who were supposed to guard him, as well as the bats that lived in the caves. And so, the Isle of Mist was transformed into Azrahel Koth’s stronghold from which his demonic influence spread across the Misty Vale. He also summoned several demons to further strengthen the island’s defenses. Once the player characters have found Um-Durman (page 27), Azrahel Koth soon learns of this from his spies. The demon sorcerer knows that the sword is the only weapon in this world that can slay him – but also the key to his freedom. It therefore fills him with both dread and elation. Azrahel Koth senses that the player characters are on their way and looks forward to the final showdown."
        sections:
          - id: the-isle-of-mist/the-situation/the-crossing
            title: The Crossing
            kind: section
            page: 104
            body: The journey across Mirror Lake is uneventful and particularly easy if the player characters have access to a boat or a float of some sort. Building a raft takes a shift and requires a CRAFTING roll. Without a boat or raft they will have to SWIM across (page 53 in the Rulebook). The island is veiled in yellowish mist, but occasionally the shape of a gloomy tower reaching for the heavens at the southern end of the island can be glimpsed through resist cold. Climbing up the slippery walls of the shaft requires two successful ACROBATICS rolls with a bane. Others can only help if the wheel has been stopped.
            sections:
              - id: the-isle-of-mist/the-situation/the-crossing/bats
                title: Bats
                kind: section
                page: 105
                body: |
                  At the northern tip of the island is a massif with
                  Azrahel Koth’s mausoleum (#20). It is through these that Azrahel Koth sends his demonic bats across the Misty Vale.
                  The player characters can find the passages with a SPOT HIDDEN roll, but only a person with the heroic ability Contortionist can pass through them.
          - id: the-isle-of-mist/the-situation/random-events
            title: Random Events
            kind: table
            page: 105
            table: "The Isle of Mist: Random Events"
          - id: the-isle-of-mist/the-situation/leaving-the-isle-of-mist
            title: "Leaving the Isle of Mist?"
            kind: sidebar
            page: 105
            body: There is no place on the Isle of Mist where the player characters can take a shift rest. If the player characters leave the island to rest up, roll D6 per shift on the table on page 107 in the Rulebook.
          - id: the-isle-of-mist/the-situation/corrosive-mist
            title: Corrosive Mist
            kind: sidebar
            page: 105
            body: "The locals avoid the Isle of Mist as the thick magical mist that covers it eats away at all living things. It is extremely painful, and anyone traversing the surface of the island suffers D6 damage per stretch – only the undead are immune. No natural healing can occur here. The mist was created to hold Azrahel Koth, who is particularly vulnerable to it – he takes D6 damage per round if he enters it without Um-Durman. Neither armor nor spells can protect against the mist. However, the sword Um-Durman or Cadal’s ring (#4) keeps the mist at a distance of 10 meters, thus creating a bubble that allows the bearer to move unharmed on the island. The mist only exists on the surface of the island, not in the cave complex below. It also does not reach the cliff with the bat tunnels."
      - id: the-isle-of-mist/locations
        title: Locations
        kind: section
        page: 106
        body: "The complex on the Isle of Mist consists of two levels. The first level is mainly made up of natural caves (#2–8). Unless the room description says otherwise, it is pitch black down here. The labyrinth on the lower level (#9–20) was created by the demon worshipers of old, and now serves as Azrahel Koth’s headquarters. Here the rooms are lit by torches on the walls, unless otherwise stated."
        sections:
          - id: the-isle-of-mist/locations/1-the-tower-of-sacrifice
            title: The Tower of Sacrifice
            number: "1"
            kind: location
            page: 106
            body: |
              On a hilltop stands a column of white marble so tall it rises above the yellowish mist. A narrow staircase winds its way up the column. Five arms support a wide stone slab at the top of the tower.
              ✦Altar: At the top of the tower is an altar with strange inscriptions. Shackles on the altar suggest that sacrifices were performed here, as does a burnt skeleton on the scorched surface.
              ✦Medallion: The dead body wears a medallion with the black mark of Sathmog on it (page 7). Whoever touches the medallion summons the ghost of a demon worshiper named Verkon, who immediately attacks. The medallion is CHARGED with 20 WP which the wearer can use.
            sections:
              - id: the-isle-of-mist/locations/1-the-tower-of-sacrifice/verkons-ghost
                title: Verkon’s Ghost
                kind: monster
                page: 107
                body: "The demon worshiper Verkon served Sathmog back when he ruled the Misty Vale (page 6), but lost his life in a ritual gone awry. His restless spirit attacks whoever takes the medallion from his earthly remains. He is a shimmering blue shadow of his living self, robed, with staring eyes and the black mark of Sathmog burned into his forehead. Verkon hisses “All power to Sathmog, our three-tongued liberator” to the player characters, but it takes a successful LANGUAGES roll to understand what he is saying. He is a ghost with stats as per page 96 in the Rulebook. Verkon will leave the player characters alone if they drop his medallion."
                creatures:
                  - core/monster/adventure-verkon-s-ghost
                keywords:
                  - Verkon’s Ghost
                images:
                  - images/people/the-isle-of-mist-locations-1-the-tower-of-sacrifice-verkons-ghost.jpg
            keywords:
              - The Tower of Sacrifice
              - Tower of Sacrifice
          - id: the-isle-of-mist/locations/2-entrance
            title: Entrance
            number: "2"
            kind: location
            page: 106
            body: |
              In a hollow surrounded by barren hills is a pond. At its edge lies the corpse of an orc, seemingly burned to death by acid. The water is clear and utterly devoid of life. A staircase can be seen at the bottom, leading upwards into the mountain.
              ✦Footprints: Anyone who examines the ground around the pond and succeeds with SPOT HIDDEN can see footprints leading both into and out of the water. These were left by Azrahel Koth’s undead guards (page 108).
              ✦Diving: To reach the caves, the player characters must dive into the pond and succeed with a SWIMMING roll. Anyone who fails starts to drown (page 53 in the Rulebook). The stairs into the mountain lead upwards, to the upper level which is above the surface of the water.
              ✦Wet Torches: It is pitch black inside the cave. Lighting a torch that has been under water requires a BUSHCRAFT roll. Only one attempt is allowed per stretch.
              ✦Random Event: Roll D8 on the table on page 103 for each full stretch the player characters spend in the cave.
              ✦EAST: Low-ceilinged passage to the three-way room (#5).
              ✦WEST: Rough-floored passage to the demon chamber (#3) and the ghost room (#4).
          - id: the-isle-of-mist/locations/the-isle-of-mist
            title: The Isle of Mist
            kind: map
            page: 106
            images:
              - images/maps/the-isle-of-mist-locations-the-isle-of-mist.jpg
              - images/art/the-isle-of-mist-locations-the-isle-of-mist-2.png
          - id: the-isle-of-mist/locations/3-the-demon-chamber
            title: The Demon Chamber
            number: "3"
            kind: location
            page: 107
            body: |
              A natural cave where heavy mist floats over blue-black water. A faint dripping sound echoes in the cave, which smells of wet rock and decay. Stones in the water form a path across.
              ✦The stones are slippery. ACROBATICS rolls are required each round (not an action) to avoid falling into the water, which would extinguish a torch. What’s more, the water in the cave is freezing – anyone who falls in must roll BUSHCRAFT to resist cold (page 54 in the Rulebook).
              ✦The Demon Akrae: On a large rock in the middle of the cave, shrouded by mist, stands the demon Akrae. He cannot be seen from a distance. Akrae attacks anyone who sets foot on the rock, which is covered by a pentagram.
              ✦NORTH: Dark passage to the entrance (#2).
              ✦EAST: Damp passage to the three-way room (#5).
              ✦SOUTH: Wide passage to the descent (#8).
              ✦WEST: Narrow passage to the ghost room (#4).
            sections:
              - id: the-isle-of-mist/locations/3-the-demon-chamber/the-mist
                title: The Mist
                kind: section
                page: 107
                body: Because of the dense mist, the player characters must roll to see whether their torches go out (page 52 of the Rulebook) at the end of each round.
              - id: the-isle-of-mist/locations/3-the-demon-chamber/the-demon-akrae
                title: The Demon Akrae
                kind: monster
                page: 107
                body: Akrae looks human, but with the head and claws of a crab. He lets out a gurgling sound and reeks of rotten seaweed. Akrae is bound to the stone with the pentagram and cannot leave.
                creatures:
                  - core/monster/adventure-the-demon-akrae
                keywords:
                  - The Demon Akrae
                  - Demon Akrae
                  - Akrae
                images:
                  - images/people/the-isle-of-mist-locations-3-the-demon-chamber-the-demon-akrae.jpg
          - id: the-isle-of-mist/locations/the-caves
            title: The Caves
            kind: map
            page: 108
            images:
              - images/maps/the-isle-of-mist-locations-the-caves.jpg
          - id: the-isle-of-mist/locations/4-ghost-room
            title: Ghost Room
            number: "4"
            kind: location
            page: 108
            body: |
              A cramped cave, dripping with water and with algae on the walls. A skeleton in rusted chainmail is lying on the floor.
              ✦Skeleton: The skeleton has an old broadsword that is still in good shape and wears a ring on one of its fingers. Removing the ring awakens Cadal’s ghost (see adjacent sidebar).
              ✦Cadal’s Ring: The ring on Cadal’s finger grants the ability to see in the dark (the wearer may ignore all effects on page 52 in the Rulebook) and protection against the island’s evil mist, provided that the wearer first receives the blessing of Eledain. Cadal can bless them, but only if the player characters accept his request.
              ✦Random Event: Roll D8 on the table on page 103 when the player characters arrive here, and again after each full stretch they spend here.
              ✦NORTH: Rough-floored passage to the demon chamber (#3) and the entrance (#2).
              ✦SOUTH: Narrow passage to the demon chamber (#3).
            sections:
              - id: the-isle-of-mist/locations/4-ghost-room/cadals-ghost
                title: Cadal’s Ghost
                kind: npc
                page: 109
                body: "The ghost of a handsome young man rises above the skeleton and speaks to the player characters: “My name was Cadal of the Keepers of the Immaculate Flame. I came to free my beloved Tuviel and defeat the wicked sorcerer Azrahel Koth. But here in these caves I met my bane, the malodorous sea demon Akrae. The demon must die for me to have peace. Give my ring to your best fighter and slay the demon. This is my final wish.” If the player characters accept his request, he blesses them in the name of Eledain, which allows them to use his magic ring. If they refuse, the ghost sinks back into the skeleton."
                creatures:
                  - mistyvale/monster/cadal-s-ghost
                keywords:
                  - Cadal’s Ghost
                  - Cadal
                images:
                  - images/people/the-isle-of-mist-locations-4-ghost-room-cadals-ghost.jpg
          - id: the-isle-of-mist/locations/5-three-way-room
            title: Three-Way Room
            number: "5"
            kind: location
            page: 108
            body: |
              Three cave passages meet in a natural cave. Faint echoes are heard, but from what or where is unclear.
              ✦Warning: With a successful SPOT HIDDEN roll, the player characters find a warning written in charcoal on the wall: “TROLL”, followed by an arrow pointing east.
              ✦Random Event: Roll D8 on the table on page 103 when the player characters arrive here, and again after each full stretch they spend here.
              ✦EAST: Fungus-covered passage leading to the rockfall (#6) and Okvid’s den (#7).
              ✦SOUTH: Misty passage to the demon chamber (#3).
              ✦WEST: Low-ceilinged passage to the entrance (#2).
            images:
              - images/art/the-isle-of-mist-locations-5-three-way-room.png
          - id: the-isle-of-mist/locations/6-rockfall
            title: Rockfall
            number: "6"
            kind: location
            page: 109
            body: |
              The passageway ends at a rockfall.
              ✦Rocks: A player character who succeeds with a CRAFTING roll realizes that the rockfall was set off deliberately. Collapsed rocks block the entrance and form a dead end. Azrahel Koth caused the rockfall so that intruders would have to get past Akrae in room #3.
              ✦Digging: Digging through the debris is possible but requires ten successful CRAFTING rolls. Each player character may roll once per shift. Their digging efforts inevitably attract the attention of the troll Okvid in room #7.
              ✦SOUTH: If the player characters dig through the rubble, the opening leads to the descent (#8).
          - id: the-isle-of-mist/locations/7-okvids-den
            title: Okvid’s Den
            number: "7"
            kind: location
            page: 109
            body: |
              The stench of decay precedes the sight of the room – a natural cave with animal skins on the walls and floor. Boxes, sacks, weapons, and all sorts of junk are neatly lined up against the wall.
              ✦Okvid the Troll: Okvid stays here when he is not out in the cave system.
              ✦Rotting Food: The boxes and sacks contain food in various stages of decay. Okvid likes it that way, as it is easier to chew. The player characters can eat the food but are then exposed to a disease with virulence 9.
              ✦Treasures: Among the items Okvid has collected are D6 torches and valuables equivalent to three treasure cards.
              ✦WEST: Fungus-covered passage to the three-way room (#5).
            sections:
              - id: the-isle-of-mist/locations/7-okvids-den/okvid-the-troll
                title: Okvid the Troll
                kind: monster
                page: 109
                body: "Okvid is a grumpy old troll who serves as caretaker of the caves under an agreement with Azrahel Koth. As payment, he is allowed to keep all the treasures he picks up from fallen adventurers. Okvid’s regenerative ability allows him to live in the corrosive mist. His voice rumbles like a rockslide, and his stench makes the eyes water. Okvid has stats as a troll on page 97 in the Rulebook, with one addition:"
                creatures:
                  - core/monster/adventure-okvid-the-troll
                sections:
                  - id: the-isle-of-mist/locations/7-okvids-den/okvid-the-troll/toothache
                    title: Toothache
                    kind: section
                    page: 109
                    body: "Anyone who succeeds with a HEALING roll realizes that the troll suffers from a terrible toothache. It takes a successful PERSUASION or BLUFFING roll to get the troll to accept an operation. Pulling the aching tooth requires another HEALING roll – on failure, the troll attacks. If the operation succeeds, Okvid allows the player character to pass. He also offers them some rotting food."
                keywords:
                  - Okvid the Troll
                  - Okvid
                images:
                  - images/people/the-isle-of-mist-locations-7-okvids-den-okvid-the-troll.jpg
            keywords:
              - Okvid’s Den
          - id: the-isle-of-mist/locations/undead-guards
            title: Undead Guards
            kind: npc
            page: 110
            body: "Eight hundred years ago, the Dragon Emperor had a band of warriors locked in Azrahel Koth’s crypt to guard the demon sorcerer until the end of time. Their lives were extended through necromantic spells, but these did not stop the warriors’ physical and mental decay. Now the once-great warriors have been reduced to walking skeletons with grinning skulls. Azrahel Koth has taken control of their weakened minds and turned them into obedient puppets. The player characters can run into these undead warriors as a random event (page 103) and in Azrahel Koth’s mausoleum (#20). You can also have a patrol show up if the player characters make a lot of noise or whenever you need to give them an additional challenge. The guards are moving all around the cave complex. Clever player characters can SNEAK after a patrol to figure out how to get past the labyrinth’s many traps. This requires a successful roll per room."
            creatures:
              - core/monster/adventure-undead-guards
          - id: the-isle-of-mist/locations/continued
            title: Continued
            kind: text
            page: 110
            body: "Resistance: Takes half damage from piercing attacks (rounded up). Immunity: The guards are immune to fear and PERSUASION."
          - id: the-isle-of-mist/locations/8-the-descent
            title: The Descent
            number: "8"
            kind: location
            page: 110
            body: |
              A stone staircase carved out of the rock leads down to a heavily scarred copper gate. A demonic symbol is embedded in the door, with a short line of text underneath. The symbol shines brightly in the torchlight, as if it had just been carved.
              ✦Symbol: The symbol on the door is the black mark of Sathmog (see picture on page 7). The text below is ancient and can only be understood with a successful LANGUAGES roll: “All power to Sathmog, our three-tongued liberator.”
              ✦Door Trap: The door is unlocked, but anyone who tries to push it open is hit by a LIGHTNING BOLT (Power
              Level 1). Each attempt to open the door triggers an additional LIGHTNING BOLT until the trap’s CHARGE of 20 WP is depleted (each LIGHTNING BOLT consumes 4 WP since it takes place indoors). To open the door safely, a player character must first run their finger along the symbol on the door and speak the words written below. A person who examines the door and succeeds with SPOT HIDDEN realizes that the symbol has been polished by many fingers run along its grooves.
              ✦Random Event: Roll D8 on the table on page 103 for each full stretch the player characters spend here.
              ✦NORTH: Wide passage to the demon chamber (#3) with a branching tunnel leading to the rockfall (#6).
              ✦SOUTH: Copper door to the four-way room (#9) on the lower level.
          - id: the-isle-of-mist/locations/9-four-way-room
            title: Four-Way Room
            number: "9"
            kind: location
            page: 110
            body: |
              The square room is clad in white marble. On each wall is a polished copper door with a demonic symbol engraved on it. In the middle of the room is a human-sized statue of a horned demon. It points at you with its clawed hand.
              ✦The Symbol: The symbol on the doors is the black mark of Sathmog. But on the east door the symbol is upside down, which the player characters notice automatically if they take a closer look at the door.
            images:
              - images/art/the-isle-of-mist-locations-9-four-way-room.jpg
          - id: the-isle-of-mist/locations/the-labyrinth
            title: The Labyrinth
            kind: map
            page: 111
            images:
              - images/maps/the-isle-of-mist-locations-the-labyrinth.jpg
          - id: the-isle-of-mist/locations/10-cells
            title: Cells
            number: "10"
            kind: location
            page: 111
            body: |
              A row of cramped cells behind rusty barred doors. There is a strong stench of decay. Faint groans and mumbled prayers can be heard from a couple of the cells.
              ✦Barred Doors: The barred doors are locked, and the keys are carried by the undead guards (page 108). Alternatively, the doors can be picked or smashed open (20 HP, armor rating 12). The prisoners here are awaiting interrogation before being recruited into Azrahel Koth’s army.
              ✦Orc Scout: In one cell lies the orc scout Kretscha (see page 110). She is emaciated and beaten, but not seriously injured.
              ✦Knight: In another cell sits a dragon knight named Emrys, badly injured (see page 110).
              ✦Random Event: Roll D8+2 on the table on page 103 for each full stretch the player characters spend here.
              ✦SOUTH: Copper door to the four-way room (#9).
            sections:
              - id: the-isle-of-mist/locations/10-cells/kretscha
                title: Kretscha
                kind: npc
                page: 112
                body: "Kretscha was captured by Azrahel Koth’s guards near Mirror Lake. He is keeping the orc alive to obtain information about Um-Durman. If the player characters have met Maladûk and forged an alliance with her (page 46), Kretscha is aware of this. If they free her, she tells them that Azrahel Koth cannot leave the labyrinth without Um-Durman – nor can he be killed by anything other than this mighty weapon. He bragged about this during the long interrogations. If the player characters ask for the password to the east door of room #9, Kretscha says she heard the undead guards hiss it, and she can repeat it word for word. If the player characters do not have an alliance with Maladûk, it takes a PERSUASION roll to obtain the information above. Kretscha is not willing to stay and fight alongside the player characters and would rather go back and report to Maladûk, but she can be PERSUADED to stay. You can also have Kretscha show up and save the day if the player characters find themselves in a tight spot."
                creatures:
                  - mistyvale/monster/kretscha
                keywords:
                  - Kretscha
                images:
                  - images/people/the-isle-of-mist-locations-10-cells-kretscha.jpg
              - id: the-isle-of-mist/locations/10-cells/emrys
                title: Emrys
                kind: npc
                page: 112
                body: "Emrys is a knight who serves the Keepers of the Immaculate Flame (page 8). Repeated interrogations have left him on the verge of death. Someone must succeed with a HEALING roll within a stretch, or Emrys will draw his last breath. Only one attempt is allowed. The emaciated Emrys alternates between mumbling prayers to Eledain and cursing Azrahel Koth. If the player characters make themselves known, he explains that he came here to rescue his sister Tuviel, also a dragon knight, who was kidnapped by servants of Sathmog. Before he left, Emrys sent word to Cadal, his sister’s betrothed, hoping that he would join him. Emrys demands that the player characters rescue Tuviel. If he learns of her fate (room #11), he flares into a rage and demands that Azrahel Koth be killed at all costs. Emrys has heard the undead guards hiss the password to the east door of room #9, but only remembers the beginning: “Rotar Ebil Dough-Not Ert Ruo, Gomtas…” Clever players can use this to figure out the full password, if they do not get it from Kretscha. If the player characters save Emrys’ life, he can join them on their quest but is of limited use due to his severe injuries. He may sacrifice himself at some crucial stage if the player characters find themselves in dire straits."
                creatures:
                  - mistyvale/monster/emrys
                keywords:
                  - Emrys
                images:
                  - images/people/the-isle-of-mist-locations-10-cells-emrys.jpg
          - id: the-isle-of-mist/locations/11-the-skeletal-guard
            title: The Skeletal Guard
            number: "11"
            kind: location
            page: 113
            body: |
              The room consists of a deep pit filled with armored skeletons and armed cadavers in varying degrees of decay. An ominous rattling sound is heard from the deep mass grave, as if something is moving down there among the dead – or is it the pile of corpses itself that is moving?
              ✦Fear: The sight of the living dead is so horrific that the player characters must make a roll against WIL to resist fear. This hall is where creatures killed in the cave system are dumped, and where Azrahel Koth finds recruits for his skeleton army.
              ✦The Undead Awake: If the player characters enter the room without succeeding with a SNEAKING roll, a bunch of skeletons (as many as the player characters) come to life and attack. All undead in the room have stats as Skeleton Warriors on page 95 in the Rulebook.
            sections:
              - id: the-isle-of-mist/locations/11-the-skeletal-guard/undead
                title: Undead
                kind: npc
                page: 113
                creatures:
                  - core/monster/adventure-undead
              - id: the-isle-of-mist/locations/11-the-skeletal-guard/tuviel
                title: Tuviel
                kind: npc
                page: 113
                body: |
                  One of the bodies in the pit wears beautiful clothes, elegant chainmail, and a mastercrafted broadsword. The corpse also wears a gold ring with the inscription “Tuviel & Cadal, forever.” It stands up and swings its sword at the player characters if they touch any of the items. However, the skeleton will not attack a player character wearing Cadal’s ring, if that person received his blessing (room #4). If the player characters have defeated Akrae and show Cadal’s ring, the skeleton stops and expresses its gratitude with a deep bow before collapsing into a lifeless heap.
                  ✦Random Event: Roll D8+2 on the table on page 103 for each full stretch the player characters spend here.
                  ✦NORTH: Copper door to the four-way room (#9).
                creatures:
                  - mistyvale/monster/tuviel
                keywords:
                  - Tuviel
            keywords:
              - The Skeletal Guard
              - Skeletal Guard
          - id: the-isle-of-mist/locations/12-bolt-trap
            title: Bolt Trap
            number: "12"
            kind: location
            page: 113
            body: |
              A long corridor of white stone whose floor is made up of large marble tiles, each with a letter carved into it. On the far side is a polished copper door marked with the demonic symbol.
              ✦Crossbow Trap: The floor is a trap. It can be avoided by stepping on the letters that form the name SATHMOG as shown on the map on page 109. As soon as someone steps on the wrong tile, a crossbow bolt is fired from the wall. The bolt hits automatically and inflicts 2D8 damage. It can only be dodged (or parried with a shield) if the player characters noticed the small holes in the wall, which they do automatically upon examining the wall. There are a total of six crossbows in the walls. They are reloaded via water pressure inside the mountain, which takes a shift.
              ✦Pattern on the Floor: Player characters who examine the floor and succeed with SPOT HIDDEN can see that the stone tiles are worn in the pattern that must be followed to avoid triggering the trap.
              ✦EAST: Copper door to the circular hall (#13).
              ✦WEST: Copper door to the four-way room (#9).
          - id: the-isle-of-mist/locations/13-circular-hall
            title: Circular Hall
            number: "13"
            kind: location
            page: 113
            body: |
              A circular room of black marble. Doors bearing the demonic mark are found to the north and south. A red pentagram has been carved into the floor, and a burning, smoldering demon is waiting in its center.
              ✦Riddling Demon: This room is guarded by the fire demon Khaa (page 112), who will not let any strangers pass unless they answer its three demonic riddles (see sidebar). If the player characters figure them out and answer “the night”, “tears”, and “gold”, in that order, they are allowed to pass – otherwise Khaa attacks. It does not leave this room. The demon is impatient and does not give its visitors much time to think. If you want, you can give players a time limit of three minutes. Once the player characters have solved the riddles, they do not have to answer them again.
              ✦Door Traps: The doors are unlocked, but anyone trying to push them open is hit by a LIGHTNING BOLT (Power Level 1) just like in room #8. Each door has a CHARGE of 20 WP. To safely open the doors, a player character must first run their finger along the symbols engraved on them while speaking the phrase: “All power to Sathmog, our three-tongued liberator.”
              ✦NORTH: Copper door to the skeleton trap (#16).
              ✦SOUTH: Copper door to the water trap (#14).
              ✦WEST: Copper door to the bolt trap (#12).
            sections:
              - id: the-isle-of-mist/locations/13-circular-hall/khaas-riddles
                title: Khaa’s Riddles
                kind: sidebar
                page: 113
                body: |
                  “Two siblings are we One dark and one bright Impossible to see Yet I shade all in sight.”
                  “Fathered by sorrow and dread Mothered by sheer happiness Easily gained, yet hard to shed Burning but wet nonetheless.”
                  “Found everywhere from east to west Sought by those who rule Unfit to eat, yet feeds the blessed Always beware of the Fool!”
              - id: the-isle-of-mist/locations/13-circular-hall/khaa-the-fire-demon
                title: Khaa the Fire Demon
                kind: monster
                page: 114
                body: Khaa was summoned by Azrahel Koth to guard his crypt, but proved to be something of a disappointment as the demon was more interested in discussing the mysteries of existence than fighting. Khaa appears as a humanoid seemingly made of fire, always sizzling, crackling, and smoldering, even while standing still. Its voice hisses like steam escaping wet wood on a large fire.
                creatures:
                  - core/monster/adventure-khaa-the-fire-demon
                keywords:
                  - Khaa the Fire Demon
                  - Khaa
                images:
                  - images/people/the-isle-of-mist-locations-13-circular-hall-khaa-the-fire-demon.jpg
              - id: the-isle-of-mist/locations/13-circular-hall/continued
                title: Continued
                kind: text
                page: 114
                body: "Resistance: Takes half damage from piercing and bludgeoning attacks. Immunity: Khaa is completely immune to all kinds of fire, including magical ones. Instead, Khaa heals as many HP as the damage from a fire attack."
              - id: the-isle-of-mist/locations/13-circular-hall/continued-2
                title: Continued
                kind: text
                page: 114
                page_end: 115
                body: |
                  ✦Passage to the Treasure Chamber: There is an underwater passage leading to the treasure chamber (#18). The player characters find it if they look, but passing through it requires a SWIMMING roll.
                  ✦Other Solutions: Climbing over the walls of the wheel is impossible. Stopping the wheel requires some sort of weapon or tool and a successful CRAFTING roll, but then it becomes impossible to get past the walls. Destroying the stone cross is very difficult (30 HP, armor rating 20) but can be done with the Mastercrafter heroic ability or the SHATTER spell. Spells such as PILLAR and LEVITATE can also be used to get through the trap.
                  ✦NORTH: Corridor to the circular hall (#13).
                  ✦SOUTH: Corridor to the library (#15).
          - id: the-isle-of-mist/locations/14-water-trap
            title: Water Trap
            number: "14"
            kind: location
            page: 114
            body: |
              In the middle of this round chamber is a large, rotating, cross-shaped wheel with walls of stone that reach almost all the way to the ceiling. It seems that the only way forward is through the wheel. The sound of rushing water echoes between the stone walls. The air is cold and damp.
              ✦Trap: Whoever steps into the cross is pushed forward by the wheel until the floor suddenly disappears at the far end of the room (see map). Jumping across the gap requires an ACROBATICS roll with a bane. Anyone who fails plummets down a deep shaft. It takes two rounds for the wheel to make a full rotation.
              ✦Ledge: The correct way to bypass the trap is to stand in the center of the wheel. There is a small ledge from which a person can quickly walk along the edge to the left (east) of the shaft before the wall of the cross-shaped wheel blocks the exit. No roll is required. The ledge only has enough room for one person, which means that only one person at a time can bypass the trap. To reach the ledge in time, the player characters must be standing in the center of the wheel before the shaft opens – ask players whose characters enter the wheel exactly where they position themselves. Those who have made it past the trap can shout instructions to the other side.
              ✦Shaft: Anyone who falls into the hole lands in freezing water ten meters below, taking D6 bludgeoning damage. Once in the rushing water, a player character must make a SWIMMING roll per round (not action) to avoid drowning and a BUSHCRAFT roll each stretch to
          - id: the-isle-of-mist/locations/15-library
            title: Library
            number: "15"
            kind: location
            page: 115
            body: |
              A large room with rounded ends. The walls are covered with large bookshelves that smell heavily of cotton paper, parchment, and moth repellents.
              ✦Scholarly Tomes: There are numerous books on various topics, but they are completely disorganized. Player characters who search the library can roll SPOT HIDDEN to find a book that grants a boon for a skill. Roll D4 to determine which one. 1:BEAST LORE, 2: LANGUAGES, 3:HEALING, 4:MYTHS & LEGENDS. Multiple attempts may be made, until the character has found a book on each topic. Each of these books is worth 25 gold coins.
              ✦Studying: Player characters who spend an entire shift studying in this library gain an extra Advancement Mark in one of the skills above, as if tutored by a teacher (page 29 in the Rulebook). Note that, given the random events, the player characters will probably not have time for this until Azrahel Koth is defeated.
              ✦Secret Bookshelf: Player characters looking for hidden compartments or the like can roll SPOT HIDDEN to find a secret bookshelf hidden behind other shelves. There are four grimoires – one for each school of magic in the Rulebook and one for general magic. Each grimoire contains D6 spells. Roll D4–1 to determine the rank of each spell (zero means magic trick).
              ✦Resting: The library is a quiet and restful place. The player characters can take an extra short rest here, even if they already had one this shift.
              ✦Random Event: Roll D8+2 on the table on page 103 for each full stretch the player characters spend here.
              ✦EAST: Corridor to the statue room (#19).
              ✦WEST: Corridor to the water trap (#14).
          - id: the-isle-of-mist/locations/16-skeleton-trap
            title: Skeleton Trap
            number: "16"
            kind: location
            page: 115
            body: |
              A corridor with polished white marble walls. At the far end you see a copper door.
              ✦Tripwire: A player character who actively examines the floor and succeeds with a SPOT HIDDEN roll notices a very thin metal wire strung across the floor two meters into the corridor. If they fail to notice it, the player characters will touch the wire and cause heavy portcullises to come rattling down at both ends of the corridor.
            sections:
              - id: the-isle-of-mist/locations/16-skeleton-trap/skeletons
                title: Skeletons
                kind: npc
                page: 115
                body: |
                  If the trap is triggered, secret doors open in the walls and twice as many skeletons as there are player characters step out into the corridor. They attack immediately and have stats as Skeleton Warriors on page 95 in the Rulebook. The corridor is only wide enough for two skeletons (and player characters) to fight shoulder to shoulder; the others end up behind them.
                  ✦The Portcullis can be smashed (25 HP, armor rating 12) or pushed open by making a STR roll with bane or casting the PILLAR spell. Otherwise, it is raised automatically after a shift, when a patrol of undead guards (page 108), as many as the player characters, comes to check the trap.
                  ✦NORTH: Copper door to the mirror chamber (#17).
                  ✦SOUTH: Copper door to the circular hall (#13).
                creatures:
                  - core/monster/adventure-skeletons-2
          - id: the-isle-of-mist/locations/17-mirror-chamber
            title: Mirror Chamber
            number: "17"
            kind: location
            page: 115
            body: |
              One wall of this chamber is one big mirror from floor to ceiling.
              ✦Life Drain: Anyone who looks into the mirror must make a WIL roll each round not to lose 4 WP. The mirror immediately uses these WP to cast a LIGHTNING BOLT (Power Level 1) at the victim. No LIGHTNING BOLT is triggered if the victim has fewer than 4 WP left. You should let the first player character who sees the mirror roll for this and give the others a chance to close their eyes or look away.
              ✦Hidden Door: In the middle of the mirror there is a hidden door, which can be opened by pressing it inwards. Finding the door requires the player characters to actively examine the mirror and succeed with SPOT HIDDEN. Searching by touch alone, without looking, applies a bane to the roll, but anyone who does look must make a WIL roll as described above.
              ✦Random Event: Roll D8+2 on the table on page 103 for each full stretch the player characters spend here.
              ✦EAST: The secret passage behind the mirror opens into the treasure chamber (#18).
              ✦SOUTH: Copper door to the skeleton trap (#16).
          - id: the-isle-of-mist/locations/18-treasure-chamber
            title: Treasure Chamber
            number: "18"
            kind: location
            page: 116
            body: |
              A square chamber with a high ceiling. A narrow footbridge leads from the door to a circular platform in the center of the room, and an identical bridge and door can be seen on the other side. Outside the platform there is nothing but a dark abyss, with black water barely visible in the depths below. On the platform are stuffed bags and small chests. One of the bags has burst at the seams, and shiny coins have poured out.
              ✦Footbridge: If the player characters take a good look at the western bridge before stepping onto it and succeed with SPOT HIDDEN, they realize it is rigged with some kind of trap that is triggered by pressure. Small creatures such as halflings and mallards can cross the bridge without setting off the trap, but other player characters cannot. The southern bridge has no trap.
              ✦Swinging Stones: When the trap on the western bridge is triggered, three massive boulders are swung across the footbridge on heavy iron chains. Anyone standing on the bridge must make an EVADE roll. On failure, the victim suffers 2D8 damage and is thrown into the freezing water below. The solution to the trap is to crawl across the bridge – that way the characters do not risk being hit by the boulders.
              ✦Freezing Water: Anyone who falls into the abyss lands in freezing water ten meters below, taking D6 bludgeoning damage. Once in the rushing water, a player character must make a SWIMMING roll per round (not action) to avoid drowning and a BUSHCRAFT roll each stretch to resist cold. Climbing up the slippery walls requires two successful ACROBATICS rolls with a bane. Others can help.
              ✦Passage to the Water Trap: There is an underwater passage leading to the water trap (#18). The player characters find it if they look, but passing through it requires a SWIMMING roll.
              ✦Treasure: On the platform are treasures from both Sathmog’s realm and Eledain’s empire, equivalent to seven treasure cards. At least one card must be gold coins, so keep drawing until you get such a card. Any weapons found here are mastercrafted. Remove the “rusty nail” and “rat” cards before drawing – there is none of that here.
              ✦Potions: In addition to the treasures, there is a small podium on the platform with glass vials containing red and blue liquids (three of each). The red potion is a healing elixir that instantly restores 2D6 HP, while the blue potion invigorates the user and restores 2D6 WP. The player characters can figure out the effects with a successful HEALING roll – otherwise they will have to take their chances.
              ✦Random Event: Roll D8+2 on the table on page 103 for each full stretch the player characters spend here.
              ✦WEST: Door to the mirror chamber (#17).
              ✦SOUTH: Door to the statue room (#19).
          - id: the-isle-of-mist/locations/19-statue-room
            title: Statue Room
            number: "19"
            kind: location
            page: 116
            body: |
              The most striking feature of this square white room is the meter-high demon statue in the middle of it. It has precious stones for eyes, one red and one green. To the east is a great door of patinated copper with a large demonic symbol in its center. Across the room is a smaller door.
              ✦Mark on the Floor: On the floor in front of the statue, which faces east, there are marks which the player characters will notice if they look in that exact spot or examine the room in general and succeed with SPOT HIDDEN. They look like acid burns and soot.
              ✦Jeweled Eyes: The statue’s eyes are a ruby and an emerald. If someone presses both gems simultaneously, the door to the mausoleum (#20) opens and the player characters are faced with their archenemy, Azrahel Koth. If only the ruby is pressed, or removed, a powerful flame shoots out from the statue’s eyes and deals 3D8 damage. If only the emerald is pressed or removed, a stream of acid sprays from the statue’s mouth. It inflicts 2D8 damage and corrodes the victim’s armor if the damage penetrates it. The attacks cannot be dodged or parried, but only people standing directly in front of the statue are affected. The statue’s eyes are worth 20 gold coins each, but if they are removed, the door to the mausoleum cannot be opened from the outside.
              ✦Random Event: Roll D8+2 on the table on page 103 for each full stretch the player characters spend here.
              ✦NORTH: Copper door to a corridor that ends in the treasure chamber (#18).
              ✦EAST: Large copper door to the mausoleum (#20).
              ✦SOUTH: Copper door to a corridor that ends in the library (#15).
          - id: the-isle-of-mist/locations/20-mausoleum
            title: Mausoleum
            number: "20"
            kind: location
            page: 116
            body: |
              The air is heavy in this ancient crypt. Dense blankets of mist float over the floor and around a massive stone bed in the center of the room, fitted with thick shackles for arms and legs. In front of it stands a terrible horned figure, surrounded by green demonic energies and a swarm of demonic bats. His face is contorted into a grinning skull, but he is very much alive, even after centuries of imprisonment down here. You stand before Azrahel Koth, herald and champion of the demon lord Sathmog. “So, you come at last,” echoes his hissing, grating voice. “Let me take that toothpick from you,” he continues, pointing at the sword Um-Durman.
              ✦Azrahel Koth: The demon sorcerer attacks immediately. This is the final battle of The Secret of the Dragon Emperor, so be sure to make it exciting and memorable!
            sections:
              - id: the-isle-of-mist/locations/20-mausoleum/azrahel-koth
                title: Azrahel Koth
                kind: monster
                page: 117
                body: The demon sorcerer Azrahel Koth is Sathmog’s greatest servant in the Misty Vale, resurrected by his master to spread the demon cult throughout the world.
                creatures:
                  - core/monster/adventure-azrahel-koth
                keywords:
                  - Azrahel Koth
              - id: the-isle-of-mist/locations/20-mausoleum/continued
                title: Continued
                kind: text
                page: 117
                body: |
                  Bound to the Labyrinth: Azrahel Koth is bound to the labyrinth as long as he does not carry Um-Durman. Resistance: Azrahel Koth takes half damage from all non-magical weapons. Only magic and magical weapons deal full damage against him. Teleportation: When fighting anywhere outside the Mausoleum (#20), Azrahel Koth can use an action to
                  teleport there. If he takes damage, he will do so at the earliest opportunity (instead of a monster attack). Regeneration: Inside his mausoleum, Azrahel Koth heals all damage in one stretch. Um-Durman: Azrahel Koth dies if an attack with the sword Um-Durman reduces him to zero HP. His body collapses inwards like an empty bellows until only a shriveled husk remains. If reduced to zero HP by any other weapon, he wakes up with full HP after one stretch. A killing blow can be delivered with Um-Durman even if he is brought down by other damage. Note that Azrahel Koth is not a demon himself, so he is not affected by Um-Durman’s special effect against dragons and demons (page 27). However, the sword does count as a magical weapon.
              - id: the-isle-of-mist/locations/20-mausoleum/continued-2
                title: Continued
                kind: text
                page: 117
                body: |
                  Koth for his first two turns in the round. First roll a monster attack for the bats, and then for Azrahel Koth.
                  ✦Skeletons in the Mist: If the fight seems too easy for the player characters – for example, if Azrahel Koth loses half his HP with all the player characters still standing – a patrol of undead guards (page 108) emerges from the shadows to protect him. They are as many as the player characters and act on a common turn in the round (only draw one initiative card).
                  ✦Saviors: If the fight goes badly for the player characters,
                  a chance to succeed – Kretscha or Emrys are obvious choices, but you could also have Alfilia Shadowleaf or Maladûk show up.
                  ✦WEST: Copper door to the statue room (#19).
