  - id: journeys
    title: Journeys
    number: 4
    kind: chapter
    page: 30
    body: Between their adventures, the player characters will travel all over the Misty Vale. They might return to Outskirt to lick their wounds, or maybe head straight to the next adventure. To play out these journeys, you use the travel rules in chapter 8 of the Rulebook. The map of the Misty Vale is not exact, so you may have to estimate the distances and how long the journey will take.
    sections:
      - id: journeys/preamble
        title: Preamble
        kind: section
        page: 30
        sections:
          - id: journeys/preamble/the-adventure-sites
            title: The Adventure Sites
            kind: section
            page: 31
            body: The adventure sites in this book are marked on the GM map on page 4. With the help of rumors (see page 17 and the adventure cards), the players should be able to locate the sites on the large map of the valley. Do not make them difficult to find.
          - id: journeys/preamble/random-encounters
            title: Random Encounters
            kind: section
            page: 31
            body: Once per shift, or whenever it seems appropriate, you can roll on a Random Encounters table. In this chapter you will find five different tables, one for each part of the Misty Vale. You can also select a suitable encounter instead of rolling randomly.
            images:
              - images/art/journeys-preamble-random-encounters.jpg
