  - id: kretscha
    name: Kretscha
    source: adventure
    kind: npc
    category: The Isle of Mist
    image: images/people/the-isle-of-mist-locations-10-cells-kretscha.jpg
    description: "Kretscha was captured by Azrahel Koth’s guards near Mirror Lake. He is keeping the orc alive to obtain information about Um-Durman. If the player characters have met Maladûk and forged an alliance with her, Kretscha is aware of this. If they free her, she tells them that Azrahel Koth cannot leave the labyrinth without Um-Durman – nor can he be killed by anything other than this mighty weapon. He bragged about this during the long interrogations. If the player characters ask for the password to the east door of room #9, Kretscha says she heard the undead guards hiss it, and she can repeat it word for word. If the player characters do not have an alliance with Maladûk, it takes a PERSUASION roll to obtain the information above. Kretscha is not willing to stay and fight alongside the player characters and would rather go back and report to Maladûk, but she can be PERSUADED to stay. You can also have Kretscha show up and save the day if the player characters find themselves in a tight spot."
