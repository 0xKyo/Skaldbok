  - id: emrys
    name: Emrys
    source: adventure
    kind: npc
    category: The Isle of Mist
    image: images/people/the-isle-of-mist-locations-10-cells-emrys.jpg
    description: "Emrys is a knight who serves the Keepers of the Immaculate Flame. Repeated interrogations have left him on the verge of death. Someone must succeed with a HEALING roll within a stretch, or Emrys will draw his last breath. Only one attempt is allowed. The emaciated Emrys alternates between mumbling prayers to Eledain and cursing Azrahel Koth. If the player characters make themselves known, he explains that he came here to rescue his sister Tuviel, also a dragon knight, who was kidnapped by servants of Sathmog. Before he left, Emrys sent word to Cadal, his sister’s betrothed, hoping that he would join him. Emrys demands that the player characters rescue Tuviel. If he learns of her fate (room #11), he flares into a rage and demands that Azrahel Koth be killed at all costs. Emrys has heard the undead guards hiss the password to the east door of room #9, but only remembers the beginning: “Rotar Ebil Dough-Not Ert Ruo, Gomtas…” Clever players can use this to figure out the full password, if they do not get it from Kretscha. If the player characters save Emrys’ life, he can join them on their quest but is of limited use due to his severe injuries. He may sacrifice himself at some crucial stage if the player characters find themselves in dire straits."
