    description: Hardy is a battle-hardened war veteran in his 40s, with shoulder-length hair and a broken nose. He is the strong, silent type, but does have a sentimental side that tends to come out after a few mugs of mead at the inn. Sometimes Hardy heads out in the wilds to drive off goblins, bandits, and other potential troublemakers. During these expeditions he is often accompanied by Jory – son of Master Ulvar who runs the village shop (#5) – whom Hardy regards as his future successor.
