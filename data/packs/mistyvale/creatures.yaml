    kind: npc
    category: The Isle of Mist
    description: "The ghost of a handsome young man rises above the skeleton and speaks to the player characters: “My name was Cadal of the Keepers of the Immaculate Flame. I came to free my beloved Tuviel and defeat the wicked sorcerer Azrahel Koth. But here in these caves I met my bane, the malodorous sea demon Akrae. The demon must die for me to have peace. Give my ring to your best fighter and slay the demon. This is my final wish.” If the player characters accept his request, he blesses them in the name of Eledain, which allows them to use his magic ring. If they refuse, the ghost sinks back into the skeleton."
