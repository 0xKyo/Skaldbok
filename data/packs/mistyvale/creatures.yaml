    description: One of the guests is Antelia, the missing shepherd. The player characters can learn this by asking Helemi or the guests. She invites the player characters to sit down and brushes aside any questions about her disappearance. “Missing? Oh no, I just walked a bit deeper into the Greatwood than usual. My family worries a lot, that’s all.”
