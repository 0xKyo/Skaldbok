    description: |
      Kato is very old and in a bad way, as the demon Ix just told him that his tower is about to be attacked by dragons and explained the fine print of the contract he signed. Kato has had a stroke and spends the time cycle trying to crawl to the spot in front of the fireplace where Ix placed his contract. But he can never get there in time. At the end of the cycle, he is badly burned by dragon fire, and then the cycle begins anew. Other than imploring the player characters to burn the contract, Kato is incapable of communication.
      sitting cross-legged on the stone floor to watch Kato’s final moments of humiliation and torment. This is how the demon gets its nourishment. Ix reacts with curiosity when the player characters show up and defends himself if they act aggressively. See more below.
