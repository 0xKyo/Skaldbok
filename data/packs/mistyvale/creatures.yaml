    description: |
      One of the guests, an impressive-looking dwarf, asks to sit with the player characters. He tells them stories of mining in the Kummer Mountains and of hideous monsters he defeated. Stig is partly aware of the curse, but unable to talk about it. He makes contact with the player characters now in order to talk to them later, at night (see room #2).
      that something is wrong. The walls and ceiling seem to contract inward. Immediately thereafter, everything goes black. Stare’s curse is putting the player characters to sleep – they can do nothing to prevent this, and the same thing happens the moment they try to leave the inn. Then they wake up in room #2 at the twisted version of the inn.
