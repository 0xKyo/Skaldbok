  - name: "Road’s End Inn: Random Events"
    dice: D6
    columns:
      - EVENT
    page: 97
    rows:
      - roll: "1–3"
        cells:
          - Nothing happens.
      - roll: "4"
        cells:
          - Bone Shambler. A bone shambler (page 96) drops from the ceiling and moves quickly towards the player characters.
      - roll: "5"
        cells:
          - Shaking Floor. The floor suddenly begins to shake and crack open. A foul stench rises from the cracks, and all player characters must make a roll against CON not to become Sickly.
      - roll: "6"
        cells:
          - Dense Silence. A thick silence settles over the room. The room drains the player characters’ energy and leaves them famished (page 54 in the Rulebook).
  - name: "The Isle of Mist: Random Events"
    dice: D10
    columns:
      - EVENT
    page: 105
    rows:
      - roll: "1"
        cells:
          - "Vampire Bats: The player characters are attacked by a swarm of demonic bats (stats as per page 99 in the Rulebook)."
      - roll: "2"
        cells:
          - "Okvid the Troll: The player characters encounter the troll Okvid (see location #7). Re-roll if they have already met Okvid."
      - roll: "3"
        cells:
          - "The Voice of Azrahel Koth: A hoarse and urgent voice echoes through the labyrinth. The player characters must roll against WIL to resist fear, but only the first time this event occurs. It takes a successful LANGUAGES roll to understand the words: “All power to Sathmog, our three-tongued liberator.”"
      - roll: "4–7"
        cells:
          - Nothing happens.
      - roll: "8–9"
        cells:
          - "Undead Guards. The player characters encounter a patrol of undead guards (page 108), as many as themselves. Have the player characters make an AWARENESS roll – if they succeed, they can try to hide (SNEAKING roll) or even follow the guards."
      - roll: "10"
        cells:
          - "Azrahel Koth Attacks: The demon sorcerer himself shows up and attacks the player characters to test their strength. Upon taking damage he instantly teleports back to his mausoleum (location #20). The locals avoid the Isle of Mist as the thick magical mist that covers it eats away at all living things. It is extremely painful, and anyone traversing the surface of the island suffers D6 damage per stretch – only the undead are immune. No natural healing can occur here. The mist was created to hold Azrahel Koth, who is particularly vulnerable to it – he takes D6 damage per round if he enters it without Um-Durman. Neither armor nor spells can protect against the mist. However, the sword Um-Durman or Cadal’s ring (#4) keeps the mist at a distance of 10 meters, thus creating a bubble that allows the bearer to move unharmed on the island. The mist only exists on the surface of the island, not in the cave complex below. It also does not reach the cliff with the bat tunnels."
