format: 1
rollable:
  - Fear Table
entities:
  - name: Enfeebled
    kind: effect
    category: Fear Table
    legacy_key: "#41"
    description: The fear drains your energy and determination. You lose 2D6 WP (to a minimum of zero) and become Disheartened.
  - name: Shaken
    kind: effect
    category: Fear Table
    description: You suffer the Scared condition.
  - name: Panting
    kind: effect
    category: Fear Table
    description: The intense fear leaves you out of breath and makes you Exhausted.
  - name: Pale
    kind: effect
    category: Fear Table
    description: Your face turns white as a sheet. You and all player characters within 10 meters and in sight of you become Scared.
  - name: Scream
    kind: effect
    category: Fear Table
    description: You scream in horror, which causes all player characters who hear the sound to immediately suffer a fear attack as well. Each person only ever needs to make one WIL roll to resist the same fear attack.
  - name: Rage
    kind: effect
    category: Fear Table
    description: Your fear turns to anger, and you are forced to attack its source on your next turn – in melee combat if possible. You also become Angry.
  - name: Paralyzed
    kind: effect
    category: Fear Table
    description: You are petrified with terror and unable to move. You cannot perform any action or movement on your next turn. Make another WIL roll on each subsequent turn (not an action) to break the paralysis.
  - name: Wild Panic
    kind: effect
    category: Fear Table
    description: In a fit of utter panic, you flee the scene as fast as you can. On your next turn you must dash away from the source of your fear. Make another WIL roll on each subsequent turn (not an action) to stop running and act normally again.
