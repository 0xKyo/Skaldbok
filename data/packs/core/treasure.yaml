  - name: Grimoire
    kind: treasure
    category: Treasure Table 2
    fields:
      VALUE/OBJECT/EFFECT: "Roll D4 for the school. 1: animism, 2: elementalism, 3: mentalism, 4: general magic. Roll D4−1 for the spell rank (0 means magic tricks) and D4 for the number. The GM chooses or randomized the exact spells."
  - name: Bottle
    kind: treasure
    category: Treasure Table 2
    fields:
