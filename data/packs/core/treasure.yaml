    kind: treasure
    category: Treasure Table 2
    roll: "15"
    fields:
      VALUE/OBJECT/EFFECT: "Roll D4 for the school. 1: animism, 2: elementalism, 3: mentalism, 4: general magic. Roll D4−1 for the spell rank (0 means magic tricks) and D4 for the number. The GM chooses or randomized the exact spells."
  - id: treasure-table-2-16
    name: Bottle
    kind: treasure
    category: Treasure Table 2
    roll: "16"
    fields:
      VALUE/OBJECT/EFFECT: "A HEALING roll reveals the contents. On a failure, the GM rolls in secret. Roll D6. 1: lethal poison (Potency 12), 2: sleeping poison (Potency 14), 3: booze, 4: herbal concoction, 5: healing potion (2D6 HP), 6: healing potion (3D6 HP)."
