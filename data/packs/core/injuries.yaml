    name: Changed personality
    kind: injury
    category: "Severe Injuries: Injury"
    roll: "19"
    fields:
      EFFECT: Randomly generate a new weakness (optional rule, page 26).
  - id: severe-injuries-injury-14
    name: Amnesia
    kind: injury
    category: "Severe Injuries: Injury"
    roll: "20"
    fields:
      EFFECT: "You cannot remember who you or the other player characters are. The effect must be roleplayed. Healing time: D6 days."
