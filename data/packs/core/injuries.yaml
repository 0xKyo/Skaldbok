format: 1
rollable:
  - "Severe Injuries: Injury"
entities:
  - name: Broken nose
    kind: injury
    category: "Severe Injuries: Injury"
    legacy_key: "#40"
    fields:
      EFFECT: "You get a bane on all AWARENESS rolls. Healing time: D6 days."
  - name: Scarred face
    kind: injury
    category: "Severe Injuries: Injury"
    fields:
      EFFECT: "Bane on all PERFORMANCE and PERSUASION rolls. Healing time: 2D6 days."
  - name: Teeth knocked out
    kind: injury
    category: "Severe Injuries: Injury"
    fields:
      EFFECT: Your PERFORMANCE and PERSUASION skills levels are permanently reduced by 2 ( to a minimum of 3).
  - name: Broken ribs
    kind: injury
    category: "Severe Injuries: Injury"
    fields:
      EFFECT: "Bane on all skills based on STR or AGL. Healing time: D6 days."
  - name: Concussion
    kind: injury
    category: "Severe Injuries: Injury"
    fields:
      EFFECT: "Bane on all skills based on INT. Healing time: D6 days."
  - name: Deep wounds
    kind: injury
    category: "Severe Injuries: Injury"
    fields:
      EFFECT: "Bane on all skills based on STR or AGL, and every roll against such skill inflicts D6 points of damage. Healing time: 2D6 days."
  - name: Broken leg
    kind: injury
    category: "Severe Injuries: Injury"
    fields:
      EFFECT: "Your movement rate is halved. Healing time: 3D6 days."
  - name: Broken arm
    kind: injury
    category: "Severe Injuries: Injury"
    fields:
      EFFECT: "You cannot use two-handed weapon, nor dual wield, and get a bane on all other actions normally using both arms, such as climbing. Healing time: 3D6 days."
  - name: Severed toe
    kind: injury
    category: "Severe Injuries: Injury"
    fields:
      EFFECT: Movement rate permanently reduced by 2 (to a minimum of 4).
  - name: Severed finger
    kind: injury
    category: "Severe Injuries: Injury"
    fields:
      EFFECT: Your skill levels in all weapon skills are permanently reduced by 1 (to a minimum of 3).
  - name: Gouged eye
    kind: injury
    category: "Severe Injuries: Injury"
    fields:
      EFFECT: Your skill level in SPOT HIDDEN is permanently reduced by 2 (to a minimum of 3).
  - name: Nightmares
    kind: injury
    category: "Severe Injuries: Injury"
    fields:
      EFFECT: "Roll to resist fear (page 52) each shift you sleep. If you fail, the shift doesn’t count as slept. Healing time: 2D6 days."
  - name: Changed personality
    kind: injury
    category: "Severe Injuries: Injury"
    fields:
      EFFECT: Randomly generate a new weakness (optional rule, page 26).
  - name: Amnesia
    kind: injury
    category: "Severe Injuries: Injury"
    fields:
      EFFECT: "You cannot remember who you or the other player characters are. The effect must be roleplayed. Healing time: D6 days."
