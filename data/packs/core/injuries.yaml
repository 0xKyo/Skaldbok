      EFFECT: "Bane on all skills based on STR or AGL. Healing time: D6 days."
  - id: severe-injuries-injury-5
    name: Concussion
    kind: injury
    category: "Severe Injuries: Injury"
    roll: 9–10
    fields:
      EFFECT: "Bane on all skills based on INT. Healing time: D6 days."
