  - id: fighter
    name: Fighter
    source: rulebook
    description: |
      “Uh, well, of course a warrior must be able to kill things. Creatures and monsters and such. Being able to avoid getting killed is also good. Then... well, there are different weapons, different techniques and... Anyway, the basis is simple: kill, and avoid dying.”
      – Norde from Boar Ridge
      Fighters earn their living by following the way of the sword. It may of course also be the way of the spear or crossbow, but a fighter’s specialty is always weapon proficiency and violence. But this is not to say that all fighters are driven by bloodlust. For some it is a matter of professional pride to achieve the maximum effect with minimal bloodshed; others are lazy and prefer saber-rattling to actual combat. Many fighters are troubled souls, haunted by nightmares and bad memories of a life spent in the company of death. They can therefore be surprisingly sentimental, prone to tears and compassionate embraces.
