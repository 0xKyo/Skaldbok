  - id: scholar
    name: Scholar
    source: rulebook
    description: |
      “You can talk about education, genius, and matter-of-factness all you want, but the scholar is never better than their sources. If you want to become learned, it’s not enough to sit and brood in some dusty tower room – you have to go out, into the world, to where the sources nest!”
      – Quasimo Dearfeather
      Scholarly individuals gather knowledge about nature and the shrouded history of the world. They seek the truth in order to understand the unseen forces and deep structures that hold the universe together as a single entity. Some are specialists with specific areas of expertise, such as monsters, plants, or dead languages. Others pride themselves in avoiding limitations and dedicating themselves to an all-encompassing, non-discriminatory pursuit of knowledge where the mating calls of dragons, the foaming of beer, and the inner workings of minerals are all covered by the same academic system. Scholars are often well-versed in myths, legends, and folklore, and have learned to decipher ancient languages and forgotten scripts.
    key_attribute: INT
