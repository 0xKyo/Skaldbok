kind: weakness
rollable:
  - Weakness
entities:
  - name: Gullible
    description: I believe everything that others tell me.
  - name: Greedy
    description: I want a bigger share of all treasure.
  - name: Thin-skinned
    description: I never tolerate a provocation.
  - name: Foolhardy
    description: I always go first into danger.
  - name: Fainthearted
    description: I always stay at the back of the group.
  - name: Monster Slayer
    description: All monsters are evil and must be slain.
  - name: Intolerant
    description: Nightkin such as orcs and goblins are evil and need to be fought.
  - name: Slothful
    description: I take every chance to rest.
  - name: Gluttonous
    description: I take every chance I get to eat something tasty.
  - name: Kleptomaniac
    description: I can’t stop myself from stealing valuables.
  - name: Vain
    description: I’ll help anyone who gives me praise or compliments.
  - name: Reckless
    description: I always take big risks without thought of the consequences.
  - name: Fearful of Magic
    description: Magic is an evil force and mages cannot be trusted.
  - name: Craving Knowledge
    description: The hunt for knowledge is more important than my friends.
  - name: Child of the Wild
    description: I never sleep indoors.
  - name: Boastful
    description: I always exaggerate my accomplishments.
  - name: Violent
    description: I resort to violence to overcome every obstacle.
  - name: Overbearing
    description: I always tell others what to do.
  - name: Pessimist
    description: I always think things will turn out for the worst.
  - name: Haughty
    description: I look down on everyone I meet.
