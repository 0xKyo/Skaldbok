  - id: adventure-the-demon-ix
    name: The Demon Ix
    source: adventure
    category: The Village of the Day Before
    attack_dice: D6
    statblocks:
      - fields:
          Ferocity: No. of PCs−1 (min. 1)
          Size: Normal
          Movement: "16"
          Armor: —
          HP: "64"
    attacks:
      - roll: "1"
        name: Demonic Dread!
        text: Demonic Dread! A chorus of voices rises from the demon's eyes to a deafening crescendo. All player characters within 10 meters become Dazed and suffer a fear attack.
      - roll: "2"
        name: Flaming Grip!
        text: Flaming Grip! Ix smiles as he grabs a player character and burns the victim with demonic heat. The attack inflicts 2D10 fire damage. The attack can be parried.
      - roll: "3"
        name: Curse!
        text: "Curse! Ix points at a player character within 10 meters and utters an ancient curse. The attack cannot be dodged, but all curses except #4 can be lifted with DISPEL (power level 1). Roll D4: The victim is blinded and acts as if in total darkness. Roll D4 every Shift. On 1 the effect 1 wears off. The victim is struck by amnesia and forgets their own name and who the other player charac- 2 ters are. The effect must be roleplayed. Roll D4 every morning. On 1 the victim’s memory returns. The victim turns into an animal. Roll D6. 1: cat, 2: fox, 3: goat, 4: wolf, 5: deer, 6: bear. The 3 victim gains stats as per page 99 and cannot speak. Roll D4 every Shift. On 1 the effect wears off. The victim becomes one category older, for example going from Adult to Old. Their attributes 4 and derived ratings change as per the table on page 24 in the Rulebook, but skill levels do not. The effect is permanent, and the victim ages normally from their new age. A person who is already old becomes very frail and gets −2 STR and CON."
      - roll: "4"
        name: Unseen Force!
        text: Unseen Force! Ix stretches out his hand towards a victim within 10 meters. The victim is hurled 2D8 meters backwards with tremendous force, suffers the same amount of bludgeoning damage, and lands prone.
      - roll: "5"
        name: Demonic Smoke!
        text: Demonic Smoke! The sulfurous smoke from Ix’s eyes billows out and envelops a player character. The victim takes 2D10 damage and becomes Scared. Armor has no effect.
      - roll: "6"
        name: Possession!
        text: Possession! Ix glares at a player character within 10 meters and takes full control of their body. The player character must make a WIL roll with a bane (not an action). On failure, the victim must immediately perform a movement and action of Ix’s choice, except actions that require WP. The victim also loses their next turn.
    abilities:
      - name: Immunity
