  - id: bestiary-ogre
    name: Ogre
    source: bestiary
    category: Nightkin
    description: Ogres can use their large bodies to slam an opponent with tremendous force. This counts as an unarmed melee attack with a boon that inflicts 2D6 bludgeoning damage (plus any damage bonus) and cannot be parried. The ogre can also dash before the attack (but does not have to). Humanoid targets of Normal size or smaller who are hit by the attack are automatically knocked down.
    quote: |
      “My great-grandmother had an ogre. It came to the farm one day, hungry and alone. Before long it had moved into the barn and started helping with everything from pulling the plow to ditching and heavy lifting.”
      – Julinel Garpe, farm wife
    random_encounter: In the middle of the night, the player characters hear heavy footsteps approaching. A moment later the ogre Gvorm crashes howling into their camp. Combat-ready characters can attack immediately, but anyone who succeeds with an AWARENESS roll notices that the traveler does not appear to be violent, just violently hungry and very drunk. Gvorm throws himself at the player characters’ packs in search of food; if allowed to eat, he calms down and proves to be a pleasant and helpful fellow. However, it takes a successful PERSUASION roll to communicate with him in any way.
    adventure_seed: A group of inebriated ogres has staggered into a logging site, demanding tribute in the form of all the beer in the village. Despite being provided with barrel after barrel, the ogres refuse to leave, which soon becomes unbearable for the villagers – they send for heroes to free them from this drunken yoke. If the player characters answer the call and try to solve the problem by force, the locals beg them not to, as this could lead to the destruction of the entire village. Perhaps the ogres can be PERSUADED to go to another village, but would that really be good for neighborly relations? No matter what the player characters do, the ogres soon get tired of the chatter and start turning the village upside down. Now it is time to act fast!
    image: images/bestiary/ogre-48.jpg
    image_page: 15
