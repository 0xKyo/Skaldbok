  - id: bestiary-goblin
    name: Goblin
    source: bestiary
    category: Nightkin
    description: "It is well established that the core of the army that the sorcerer Visimir assembled to conquer the territory of the Bloodfist orc clan was made up of goblins. He tempted several clans with fine words of plunder and treasure, but also with promises that they would get to keep part of the valley for themselves. It may seem like a blatant lie in retrospect, but this duplicity also cost Visimir his life – when his treachery was discovered, a young scout named Gutsy shot a poisoned black arrow straight into the two-faced sorcerer’s heart. What happened next is common knowledge, at least among the nightkin: the surviving goblins rallied around Gutsy, and she led them deep into the nearby forest, away from the eyes of enemies and traitors."
    quote: |
      “Oh yes, in my line of work you come across the occasional nightkin. Goblins are probably my favorites. With a good swing, you can split two or three of them right away!”
      – Antos Flandel, caravan guard
    random_encounter: "A badly wounded woman comes staggering towards the player characters but collapses before reaching them. If someone hurries, she has time to whisper a few words before she dies: “Follow the blood trail. Save my darling, before they eat him… with mustard…” Anyone who succeeds with a SPOT HIDDEN or HUNTING & FISHING roll can follow the blood trail deep into the wilderness, to a clearing where a handful of cheerful goblins (two scouts and three warriors) have lit a fire and set up a roasting spit. Lying on the ground is the intended meal: a tied-up man."
    adventure_seed: From the darkest depths of a vast forest, small bands of goblins are setting off on raids. Successfully robbing merchants, priests, peasants, and nobles has made them bolder. So far they have not killed anyone who put their hands in the air, but several guards have lost their lives trying to stop them. It is Gutsy herself who is behind the attacks. In the autumn of her life, her mind is stuck in memories of being betrayed and forced to hide in the woods with her companions, like rats in filthy holes. Now she intends to take what she was once promised by Visimir. Any gold the goblins scrape together is used to buy food, weapons, and equipment for the growing army. Someone must stop Gutsy before her goblins grow so strong that they pose a real threat to everyone in the area.
    image: images/bestiary/goblin-46.jpg
    image_page: 11
    statblocks:
      - variant: Scout
        fields:
          Movement: "10"
          Damage Bonus: —
          HP: "9"
          Typical Armor: Leather (1)
          WP: "8"
          Skills: Awareness 10, Evade 10, Sneaking 12
          Typical Weapons: Short bow (skill level 12, damage D10), short sword (skill level 10, damage D10)
      - variant: Warrior
        fields:
          Movement: "10"
          Damage Bonus: —
          HP: "10"
          Typical Armor: Studded leather (2)
          WP: "8"
          Skills: Awareness 10, Evade 10, Sneaking 12
          Typical Weapon: Long spear (skill level 12, damage 2D8)
    abilities:
      - name: Non-Monster
        kind: ability
        text: Goblins do not count as monsters in combat, but as ordinary NPCs.
      - name: Nocturnal
        kind: ability
        text: In direct sunlight, goblins get a bane on all rolls and suffer D6 damage per stretch. A thick layer of clouds, dense foliage, or full-cover clothing are enough to avoid the effect.
      - name: Player Character
        kind: ability
        text: If the gaming group agrees on it, goblins can be created as player characters. They will then have the innate ability Resilient (see sidebar below).
      - name: Resilient
        kind: pc_ability
    tables:
      - First Name
  - id: bestiary-hobgoblin
    name: Hobgoblin
    source: bestiary
    category: Nightkin
    description: The hobgoblins I have encountered on my travels have, without exception, been extremely hard-working and almost unstoppable in their zeal. In fact, I would go so far as to call them the opposite of halflings in this respect
    quote: |
      “Hobgoblins are said to be hard-working, determined, and averse to laziness. Tell that to Truutul, that drunken hobgoblin who has moved into the inn’s broom closet and never does anything but drink and sleep!”
      – Fialina Rumble, potter
    random_encounter: A player character who succeeds with a SPOT HIDDEN roll notices two boots sticking out of a thicket, as if someone is lying there. It is a dead woman, an adventurer by the looks of her clothes, killed by countless cuts and stab wounds. She is clutching a bloodstained map in one hand; it shows three distinct landmarks in the area – a hilltop and a marsh that the player characters have already passed, and a circled squiggle that may represent a ruin. If the characters go there, they find what is left of the hobgoblin clan Phubarra (a scout, a thief, and three warriors) and a large number of dead hobgoblins. The hobgoblins are frantic with grief and crave revenge after the adventurer’s murderous visit.
    adventure_seed: "A small village that makes its living from mining bog ore has a problem: a hobgoblin clan has moved into caves in the forest and taken control of the operation. The villagers want someone to help them drive the hobgoblins away, but if the player characters talk to one of the clan members, the hobgoblin claims that it was actually they who once lived here and mined the ore – in other words, that the villagers stole their land and drove them from their homes. Perhaps the characters can get to the bottom of this by talking to older villagers and PERSUADING them to tell the truth? Or maybe they must visit one of the more inhospitable neighboring settlements in search of information? Ultimately, they have a choice to make: taking sides, brokering peace, or leaving both parties to resolve the situation by violent means."
    image: images/bestiary/hobgoblin-47.jpg
    image_page: 13
    statblocks:
      - variant: Scout
        fields:
          Movement: "10"
          Damage Bonus: —
          HP: "9"
