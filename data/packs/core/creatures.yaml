  - id: bestiary-young-dragon
    name: Young Dragon
    source: bestiary
    category: Dragons
    description: Young dragons have recently left their parents and learned to fly and hunt on their own. They are recognized by their size but also by being more slender than their elders. However, their hard scales and natural weapons quickly grow to proportionate size. Despite their age, a young dragon is still a formidable predator; life is a feast and the world its festival grounds. It develops by curiously exploring and playing with its surroundings – hunting small game to become fast and agile; going after larger prey to build up its strength. But whatever the prey, the hunt is everything – its entertainment, training, and survival. Later, as the dragon grows and matures, the greed awakens as well; the desire to take, own, and hoard. Even in its youth, it may start collecting gold and precious stones. These treasures are hidden in various places until, as an adult, it comes back for them and adds them to a growing pile in its very own cave.
    quote: |
      “Before the masters of the order knew better, young specimens were used as training dragons for aspiring dragon knights. Their untamable animality cost countless squires and young knights their lives.”
      – Krusibor Adlefant, learned in ancient history
    random_encounter: A young dragon flies over the player characters. As long as they do not attract its attention, it simply passes by on its way to other adventures, but if the adventurers pique its curiosity, the dragon lands about thirty meters away from them. It has already eaten its fill and is more curious than aggressive. After studying the characters for a few rounds, it loses interest and leaves them alone. If the characters decide to fight, the dragon will gladly play with them for three rounds before it flies off.
    adventure_seed: A wedding feast is held at Rosenbrand Castle, and everyone is invited! Nobles and commoners from all over the region come to join the festivities, as do the player characters – they are all there to celebrate the union between Houses Rosenbrand and Hammerfist. The delicious smell of exotic dishes is mixed with laughter and music, dancing and games. This will certainly be a day to remember, but for a completely different reason… At the height of the festivities, the sun is cast in shadow by a creature from the darkest of nightmares. The young dragon Vreltir has been drawn to the feast and decided that this will be her day. She starts by destroying the drawbridge and then makes her way into the castle. Someone must slay or drive away the dragon before she wipes out the terrified wedding guests and steals House Rosenbrand’s treasures. And who better to play this game of cat and mouse than the player characters?
