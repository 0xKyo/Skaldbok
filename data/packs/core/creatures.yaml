  - id: bestiary-skeleton
    name: Skeleton
    source: bestiary
    category: Undead
    description: There were probably both practical and cultural reasons why so many ancient rulers reanimated skeletons to watch over their tombs and shrines. They are practical in the sense that they never tire or betray their duties; culturally, they clearly became something of a fad – at the expense of golems, pact-bound demons, and other alternatives.
    quote: |
      “Apparently they aren’t very good warriors and guards, the skeletons. But I could sure use a dozen of ’em on the farm – both cheaper and more obedient than farmhands and maids.”
      – Brynhild Croft, grain farmer
    random_encounter: A rusty old iron gate blocks the player characters’ path; it is easy to go around it, as the wall in which it was once embedded has collapsed. As they approach, a figure sitting at the foot of the gate post rises to its feet – a skeleton that steps forward and opens the gate. The skeleton stands there until the adventurers have passed, and then closes the gate and sits back down by the gate post. If the characters ask the locals about it, they explain that the skeleton has always been there and that no one knows who created it.
    adventure_seed: The player characters find themselves in a region ravaged by grave robbers – a dozen older graves have already been dug up and robbed of their occupants. They trail leads into a misty moor where the death shaman Guralgolg and his goblins are gathering skeletons for their army of undead. Guralgolg’s plan is to use a magic scroll to reanimate the skeletons and march on the region’s main town. If the characters are spotted and the shaman sees them as an obvious threat to his plans, he rushes to the great pile of bones and uses the scroll to raise 2D10 skeletons, before ordering them to stall the adventurers while he escapes. If he manages to get away, Guralgolg will soon reappear with a new sinister plan in motion…
