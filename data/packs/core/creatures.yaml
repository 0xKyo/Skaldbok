  - id: bestiary-centaur
    name: Centaur
    source: bestiary
    category: Rare Kin
    description: Although my colleague Virdal would object vociferously, I believe the centaurs are best described as savage and boisterous nature beings. For some reason, Virdal seems to think that they are noble creatures who personify the task of watching over the world’s forests and all that inhabit them. But I have no time for such unscholarly nonsense. Centaurs are big and characterized by a brash, almost cocky attitude – that much is beyond dispute! They can certainly relax at their regular, wine-drenched, excessive parties and appear both light-hearted and good-natured – especially if a satyr or two shows up and adds to the fun. But this is of little comfort to the settlers, hunters, and adventurers who, according to the centaurs, do not show proper regard for nature and therefore incur their wrath.
    quote: |
      “Think about it. Why have an ordinary horse when you can have a centaur? They understand what you’re saying so it’s easy to give them orders. And they can swing a sword and shoot a bow to fend off robbers. It’s perfect!”
      – Gultrub Skackle, a fool
    random_encounter: The centaurs Atos and Atene suddenly appear before the player characters, demanding to know what business they have in the area. The centaurs immediately become suspicious if they are told a blatant lie or if anyone admits to having goals that could somehow threaten the area’s natural environment. Can the player characters talk their way out of this precarious situation? If not, Atos will likely gallop off for reinforcements…
    adventure_seed: Someone has stolen a wagonload of the centaurs’ most potent ale! A band of dwarves has made off with a dozen barrels, and the centaurs have followed their trail to the foot of a nearby mountain range. But where the earth turns to rock, the trail is lost. Can the player characters help the centaurs track down the dwarves and persuade them to return the barrels while there is still some ale left? If successful, they are invited to a marvelous party where they meet not only centaurs but many other forest creatures over the course of a truly magical night. In the morning the player characters’ memories of the party are fuzzy at best and they are struck by a massive headache. But they have made new friends in the forest – friends who could prove invaluable in the future.
    attack_dice: D6
    image: images/bestiary/centaur-51.jpg
    image_page: 23
    statblocks:
      - fields:
          Ferocity: "2"
          Size: Large
          Movement: "20"
          Armor: —
          HP: "28"
          Alcohol Tolerance: Centaurs can drink copious amounts of wine and beer without getting particularly drunk.
          Typical Gear: Short spear, longbow, quiver of arrows.
    attacks:
      - roll: "1"
        name: Horse Kick!
        text: Horse Kick! The centaur kicks back at an opponent. The attack hurls the victim 2D6 meters and inflicts an equal amount of bludgeoning damage. The victim lands prone.
      - roll: "2"
        name: Spear Thrust!
        text: Spear Thrust! The creature thrusts its short spear at an opponent, inflicting 2D10 piercing damage. The attack can be parried.
      - roll: "3"
        name: Crushing Hooves!
        text: Crushing Hooves! The centaur rears up and strikes with its hooves at two opponents within 2 meters of each other. Each victim suffers 2D6 bludgeoning damage.
      - roll: "4"
        name: Quick Shot!
        text: Quick Shot! The creature uses its longbow and quickly fires an arrow at an opponent within 30 meters, preferably a mage or another archer. The victim suffers D12 piercing damage.
      - roll: "5"
        name: Ramming Attack!
        text: Ramming Attack! The creature lunges at an enemy with its full weight. The attack inflicts 2D10 bludgeoning damage and knocks the victim down.
      - roll: "6"
        name: Mocking Laughter!
        text: Mocking Laughter! The centaur lets out a burst of deafening and mocking laughter. All enemies within 10 meters must make a WIL roll to not become Angry. Anyone who is already Angry suffers another condition of their choice.
  - id: bestiary-fairy
    name: Fairy
    source: bestiary
    category: Rare Kin
    description: Fairies are the bane of my existence. In fact, I considered omitting them from my catalog altogether as punishment for all the misery they have caused us on our travels. At least a wolf or a band of orc bandits has reasonable motives for their actions, but not the fairies – oh no, they cause mischief just to amuse themselves! Indeed, these elf-like little fiends are not content to play innocent pranks on passing travelers; they are most delighted when their victims get into real trouble or suffer harm. To take an example from our own journey, we lost several days’ rations of food when the rascals threw itching powder up the backside of Molly, our trusty mule – she panicked and ran straight into a rapid, kicking off her packs which were then taken by the current. You better believe there was a lot of giggling from the surrounding bushes!
    quote: |
      “The hair and wings of a fairy can be brewed into a powerful love potion. But be sure to kill the little bugger, or you and your lover will be haunted by vengeful fairies for the rest of your lives!”
      – Fasimo Kvagger, drug monger
    random_encounter: The player characters pass an area inhabited by a group of fairies. The creatures subject them to a number of pranks as they make their way through the forest, and if the adventurers take it all in good humor, the fairies may even give them a simple parting gift once they tire of the game.
    adventure_seed: A confused merchant is walking on the road in front of the player characters. She does not know how she got there or where her horse and wagon with all the goods have gone, but mutters something about ghosts and malevolent spirits. The adventurers can follow the tracks to her wagon, which has been looted of most of its cargo. In the distance they can hear singing and laughter, and it soon becomes clear that the perpetrators are a group of fairies who have enriched themselves at the expense of the merchant. Can the player characters take back the stolen goods?
    attack_dice: D6
    image: images/bestiary/fairy-52.jpg
    image_page: 25
    statblocks:
      - fields:
          Ferocity: "1"
          Size: Small
          Movement: "16"
          Armor: —
          HP: "6"
          Swarm: Fairies fight together and some of their monster attacks are performed by several fairies as a group. Such attacks still only use up the turn in the round for one fairy. Once half of the fairies have suffered damage, they flee, but will likely come back for revenge later.
          Wings: Fairies fly around in erratic patterns. They always attack from the air and can only be attacked with ranged weapons or Long melee weapons.
          Invisibility: As an action, a fairy can become invisible except for its shadow. If the fairy performs an action that affects another creature, it immediately becomes visible and cannot become invisible again for one stretch.
    attacks:
      - roll: "1"
        name: Teasing!
        text: Teasing! The fairies hurl insults and taunts at their enemies. Everyone within 10 meters must succeed with a WIL roll or gain the Angry condition. Those who are already Angry gain another condition of their choice.
      - roll: "2"
        name: Pinprick!
        text: Pinprick! Several fairies swarm around an opponent and stab them with their needle-sharp daggers. The victim suffers D10 damage (armor has no effect) and gains the Dazed condition.
      - roll: "3"
        name: Blinding Dust!
        text: Blinding Dust! A fairy throws a fistful of glitter into the air which may blind anyone within 10 meters. Those affected must succeed with an EVADE roll (not an action) or act as if in total darkness for D6 rounds.
      - roll: "4"
        name: Sweet Dreams!
        text: Sweet Dreams! A fairy sneaks up behind an opponent and stabs them with the poisonous thorn of an enchanted rose. The victim is injected with a paralyzing poison with potency 12.
      - roll: "5"
        name: Enchanted Kiss!
        text: Enchanted Kiss! One of the fairies blows an enchanted kiss at a victim, who must succeed with an EVADE roll (not an action) or gain the Disheartened condition. Anyone who is already Disheartened gains another condition of their choice.
      - roll: "6"
        name: Magic Arrow!
        text: Magic Arrow! A fairy fires an enchanted arrow at an enemy within 10 meters. The victim suffers D10 piercing damage and must make a WIL roll to resist fear.
  - id: bestiary-frog-people
    name: Frog People
    source: bestiary
    category: Rare Kin
    description: Frog people can activate this ability to jump as far as their movement rating horizontally, or up to half their movement rating vertically. No ACROBATICS roll is required. The jump can end with a melee attack, which is made with a boon.
    quote: |
      “First one of ‘em pops up, throwing a spear. Then there’s another one, throwing a spear. And then another one. Fighting the frog people in their natural habitat is… challenging…”
      – Jina Cleaves, swamp ranger
    random_encounter: Trudging through a swamp or marsh, the adventurers suddenly hear a loud croak coming from some nearby bushes. Two frog creatures step forward. The plucky youngsters Kaarvia and Saartia have had great luck fishing and hope to trade useful items from the player characters. At the slightest sign of hostility, the two of them flee headlong into the swamp.
    adventure_seed: The exploring mage Ulvalf hires the player characters to escort him in his search for an ancient temple ruin; according to his calculations, it should be located in what is now a vast swamp. He has been advised to seek out the frog creature Quaark and hire her as a guide, so the first challenge is to find the frog people’s settlement. Once there, Quaark demands that the expedition help her defeat a giant amoeba that is hunting in the area and has killed several of her friends. Only when the beast has been slain will she show them the way to the ruin.
    image: images/bestiary/frog-people-53.jpg
    image_page: 27
    statblocks:
