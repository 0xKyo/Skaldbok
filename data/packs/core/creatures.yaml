          Healing Blood: The mountain troll’s blood is a thick, sweet sap with healing properties. The mountain troll heals D8 HP per turn in a combat, as long as it has not reached zero HP.
          Memories of Ages Past: Mountain trolls have skill level 18 in LANGUAGES and MYTHS & LEGENDS.
          Troll Staff: The mountain troll’s staff allows it to cast all magic tricks listed under general magic as well as DIVINATION, FARSIGHT, LONGSTRIDER, and SCRYING. All the spells can be cast at power level 3. The staff has 12 WP that reset every dawn. The staff is bound to the mountain troll’s soul and loses its ability to regain WP if taken from the troll.
    attacks:
