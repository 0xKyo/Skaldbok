  - id: bestiary-ancient-dragon
    name: Ancient Dragon
    source: bestiary
    category: Dragons
    description: It is very hard to say how many dragons remain from the oldest times, who lived in the days of the Dragon Empire and fought in the great demon wars. By their own account, they can lie dormant for hundreds of years, slumbering on their mountains of treasure, which means they are very rarely seen. What is more, they tend to move further and further into the wilderness as they get older – away from people who disturb their hunting grounds, away from the arrows of bothersome heroes. But an educated guess tells me that there may be between five and ten of them, including the legendary Arknarath and Nielfrung. These oldest of dragons rarely attack halflings, humans, and other civilized kin, perhaps because they view us as subjects or as their (inferior) equals. They are wise beyond our comprehension; they have power over language and therefore over the world; they are immensely strong and virtually invulnerable. As indicated above, they can be talked to, but know that you risk catching the dragon on a bad day – which often ends in disaster.
    quote: |
      “No, the old dragons are not capricious. It may seem that way, but that’s only because you don’t understand their motives and what they are reacting to.”
      – Eulina Stoltendal, dragon scholar
    adventure_seed: "The world is on the brink of total war. The demon prince Beliel is gathering his armies in the south, and all the peoples of the world must unite to resist the coming onslaught. But there may be a path to peace; perhaps Beliel can be defeated and driven off before the war breaks out? According to the elven elders, there is a creature that once defeated Beliel and banished him to the demonic realm for hundreds of years: the dragon Nielfrung. The player characters are sent to Nielfrung’s cave, on the edge of a lava lake deep in the bedrock, carrying priceless gifts to trade for information on how to banish Beliel again. But there are of course forces that do not want the expedition to succeed, so the journey underground is lined with demon cultists and increasingly powerful demons. Not to mention brigands who have caught wind of the riches they carry. Will the characters make it to Nielfrung’s cave, and if so, will they be able to convince the ancient dragon to join the fight against the demon prince?"
