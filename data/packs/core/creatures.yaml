          Armor: —
          HP: "56"
          Animal Friend: Forest giants are friends with all animals in the forest. If anyone hurts an animal within a shift’s walk of the giant, it immediately senses this and seeks out the perpetrator to stop the cruelty.
          Woodland Camouflage: In a forest, a forest giant can blend in with its surroundings at any time and become invisible as long as it remains still.
    attacks:
      - roll: "1"
        name: Gnawing Friends!
        text: Gnawing Friends! Small animals swarm out of the surrounding woods to defend their friend – biting, clawing, and tearing at its enemies. Anyone within 10 meters of the forest giant suffers 2D6 slashing damage and is knocked down.
      - roll: "2"
        name: Crushing Club!
        text: Crushing Club! The forest giant swings its wooden club over its head and delivers a devastating blow to an opponent. The club deals 4D8 bludgeoning damage and knocks the victim down.
      - roll: "3"
        name: Body Tackle!
        text: Body Tackle! The giant charges forward and tackles an opponent with full force, inflicting 4D6 bludgeoning damage. The victim is knocked down and becomes Dazed.
      - roll: "4"
        name: Bear Hug!
        text: Bear Hug! The giant stretches out its arm and pulls an opponent close. It then gives the victim a big bear hug before dropping it to the ground. The hug inflicts 3D6 damage (armor has no effect) and the victim loses their turn in the round (if it has not already passed).
      - roll: "5"
        name: Forceful Throw!
        text: Forceful Throw! The creature grabs an opponent and tosses them over its shoulder. The victim flies 2D8 meters, suffers an equal amount of bludgeoning damage, and lands prone.
      - roll: "6"
        name: Snaring Roots!
        text: Snaring Roots! The forest giant conjures roots from the ground that grab all opponents within 10 meters. The victims suffer D6 damage (armor has no effect) and are unable to move or perform actions that require movement. It takes a successful STR roll (counts as an action) to break free. Others can help.
  - id: bestiary-mountain-giant
    name: Mountain Giant
    source: bestiary
    category: Giants
    description: "Of all the giants in this world, mountain giants are the ones that ordinary people most often have the misfortune to encounter. While they are generally quite meek and peaceful, they seem to regard all small folk in the same way that dragons and demon princes do – as any other animal, or even as livestock. It takes a lot to provoke a mountain giant, but when its patience finally runs out, it explodes into unbridled aggression. Furthermore, their size, clumsiness, and short-sightedness mean that anyone who gets close risks being accidentally crushed – by a misstep or a dropped object. Mountain giants often live alone in the mountains, where they raise goats and sheep. Their temperament can vary considerably: some are accommodating and communicative, but I have also heard many stories of small folk suffering at their hand – whose barns were raided and whose youngsters were abducted and forced to look after the giant’s livestock."
    quote: |
      “The giant we called Graycliff watched over our village for over a century. But suddenly his eyes went dim and his mind dull. We couldn’t stay; the village was abandoned and no longer exists.”
      – Enid Parting, weaver
    random_encounter: "A player character who succeeds with a SPOT HIDDEN roll sees the shadow of the massive boulder that comes flying in time to warn their friends. If no one notices, a random player character is subjected to monster attack #6. The victim may roll EVADE. The boulder is thrown by Little Trull, a giant who is trying to scare away the intruders from his domain. If the characters do not run away, he will come charging with waving arms, roaring so hard that spittle sprays from his mouth. But he only fights in self-defense, so as long as the characters do not attack, the encounter may result in a conversation and possibly an agreement of safe passage."
    adventure_seed: Enemies threaten Castle Brand, but there is still hope! In the northern mountains lives a pair of giants, old friends of the castle’s lord, who previously helped defend the castle from attack. The player characters are sent up into the mountains by the aging Lord Brand to find the giants and persuade them to help him once more. But this time the giants have a new head of the family, and she is not prepared to do the player characters’ bidding without getting something in return – the eradication of the demonic vermin infesting one of their mountains, which can only be accessed through cracks and tunnels that are far too narrow for the giants.
    attack_dice: D6
    image: images/bestiary/mountain-giant-70.jpg
    image_page: 67
    statblocks:
      - fields:
          Ferocity: "1"
          Size: Huge
          Movement: "16"
          Armor: —
          HP: "78"
          Short-Sighted: Mountain giants are short-sighted and any SNEAKING roll to get past them or hide from them is made with a boon.
    attacks:
      - roll: "1"
        name: Crushing Blow!
        text: Crushing Blow! The giant swings its fist or club and bashes a player character with all its might. The attack inflicts 4D10 bludgeoning damage and knocks the victim down.
      - roll: "2"
        name: Where Did You Go?
        text: Where Did You Go? The giant’s short-sightedness causes it to lose sight of the player characters for a moment. It clumps around and shouts at them to come forward. All player characters must make a SNEAKING roll. If everyone succeeds, they may exit combat or perform the next attack as a sneak attack. The first person to fail becomes the giant’s next target.
      - roll: "3"
        name: Stomping Attack!
        text: Stomping Attack! The mountain giant stomps its feet in an attempt to crush all opponents within 2 meters. The attack inflicts 3D6 bludgeoning damage and knocks the victims down.
      - roll: "4"
        name: Sweeping Blow!
        text: Sweeping Blow! The giant sweeps its club at all enemies within 6 meters. The attack inflicts 2D10 bludgeoning damage and knocks the victims down.
      - roll: "5"
        name: Enough is Enough!
        text: Enough is Enough! The giant gets fed up with an enemy, grabs the victim, and stuffs them into a sack. The victim suffers 2D6 bludgeoning damage and is unable to move or perform actions that require movement. To free the prisoner, the victim or someone else must have a slashing weapon and roll against the weapon skill with a bane (counts as an action).
      - roll: "6"
        name: Stone Throw!
        text: Stone Throw! The mountain giant grabs a large rock and throws it at an enemy within 10 meters. The victim suffers 3D10 bludgeoning damage and is knocked down.
  - id: bestiary-sea-giant
    name: Sea Giant
    source: bestiary
    category: Giants
    description: As far as I can tell, sea giants are the largest of their kind, standing between eight and twelve times the height of a human. They hunt whales and giant squid in the depths of the oceans, and do not seem to be upset by members of other kin making a living in similar ways. In fact, with few exceptions, these titans of the sea never take any notice of other intelligent creatures; to my knowledge, no man, elf, mallard, or halfling has ever exchanged so much as a word with a sea giant. When they become violent towards seafarers, it is at the behest of mermaids or others who have earned their respect and can convince them that there is an imminent threat to the sea or its inhabitants. Any crew that angers a sea giant in this way would be wise to head for the nearest port!
    quote: |
      “It is said that Princess Maia of Arandeld tricked mermaids into believing that a hostile fleet also threatened the rest of the coastline. No less than three sea giants helped sink the enemy’s ships, and the threat was averted.”
      – Fiola Firth, court jester
    random_encounter: Out on the open water, the gentle waves ahead of the player characters’ vessel begin to boil up. The navigator must make a SEAMANSHIP roll to get out of the way. On failure, their ship sails straight into a battle between the sea giant Attia and an enormous sea serpent; their hull is breached and the angered Attia will attack as soon as she has scared off the sea serpent. If the roll succeeds, they can see the giant from a distance as she rises to the surface with a triumphant roar.
    adventure_seed: A sea giant has declared war on all shipping along a strip of coastline whose population depends on trade across the sea. The mariners’ guild asks the player characters to find out why the giant has become so aggressive and what can be done to stop it. What has happened is that a small, unassuming fishing village has been taken over by poachers; their goal is to catch as many whales and squid as possible before moving on. If the player characters put an end to their activities and provide the giant with proof of this, it will soon allow the people to resume maritime trade.
    attack_dice: D6
    image: images/bestiary/sea-giant-71.jpg
    image_page: 69
    statblocks:
      - fields:
          Ferocity: "1"
          Size: Huge
          Movement: "20"
          Armor: —
          HP: "82"
          Absent-Minded: The sea giant is very absent-minded and finds it difficult to maintain focus on smaller creatures or tasks over a long period of time. This can be exploited to escape a wrathful giant, who simply loses interest in pursuing small, insignificant creatures after only fifteen minutes – that is, if they manage to avoid the giant’s terrible attacks.
          Sea Creature: Sea giants live exclusively in salt water and can swim as well as the whales they often keep as pets. They can hold their breath for several hours, but cannot breathe underwater.
    attacks:
      - roll: "1"
        name: Thunder and Lightning!
        text: Thunder and Lightning! The sea giant raises its fist to the sky, causing dark thunderclouds to gather overhead. Then it points at an opponent within 30 meters and sends a bolt of lightning at the victim, who suffers 2D10 damage (metal armor has no effect). Moments later a clap of thunder rumbles above the giant and renders all opponents within 20 meters Dazed.
      - roll: "2"
        name: Rock Throw!
        text: Rock Throw! The creature picks up a large rock from the ocean floor and hurls it at an opponent within 20 meters, inflicting 3D10 bludgeoning damage. The victim, as well as anyone within 6 meters, is knocked down by the resulting wave.
      - roll: "3"
        name: Skewering Spear!
        text: Skewering Spear! The giant grabs a spear made from a broken mast from a quiver in its belt and throws it at an opponent within 50 meters. The spear inflicts 4D10 piercing damage and knocks the victim down.
      - roll: "4"
        name: Whirling Flurry!
        text: Whirling Flurry! Blow upon blow rain down upon all opponents within 4 meters, who suffer 3D6 bludgeoning damage.
      - roll: "5"
        name: Fishing Fortune!
        text: Fishing Fortune! The sea giant casts a large net over up to four opponents within 4 meters of each other. All victims must be within 10 meters of the giant. They become unable to move or perform actions that require movement. To free the prisoners, they or someone else must have a slashing weapon and roll against the weapon skill with a bane (counts as an action).
      - roll: "6"
        name: Wave Attack!
        text: Wave Attack! The giant uses its arms to whip up waves in the water around it. Anyone within 10 meters of the sea giant is thrown 2D10 meters and must make a SWIMMING roll to avoid drowning.
  - id: bestiary-titan
    name: Titan
    source: bestiary
    category: Giants
    description: People are afraid of dragons, demons, and ravenous trolls, and rightly so. But there may be an even greater threat lurking out there, though the risk of encountering it is far lower. The titans appear to be related to giants. They can be found standing, sitting, or hibernating in up to twenty known locations in this world, clad in full armor and armed with huge maces or warhammers. I am fairly certain that their number is much higher, and that they were the giants’ greatest champions in the oldest times, when the battle between dragons and demons raged most fiercely – possibly refined into outright monsters of war through powerful rituals. Anyway, as long as they are asleep, the titans pose no threat to anyone. But sometimes they wake, compelled by their duty to fight but unsure of who the enemy is. Sometimes they direct their anger at a halfling village, a noble’s estate, a dwarven mine, or the like. In such cases, the titan will not stop until every last enemy has been vanquished, and then, its work done, it drifts back into slumber.
    quote: |
      “A living creature? No, no, it’s a statue, no doubt about it. We call him Galt and the young’uns love playing with him – decorating him with flowers, climbing and clambering, messing with paint. It’s great fun!”
      – Waltert Roe, old-timer
    random_encounter: Next to an unkempt path in a deep forest, the player characters find a huge overgrown stone tablet. If they clean it, they see a magnificent engraving of a titan standing between a dragon and a demon, keeping them apart with a shield and mace. At the titan’s feet lie a defeated dragon and a fallen demon, crushed by the mace. That is all the player characters can glean from the stone tablet, but they leave with an eerie feeling of having learned a secret hidden since the oldest times.
    adventure_seed: An exhausted young girl comes staggering across the player characters’ path. She explains that her village has been attacked by a “warrior monster” that is killing people indiscriminately. She managed to escape, but many are still hiding in basements and larger buildings; it seems that the warrior will not stop until everyone has been found and killed. This is of course a titan who has designated the villagers as “the enemy.” Can the player characters defeat it in combat, or at least draw it away to give those in hiding a chance to escape? Or can they help the titan find another, more worthy adversary – perhaps the notorious mage Gadim Dragonbane, who is said to be a powerful demon cultist?
    attack_dice: D6
    image: images/bestiary/titan-72.jpg
    image_page: 72
    statblocks:
      - fields:
          Ferocity: "2"
          Size: Huge
          Movement: "14"
          Armor: "6"
          HP: "64"
          Hibernation: Once a titan has completed a mission to its own satisfaction, it withdraws to a remote location and goes back into hibernation until the next time it is called to battle. It then turns to stone, but wakes up if anyone attacks it or if it is summoned by the ancient cries of those who do battle with dragons and demons.
          Resistance: The magic ritual that created the titan also gave it a heart of iron. As a result, a titan takes half damage from non-magical attacks.
          Shield: The titan carries a huge shield that can be used to parry one attack (including ranged attacks) per round without spending the giant’s own attacks. Roll against skill level 15. The shield has durability 24.
          Heavy Footsteps: When a titan moves, the ground around it shakes in a 10-meter radius. Anyone within that area must make a WIL roll (not an action) to not get Scared. Only one roll per combat is required.
    attacks:
      - roll: "1"
        name: Hammer Blow!
        text: Hammer Blow! The creature aims three hard blows at an opponent, each inflicting D10 bludgeoning damage. The victim is knocked down.
      - roll: "2"
        name: Battering Ram!
        text: Battering Ram! The titan holds its shield in front of it and plows through all opponents in its path, up to its Movement score. Anyone in its way suffers 2D10 bludgeoning damage, is knocked down, and becomes Dazed.
      - roll: "3"
        name: Out of the Way!
        text: Out of the Way! With a strong hand, the titan pushes an opponent away. The victim is thrown 2D6 meters, suffers an equal amount of bludgeoning damage, and lands prone.
      - roll: "4"
        name: Ferocious Shake!
        text: Ferocious Shake! The titan extends a long arm towards an opponent, grabbing them by the neck before lifting the victim into the air and shaking them ferociously. The unfortunate victim suffers 3D6 damage (armor has no effect) and loses its turn in the round (if it has not already passed).
      - roll: "5"
        name: Deafening Roar!
        text: Deafening Roar! The creature focuses its aggression and lets out a roar that shakes the ground and its opponents. Everyone within 10 meters suffers a fear attack with a bane on the WIL roll.
      - roll: "6"
        name: Earthquake!
        text: Earthquake! The titan takes a huge leap and lands on its armored feet, causing a minor earthquake. Everyone within 10 meters suffers D6 damage (armor has no effect) and must make an AGL roll to remain standing. The titan is not affected.
  - id: bestiary-basilisk
    name: Basilisk
    source: bestiary
    category: Beasts
    description: The basilisk is a feared, semi-intelligent predator with an unpleasant tendency to appear near villages and other settlements, sometimes even in city catacombs. It is a terrifying abomination with a reptilian body, a rooster’s head, and huge murderous claws. On top of that, it is endowed with poisonous breath and a gaze that can turn its victims to stone. Humans are its main prey, but a hungry basilisk may also feed on dwarves and halflings. It is a formidable opponent in combat – and the bane of many an ambitious knight.
    quote: |
      “The only things that stay normal when a basilisk petrifies someone are gold and gems. No really, you can break them out of the stone – all you need is a hammer and chisel and loooots of paaaatience!”
      – Vania Bell, joker
    random_encounter: Rounding a bend in the path, the player characters walk straight into an unpleasant scene. Three stone statues are standing with their weapons raised to protect another statue crouching on the ground. There is moss growing on them; whatever happened here obviously took place decades ago. But perhaps the basilisk that petrified these people is still in the area?
    adventure_seed: |
      Princess Qildara is afflicted by a curse that is slowly turning her into stone. Her trusted friend, the mage Wyrrahn, has a plan and asks the player characters to head out into the wilderness as soon as possible to find and kill a basilisk. They must then return with the beast’s eyes, which
      Wyrrahn intends to use to brew a magic potion that can reverse the effects of the curse. But someone wants to stop the player characters from completing this task – a group of cave trolls do everything in their power to sabotage the mission, before eventually attacking the player characters. If the characters capture any of them, they can PERSUADE the trolls to reveal the name of their employer: the princess’s younger brother, Qiamtor. The brother keeps a basilisk trapped in a ruined wing of their shared castle and is using the beast’s powers as part of the curse he has placed on his sister.
    attack_dice: D6
    image: images/bestiary/basilisk-73.jpg
    image_page: 75
    statblocks:
      - fields:
          Ferocity: "2"
          Size: Large
          Movement: "16"
          Armor: "6"
          HP: "38"
          Afraid of Chickens: Basilisks are terrified of chickens. Their Ferocity decreases by one if such a bird can be seen within 10 meters, and they will not attack a person carrying a hen or rooster if there are other targets available A player character can recall this weakness with a successful BEAST LORE roll.
    attacks:
      - roll: "1"
        name: Slash Attack!
        text: Slash Attack! The basilisk slashes its terrible claws at two player characters within 4 meters of each other. Each attack inflicts 2D8 slashing damage.
      - roll: "2"
        name: Peck!
        text: Peck! The beast thrusts its vile bird’s head forward and pecks at a player character with its razor-sharp beak. The attack inflicts 3D8 piercing damage.
      - roll: "3"
        name: Cock-a-Doodle-Doo!
        text: Cock-a-Doodle-Doo! The basilisk lets out a cacophonous crow that pierces the player characters and makes their ears bleed. Everyone within 10 meters must make a CON roll (not an action). On failure the victim falls to the ground, becomes Dazed, and loses their turn in the round (if it has not already passed).
      - roll: "4"
        name: Whip Attack!
        text: Whip Attack! The basilisk uses its snake-like tail as a whip in a sweeping attack against all adventurers within 4 meters. Each attack inflicts D10 bludgeoning damage, and anyone hit is knocked down.
      - roll: "5"
        name: Poison Cloud!
        text: Poison Cloud! The basilisk spews a greenish-yel-low cloud that reeks of poison and corrosive stomach acids. Everyone within 10 meters is affected by a lethal poison with potency 15.
      - roll: "6"
        name: Petrifying Gaze!
        text: Petrifying Gaze! A glow lights up in the basilisk’s eyes as it turns its vicious bird’s head towards the player character who currently has the highest HP. If the victim can see (i.e., is not blind or blind-folded), they must make a WIL roll (not an action). On failure, their body turns to stone and the victim can no longer move or perform any actions whatsoever, but also cannot take damage. A petrified victim dies after 2D6 rounds, but the petrifaction can be reversed with a successful WIL roll. While still alive, the victim may roll once per turn. The DISPEL spell (power level 1) can also undo the petrifaction, but only if the victim is still alive.
  - id: bestiary-brook-horse
    name: Brook Horse
    source: bestiary
    category: Beasts
    description: Among rivers and rapids lurks the devious brook horse. To us it may seem like any other horse, large and gray. But unlike our regular steeds, the brook horse is a ruthless predator that feeds on humans, elves, halflings, and anything else that comes its way. The monster can breathe both on land and underwater and makes its nest in flooded caves and caverns, a nest that is quickly filled with the bones of its victims. Its teeth are sharp and pointed and a faint stench of rotten seaweed surrounds its body.
    quote: |
      “Oh yes, brook horses can absolutely be tamed. I’m told they’re extremely fond of flowers and poetry. And as mounts they are unmatched in both strength and speed.”
      – Eremund Tote, horse dealer
    random_encounter: A riderless gray horse is standing in the middle of a raging river. Wide-eyed, it whinnies pleadingly to the player characters as if asking to be saved from drowning. It is of course a brook horse that wants to lure the adventurers into the water to make a meal out of them. One of the monster’s latest victims can be seen in the rapids.
    adventure_seed: Several log drivers have gone missing, and the village elder of Timbercreek asks the player characters to find them, identify the reason for the disappearances, and put an end to whatever is causing them. There are two main suspects – a nearby wolfkin tribe that has been acting aggressively lately and is believed to be infected with demonic madness, and a group of elves that have been sighted several times in recent months and are said to be fanged. But neither the wolves nor the elves are the true culprits, which the player characters will hopefully figure out without much bloodshed. It is actually a brook horse that has built a nest in the rapids and slowly but surely lured the log drivers into a cold, wet death.
    attack_dice: D6
    image: images/bestiary/brook-horse-74.jpg
    image_page: 77
    statblocks:
      - fields:
          Ferocity: "2"
          Size: Large
          Movement: "24"
          Armor: —
          HP: "34"
          Deceptive: The brook horse can appear as an ordinary horse and is able to keep its instincts under control when hunting. It lures its victims into the water and tricks them into mounting it. If they do, the brook horse immediately gallops towards the deepest part of the water to throw the victim off and attack them by any means at its disposal. Seeing through a brook horse’s facade requires a successful BEAST LORE roll.
    attacks:
      - roll: "1"
        name: Horse Kick!
        text: Horse Kick! The brook horse kicks back at an opponent. The victim is thrown 2D8 meters, lands prone, and takes an equal amount of bludgeoning damage.
      - roll: "2"
        name: Ravenous Bite!
        text: Ravenous Bite! The creature bites an opponent with its sharp teeth. The victim suffers 2D10 slashing damage.
      - roll: "3"
        name: Crushing Hooves!
        text: Crushing Hooves! The brook horse rears up and strikes with its hooves at two opponents within 4 meters of each other. Each victim suffers 2D6 bludgeoning damage and must make a WIL roll to resist fear.
      - roll: "4"
        name: Hateful Gaze!
        text: Hateful Gaze! The brook horse fixes its gaze on a player character within 10 meters and focuses all its hatred on them. The victim must make a WIL roll with a bane to resist fear.
      - roll: "5"
        name: Drowning!
        text: Drowning! The beast pulls an opponent into the deep and the victim immediately begins to drown as per page 53 in the Rulebook. The victim cannot move or perform actions that require movement, except trying to break free, which requires a STR roll with a bane. Others can help.
      - roll: "6"
        name: Wild Ride!
        text: Wild Ride! The brook horse lures an opponent to climb onto its back. Resisting requires a WIL roll with a bane. On failure, the beast rides off with the victim at breakneck speed (up to twice its movement, i.e. 48 meters), leaving the victim Exhausted (an already Exhausted victim must choose another condition) and inflicting D6 damage (armor has no effect). This is repeated each round on the brook horse’s turn, instead of rolling another monster attack, until the victim reaches zero HP or manages to jump off. On their turn, the victim can roll WIL again to throw themselves off the horse – on success, they take 2D6 bludgeoning damage from the fall (armor has no effect).
  - id: bestiary-calydon
    name: Calydon
    source: bestiary
    category: Beasts
    description: With fur as white as snow and a soul as black as the night, the calydon is one of our world’s most fearsome beasts. It is the size of a bull and has huge tusks, sharp as spears. As if that was not enough, it can breathe fire from its snout – giving rise to the theory that they originated from magical experiments that escaped from captivity and established themselves in the forest. The calydon is unpredictable, extremely violent, and is not afraid to attack creatures much larger than itself or charge at large groups of opponents to create chaos and confusion. This mindless ferocity means that they can be lured into traps by skilled trappers, who then sell them to the highest bidder to be tamed and trained into raging war beasts.
    quote: |
      “My dear husband wanted a calydon fur coat as a wedding gift, and he got it. If only he knew how many of our subjects paid for it with their lives…”
      – Violet Isengrip, princess
    random_encounter: The sound of a desperate struggle reaches the player characters’ ears. If they investigate, they find a nearby hollow where a calydon has been cornered by a small troop of warriors. The warriors clearly intend to capture the beast with nets and ropes but seem to have misjudged the strength of the monstrous swine – only a few are still on their feet. In other words, they desperately need help to accomplish their mission and can only hope that the player characters do not aid the beast instead…
    adventure_seed: A battle between two warlords has resulted in the total annihilation of both sides, except for three angry calydons who now live in the ruins of the castle where the battle took place. From there they attack anyone passing through the area, crippling both agriculture and trade. Someone must find the place where the calydons are hiding and deal with the problem once and for all. Since only one calydon has been seen during each attack, it will probably come as a surprise to the player characters that there are in fact three monsters inside the castle.
    attack_dice: D6
    image: images/bestiary/calydon-75.jpg
    image_page: 79
    statblocks:
      - fields:
          Ferocity: "2"
          Size: Large
          Movement: "14"
          Armor: —
          HP: "52"
          Resistance: Calydons take half damage from fire attacks.
    attacks:
      - roll: "1"
        name: Charge!
        text: Charge! The monster charges an opponent and tackles them hard. The victim is thrown 2D6 meters backwards, takes an equal amount of bludgeoning damage, and is knocked down.
      - roll: "2"
        name: Skewering Tusks!
        text: Skewering Tusks! The calydon thrusts its tusks at an opponent, inflicting D12 piercing damage.
      - roll: "3"
        name: Crushing Hooves!
        text: Crushing Hooves! The monster rears up and kicks an opponent with its hooves. The victim suffers 2D8 bludgeoning damage and is knocked down.
      - roll: "4"
        name: Hurling Attack!
        text: Hurling Attack! The calydon catches an opponent with its tusks and hurls the victim 2D4 meters. The victim suffers an equal amount of bludgeoning damage (armor has no effect) and becomes Dazed.
      - roll: "5"
        name: Hateful Grunt!
        text: Hateful Grunt! The monster lets out a grunt filled with hatred and malice. Everyone within 10 meters must make a WIL roll to resist fear.
      - roll: "6"
        name: Breath of Fire!
        text: Breath of Fire! The calydon takes a deep breath and blasts its enemies with fire. The fire forms a cone 6 meters long whose width at any given point is equal to the distance from the beast’s snout. Anyone hit by the flames suffer 2D10 damage. Armor has no effect.
  - id: bestiary-chimera
    name: Chimera
    source: bestiary
    category: Beasts
    description: "A chimera is most likely created by magically merging at least three common animals: it has the front body of a lion, the head and hind quarters of a goat, and a poisonous snake for a tail. My traveling companion Virdal assures me that he has seen scrolls describing experimental rituals that, if they really worked, could concoct such a creature – the answer to some archmage’s nightmare or morbid wish. Regardless, the chimera is a ferocious predator that can easily tear even large prey to pieces. With three creatures to feed, the monster is virtually insatiable and constantly searching for food. It can wreak havoc on livestock, and it is not uncommon for one or two shepherds to be killed as well."
    quote: |
      “The mage who created the chimeras was an idiot. First of all, a goat!? Secondly, why not start over from scratch, with a dragon, a giant, and a full-grown sea serpent!”
      – Ludifor Mieda, mage’s apprentice
    random_encounter: The player characters come across the bodies of two large minotaurs that have fallen in battle. They have obviously suffered terrible bites, slashes, and blunt force trauma, and a HEALING roll reveals that the minotaurs have also been poisoned. They were of course killed by a chimera; when the player characters came clumping along, it left its prey to hide in some bushes. When an opportune moment presents itself, the chimera attacks!
    adventure_seed: A local goat farmer needs help. A monster is taking her goats one by one, leaving only bloody tufts of fur. The player characters must track the culprit to its lair, where it turns out that two chimeras are taking the goats to feed their defenseless young. How should the player characters deal with this situation? If they kill the adults and get their hands on the little ones, they can surely make a tidy profit by selling them to some mage, warlord, or noble.
    attack_dice: D6
    image: images/bestiary/chimera-76.jpg
    image_page: 81
    statblocks:
      - fields:
          Ferocity: "3"
          Size: Large
          Movement: "14"
          Armor: —
          HP: "42"
          Three Pairs of Eyes: A chimera has three pairs of eyes and is very difficult to surprise. Any attempt to use SNEAKING against the monster is rolled with a bane.
    attacks:
      - roll: "1"
        name: Claw Attack!
        text: Claw Attack! The monster lunges at an opponent, tearing at them with its sharp claws. The attack inflicts 2D8 slashing damage and knocks the victim down.
      - roll: "2"
        name: Lion Jaws!
        text: Lion Jaws! The lion’s head opens its great jaws and bites an opponent with its big, sharp fangs. The attack inflicts 2D10 slashing damage.
      - roll: "3"
        name: Goat Head!
        text: Goat Head! The chimera jumps up to an opponent and butts the victim with its goat head. The attack deals 2D6 bludgeoning damage and leaves the victim Dazed.
      - roll: "4"
        name: Snakebite!
        text: Snakebite! The snake tail lashes out at an opponent within 4 meters and delivers a venomous bite, inflicting D8 piercing damage. If the victim takes damage, they are also injected with a lethal poison with potency 15.
      - roll: "5"
        name: All at Once!
        text: All at Once! The chimera pounces on an opponent and directs all its attacks at the unfortunate victim. The attack deals 2D10 slashing damage, 2D6 bludgeoning damage, and D8 piercing damage. Armor protects against each of these. If the piercing damage penetrates the armor, the victim is injected with a lethal poison with potency 15.
      - roll: "6"
        name: Cacophony!
        text: Cacophony! The chimera roars, bleats, and hisses in a deafening cacophony. Everyone within 10 meters must make a WIL roll to resist fear.
  - id: bestiary-giant-amoeba
    name: Giant Amoeba
    source: bestiary
    category: Beasts
    description: "Here I must make a value judgment: the giant amoeba is one of the most revolting creatures an adventurer can possibly encounter. It was created or conjured by demon cultists in the oldest times; it is not clear why, but I am convinced it was an accident. The monster in question is a huge lump of slime whose life revolves around finding and consuming organic matter. The amoeba uses its jelly-like form to hide in pits and holes or crawl through narrow cracks to surprise its victims and pull them into its body, where their flesh slowly dissolves. You are not likely to encounter the creature anywhere but in swamps or deep caves, but they have been sighted elsewhere: in ruin complexes, dark forest lakes, and even in city sewers"
    quote: |
      “Amoebas are perfectly edible, as long as you neutralize the corrosive properties of the ‘flesh’. Stuff them with meat, root vegetables, or fruit and you have a delicious, slightly acidic aspic.”
      – Jans Luguber, master chef
    random_encounter: "The player characters see something very strange on the road ahead: a hole in the ground, filled with murky water, with the rear end of a horse sticking out. It is not moving and there are flies buzzing around its legs. The horse and its rider have been devoured by a giant amoeba that has strayed from its habitat and found a deep pit where it now feeds on unwary travelers and their mounts."
    adventure_seed: At Castle Rosencrest, the princess and her husband tremble with fear. Their servants are disappearing without a trace, one by one, and at an accelerating pace. Soon no one wants to work at the “haunted castle” and the Rosencrests fear that they themselves will vanish before long. The player characters are hired to search the building and find out what is causing these disappearances, and if possible, bring them to an end. The answer to the mystery is that two giant amoebas have entered the castle’s dark cellar, from which they hunt its residents at night. But the castle is also haunted by the monsters’ victims – the ghosts of servants and courtiers who appear threatening but simply want to show the player characters the way to their murderers’ lair.
    attack_dice: D6
    image: images/bestiary/giant-amoeba-77.jpg
    image_page: 83
    statblocks:
      - fields:
          Ferocity: "2"
          Size: Large
          Movement: "8"
          Armor: —
          HP: "64"
          Corrosive: The monster’s entire body is slightly corrosive. Anyone who touches the giant amoeba or takes damage from its attacks is exposed to a paralyzing poison with potency 9.
          Resistance: The giant amoeba takes half damage from non-magical weapons and attacks.
          Immunity: Amoebas are completely immune to piercing damage, magical or non-magical.
          Vulnerable to Fire: The giant amoeba takes double damage from fire.
    attacks:
      - roll: "1"
        name: Tentacle Attack!
        text: Tentacle Attack! The monster forms tentacles that strike at all enemies within 2 meters. The victims suffer D10 bludgeoning damage and risk being exposed to the giant amoeba’s corrosive poison (see above).
      - roll: "2"
        name: Faces of the Dead!
        text: Faces of the Dead! Twisted faces appear on the surface of the shapeless body mass – floating by, dissolving, or morphing into something else, in a mocking imitation of intelligent life. All opponents within 10 meters must make a WIL roll to resist fear.
      - roll: "3"
        name: Theft!
        text: Theft! The slimy creature launches a long tentacle at an enemy within 6 meters, snatching a weapon from the victim’s hand. The weapon is absorbed by the giant amoeba’s body and can only be recovered by killing the beast.
      - roll: "4"
        name: Slime Ball!
        text: Slime Ball! From the depths of its gelatinous being, the giant amoeba spits a disgusting ball of slime at an opponent within 10 meters. The victim suffers D8 bludgeoning damage and risks being exposed to the monster’s corrosive poison.
      - roll: "5"
        name: Poison Cloud!
        text: Poison Cloud! The giant amoeba gathers its strength and emits a stinking cloud of poison that affects everyone within 10 meters. The victims become Dazed and are exposed to a paralyzing poison with potency 12.
      - roll: "6"
        name: Absorption!
        text: Absorption! The monster sends out tentacles towards an opponent, enveloping their body and pulling them into its slimy interior. Once inside the giant amoeba, the victim is immediately exposed to its corrosive poison (see above) and suffers D6 damage (armor has no effect). The victim takes an additional D6 damage per turn but can continue to attack the amoeba from within.
  - id: bestiary-giant-octopus
    name: Giant Octopus
    source: bestiary
    category: Beasts
    description: "Giant octopi are typically found in large bodies of water such as oceans and great lakes, and I am personally skeptical of reports that they can also be encountered in rivers and swamps. The fact that they live in both salt and fresh water suggests they are bred or magically created, possibly to guard moats or the waters around islands and peninsulas. The giant octopus’s many abilities certainly make it well suited for that purpose. It has large eyes and excellent vision and can sense the presence of other creatures through vibrations in the water if they so much as go near the water’s edge. Furthermore, it is able to squeeze through narrow cracks to reach escaping prey or escape its own hunters. Finally, their remarkable wintering ability should be mentioned: in extreme cold, they can freeze solid and thaw out when the temperature rises again."
    quote: |
      “Listen, I once saw a group of wreckers trying to escape a giant octopus. But the beast kept chasing them, on land. It was fast too!”
      – Rosamunda of Hylt, wine drinker
    random_encounter: |
      A lone rowing boat is floating on the water as the player characters pass by. If they take a closer look, they see bubbles on the surface around it – bubbles that are slowly dissipating. Someone has fallen overboard and needs help!
      But it is not as simple as it seems, because the fisherman who fell into the water has been attacked by a giant octopus that refuses to let go of its prey.
    adventure_seed: A giant octopus is terrorizing a small fishing village that asks the player characters for help. What the quest givers do not tell them is that the villagers are actually looking for a sunken treasure in the waters near the village, and that the giant octopus is bound to defend the wreckage, along with a group of undead warriors guarding the treasure itself. Should the player characters defeat the octopus and the guards, they are welcomed back ashore by a group of armed villagers – the quest givers have turned into antagonists who are hoping that the player characters, weakened by the ordeal, will surrender without protest or bloodshed…
    attack_dice: D6
    image: images/bestiary/giant-octopus-78.jpg
    image_page: 85
    statblocks:
      - fields:
          Ferocity: "4"
          Size: Large
          Movement: "16"
          Armor: "3"
          HP: "32"
          Three Hearts: A giant octopus has three hearts, which makes it very hard to kill. Dragon rolls have no effect against this monster.
          Elastic: The monster can stretch its body and pass through openings as narrow as 10 centimeters.
          Resistance: Takes half damage from bludgeoning attacks.
    attacks:
      - roll: "1"
        name: Disarm!
        text: Disarm! The octopus launches a long tentacle at an enemy within 6 meters and snatches a weapon from their hand.
      - roll: "2"
        name: Crushing Embrace!
        text: Crushing Embrace! The beast wraps a tentacle around an opponent within 6 meters and tries to squeeze the life out of them. The attack inflicts D10 bludgeoning damage and an additional D10 whenever it is the victim’s turn. The victim cannot move or perform actions that require movement, except trying to break free, which requires a STR roll with a bane. Others can help.
      - roll: "3"
        name: Tentacle Slam!
        text: Tentacle Slam! The giant octopus slams a tentacle hard against an opponent within 6 meters, inflicting 2D6 damage and knocking the victim down.
      - roll: "4"
        name: Drowning!
        text: Drowning! The creature wraps a tentacle around the leg of an enemy within 6 meters and pulls them into the deep. The victim immediately begins to drown as per page 53 in the Rulebook and cannot move or perform actions that require movement. Attempts to break free require a STR roll with a bane. Others can help.
      - roll: "5"
        name: Devour!
        text: Devour! The giant octopus grabs an opponent within 6 meters and swallows them whole. The attack inflicts 2D6 slashing damage. The victim can keep attacking the beast from within, where it has no armor rating. But for each round spent in the beast’s belly, the victim suffers D6 damage on their turn (armor has no effect). The victim gets out once the monster is dead.
      - roll: "6"
        name: Black Fog!
        text: Black Fog! The giant octopus discharges a cloud of black ink that darkens the water around it. All adventurers within 10 meters act as if in total darkness for D6 rounds.
  - id: bestiary-giant-spider
    name: Giant Spider
    source: bestiary
    category: Beasts
    description: There are few predators in the wilderness that can match the giant spiders – as fast as hawks, as strong as oxen, as cunning as foxes. Add to that the ability to spin trapping webs and you have a near-perfect hunter. Their speed allows them to work together to cut off their prey’s escape route by spinning thinner webs and thus direct the intended meal to one of several sturdier webs spun in advance. They can also catch prey by simply dropping down on them from hiding places in the treetops or on ledges high up steep mountainsides. If they have a weakness, it is their eyes’ sensitivity to bright light. Those unfortunate enough to be chased by a giant spider may be able to escape by blinding the monster, but a torch is not enough – the light must be as bright as direct sunlight.
    quote: |
      “How typical of humans to belittle such a glorious life form by calling it a ‘giant spider.’ I prefer the ancient Elvish term Ailel Arnath: it means something like ‘God of the Woodland Darkness’.”
      – Elendiel, wanderer
    random_encounter: The hunter Deloriel is caught in a giant spider’s web. She has been languishing in the web for several days when she hears the player characters approaching. She is weak but desperately gathers the last of her strength to call for help. Will the player characters hear her cries? Will the giant spider return to silence its supper?
    adventure_seed: |
      Krikelbik is an ancient giant spider who, by only hunting animals and other beasts, has managed to avoid being hunted by intelligent creatures. But suddenly her peaceful life is turned upside down: a group of lumberjacks have found hardwood trees near her dwelling and decided that the monster must die. With fire and axe, the humans have driven Krikelbik and her spiderkin servants from the area; now they are on the run through the forest, pursued by murderous lumberjacks. That is the situation when the already wounded
      Krikelbik and her family encounter the player characters. The spider cautiously approaches her potential rescuers’ camp and initiates a telepathic conversation in the form of images – describing the threat and the escape, trying to illustrate a plea for help and a promise of great rewards in the form of treasures she has accumulated over the centuries. If the player characters decide to help, dealing with the pursuers is not enough; they must also find a way to discourage the lumberjack chief from looking for hardwood in Krikelbik’s part of the forest.
    attack_dice: D6
    image: images/bestiary/giant-spider-79.jpg
    image_page: 87
    statblocks:
      - fields:
          Ferocity: "2"
          Size: Normal
          Movement: "24"
          Armor: —
          HP: "36"
          Spider Web: The giant spider’s most feared weapon is its strong web. It can spin threads as thick as a thumb, which can only be destroyed with slashing weapons, fire, or magic. Each thread has durability 8, so anyone wishing to break it must inflict at least 9 damage in a single attack. 2D4 threads must be cut for a human-sized creature to get through.
    attacks:
      - roll: "1"
        name: Mandibles!
        text: Mandibles! The spider’s serrated mandibles swish through the air like scimitars. The attack inflicts 2D8 slashing damage on an opponent.
      - roll: "2"
        name: Tearing Attack!
        text: Tearing Attack! The famished spider lunges at its victims, frantically attacking with its multitude of hairy, barbed legs. All opponents within 2 meters suffer D8 piercing damage.
      - roll: "3"
        name: Mesmerizing Eyes!
        text: Mesmerizing Eyes! The monstrous arachnid stares at its victims with a terrifying multitude of eyes. Everyone within 10 meters must make a WIL roll to resist fear.
      - roll: "4"
        name: Poison Sting!
        text: Poison Sting! The eight-legged horror raises its rear end and attacks a victim with a poisonous stinger that shoots out of its repulsive body. The attack inflicts D10 piercing damage, and a victim who sustains at least 1 point of damage is also injected with a paralyzing poison with potency 16. The attack can be parried.
      - roll: "5"
        name: Web Attack!
        text: Web Attack! The spider fixes its numerous eyes on the opponent with the highest STR. The next moment it spits sticky spider web at the victim, who must make an EVADE roll (not an action). On failure, the victim is caught in the web and unable to move or perform actions that require movement. It takes a successful STR roll with a bane (action) to break free. Other can help.
      - roll: "6"
        name: Ramming Attack!
        text: Ramming Attack! With a great leap, the giant spider launches its massive body at an opponent. The attack inflicts 2D6 bludgeoning damage and knocks the victim down.
  - id: bestiary-griffon
    name: Griffon
    source: bestiary
    category: Beasts
    description: Watching griffons soar on updrafts between snow-capped peaks, watching them swoop down on hapless adventurers and their mounts from a clear blue sky, is truly a wonderful and terrifying experience. But grandest of them all are the elven war griffons. Captured as cubs, they are raised over a long period of time by a single warrior who becomes the only person capable of commanding the griffin once it is old enough to be used as a mount. Together the griffin and its warrior guard the elven realms, patrolling high above our heads in search of monsters and beasts. Evidence suggests that not even dragons will pass through airspace patrolled by griffon riders.
    quote: |
      “Oh, griffon, my griffon, how lovely you are. So unattainable, so handsome, so perfect. I am filled with gratitude that it was you who took my eye and my arms, and not some mangy calydon.”
      – Amfrida Hart, grateful griffon victim
    random_encounter: A griffon dives towards the player characters with a loud cry, hoping to separate them from their mounts and pack animals. It hovers just above their heads to distract them while a second griffon lands silently behind them and attacks. This is the signal for the diving beast to land and join the fray as well. The griffons are hoping for an easy hunt and will retreat if either of them takes more than 10 points of damage. If the player characters flee and leave one or more horses behind, the griffons will not pursue them.
    adventure_seed: The noble knight Griffonshield has lost his most beloved friend, the griffon Stormheart. It has been his companion since he was a young squire but has now gone missing. The knight is convinced that someone has taken the griffon and hires the player characters to find it. Suspicion falls on Haarpu’s troupe of jesters who passed the knight’s castle just a few days before Stormheart disappeared. But has the griffon really been stolen, or is it just tired of being the mount of an increasingly corpulent knight? Perhaps it has found new friends among Haarpu’s jesters and would rather stay with them than be chained in Griffonshield’s stable? Whatever Stormheart wants, Griffonshield will only reward the adventurers if they bring the griffon back to his castle.
    attack_dice: D6
    image: images/bestiary/griffon-80.jpg
    image_page: 89
    statblocks:
      - fields:
          Ferocity: "2"
          Size: Large
          Movement: "30"
          Armor: —
          HP: "38"
          Wings: The powerful wings of the griffon allow it to move freely through the air.
    attacks:
      - roll: "1"
        name: Snapping Beak!
        text: Snapping Beak! The beast tears at a player character with its razor-sharp beak, inflicting 2D8 piercing damage.
      - roll: "2"
        name: Rearing Strike!
        text: Rearing Strike! The griffon rears up before a player character and tries to tear them apart with D6 rapid strikes. Each attack inflicts D8 slashing damage. The attacks can be dodged or parried, but only one at a time.
      - roll: "3"
        name: Sweeping Claws!
        text: Sweeping Claws! The griffon sweeps its clawed foreleg in a wide arc, attacking all player characters within 2 meters. Each victim suffers D8 slashing damage and is knocked down.
      - roll: "4"
        name: Griffon Throw!
        text: Griffon Throw! The beast grabs a player character with its beak and tosses them with a flick of its head. The attack inflicts 2D6 piercing damage. The victim is thrown an equal number of meters and lands prone.
      - roll: "5"
        name: Whirlwind!
        text: Whirlwind! The griffon uses its powerful wings to create a whirlwind that blows away all player characters within 6 meters. The victims land prone D6 meters away and suffer the same amount of bludgeoning damage.
      - roll: "6"
        name: High Drop!
        text: High Drop! The griffon grabs a player character in its claws and takes to the sky. Unless the victim dodges the attack, the griffon grabs them and flies 2D6+6 meters into the air. On its next turn the griffon drops the victim (instead of making a new monster attack), who takes damage from the fall.
  - id: bestiary-hippogriff
    name: Hippogriff
    source: bestiary
    category: Beasts
    description: With the front half of an enormous bird of prey and the back half of a horse, one might think that the hippogriff would look rather ridiculous, but nothing could be further from the truth. Exuding authority and pride, they are formidable opponents both on the ground and in the air – in fact, they are rightly feared on battlefields all over the world. They usually live high above cloud-covered mountaintops, wild and free and exceedingly difficult to tame. But legends tell of both dragon knights and elves battling demons and other horrors from the backs of gold-feathered hippogriffs. Not all of them have gold-colored plumage, however; only the oldest bloodlines have golden feathers and white fur, while younger bloodlines tend to be mottled gray.
    quote: |
      “Hippogriff sacrifices are central to many rituals aimed at opening portals to the world beyond – they must be split while still alive, just where bird meets horse, for the rift to open.”
      – Anonymous, would be sorcerer
    random_encounter: A herd of panicked deer suddenly rushes out in front of the player characters; chaos ensues as they become even more terrified and confused by the unexpected encounter. Then the hippogriff strikes. All it wants is a deer or two to feast on, but it will defend itself and any prey it has brought down if the player characters attack.
    adventure_seed: In a mountain pass, the player characters come across the mangled carcass of a hippogriff, dead for several days. From somewhere above they hear an agitated squeak mixed with faint cries of fear or maybe hunger. It is the dead creature’s foal, stuck in a hard-to-reach nest. A group of harpies has spotted the little one. They have not yet dared to approach but will attack anyone who tries to climb towards their intended prey. Perhaps the player characters can instead find a way through the cracks and caves of the mountain, at the risk of being discovered by the ferocious goblins who dwell there. And if they manage to rescue the young hippogriff, what will they do with it?
    attack_dice: D6
    image: images/bestiary/hippogriff-81.jpg
    image_page: 91
    statblocks:
      - fields:
          Ferocity: "2"
          Size: Large
          Movement: "24"
          Armor: —
          HP: "36"
          Craves Freedom: Wild hippogriffs in captivity will always try to escape. A hippogriff can be tamed if it is captured at a young age and imprints on its future rider for a year. The tamer must succeed with rolls against BEAST LORE, RIDING, and PERSUASION, all with a bane. All three rolls must be made in succession – a new attempt can only be made one year later.
          Dive: A hippogriff prefers to initiate combat by swooping down on its opponents while screaming as loud as it can with its shrill bird call. All opponents within 20 meters of the hippogriff when it attacks in the first round of combat must roll WIL to resist fear.
          Wings: The hippogriff’s wings allow it to move freely through the air.
    attacks:
