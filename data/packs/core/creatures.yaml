  - id: bestiary-chaos-demon
    name: Chaos Demon
    source: bestiary
    category: Demons
    description: Endowed with wings and armed with black, life-leeching runic swords, chaos demons are the epitome of demonic invaders. These creatures formed the backbone of the ancient demon armies, and they are a scourge whenever they intrude into our world. They live to create chaos, to upset any kind of order, to tear down any kind of structure. Paradoxically, we may well have the chaos demons to thank for the favorable outcome of the wars. If they had been capable of submitting to the will of demon princes and fire demons, if they had not resisted any attempt at coordinated strategy, the dragons and their knights would likely never have stood a chance against the enemy’s onslaught.
    quote: |
      “Can chaos demons possess ordinary people? I could swear Leric, our youngest, is being controlled by demonic forces. You… you wouldn’t know anyone who could help us banish the damn thing?”
      – Solia Morel, porcelain merchant
    random_encounter: The player characters find an old battlefield where the ground is black and the vegetation withered. The only thing that moves is a winged monster brandishing a black longsword in triumph over its fallen foes – a group of elves, dwarves, and wolfkin who died trying to neutralize the demonic threat. Realizing that it is not alone, the chaos demon turns its attention to the adventurers. More lives to destroy!
    adventure_seed: In the city of Sankhara, gladiators fight for their lives in front of cheering crowds. One of the greatest fighters is a mysterious winged creature dressed in full armor and armed with a black runic sword. It is a chaos demon summoned and bound by the mage Armarand; the demon wants nothing more than to win its freedom, but its master’s shackles are too strong. However, there are others who would like to gain control of the chaos demon – Aknator, owner of the city’s largest stable of gladiators, offers the player characters a princely sum if they can steal the demon from the mage. Adventurers who discover the truth behind the demonic gladiator’s great helm can also try to PURGE the creature but can then expect that both Armarand and Aknator will try to stop them.
    attack_dice: D6
    image: images/bestiary/chaos-demon-104.jpg
    image_page: 143
    statblocks:
      - fields:
          Ferocity: "2"
          Size: Normal
          Movement: "12"
          Armor: "2"
          HP: "36"
          Corrosive Blood: If a chaos demon takes piercing or slashing damage, everyone within 2 meters takes D3 damage. If the victim is wearing armor, its armor rating is permanently reduced instead. It is possible to dodge the blood spatter.
          Unnatural Aura: The demon emits an aura that causes all vegetation within 10 meters to wither.
          Wings: The creature’s wings allow it to travel clumsily through the air.
    attacks:
      - roll: "1"
        name: Runic Sword!
        text: Runic Sword! The chaos demon swings wildly with its black runic sword. The attack inflicts 2D8 slashing damage and drains D6 WP from the victim.
      - roll: "2"
        name: Horn Attack!
        text: Horn Attack! The monster thrusts its razor-sharp horns into an opponent. The victim takes 2D10 piercing damage and loses their turn in the round (if it has not already passed).
      - roll: "3"
        name: Threatening Hiss!
        text: Threatening Hiss! The demon opens its mouth and hisses horrible threats in an ancient, terrifying tongue. All opponents within 10 meters suffer a fear attack.
      - roll: "4"
        name: Scorpion Sting!
        text: Scorpion Sting! The chaos demon raises its scorpion-like tail and delivers a swift sting to its victim. The attack inflicts D12 piercing damage, and a victim who sustains at least 1 point of damage is also injected with a paralyzing poison with potency 15. The attack can be parried.
      - roll: "5"
        name: Unseen Force!
        text: Unseen Force! The demon points its hand at an opponent within 10 meters. The victim is pushed back 2D6 meters, takes the same amount of bludgeoning damage, and lands prone.
      - roll: "6"
        name: Acid Spit!
        text: Acid Spit! The demon spits a mouthful of acid at an opponent within 10 meters. The attack deals 2D6 damage on impact and D6 damage the next round unless the victim uses an action to wipe off the acid.
  - id: bestiary-fire-demon
    name: Fire Demon
    source: bestiary
    category: Demons
    description: If the disorganized hordes of the demonic realm can be said to have any commanders at all, it is the fire demons. Although they are hardly well-coordinated amongst themselves, their size and fiery authority cause many lesser demons to follow their example, on the battlefield as well as in other contexts. Those that are invited to our world, or somehow find their own way here, are inevitably drawn to volcanoes and other powerful heat sources, as some blacksmiths have experienced when the forge burns particularly hot. And if they cannot find a heat source intense enough, they do not mind creating one themselves. On the contrary, they seem to love spreading their flames, often resulting in calamitous forest fires, scorched fields, and burned-down villages.
    quote: |
      “I didn’t set fire to no barn! I’m innocent and that’s the truth. It was one of them fire demons that did it, I swear!”
      – Flatuldur Knolt, guilty as charged
    random_encounter: Suddenly a wall of fire comes sweeping towards the player characters. Animals of all kinds rush in front of the fire to get away, and the adventurers must make an AGL roll to avoid getting caught in the stampede and knocked down. The fire wave dies down just before it reaches the characters and reveals a huge fire demon walking in its wake. It looks around contentedly and for a moment it stops to look at the characters. Unless they act, the demon will continue its journey up the mountain, with predictable consequences for its surroundings.
    adventure_seed: The mining queen Hildebrand seeks adventurers who can help rid her mines of a monster lurking in the tunnels, whose presence has brought the entire mining operation to a halt. She claims it is a young, fire-breathing chimera – a monster that escaped from a mage’s menagerie and found its way into her domain. But this is a lie. The monster is a fire demon that the dwarves themselves have summoned and bound to service in the forges. It has now broken free and is looking for a way back to its own world, to gather allies for a large-scale revenge attack against all dwarvenkind. Once the player characters have dealt with the demon, there are more mysteries to unravel. How could the dwarves conjure such a dangerous demon? Who gave them the knowledge to perform the ritual? Where is the portal through which the demon was summoned, and how can it be closed before he returns with his allies?
    attack_dice: D6
    image: images/bestiary/fire-demon-105.jpg
    image_page: 145
    statblocks:
      - fields:
          Ferocity: "2"
          Size: Large
          Movement: "18"
          Armor: —
          HP: "64"
          Scorching Body: Anyone who touches the scorching body of a fire demon immediately takes D6 damage (armor has no effect). The extreme heat also gives all opponents a bane on melee attacks against the demon.
          Immunity: Fire demons are immune to fire damage.
          Vulnerability: Fire demons are vulnerable to water and take double damage from all water-based magic. A bucket of water thrown at a fire demon inflicts D10 damage, a tankard of ale or jug of wine deals D8 damage, and a gob of spit deals 1 point of damage. Use the BRAWLING skill to determine whether such attacks hit.
    attacks:
      - roll: "1"
        name: Sweeping Staff!
        text: Sweeping Staff! The fire demon sweeps its long, red-hot iron staff at all opponents within 2 meters, inflicting 2D6 bludgeoning damage, and a further D6 damage from the hot iron (armor has no effect). The victims are also knocked down.
      - roll: "2"
        name: Imps!
        text: Imps! The demon summons a swarm of burning imps that fly around taunting their opponents with vile insults. Everyone within 10 meters becomes Angry.
      - roll: "3"
        name: Flaming Flail!
        text: Flaming Flail! The monster swings its flail at an opponent. The attack inflicts 2D8 bludgeoning damage, and a further D8 fire damage (armor has no effect). The victim also becomes Dazed.
      - roll: "4"
        name: Fire Whirl!
        text: Fire Whirl! The creature swings its flail in a circle above its head, over and over, creating a fire whirl that affects everyone within 4 meters. The victims take 2D8 fire damage (armor has no effect) and are knocked down.
      - roll: "5"
        name: Crushing Kick!
        text: Crushing Kick! The fire demon delivers a surprise kick to an opponent. The victim is flung back 2D6 meters, takes the same amount of bludgeoning damage, and is knocked down.
      - roll: "6"
        name: Fire Breath!
        text: Fire Breath! The demon spews a stream of fire in a cone 10 meters long, whose width at any given point is equal to the distance from the demon. Anyone hit by the flames takes 2D10 fire damage. Armor has no effect.
  - id: bestiary-golem
    name: Golem
    source: bestiary
    category: Demons
    description: Demons are not the only beings that can be summoned from the chaos of the demonic realm. It is also home to numerous disembodied spirits, dancing in seas of fire and acid rain. Skilled mages with access to ancient rituals (several of which are actually described in the Codex Chaosium) can summon such demonic ghosts and bind them to matter in our own world. Thus, a golem is formed – a creature made from clay and stone according to the creator’s wishes, whose eyes burn with the fire of the tethered spirit. Once bound, the golem obeys its creator’s commands without question. They are mostly used as bodyguards, as sentries guarding a certain location, or as workers doing heavy, repetitive labor. When the creator dies, the creature continues its work until the end of time.
    quote: |
      “There’s a golem at the entrance to the Valley of Tombs; it turns its head if anyone comes near. There are probably riches to be found in the old tombs, but no one dares to go and get them.”
      – Gina Merryquist, brewer
    random_encounter: The player characters see a strange figure on a hilltop, looking out over the land. It is a golem that was placed there hundreds of years ago to watch over a magical fountain; whoever looks into the water of the fountain can speak to the creature’s creator, now dead for many years. The creature refuses to let anyone near the fountain.
    adventure_seed: The player characters are hired by a mage to retrieve a mysterious statue found in a temple ruin from the oldest times. It is a rather shapeless depiction of a human, or perhaps a giant, and must be transported by horse and cart. The statue is a golem that was rendered inactive when the archmage whose life it was assigned to guard suddenly passed away; the characters’ quest giver idolizes the dead mage and hopes to reactivate his rocky bodyguard. The only problem is that one of the quest giver’s old school mates, now their archenemy, has had the same idea. At some point during the journey, the characters are attacked by the archenemy and their hired goblins in an attempt to steal the sleeping bodyguard. In the ensuing fight, a thunderbolt hits the statue and brings it back to life. What will the groggy golem do? Will it quickly choose a new person to protect, and if so, whom – a player character or their enemy?
    attack_dice: D6
    image: images/bestiary/golem-106.jpg
    image_page: 147
    statblocks:
      - fields:
          Ferocity: "2"
          Size: Large
          Movement: "8"
          Armor: "6"
          HP: "64"
          Explosive: When a golem is reduced to zero HP, the magic that sustains it is released in the form of an explosion. Everyone within 4 meters takes 2D6 bludgeoning damage.
          Resistance: Takes half damage from piercing and slashing weapons.
          Rock Hard: Since a golem is made of stone or clay, it has no internal organs or blood. Therefore, rolling a dragon has no effect when attacking the creature.
    attacks:
      - roll: "1"
        name: Wild Flurry!
        text: Wild Flurry! The golem flails its long, powerful arms in all directions, hitting everyone within 2 meters. The attack inflicts 2D6 bludgeoning damage and knocks the victims down.
      - roll: "2"
        name: Hard Head!
        text: Hard Head! The creature grabs an opponent and slams its rock-hard head into the victim’s face. The attack deals 2D10 bludgeoning damage and leaves the victim Dazed.
      - roll: "3"
        name: Stone Throw!
        text: Stone Throw! The monster digs its fists in the ground and pulls up a rock, which it throws at an opponent within 10 meters. The victim takes 2D8 bludgeoning damage.
      - roll: "4"
        name: Thunderclap!
        text: Thunderclap! The monster smashes its enormous fists together and produces a sharp thunderclap. Everyone within 10 meters takes D6 damage (armor has no effect) and becomes Dazed.
      - roll: "5"
        name: Power Punch!
        text: Power Punch! The golem swings its massive fists at an opponent. The victim takes 3D6 bludgeoning damage and is knocked down.
      - roll: "6"
        name: Earthquake!
        text: Earthquake! The golem stomps the ground hard with one of its large feet, causing a minor earthquake. The ground shakes and everyone within 10 meters takes D10 damage (armor has no effect), is knocked to the ground, and loses their turn in the round (if it has not already passed).
  - id: bestiary-guardian-demon
    name: Guardian Demon
    source: bestiary
    category: Demons
    description: Whenever a portal opens between the demonic world and our own, the guardian demons are always there. They thrive on chaos just like any other demon, but are clearly less restless in temperament, as they usually remain in the place they have been assigned to guard. The Codex Chaosium offers no information on these creatures, but since other sources describe guardian demons as particularly vulnerable to the aggression of other (greater) demons, it may well be that they simply do not dare to leave their post. This in turn could explain why they are so brutally hard on each other and on the inhabitants of our world. I pity the halfling, mallard, or human who ends up in a prison camp guarded by guardian demons…
    quote: |
      “I managed to free him, but he was already ruined for life – tortured with fire, acid, and blades by those wretched guardians. I beheaded them all!”
      – Mora Nightblade, champion
    random_encounter: A bolt of lightning strikes a nearby hilltop, followed closely by a deep rumble of thunder. If the player characters investigate the smoke-filled site, they find a destroyed stone portal, and a successful MYTHS & LEGENDS roll reveals that it probably once led to the demonic realm. Suddenly two guardian demons emerge from the smoke, confused but determined to defend the portal, whether it is open or not. Who destroyed the portal will remain a mystery.
    adventure_seed: Panic reigns in Barrowsby and the villagers are fleeing for their lives. A portal to the barren lands of the demons has opened in the village graveyard and is now guarded by a handful of guardian demons. No one knows who opened it, and no one cares to stay around and see what happens next. If the portal is left alone, the guardian demons will establish a demonic outpost in Barrowsby and use it to transport demons to and from our world on nefarious missions. The player characters must enter the village, close the portal, and defeat the guardian demons. The best way to close the portal is to break the magic circle that powers it, which is reluctantly maintained by the mage Zerzey who is trapped there after a magical mishap. Zerzey does not have the power to close the portal on his own, but if someone takes his hand and grants him additional courage and power, he can break the spell.
    attack_dice: D6
    image: images/bestiary/guardian-demon-107.jpg
    image_page: 149
    statblocks:
      - fields:
          Ferocity: "1"
          Size: Normal
          Movement: "14"
          Armor: "2"
          HP: "28"
          Keen Sense of Smell: These guardians have a very keen sense of smell, which gives opponents a bane on SNEAKING rolls to get past them.
          Coordinated: Guardian demons are constantly trained to fight together. Because of this, guardian demons may pick any initiative card they want (before any cards are drawn) instead of drawing randomly, as long as they do not fight alone.
    attacks:
      - roll: "1"
        name: Spear Sweep!
        text: Spear Sweep! The guardian demon sweeps its long iron spear to knock an opponent’s legs out from under them. The victim is knocked down and becomes Dazed.
      - roll: "2"
        name: Shield Bash!
        text: Shield Bash! The monster bashes an opponent with its large shield. The spikes on the shield inflict 2D8 piercing damage, and the victim is knocked down.
      - roll: "3"
        name: Paralyzing Spear Thrust!
        text: Paralyzing Spear Thrust! The demon thrusts its iron spear at an opponent. The attack inflicts 2D10 piercing damage and injects the victim with a paralyzing poison with potency 12.
      - roll: "4"
        name: Impaling Horns!
        text: Impaling Horns! The demon impales an opponent with its horns. The victim takes 2D10 piercing damage.
      - roll: "5"
        name: Entangling Rope!
        text: Entangling Rope! The demon pulls a rope with small weights from its belt and throws it at an opponent within 10 meters. The rope entangles the legs of the victim, who trips and falls. The victim is unable to move or perform actions that require movement, except trying to break free, which counts as an action and requires an AGL roll with a bane. Others can help.
      - roll: "6"
        name: Teleportation!
        text: Teleportation! The guardian demon sticks its iron spear into the ground and teleports to any location within 20 meters. The sudden movement does not trigger a free attack.
  - id: bestiary-shadow-demon
    name: Shadow Demon
    source: bestiary
    category: Demons
    description: Shadow demons are another example of incorporeal demonic entities. It is a fiend that haunts our dreams and thoughts, corrupting our minds in order to bring us to our knees. It is always searching for cracks in the fabric that separates our worlds. Great sorrow, tragic fates, magical mishaps, terror and pain – all of it can open rifts large enough for shadow demons to slip through. Once here, they assault our minds, destroying and diminishing our thoughts, making us doubt ourselves, our friends, and all that is good. According to the Codex Chaosium, they literally feed on this; to them our misery and anguish are like the sweetest and most nutritious honey. No wonder they do everything in their power to cast us into the deep well of despair.
    quote: |
      “My friend Filivandel was attacked by a shadow demon after losing his beloved. He asked us to leave him alone, and it got him killed; by the time we realized what was happening, it was already too late…”
      – Torun Broadaxe, mercenary
    random_encounter: The player characters set up camp at an ancient ruin. The stones are hundreds of years old and if anyone examines them, a successful MYTHS & LEGENDS roll reveals that this must have been a stone circle used for magical rituals. During the night, the adventurers are haunted by nightmares of a monster made of darkness tearing at the fabric of the world. Tonight their sleep does not count as rest, and the characters better resume their journey without delay.
    adventure_seed: Archmage Gabril of Berg has fallen into a deep slumber and cannot be awakened, no matter how hard her friends and servants try. She tosses and turns in her sleep, whispering bloodcurdling chants about monsters and stars and indescribable gods. The player characters must help Gabril’s friends identify the cause of her condition, and as they explore the Archmage’s tower, they find evidence of a failed magical ritual. They soon realize that something has come from the demonic realm, and that this is what is haunting Gabril. The culprit is a shadow demon hiding in the darkest corners of the tower, emerging at nightfall to feed on its victim’s suffering. Only by banishing the demon can the Archmage’s life be saved.
    attack_dice: D6
    image: images/bestiary/shadow-demon-108.jpg
    image_page: 151
    statblocks:
      - fields:
          Ferocity: "2"
          Size: Large
          Movement: "12"
          Armor: —
          HP: "54"
          Immunity: The shadow demon has no solid form and is immune to non-magical damage.
          Vulnerability: In direct sunlight, the shadow demon takes D6 damage per stretch. Cloud cover is enough to negate the effect.
          Mind Reading: The monster can read the surface thoughts of creatures it touches, for example in combat.
    attacks:
      - roll: "1"
        name: Anxiety Attack!
        text: Anxiety Attack! The shadow demon extends its impossibly long arms towards an opponent within 6 meters, grabbing them firmly and staring with burning eyes into their soul. The unfortunate victim is struck by deep existential dread, becomes both Scared and Disheartened, and suffers a fear attack.
      - roll: "2"
        name: Psychic Bite!
        text: Psychic Bite! The monster opens its huge mouth and bites an opponent who loses 2D6 WP. The victim is also blinded and must act as if in total darkness. Roll D4 at the start of each shift; rolling a 1 cancels the effect.
      - roll: "3"
        name: Dark Embrace!
        text: Dark Embrace! The demon’s pitch-black form embraces an opponent and plunges them into total darkness. The chill of solitude paralyzes the victim, who suffers a fear attack and becomes cold as per the rules on page 54 in the Rulebook.
      - roll: "4"
        name: Doubt!
        text: Doubt! The shadow demon whispers derogatory remarks that are heard by all opponents within 10 meters. The victims are suddenly struck by doubt and become Disheartened. Anyone who is already Disheartened must choose another condition.
      - roll: "5"
        name: Command!
        text: Command! The demon points imperiously at an opponent within 20 meters and commands them to obey. The victim must make a WIL roll with a bane or immediately perform a movement and an action (must not require WP) determined by the demon (GM). The victim also loses its turn in the round, if it has not already passed.
      - roll: "6"
        name: Visions of Stars!
        text: Visions of Stars! The monster grows huge and covers the sky above its opponents in demonic darkness, where stars live and die in just a few seconds. Everyone within 10 meters loses D6 WP and must roll WIL with a bane to resist fear. Anyone who fails also loses their turn in the round (if it has not already passed).
  - id: adventure-scouts
    name: Scouts
    source: adventure
    kind: npc
    category: Opening Scene
    description: The chattering goblin scouts are unsightly creatures with stinking breath and ill-fitting leather armor. They all bear the black mark of Maladûk on their right shoulder. The scouts all act on the same turn in combat.
