        text: Troll Blade! The monster draws a sharp stone knife from its belt and slashes at an enemy. The knife inflicts 2D8 slashing damage and automatically hits a gap – armor has no effect.
      - roll: "3"
        name: Rotten Breath!
        text: Rotten Breath! The forest troll blows its foul breath at an opponent within 4 meters. The victim becomes Sickly and must succeed with a CON roll (now with a bane) or lose their turn in the round (if it has not already passed).
      - roll: "4"
        name: Sinkhole!
        text: Sinkhole! The troll lures a victim within 10 meters into a sinkhole that suddenly opens. The victim must succeed with an ACROBATICS roll (action) to climb back up.
      - roll: "5"
        name: Stomping Attack!
        text: Stomping Attack! The troll stomps wildly at all opponents within 2 meters. The attack inflicts 2D6 bludgeoning damage and knocks the victims down.
      - roll: "6"
        name: Bludgeoning Club!
        text: Bludgeoning Club! With its club, the forest troll aims its strongest blow at an opponent. The victim suffers 4D6 bludgeoning damage and becomes Dazed.
  - id: bestiary-mountain-troll
    name: Mountain Troll
    source: bestiary
    category: Trolls
    description: Mountain trolls seem to thrive in barren highlands and on desolate tundra. That is where they return after their far-flung wanderings in search of places where significant, often world-changing events have taken place. Once back in the frigid north, they carve their observations and newly acquired insights directly into flat rock faces or into boulders they leave behind on mountaintops or tundra plains. The mountain trolls live in solitude and are essentially peaceful creatures. Anyone who angers them, for example by desecrating historical sites, will no doubt suffer their merciless rage, but I am a living example of how these venerable giants are open to conversation and friendship with other kin. Historical anecdotes, a barrel of pipe weed, and patient listening are the way to any mountain troll’s heart.
    quote: |
      “Peaceful, my foot! Usually it’s true, but some of them lose their minds to old age, hunger, or severe pain. Then there is no safety, no mercy.”
      – Egor the Wise, troll expert
    random_encounter: The player characters encounter the mountain troll Jorma who is taking a break on her way to the battlefield where the ancient dragon Hrimhir is said to have been slain by an army of demons. Puffing on her pipe, she asks the characters to tell her about their adventures so that she may learn more about what happened in the area. The troll promises them a story in return – a tale that leads them to a hidden treasure nearby.
    adventure_seed: "A settlement is being ravaged by an angry mountain troll – it has struck a handful of buildings and reduced them to rubble, with little regard for the people who, more or less deliberately, got in its way. After examining the sites, the player characters realize that the razed buildings all have one thing in common: their foundations are made of rocks taken from an old castle ruin in the area. One way to stop the attacks is to restore the ruin to the state it was in before the settlers arrived. But of course, the troll will likely mistake the restoration project for yet another violation of the historically significant ruin…"
    attack_dice: D6
    image: images/bestiary/mountain-troll-68.jpg
    image_page: 62
    statblocks:
      - fields:
          Ferocity: "1"
          Size: Large
          Movement: "10"
          Armor: —
          HP: "42"
