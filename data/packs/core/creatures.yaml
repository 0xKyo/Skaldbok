  - id: adventure-the-lady
    name: The Lady
    source: adventure
    category: Riddermound
    description: The Lady is a translucent, faintly blue shimmering phantom of a tall warrior maiden in full-length chainmail and a gilded headband. Her face looks sad and dignified, but when she attacks it contorts into a terrifying death mask with empty eye sockets. The Lady is a ghost with stats as per page 87 in the Rulebook.
    stats_ref: The Lady is a ghost with stats as per page 87 in the Rulebook.
    image: images/adventure/the-lady-127.jpg
    image_page: 39
  - id: adventure-the-wight
    name: The Wight
    source: adventure
    category: Riddermound
    description: "The wight is a huge warrior in antiquated plate mail and a horned great helm. The open visor reveals a grim skeleton face with empty eye sockets. It moves slowly and heavily through the mound to the awful sound of scraping metal. The wight is protected by ancient draconic magic inside the mound. It takes damage as per the rules, but if defeated inside the gate in the antechamber (#3), it will rise again in room #9 within one shift (exactly when is up to you). The wight has stats as per page 98 in the Rulebook. It has armor rating 8 and wields a morningstar."
    stats_ref: The wight has stats as per page 98 in the Rulebook.
  - id: adventure-the-white-death
    name: The White Death
    source: adventure
    category: Bothild’s Lode
    description: A deathly pale, rough-scaled sea serpent with a thick, wide body and a flat head with milky eyes and three curved horns. The beast emerges silently from the water before letting out a terrible, guttural roar that reeks of centuries of death as it attacks. The White Death can be lured to the surface by lowering a suitable prey into the water. In its belly rests Bothild’s mastercrafted battle axe Bothild’s Broadaxe (STR Requirement 10, durability 12), adorned with runes that recount its owner’s exploits.
    attack_dice: D6
    statblocks:
      - fields:
          Ferocity: "2"
          Size: Large
          Movement: 18 (in water)
          Armor: "3"
          HP: "56"
    attacks:
      - roll: "1"
        name: Tail Swipe!
        text: Tail Swipe! The sea serpent swipes its tail at a player character within 10 meters. The attack inflicts 2D8 bludgeoning damage and knocks the victim down.
      - roll: "2"
        name: Devour!
        text: Devour! The beast swallows the player character with the highest STR, inflicting 2D6 damage. The player character can keep attacking the sea serpent from within, where it has no armor rating. But for each round spent in the beast’s belly, the victim suffers D6 damage on their turn (armor has no effect). The victim gets out once the monster is dead.
      - roll: "3"
        name: Ferocious Bite!
        text: Ferocious Bite! The White Death bites a player character with its razor-sharp teeth. The attack inflicts 3D8 slashing damage.
      - roll: "4"
        name: Drowning!
        text: Drowning! The sea serpent pulls a player character into the deep and the victim immediately begins to drown as per page 53 in the Rulebook. The player character cannot move or perform actions that require body movement, except trying to break free, which takes a STR roll with a bane. Others can help.
      - roll: "5"
        name: Crushing Blow!
        text: Crushing Blow! The beast rises high above the water and drops its heavy body on up to two player characters within 10 meters. Both victims take 2D6 bludgeoning damage and are knocked down.
      - roll: "6"
        name: Constriction!
