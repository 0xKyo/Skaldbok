  - id: bestiary-harpy
    name: Harpy
    source: bestiary
    category: Rare Kin
    description: Harpies are the scourge of nobles, peasants, hunters, merchants, and all who tread the paths of the wilderness; they steal anything they can get their hands on and do not hesitate to harm, maim, or kill the person carrying the coveted treats or valuables. If beset by a large flock, you better run fast or ride hard, that’s for sure. A limping jester named Haarpu whom I met at the Eider & Feather inn last year did claim to have defeated a most ferocious flock – by answering their barrage of taunts and threats with insults of his own, so foul that the harpies fell dead to the ground in shock. Although it sounds like a tall tale, there may be some truth to it – perhaps those who can match the vilest insults of the harpies may be able to escape their unwanted attention.
    quote: |
      “Did you know that all the harpies’ insults and abuse originated with a large flock that long ago made the mistake of kidnapping the scandalous poet and performer Janos of Barr? Imagine that!”
      – Igismun Glytt, historian
    random_encounter: A lone harpy named Gadd decides to steal from the player characters. She waits for the best moment to strike, hiding quietly in a tall tree until they pass below her. Then she drops down on the one that seems to be carrying the most food and grabs as much as she can before launching herself into the air and flying off, hurling mocking obscenities at her victim.
    adventure_seed: The temple in the small village of Thornvale has been invaded by a flock of harpies. They have built a nest in the highest tower of the temple, from where they terrorize the peaceful population – stealing food, throwing excrement at children, and shouting insults at anyone who walks the streets of Thornvale. Someone must rid the village of this torment, but the harpies have destroyed the stairs to the top of the tower, so the player characters must find another way to get there – without the harpies hindering them.
    attack_dice: D6
    image: images/bestiary/harpy-54.jpg
    image_page: 29
    statblocks:
      - fields:
          Ferocity: "1"
          Size: Normal
          Movement: "24"
          Armor: —
          HP: "12"
          Flock: Harpies fight together, and their monster attacks are performed by several harpies as a group. These attacks still only use up the turn in the round for one harpy. Once half the flock has been killed, the rest will flee. They return later if an opportune situation presents itself.
          Wings: Harpies attack from the air. All melee attacks with weapons that are not long get a bane to the roll.
    attacks:
      - roll: "1"
        name: Threatening Cackle!
        text: Threatening Cackle! The harpies shower the adventurers with terrible descriptions of what they will do to them. Everyone within 10 meters must make a WIL roll to resist fear.
      - roll: "2"
        name: Coordinated Attack!
        text: Coordinated Attack! The harpies flock together and attack the player character who wears the most metal. The attack inflicts 2D6 slashing damage. If hit, the victim is also lifted into the air and dropped from a height of D3+3 meters.
      - roll: "3"
        name: Death From Above!
        text: Death From Above! The harpies throw rocks and other junk from afar. Everyone within 10 meters suffers D6 bludgeoning damage.
      - roll: "4"
        name: Eye Gouge!
        text: Eye Gouge! The creatures target an unfortunate player character and try to tear the victim’s eyes out with their sharp claws. The attack inflicts 2D6 piercing damage and the victim is blinded and acts as if in total darkness for one stretch.
      - roll: "5"
        name: Mass Attack!
        text: Mass Attack! The harpies split up and attack a number of player characters within 10 meters equal to the number of individual harpies. Each attack inflicts D8 slashing damage.
      - roll: "6"
        name: Excrement Attack!
        text: Excrement Attack! The harpies open their cloa-cae and mouths and release a rain of vomit and excrement on the player characters. Everyone within 10 meters must choose a Condition. The attack can be parried with a shield.
  - id: bestiary-karkion
    name: Karkion
    source: bestiary
    category: Rare Kin
    description: Karkions fascinate me to no end. I have personally had the good fortune to speak with two different individuals, and they proved to be absolute treasure troves of knowledge and insight, especially about otherworldly beings. However, they would not talk about themselves, no matter how much I pleaded. They live as lone wanderers, that much is clear, and yet they are united in a common hunt for the
    quote: |
      “Knowledge and insights? Gimme a break. The karkions are nothing more than storytelling vagabonds; their talk of demon princes and other worlds is clearly nonsense!”
      – Malcum Berg, know-it-all
    random_encounter: In a clearing deep within a huge forest, the player characters encounter a karkion mage named Sibili, meditating below a huge stone tablet covered with carvings from the oldest times. Sibili is here to seek knowledge about demons and invites the adventurers to share his camp. If they accept, Sibili will tell them about the blood demon he is looking for, in exchange for them telling him about the monsters they have slain. By morning, Sibili has disappeared without a trace.
    adventure_seed: Something has happened to the mage Siman – her tower high up in the mountains is shrouded in fog and darkness. Before disaster struck, however, she managed to send a magical thought to her friend, the karkion Abas, who in turn seeks out the player characters and offers them the job of escorting her to Siman’s tower. Once there, the adventurers realize that Siman has lost control of a blood demon she summoned, who now rules the tower and its residents. How will they save Abas’ friend?
    image: images/bestiary/karkion-55.jpg
    image_page: 31
    statblocks:
      - variant: Scholar
        fields:
          Mov.: "12"
          Damage Bonus AGL: +D4
          HP: "12"
          Typical Armor: —
          WP: "14"
          Skills: Awareness 14, Beast Lore 14, Evade 12, Healing 10, Languages 14, Myths & Legends 14, Sneaking 12, Spot Hidden 12
          Typical Weapons: Short sword (skill level 12, damage D10), short bow (skill level 14, damage D10)
