  - id: bestiary-ghoul
    name: Ghoul
    source: bestiary
    category: Undead
    description: "I struggle to find any redeeming features in the abominable ghouls. There are various theories as to their origin, but it would seem that the most plausible one is also the most horrific: that they are born from a curse that affects cannibals, those who feed on the flesh of their own kin or that of other intelligent beings. The result is a revolting creature – both undead and alive; half-blind; with loose, spongy, grayish-white skin; reeking of death and decay. Unsurprisingly, ghouls are often found near graveyards or places where great battles have recently been fought. Some stories even mention groups of corpse-eaters secretly following armies on their march to the battlefield, waiting for a chance to feast on the fallen under cover of darkness."
    quote: |
      “Eating corpses, how absolutely disgusting! Well, I suppose we do it almost every day, but… Eating people! They are certainly cleaner than many animals, but… I mean, corpses as food! Disgusting!”
      – Hummel Anvil, goldsmith
    random_encounter: The player characters arrive at a battlefield where dozens of mercenaries fought just a few days ago. All combatants were killed and the stench of their corpses is overwhelming. But instead of the usual buzzing of flies, the adventurers hear only the snapping of bones and the smacking of ravenous mouths. The bodies have been discovered by a group of ghouls, who furiously defend their feast if the player characters interrupt them.
    adventure_seed: The player characters are approached by the head of a temple who needs help tracking down some grave robbers who are plaguing the area and have so far opened a handful of recently filled graves near his temple. In response to a direct question, he explains that all the graves contained the bodies of ordinary villagers – bodies that have now vanished without a trace. Another clue pointing away from grave robbers is the silver jewelry that still remained in two of the coffins. Perhaps suspicion is first directed at an ascetic mage whom everyone in the area thinks is a necromancer. But after further investigation, the characters realize that the blame lies with a group of ghouls who roam the area and have raided graves in several neighboring villages as well. The evidence eventually leads to a half-ruined and completely overgrown mausoleum from the oldest times…
