      - roll: "5"
        name: Poison Cloud!
        text: Poison Cloud! The basilisk spews a greenish-yellow cloud that reeks of poison and corrosive stomach acids. All player characters within 10 meters are affected by a lethal poison with potency 15.
      - roll: "6"
        name: Petrifying Gaze!
        text: Petrifying Gaze! A blue glow lights up in the basilisk's eyes as it turns its vicious bird’s head towards the player character who currently has the highest HP. If the victim can see (i.e., is not blind or blindfolded), they must make a roll against WIL (not an action). On failure their body turns to stone and the victim can no longer move or perform any actions whatsoever, but also cannot take damage. A petrified victim dies after 2D6 rounds, but the petrifaction can be reversed with a successful WIL roll. While still alive, the victim may roll once per turn. The DISPEL spell (Power level 1) can also undo the petrifaction, but only if the victim is still alive.
    abilities:
