  - id: bestiary-lizard-people
    name: Lizard People
    source: bestiary
    category: Rare Kin
    description: Lizard people who wish to stay hidden are hard to spot. Activating this ability grants a boon on a SNEAKING roll.
    quote: |
      “Never try to learn the language of the lizard people! I made the mistake of confusing a [hiss] with a [grr], and that was enough for the woman I was talking to to reach for her spear.”
      – Amon Acales, fishmonger
    random_encounter: The player characters suddenly realize that they are being watched. Hiding in the roadside bushes is a small group of lizard people. They are nervous and hiss anxiously at the adventurers, but show no real hostility. If the player characters wait a while or make it clear that they mean no harm, the merchant [Click][cluck] steps forward and offers his wares for sale – mostly smoked eel and pickled clams, but also some beautiful amber jewelry. He prefers metal tools or weapons, but will also accept silver or gold if offered.
    adventure_seed: The shaman [Shh][shh][grr][cluck] has taken command of twenty warriors from a previously peaceful clan and is now attacking those who travel through her lands. Her warriors kill those who fight back and abduct anyone who surrenders – they are to be sacrificed in honor of the snake demon Sisisiss. To her subjects, the shaman claims that the demon speaks to her in her dreams, whispering promises of wealth and a great future. But the truth is that she made it all up to enrich herself. Perhaps the player characters can somehow expose her lies? Either way, the false prophet must be stopped and the captives freed, before it is too late.
