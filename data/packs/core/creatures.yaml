  - id: bestiary-vampire
    name: Vampire
    source: bestiary
    category: Undead
    description: "Perhaps the most powerful of the undead beings that plague our world are the vampires. They are cunning and secretive, but apart from being vulnerable to sunlight and feeding on the blood of others, they vary greatly in many respects. Some hide in cities where they prowl the streets at night; others have spent centuries building veritable kingdoms which they rule from remote castles. Either way, they always surround themselves with thralls, both living and undead; the most powerful ones also have the ability to raise the dead as new vampires, who tend to serve their creators with blind obedience. And slaying a vampire is no easy task: one must first knock it unconscious and then – before the beast can escape in the form of fog, bats, or ravens – drive a wooden stake through its heart."
    quote: |
      “Since what happened in Budby last year, I’ve stopped eating black pudding, blood sausage, blood soup, and stuff like that. Nobody knows how it’s transmitted and who’d want to cause another ‘Bloodby’!?”
      – Rigvard Turner, carpenter’s apprentice
    random_encounter: The group is being followed by a strange fog. It is a vampire that has lost its servants and now seeks other thralls to dominate. It attacks at night while the person it deems the weakest is keeping watch. If no one is keeping watch, the characters are in real trouble…
    adventure_seed: "A mysterious nobleman hires the player characters to retrieve an ancient tome from a ruined temple. The tome is a collection of rituals that the nobleman believes can be used to bring the undead back to life. Complications arise as the characters are pursued by another group of adventurers who clearly want to stop them from succeeding – they have found out that the nobleman is a bloodthirsty monster, but think he is a demon rather than a vampire. If the player characters get the chance to negotiate, or manage to take one of them alive after an ambush, they can hear the competitors’ side of the story. Whatever they decide to do, one thing is clear: once the book is handed over, the vampire and its minions have no intention of letting the characters live."
