  - id: bestiary-adult-dragon
    name: Adult Dragon
    source: bestiary
    category: Dragons
    description: Having left the wildness of youth behind, the dragon begins to develop both impulse control and a more analytical mind. This eventually leads it to establish a home – a cave, valley, or castle ruin that it claims for itself, whether the other creatures in the area like it or not. There it begins to build its nest. The nest in question is not made of twigs and straw. No, it is made of gold, precious stones, and objects crafted from said materials, and it is built with absolute precision – even the smallest coin or tiniest ruby shard is placed with the utmost care, according to a meticulously planned design. The procedure is probably based on the fact that it makes it easier to see if anything is missing, or rather, if anything has been stolen. But it is also an expression of (or possibly reason for) the dragon’s increasing demand for order and stability as it grows older – which surely helps explain their profound aversion to the chaos-loving demons.
    quote: |
      “Oh yes, there’s a dragon in these parts. It never paid any attention to us until we started damming the creek. That made it furious; it smashed the dam and ate everyone working on it. Then things calmed down again.”
      – Erward Torquil, priest and surgeon
    random_encounter: The player characters see a column of smoke rising into the sky further down the road. The closer they get, the sharper the smell of smoke, burnt flesh, and sulfur becomes, and eventually they arrive at a terrible scene. A dragon has attacked and wiped out a large retinue escorting a covered wagon. Judging by the wagon and the many dead soldiers, it may well have been transporting something of great value, perhaps the taxes collected by a bailiff. Everything but the covered wagon has been burnt to ashes, and the wagon’s interior is completely empty.
    adventure_seed: "During their adventures, the player characters come across several clues to where they might find the lair, and therefore the treasure, of the dragon Scarge – in an abandoned dwarven mine, high up in the mountains, deep underground. There are many ways in and out of the caves, some big enough for the dragon but many that only allow smaller creatures to pass through. Scarge’s nest is at the bottom of the mountain, spacious enough for her to stretch out fully with her wings spread wide. Soon it becomes clear that the adventurers are not the only ones seeking Scarge’s riches: a dwarven kingdom has sent a group to reclaim the mine and seize the dragon’s treasure; an elven expedition is on its way to recover the Crown of Elderin, a priceless artifact found at the top of Scarge’s hoard; and the warlord Aknator has dispatched a small army to replenish his war chest. Who will ally with whom, and who will ultimately betray everyone else?"
