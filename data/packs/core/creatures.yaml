  - id: bestiary-lindworm
    name: Lindworm
    source: bestiary
    category: Dragons
    description: "I thought long and hard about whether to include the lindworm in this chapter or in the one on beasts. It ended up here, because although the creature in question is not technically a dragon, I want to emphasize the theory that I myself favor (unlike most of my colleagues, including Virdal who is adamant on this point): that lindworms are what is left of the earliest ancestors of the dragon species. In terms of behavior and temperament, they have much in common with young dragons – they are predators whose lives consist of eating, sleeping, and growing. But there are major physiological differences: they are less intelligent and cannot breathe fire or fly. They do not collect treasure either, but for fortune hunters it can still be worthwhile to raid their nests. Their underground lairs always consist of a central chamber from which a number of winding passages lead up to the surface. This is where they drag their victims to eat in peace, which means that the victims’ packs and belongings can often be found in some corner."
    quote: |
      “Lindworms and sea serpents evolved from degenerate dragons, period! Anyone who claims otherwise should be labeled a fool rather than a monster expert.”
      – Ardelia of Harman, charlatan
    random_encounter: A lindworm has traveled the same path as the player characters just a few hours earlier. Tracks left by its powerful body indicate that it is a beast of enormous size. The remains of a bear are found by the wayside. The player characters can choose to follow the trail to the monster’s lair, if they dare…
    adventure_seed: The fishermen and log drivers at Lake Glintwater are starving. A huge creature has built a nest on an island in the middle of the lake, and from there it attacks anything that moves on the water. The player characters are promised a handsome reward if they kill or drive away the monster. There are many passages into the lindworm’s nest, both on land and underwater, and many small holes where she can catch unwary adventurers. Will the characters venture into the darkness, or can they devise a cunning plan to lure the monster out of its lair?
