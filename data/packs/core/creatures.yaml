    statblocks:
      - fields:
          Ferocity: "1"
          Size: Normal
          Movement: "12"
          Armor: "6"
          HP: "18"
          Digger: The digging ability of the beetle kin means that they are always counted as having a shovel, which halves the time spent digging.
    attacks:
