  - id: bestiary-swan-maiden
    name: Swan Maiden
    source: bestiary
    category: Rare Kin
    description: Swan maidens are female elves capable of transforming themselves into magnificent white swans. The elves consider this phenomenon a gift from the gods, and to my knowledge, no one claims to know what causes it. What is clear, however, is that these select few are viewed with great respect among the elven people, sometimes bordering on fear, sometimes on envy. They often live alone in the wilderness, preferably near large bodies of water or rushing rapids, and I would venture to say that it is the feeling of being different that drives them to seek solitude – they simply feel uncomfortable in the company of others. It is also worth mentioning that there are stories of male elves acquiring a similar ability, but from demonic powers that allow them to turn into black swans. According to legend, the black and white swans are bitter enemies, and perhaps this enmity also plays a role in why swan maidens choose to live their lives in solitude.
    quote: |
      “If you ask me, swan maidens are also the result of demonic pacts. What they can do is clearly unnatural, which should be proof enough for any thinking person!”
      – Glorimar, nature worshiper
    random_encounter: An injured swan flies clumsily over the player characters, pursued by a small flock of harpies. Suddenly the swan turns around and lands in the midst of the adventurers, where it turns into the young elf woman Laurinde. Then the harpies attack! Laurinde does everything she can to aid the player characters in the fight, and thanks them profusely if they manage to drive the beasts away.
    adventure_seed: The player characters are approached by elven messengers who tell them that three swan maidens have disappeared from their forest. Convinced that someone is kidnapping them, the elves need help identifying the culprit – none other than the mage Alosie, a human who dreams of being able to fly. It is because of this dream that she has captured several swan maidens and imprisoned them at the top of her tower, where she studies them and tries to replicate their magical powers. Once the player characters discover where the swan maidens are being held, someone has to free them, and who better than the adventurers themselves?
    attack_dice: D6
    image: images/bestiary/swan-maiden-61.jpg
    image_page: 43
    statblocks:
      - fields:
          Ferocity: "1"
          Size: Normal
          Movement: "14"
          Armor: —
          HP: "16"
          Shapeshifter: A swan maiden can turn into a white swan (and back again) at any time. The transformation is an action. In elf form, the swan maiden counts as an ordinary NPC; in swan form it counts as a monster but retains the ability to speak. Clothes and gear change with the swan maiden unless they are made of metal or their weight exceed half the creature’s carrying capacity.
          Wings: In swan form, the creature’s wings allow it to move freely through the air.
    attacks:
      - roll: "1"
        name: Wingbeat!
        text: Wingbeat! The swan maiden flaps its wings and creates a gust of wind that affects everyone within 4 meters. All creatures up to human size are hurled D8 meters away, suffering the same amount of bludgeoning damage and landing prone.
      - roll: "2"
        name: Pecking Attack!
        text: Pecking Attack! The swan maiden repeatedly pecks at an opponent with its bill. The attack inflicts 2D8 slashing damage and the victim must make a WIL roll to resist fear.
      - roll: "3"
        name: Swan Song!
        text: Swan Song! The swan maiden sings a beautiful lament for those who have fallen in battle. Everyone within 10 meters is struck by a deep sadness at the cruelty of death and gains the Disheartened condition, or another condition of their choice if they are already Disheartened.
      - roll: "4"
        name: Flock of Swans!
        text: Flock of Swans! The swan maiden summons a flock of white swans that frantically attack its enemies. All opponents within 10 meters suffer 2D4 slashing damage and must make a WIL roll to resist fear.
      - roll: "5"
        name: Pleading Gaze!
        text: Pleading Gaze! The swan maiden fixes its gaze on a victim within 10 meters and begs them to stop fighting. The victim must make a WIL roll or immediately perform a movement and an action (that does not require WP) chosen by the swan maiden (GM). The victim also loses their turn in the round, if it has not already passed.
      - roll: "6"
        name: Gift of the Gods!
        text: Gift of the Gods! The swan maiden casts a curse on an opponent within 10 meters. The victim suffers chaotic visions from the oldest times and must make a WIL roll with a bane to resist fear.
  - id: bestiary-tree-kin
    name: Tree Kin
    source: bestiary
    category: Rare Kin
    description: "One of the proudest moments of my journey was when my companions and I were able to verify the existence of a life form that is otherwise only mentioned in half-forgotten legends: the tree kin. I can now say with certainty that they exist! Though my attempts at communication were unsuccessful, I have seen them, even touched them. They roam deep in the most ancient forests, under the mighty crowns of the first trees, difficult to distinguish from the rest of the forest on account of their moss-covered, bark-crusted bodies. It is probably true, as the legend says, that they act as shepherds of the forest, older than they themselves can remember and as powerful as dragons and demons. We saw them lumbering slowly through the forests, talking to the trees and the animals in their crowns. Finally, a word of caution: given their reaction to Brasimor’s axe, they are likely very suspicious of anyone carrying such tools…"
    quote: |
      “No, I don’t doubt that you have seen walking trees. I’m just saying that there are treacherous plants in the forests, whose hallucinogenic spores can make anyone see anything.”
      – Manika Hox, wise old woman
    random_encounter: Traveling through the forest, the player characters notice a huge tree standing alone on a hill. If they approach it, they watch in astonishment as the tree pulls up its roots and walks away. If they follow, the tree soon disappears into the forest, but leaves a message for the adventurers… a broken axe.
    adventure_seed: The player characters come to a small village on the brink of despair. Every able-bodied person has disappeared! All the villagers know is that their woodcutters went into the deep forest looking for wood and never returned. If the player characters seek out the woodcutters’ camp, they find traces of a struggle and realize that someone has taken them away against their will. What happened is that the woodcutters tried to cut down trees that are loved above all else by the tree kin Hommbom the Herder, who for this reason has imprisoned them in a nearby cave and ordered them to consider their life choices. Hommbom can be persuaded to release the prisoners, but only if the player characters can convince the tree that they will leave his part of the forest alone.
    attack_dice: D6
    image: images/bestiary/tree-kin-62.jpg
    image_page: 46
    statblocks:
      - fields:
          Ferocity: "2"
          Size: Large
          Movement: "8"
          Armor: "6"
          HP: "64"
          Illusion: At any time, a tree kin can conjure an illusion that disguises the creature as an ordinary tree. The next time the tree kin performs an action, the illusion is broken.
          Vulnerable to Fire: The tree kin fear fire above all else. They take double damage from fire-based attacks and will do everything they can to stop opponents using fire.
          Resistance: Piercing and bludgeoning damage are halved.
          Giant Stride: Tree kin are serene creatures by nature, but when traveling long distances they can move faster, up to 60 kilometers per shift. They never get tired and keep walking until they decide to stop.
    attacks:
      - roll: "1"
        name: Command!
        text: Command! The tree kin speaks commanding words of power from ancient times. Everyone within 10 meters is shaken by its thunderous words and must make a WIL roll to resist fear.
      - roll: "2"
        name: Death From Above!
        text: Death From Above! A swarm of small birds swoops down on all opponents within 10 meters. All victims suffer D8 damage and lose their next turn in the round, if it has not already passed.
      - roll: "3"
        name: Spear Thrust!
        text: Spear Thrust! The creature shapes a long branch into a spear and thrusts it at a victim, inflicting 2D10 piercing damage. The attack can be parried.
      - roll: "4"
        name: Crushing Blow!
        text: Crushing Blow! The tree kin gathers all its strength and slams its thickest branch into the head of the victim, who suffers 2D10 bludgeoning damage and is knocked down.
      - roll: "5"
        name: Up, Up and Away!
        text: Up, Up and Away! The monster grabs the victim and hurls it 2D8 meters. The attack inflicts an equal amount of bludgeoning damage and the victim lands prone.
      - roll: "6"
        name: Hang Them High!
        text: Hang Them High! The tree kin extends a long branch and wraps it around an opponent’s neck. The attack inflicts 2D6 bludgeoning damage and an additional 2D6 whenever it is the victim’s turn. The victim cannot move or perform actions that require body movement, except trying to break free which requires a STR roll with a bane (action). Others can help.
  - id: bestiary-ant-people
    name: Ant People
    source: bestiary
    category: Insectoids
    description: My colleagues and I were invited to stay with Queen Fzzwzz ww Ozzbazz for twelve hectic days. Judging by what we saw and heard, the ant people live in families of a few hundred individuals, subject to the will and dictates of a queen. The queen plays an extremely important role and is always closely guarded – through her, all individuals are connected; as long as they are within ten kilometers of the regent, they share each other’s sensory impressions. In other words, they communicate telepathically within the family, while sign language is used to communicate with outsiders and ant people from other families. This probably explains why one rarely encounters ant people far from their homes. Groups of warriors are sometimes dispatched on scouting missions or to strike at potential threats. Workers may also join the patrols, tasked with making things more difficult for the enemy, for example by setting traps or destroying cave entrances.
    quote: |
      “If you want to get rid of an ant people colony, go all out to get the Queen. Take out the regent and the rest of the ant people will scatter to the wind, lost and adrift.”
      – Eggmund Hilt, military strategist
    random_encounter: Xipst the antling has angrily run off from his family after being denied a second helping of waxworms for the twelfth time. A group of ant creatures takes to the surface to find the runaway, and catches up with him just as the ever-hungry Xipst makes himself known to the player characters (in their camp or on the road). The ant creatures, upon viewing the scene, come to the conclusion that Xipst has been captured or is under attack. Verbal communication is impossible; to avoid combat, the player characters must either drop their weapons and raise their arms in the air or explain using gestures, which gives them a bane on PERSUASION.
    adventure_seed: The player characters run into Sxzzt, a lonely ant worker wandering the forest downcast and confused. If they make the effort to communicate with the worker, they eventually learn that he is the last of his family – a monster laid waste to their home and slew the queen, so Sxzzt is now looking for a new family, a new life. If the player characters agree to take him under their wing, he promises to lead them back to his abandoned home and its “treasury” where the family kept coins, items, and other things they acquired over the years. Is the monster still there? If so, what kind of beast is it? And how will the world react to the player characters traveling around with an ant creature?
    attack_dice: D6
