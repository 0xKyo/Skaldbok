          Regeneration: A cave troll automatically heals D6 HP per turn in combat, unless it has reached zero HP.
          Treasure Eater: Nothing tastes as good as gold! Cave trolls have a voracious appetite for gold coins and small gold items. The belly of a cave troll usually holds D12 gold coins.
