  - id: bestiary-mermaid
    name: Mermaid
    source: bestiary
    category: Rare Kin
    description: Mermaids can rightly be described as protectors of the seas. Apart from a few lost souls, I have found no evidence that they are upset by sailors and fishermen who live in harmony with the sea; there are even rumors of mermaids saving shipwrecked people from drowning. On the other hand, anyone who cruelly and thoughtlessly harms the waters and their inhabitants has reason to fear the wrath of the sea people. Whether it is true or not is difficult to say, but I have heard stories of mermaids hunting down greedy fishermen and whalers, and even joining with sea giants to attack great warships to prevent the madness on the surface from destroying the world below. Like the elves, mermaids live long lives and over the years they accumulate much knowledge of the sea and its secrets; knowledge that is highly sought after by mages and scholars.
    quote: |
      “I was about to pass out when someone suddenly embraced me and lifted me to the surface. I hoped it was a mermaid, but it wasn’t. It was Bertold…”
      – Unok Bluetoe, fisherman
    random_encounter: The player characters are traveling by boat when they suddenly hear calls for help. If they follow the pleading cries, they soon find the mermaid Coralia caught in a poacher’s net. She begs the adventurers to free her, promising to repay their kindness if they should ever need her help. If she is freed, Coralia thanks the player characters before disappearing into the deep.
    adventure_seed: A ship has run aground on a rocky shore and the player characters have somehow been tasked with retrieving a chest of documents kept on board. After locating the site, they soon realize that mermaids are responsible for the shipwreck. They refuse to let the player characters near the ship, and under no circumstances will they allow anyone to take anything from the wreck. But if the player characters gain their trust, the mermaids explain that the ship was carrying harpoons, meant to be used in this year’s bloody whale hunt. If the player characters help them salvage the cargo from the lower deck and toss it into the sea, they may also retrieve the chest from the captain’s cabin. Unfortunately, however, it turns out that there are sailors left on the ship…
    attack_dice: D6
    image: images/bestiary/mermaid-57.jpg
    image_page: 35
    statblocks:
      - fields:
          Ferocity: "1"
          Size: Normal
          Movement: "14"
          Armor: —
          HP: "16"
          Lifesaver: Mermaids can use artificial respiration to revive a drowned person up to one stretch after their death.
          Aquatic: Mermaids are aquatic creatures with gills that allow them to breathe underwater. They can also stay above the surface for one stretch without any problems, but after that they suffer D6 damage per stretch spent on land.
    attacks:
      - roll: "1"
        name: Harpoon Throw!
        text: Harpoon Throw! The mermaid grabs a whale bone harpoon from a quiver on its back and throws it with full force at an enemy within 10 meters. The victim suffers 2D6 piercing damage.
      - roll: "2"
        name: Spear Thrust!
        text: Spear Thrust! The mermaid thrusts its trident at an opponent. The attack inflicts 2D8 piercing damage and the victim is knocked down.
      - roll: "3"
        name: Fishing Fortune!
        text: Fishing Fortune! The mermaid casts a net and swims with powerful tail strokes around all opponents within 6 meters. The victims must make an EVADE roll (not an action) to escape the net. Those who fail are unable to move or perform actions that require body movement. Breaking free requires a successful STR roll with a bane (action). Others can help.
      - roll: "4"
        name: Drowning Attack!
        text: Drowning Attack! The mermaid grabs a victim and pulls it into the water. The victim immediately begins to drown as per page 53 in the Rulebook and cannot move or perform actions that require body movement except trying to break free, which requires a STR roll with a bane (action). Others can help.
      - roll: "5"
        name: Wave Attack!
        text: Wave Attack! The creature repeatedly slams its fishtail into the water and produces a powerful wave. All untethered objects and creatures within a 10-meter cone are pushed 2D6 meters away and suffer an equal amount of bludgeoning damage.
      - roll: "6"
        name: Whirlwind!
        text: Whirlwind! The mermaid creates a great whirlwind of water. All untethered objects and creatures up to human size within 4 meters of the mermaid are thrown 2D4 meters and suffer an equal amount of bludgeoning damage.
  - id: bestiary-minotaur
    name: Minotaur
    source: bestiary
    category: Rare Kin
    description: "Based on conversations and learned texts, I would argue that almost all minotaurs view glory as the highest goal in life, or more specifically: glory in battle. This is probably rooted in the legend of King Minas – one of the great rulers of old, so huge and powerful that he could even take on dragons and demons. Minas won glory in abundance, not least by subduing scores of orc and goblin clans who were then forced to fight in the minotaur king’s endless wars with other kin. Present-day minotaurs remember their former ruler with great reverence, and legend has it that whoever recovers King Minas’ axe, the Cleaver, will restore his vast kingdom. It is no wonder that many minotaurs choose to spend their entire lives searching for the weapon in question."
    quote: |
      “Jox was just teasing that minotaur a little, something silly about needing help pulling the plow. It just snapped. Only I managed to escape; the rest of the village was slaughtered in a blind rage…”
      – Kaspert Woodshot, gamekeeper
    random_encounter: The player characters arrive at a ford blocked by the minotaurs Gorm and Grong. They demand tribute from anyone wishing to cross the river – one gold coin’s worth of goods per person. The minotaurs are quarrelsome and short-tempered, and if anyone argues with them, the situation quickly escalates. Can the player characters PERSUADE the two bullies to let them pass or does fighting break out?
    adventure_seed: The minotaurs Sigum and Moll roam the region in a quest for glory, seeking to challenge the greatest fighters they can find. This is causing trouble for everyone traveling through the area, and local merchants have offered a bounty of 10 gold coins for each brother killed. But the jester king Haarpu promises an even larger sum to anyone who captures and delivers the minotaurs to him, so they can be put on captive display for terrified onlookers. If Sigum and Moll are brought to him in chains, the bounty hunters are rewarded with 50 gold coins.
    attack_dice: D6
    image: images/bestiary/minotaur-58.jpg
    image_page: 37
    statblocks:
      - fields:
          Ferocity: "2"
          Size: Large
          Movement: "16"
          Armor: —
          HP: "32"
          Typical Gear: Two-handed axe
    attacks:
      - roll: "1"
        name: Bull Fist!
        text: Bull Fist! A furry fist hits a player character with full force. The attack inflicts 2D6 bludgeoning damage and leaves the victim Dazed, even if their armor prevents any damage.
      - roll: "2"
        name: Hoof Kick!
        text: Hoof Kick! Using its powerful legs, the minotaur kicks the victim with its hooves. The force of the attack throws the victim 2D6 meters away and inflicts the same amount of bludgeoning damage. The victim lands prone.
      - roll: "3"
        name: Horn Rush!
        text: Horn Rush! The minotaur lowers its head and rushes toward two enemies within 2 meters of each other, hoping to impale them with its sharp horns. Both victims suffer 2D8 piercing damage and are knocked down.
      - roll: "4"
        name: Cleaving Chop!
        text: Cleaving Chop! The beast swings its weapon over its head and brings it down with full force. The attack inflicts weapon damage plus an extra D10 and can be parried.
      - roll: "5"
        name: Sweeping Attack!
        text: Sweeping Attack! The minotaur roars and sweeps its weapon in a wide arc, hitting everyone within 2 meters. The attack inflicts weapon damage.
      - roll: "6"
        name: Stomping Attack!
        text: Stomping Attack! The minotaur jumps high in the air and comes crashing down on an adventurer, who suffers 2D10 bludgeoning damage and is knocked down.
  - id: bestiary-naiad
    name: Naiad
    source: bestiary
    category: Rare Kin
    description: Naiads are strange creatures found in dark lakes, bogs, and marshes. Except for their pale green skin, they appear as human men or women of staggering beauty. But behind the facade there is only darkness and self-serving evil. Naiads use their powers to attract and trap innocent creatures; the victims are lured into the water, where they are quickly ensnared and brought to the monster’s cave. Only the victims know exactly why, and the few survivors I have encountered tend not to talk about it. But from what little I do know, naiads seem to feed on the dreams and nightmares of other creatures. Their victims often die miserable in the deep, but apparently the naiad sometimes tires of its prisoner and releases it to return home in confusion.
    quote: |
      “Something so beautiful can’t be evil, there’s just no way – the rot of evil cannot be concealed! I mean, if I were invited to share a swamp with a naiad, I wouldn’t hesitate for one moment.”
      – Mungus the Mild, hopeless romantic
    random_encounter: Crossing a stream, the player characters notice an incredibly beautiful creature sitting on the bank. The naiad tries to lure them closer and enchant the character with the highest CHA. On failure the naiad flees, but it will defend itself if attacked.
    adventure_seed: A young man from a local village has disappeared by the lake. Some say he was eaten by a sea serpent or a brook horse, but player characters investigating the matter soon find that a naiad has moved into the area. The naiad was driven from its former home and is now trying to start a new life in a new place. But will the villagers accept a deadly creature living so close by?
    attack_dice: D6
    image: images/bestiary/naiad-59.jpg
    image_page: 39
    statblocks:
      - fields:
          Ferocity: "2"
          Size: Normal
          Movement: "12"
          Armor: —
          HP: "24"
          Enchant: A naiad can enchant a person’s mind and trick them into following it to its lair. If the naiad can speak with a creature undisturbed, the victim must succeed with a WIL roll to avoid being enchanted by the monster’s beauty. Anyone who falls under its power follows the naiad until the spell is broken. The victim can make a new attempt at each sunrise. The spell can also be broken with DISPEL.
          Invisibility: As an action, a naiad can become invisible to avoid detection. If the naiad performs an action that affects another creature, it immediately becomes visible and cannot become invisible again until the next sunrise.
          Aquatic: The naiad lives underwater and can give a creature it touches the ability to breathe underwater.
          Beautiful: Naiads are stunningly beautiful and capable of charming creatures of the intelligent kin. Anyone wishing to perform a hostile action against a naiad must make a WIL roll (not an action) to do so.
    attacks:
      - roll: "1"
        name: Strangulation!
        text: Strangulation! The naiad stretches out its long, strong arms and grabs a victim by the throat. The attack inflicts D10 bludgeoning damage and an additional D10 whenever it is the victim’s turn. The strangled victim cannot move or perform actions that require body movement, except trying to break free, which requires a STR roll with a bane (action). Others can help.
      - roll: "2"
        name: Broken Heart!
        text: Broken Heart! The naiad waves dismissively at a victim within 10 meters who suddenly realizes that their love for the creature will never be reciprocated! The victim must make a WIL roll with a bane to resist fear.
      - roll: "3"
        name: Sharp Nails!
        text: Sharp Nails! The naiad claws at an opponent’s eyes with its sharp fingernails. The attack inflicts D8 slashing damage, and the victim acts as if in total darkness for D3 rounds.
      - roll: "4"
        name: Drowning Attack!
        text: Drowning Attack! The naiad grabs an opponent with its strong arms and pulls it into the water. The victim immediately begins to drown as per page 53 in the Rulebook and cannot move or perform actions that require body movement except trying to break free, which requires a STR roll with a bane (action). Others can help.
      - roll: "5"
        name: Enchanting Song!
        text: Enchanting Song! With its sweet voice, the naiad seduces a victim within 10 meters. The victim must succeed with a WIL roll or immediately perform a movement and an action (must not require WP) of the naiad’s (GM’s) choosing. The victim also loses its turn in the round, if it has not already passed.
      - roll: "6"
        name: Tidal Wave!
        text: Tidal Wave! The naiad summons a great wave from a water source within 10 meters. The area of effect is a 10-meter-long cone emanating from the source. All untethered objects and creatures affected are pushed 2D6 meters away from the source and suffer an equal amount of bludgeoning damage.
  - id: bestiary-satyr
    name: Satyr
    source: bestiary
    category: Rare Kin
    description: No one loves singing and dancing as much as the satyrs. Together with their naiad and centaur friends, they hold court in flower-covered glades deep in the world’s deciduous forests. I have been there myself, along with Brasimor (who does his best not to remember that night), and there is no doubt that satyrs literally worship joy. There is always a cause for celebration, and they celebrate by arranging wild feasts where they eat like princes and drink exquisite satyr-made wines. Dancing, singing, and music are part of the festivities as well. According to my observations, their joy is rarely as great in the mornings, but this is quickly remedied by someone finding a new reason to dance, drink, and feast!
    quote: |
      “Satyr wine is delicious but deadly – fruity as lemonade and strong as spirits. Fortunately for the world, they refuse to share their brewing secrets…”
      – Loretta Wineroot, tavern maid
    random_encounter: The player characters hear music, singing, and laughter in the distance. A group of satyrs have arranged a great feast in the forest they are traveling through and anyone who wants to join them is invited. Satyrs, centaurs, and naiads are dancing among the trees. The party continues throughout
    adventure_seed: During their travels, the player characters encounter a haggard and melancholic satyr wandering alone in the forest. He introduces himself as Spiros and tells them that the other day he managed to escape from a traveling troupe of jesters who held him captive for years; he was put in a cage and showcased for money. Spiros asks them to help him get back to his friends, and if the player characters accept, the search for the greatest feast in the forest can begin. As the satyr gets to know the player characters, his melancholy eases somewhat and he makes tentative attempts to turn their group into a traveling party. Soon enough, the jesters also hear about this and track down the player characters to take back what is theirs.
    image: images/bestiary/satyr-60.jpg
    image_page: 41
    statblocks:
      - variant: Bard
        fields:
          Movement: "10"
          Damage Bonus: —
          HP: "10"
          Typical Armor: —
          WP: "12"
          Skills: Bluffing 10, Evade 10, Performance 14, Persuasion 12
          Typical Weapon: Short spear (skill level 10, damage D10)
    abilities:
      - name: Non-Monster
        kind: ability
        text: Satyrs do not count as monsters in combat, but as ordinary NPCs.
      - name: Melancholy
        kind: ability
        text: A satyr who does not get to rejoice with friends every day quickly falls into melancholy. The satyr then gets a bane on all rolls until it can party again.
      - name: Player Character
        kind: ability
        text: If the gaming group agrees on it, satyrs can be created as player characters. They will then have the innate ability Raise Spirits (see sidebar below).
      - name: Raise Spirits
        kind: pc_ability
