        text: Scream of the Dead! The wretched creature lets out a terrible death scream. Everyone within 10 meters suffers a fear attack, and the scream attracts another ghoul who joins the fight in the next round.
  - id: bestiary-living-dead
    name: Living Dead
    source: bestiary
    category: Undead
    description: "Are they living or undead? Well, those who like to split hairs might find this question very interesting. I tend to fall into that category myself, but in this case I am more concerned with the facts: there is a disease that prevents people from dying and instead turns them into walking, rotting corpses whose only purpose in life is to feast on living flesh. Whether the disease is demonic, magical, or even natural in origin does not really matter. What does raise questions and doubts is that these disgusting creatures seem to retain memories from before the transformation, at least judging by the reports that they are capable of recognizing old acquaintances, muttering intelligible phrases, and grasping and using tools. Surely this must mean that they are still themselves, that they are living some kind of half-life, darkened by their abominable hunger?"
    quote: |
      “My great grandfather was infected. That’s what we think, anyway. Of course, he couldn’t walk at the end. And he always slurred his words. Smelled bad too. But we think he died and became one of those living dead…”
      – Iasmira Dusk, innkeeper
    random_encounter: In the distance, the player characters see a group of people wandering around in a field. The people are walking slowly and aimlessly and something seems wrong. If the characters approach them, the living dead quickly pick up the scent of their flesh and start moving towards their next meal.
    adventure_seed: The player characters arrive in a small village where something terrible has happened. Dead villagers with terrible injuries litter the streets. The stench of death and decay is overwhelming. Many more corpses are found as the characters investigate the village, and when they reach the well in the village square, they watch in horror as the dead slowly come back to life with hunger in their eyes. The situation quickly turns into a survival drama in which the characters must escape but also eradicate the living dead – otherwise the infection will spread, perhaps all over the world.
