        text: Acid Spit! The creature spits a gob of corrosive poison at an opponent within 10 meters, inflicting D8 damage (armor has no effect).
      - roll: "6"
        name: Shattering Shriek!
        text: Shattering Shriek! The beetle kin lets out a shriek so high-pitched it becomes inaudible. All victims within 10 meters become Dazed and must make a WIL roll to resist fear.
  - id: bestiary-spider-kin
    name: Spider Kin
    source: bestiary
    category: Insectoids
    description: Spider kin seem to be the least numerous of the insectoids, and certainly the most mysterious. Our visit to their dark, cobwebbed part of the forest felt almost dreamlike. Brasimor and Kvalka refused to go, so I sought them out with only Virdal in tow. The dozen spider creatures we encountered did not answer when spoken to and seemed barely aware of our presence, as did their friends and neighbors, ranging from giant spider monsters to colonies of ten or so smaller arachnids of different species. Virdal was just as eager as I was to seek confirmation that our hosts were not only hyper-intelligent creatures, but also highly gifted in the arcane arts. We could not find any actual evidence to support the latter assumption, but much suggests that our suspicions are correct. They have a written language and even own works penned by elves and humans; they weave sparkling webs that seem to catch magical energies rather than bugs, and much of what we experienced in the forest can hardly be explained by natural means. It seems to me that whoever antagonizes these immensely powerful creatures will not live to regret it.
    quote: |
      “They’re demon princes in disguise, the spider kin – lords of all insectoids, plotting to conquer the world. And they’ll strike soon…”
      – Elfea Petrella of Merrywald, dragon knight
    random_encounter: "One of the player characters suddenly spots a large spider creature no more than ten meters away, among the trees or partially hidden behind a boulder. It does not seem hostile and gives the character a welcoming wave, but because it is hidden by a magical veil, no one else can see it. If it takes damage, the spider becomes visible to all and can be fought, but if the character approaches peacefully, the spider creature hands over a piece of bark carved with letters in the human language: “You have been chosen by the web of fate. Beware the darkness. Slay Ulugum the Destroyer.” The GM decides whether the prediction is true and what it means."
    adventure_seed: A curse has been placed on the regent’s firstborn, who will wither and die before his first birthday. The desperate parents are looking for someone to help them break the curse, and they send the player characters to find the shespider Sharlot, who is said to be able to predict and even alter the future. The player characters bring with them plenty of gifts for the fate weaver, gifts that the regent’s enemies are eager to get their hands on. When the adventurers find Sharlot, they must convince her to break the curse using a combination of beautiful speech and magical gifts.
    attack_dice: D6
    image: images/bestiary/spider-kin-65.jpg
    image_page: 54
    statblocks:
      - fields:
          Ferocity: "2"
          Size: Normal
          Movement: "16"
          Armor: —
          HP: "28"
          Many Eyed: Spider kin view the world through multiple sets of eyes, which allow them to see everything happening around them. They can never be taken by surprise and all attempts at SNEAKING around spider kin are rolled with a bane.
          Climber: Spider kin can climb any surface as quickly as they move on the ground.
          Fate Weaver: Spider kin can spin magical webs in which they collect dreams and prophecies that get caught like flies in ordinary webs. They interpret these fragments of information to predict and shape the future in their favor, which is why spider kin are highly sought after by those who seek what is hidden. The Game Master decides how much information a spider creature can gain from the web of fate; if someone else has access to it, it should be vague and ambiguous but still provide information that will help the player characters in their adventures. Spider kin will often demand magical items in exchange for their knowledge of the future.
    attacks:
      - roll: "1"
        name: Poison Bite!
        text: Poison Bite! The spider creature bites an opponent with its strong mandibles. The attack inflicts D10 damage and injects the victim with a paralyzing poison with potency 12.
      - roll: "2"
        name: Too Many Eyes!
        text: Too Many Eyes! The spider creature stares at the player characters with a terrifying multitude of eyes. All victims within 10 meters must make a WIL roll to resist fear.
      - roll: "3"
        name: Ominous Vision!
        text: Ominous Vision! There is a sparkle in the creature’s eyes as each one shows a chaotic, reflected vision of the victim’s ominous future. A player character within 10 meters must make a WIL roll with a bane to resist fear.
      - roll: "4"
        name: Poison Sting!
        text: Poison Sting! The creature spins around with incredible speed and attacks with the poisonous stinger on its rear. The attack inflicts D8 piercing damage, and a victim who suffers at least 1 point of damage is also injected with a paralyzing poison with potency 12. The attack can be parried.
      - roll: "5"
        name: Sticky Web!
        text: Sticky Web! The spider creature shoots a sticky web at an opponent. The victim is unable to move or perform actions that require movement. Breaking free requires a successful STR roll (counts as an action). Others can help.
      - roll: "6"
        name: Hypnotizing Eyes!
        text: Hypnotizing Eyes! The victim must succeed with a WIL roll (not an action) or immediately perform a movement and an action (must not require WP) as determined by the spider creature (GM). The victim also loses its turn in the round, if it has not already passed.
  - id: bestiary-cave-troll
    name: Cave Troll
    source: bestiary
    category: Trolls
    description: Neither I nor other explorers can claim to know much about cave trolls. Trying to talk to them is futile, so all we have to go on are observations. Evidence suggests that they are even more sensitive to sunlight than the nightkin – they live in caves and never leave, except at night or when the fog lies thick over the mountain valleys. They appear to see everything and everyone as a potential meal and their hunger is seemingly insatiable, at least according to all the stories of single trolls devouring entire parties of travelers, draft animals and all. It is true that the occasional orc chief or human ruler has managed to tame cave trolls and use them in battle, perhaps by providing them with a constant supply of food. But I would not dare to, nor would I want to serve in the same unit as such voracious and unpredictable warriors…
    quote: |
      “Cave trolls love gold. As food, that is! If you want to get rich quick, track down and kill one of them and you’ll reap a fortune straight from the beast’s belly!”
      – Eulola Evenlight, fortune hunter
    random_encounter: "After half a lifetime of slavery, Iogulg the cave troll has finally escaped his goblin captors in the mountains. Though the wounds from their whips have healed and formed an all-encompassing web of scar tissue, he still sees red whenever a goblin pollutes his field of vision – and sadly, his eyesight is now so poor that everyone he meets looks like a goblin. When he encounters the player characters, he attacks in a berserk rage while shouting in troll tongue: “Death to all goblin filth!” It takes a successful PERSUASION roll to convince him that they are not goblins, but if someone is, the person talking must also succeed with BLUFFING. Iogulg may also calm down if he is offered a hearty meal."
    adventure_seed: The player characters pass through a ravine with lots of large and small cracks in its sides; one of them notices something glittering in a cave that opens inside one of the cracks (polished tin bowl, worth 1 gold). If the characters enter, they walk straight into a trap – the cave troll Ymor knocks a boulder over the top of the ravine, which crashes down and blocks the opening. Then he sits back and waits for hunger to weaken his victims. One way out is to somehow trick the cave troll (BLUFFING); otherwise a successful SPOT HIDDEN roll can reveal a place where the cracks in the mountain widen into an exit about ten meters from where Ymor is waiting. But the characters can also head deeper into the mountain, where they may find the remains of a hero’s tomb… watched over by an honor guard of skeleton warriors.
    attack_dice: D6
