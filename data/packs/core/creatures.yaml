        text: Corrosive Mist! The vampire dissolves and transforms into corrosive mist. Menacing wisps of mist wrap themselves around all opponents within 10 meters, inflicting D6 damage (armor has no effect) and leaving them Exhausted (anyone already Exhausted must choose another condition). After the attack, the vampire returns to its physical form.
      - roll: "4"
        name: Hypnotic Gaze!
        text: Hypnotic Gaze! The undead creature fixes its gaze on an opponent within 10 meters and bends them to its will. The victim must roll WIL with a bane or immediately perform a movement and an action (may not require WP) chosen by the vampire (GM). The victim also loses its turn in the round, if it has not already passed.
      - roll: "5"
        name: Swarm of Bats!
        text: Swarm of Bats! The vampire turns into a swarm of bats and attacks. Roll on the attack table for vampire bats on page 99 in the Rulebook. The swarm takes damage as normal and all damage is transferred to the vampire. The vampire reverts to its true form on its next turn.
      - roll: "6"
        name: Bloodthirst!
        text: Bloodthirst! The vampire pounces on an opponent and drinks their blood. The victim takes D6 piercing damage (armor has no effect) while the vampire recovers the same amount of HP (up to max HP). The victim also loses D6 WP. The vampire continues to drink, sucking out an additional D6 HP and WP each turn. The victim becomes paralyzed and cannot move or perform any actions except trying to break free, which requires a WIL roll with a bane. The vampire makes no other monster attacks until the victim reaches zero HP or breaks free. If the victim loses their last WP as a result of this attack, it is exposed to a vampiric disease with virulence 12. Anyone who suffers the full effect of the disease turns into a vampire the next night. A player character who turns into a vampire becomes a monster under the GM’s control.
  - id: bestiary-wight
    name: Wight
    source: bestiary
    category: Undead
    description: The being known as the wight is by far the most hateful and murderous of the undead. Their entire existence is based on their hatred of all living things, and they usually spend hundreds and hundreds of years dreaming of revenge on the world that, in their minds, betrayed, wronged, and hurt them. Based on my studies, I would argue that most wights are bound to a specific location, often their own tomb or place of death. But I can also conclude that some manage to break free, which allows them to move freely through the world. Some of these immediately begin to pursue their dreams of revenge; others are able to control their urges long enough to raise an entire army of undead, which they then command against any living creature that gets in their way. In conclusion, if life itself can be said to have a mortal enemy, the wight is most certainly a candidate for the position.
    quote: |
      “The catacombs under the castle ruin east of here are haunted by a wight. But it’s alright because it can’t get out of there. I think… I hope… Can it, mommy!?”
      – Henriel Skakke, cobbler’s daughter
    random_encounter: The player characters see a hill in the distance, crowned by an ancient stone circle. Several of the moss-covered stones have fallen over and are partially covered by grass. In the middle of the stone circle, the ground has collapsed to reveal a simple burial chamber, empty and abandoned. The whole place stinks of hate and anyone who stays here for more than a stretch becomes Scared.
    adventure_seed: "The scholar Xeizial is searching high and low for adventurers to help her find the tomb where the wight Gildraveth is said to be trapped, somewhere in a vast marsh. Equipped with an ancient map and a mysterious book bound in basilisk skin, Xeizial leads the player characters into the swamp, towards the final resting place of Gildraveth. The closer they get to the tomb, the more disturbing the expedition leader’s behavior becomes. She stops eating and stares incessantly at the night sky, mumbling ancient phrases and flipping frantically through her unholy book. And she refuses to tell the characters what is troubling her. When they arrive, Xeizial’s diabolical plan begins to unfold. Under the dark influence of Gildraveth, she has lured the characters here to become the blood sacrifices that will free the wight from its shackles. Xeizial’s duplicity is revealed as they descend into the tomb and encounter the wight: then Xeizial stabs them in the back!"
