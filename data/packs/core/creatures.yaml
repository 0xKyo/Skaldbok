        text: Cock-a-Doodle-Doo! The basilisk lets out a cacophonous crow that pierces the player characters and makes their ears bleed. Everyone within 10 meters must roll against CON (not an action). On failure the victim falls to the ground, becomes Dazed, and loses their next turn.
