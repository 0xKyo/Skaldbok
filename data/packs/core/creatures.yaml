  - id: rulebook-skeleton
    name: Skeleton
    category: Bestiary
    description: Skeletons are the remains of humanoids who have been raised from the dead through powerful magic. They are lesser undead and lack both will and true consciousness. They are primarily used for simple tasks, for instance as guards, foot soldiers, or servants. Powerful sorcerers are also known to use skeletons to dig tunnels, move soil and heavy rocks, and perform other tasks related to construction work. They have difficulty understanding complex instructions, but are cheap and labor without complaint – as long as they are not stopped by meddlesome adventurers.
    image: images/rulebook/skeleton-12.jpg
    image_page: 100
    statblocks:
      - variant: Warrior
        fields:
          Movement: "8"
          Damage Bonus: —
          HP: "8"
          Typical Armor: Studded leather (2)
          Skills: Awareness 8, Evade 6
          Typical Weapon: Short sword (skill level 12, damage D10)
      - variant: Archer
        fields:
          Movement: "8"
          Damage Bonus: —
          HP: "8"
          Typical Armor: Leather (1)
          Skills: Awareness 8, Evade 6
          Typical Weapon: Dagger (skill level 10, damage D8), crossbow (skill level 12, damage 2D6)
      - variant: Champion
        fields:
          Mov.: "10"
          Damage Bonus STR: +D6
          HP: "24"
          Typical Armor: Chainmail (4)
          WP: "15"
          Skills: Awareness 12, Evade 8
          Abilities: Veteran, Defensive, Double Slash, Robust × 4
          Typical Weapon: Longword (skill level 16, damage 2D8), large shield
    abilities:
      - name: Non-Monster
        kind: ability
        text: Skeletons do not count as monsters in combat, but as ordinary NPCs.
      - name: Resistance
        kind: ability
        text: All piercing damage is halved (rounded up).
      - name: Immunity
        kind: ability
        text: Skeletons are immune to fear and PERSUASION.
  - id: rulebook-troll
    name: Troll
    category: Bestiary
    description: "Stories of cruel, black-hearted trolls are told among most peoples of the world to keep their children in line. And they really are terrifying beasts: as large and massive as moving boulders, with great tusks and staring eyes that glow a sickly yellow. But their reputation is somewhat unfair. It is true that they are often in a terrible mood and exceedingly dangerous to encounter, but the reasons for this are usually their endless hunger and the signals they get from the hostile world around them. Drawn weapons and sudden movements trigger their terrible, all-consuming wrath, but trolls who are offered food and met with kindness can be surprisingly agreeable."
    attack_dice: D6
    image: images/rulebook/troll-13.jpg
    image_page: 101
    statblocks:
      - fields:
          Ferocity: "2"
          Size: Large
          Movement: "10"
          Armor: —
          HP: "38"
          Regeneration: A troll automatically heals D6 HP on each of its turns in combat.
          Sensitive to Sunlight: Trolls suffer D6 damage per round in direct sunlight , and cannot regenerate. A troll that reaches zero HP because of this is turned to stone. A thick layer of clouds or full-cover clothing are enough to avoid the effect.
          Persuadable: Unlike other monsters, trolls can usually be PERSUADED, albeit with a bane on the roll.
    attacks:
      - roll: "1"
        name: Troll Vomit!
        text: Troll Vomit! The troll clears its throat with a thunderous rumble, coughs from deep in its lungs, and vomits up a cascade of bile and stinking swamp water. All adventurers within 6 meters suffer a condition of their choice.
      - roll: "2"
        name: Rending Attack!
        text: Rending Attack! The troll tears at a player character’s body with its filthy, green-black claws. The attack inflicts D10 slashing damage but can be parried. A victim who takes damage also con-tracts a disease with virulence 10.
      - roll: "3"
        name: Repulsive Bite!
        text: Repulsive Bite! The troll opens its foul-smelling mouth and bites a player character with a denture of fangs, gravel, and old bone fragments. The attack inflicts 2D8 piercing damage. The player character is stuck in the troll’s mouth and must make a STR roll (counts as an action) every round to break free. On failure the victim suffers an additional 2D8 damage.
      - roll: "4"
        name: Troll Throw!
        text: Troll Throw! The troll lifts a character over its head and tosses the victim like a rag doll 2D6 meters in a random direction, inflicting an equal amount of bludgeoning damage. The victim lands prone.
      - roll: "5"
        name: Sweeping Blow!
        text: Sweeping Blow! The troll sweeps its long, gnarled arms around, hitting all characters within 2 meters. The attack inflicts 2D6 bludgeoning damage on each victim.
      - roll: "6"
        name: Mangling Smash!
        text: Mangling Smash! The troll grabs the nearest player character and uses the victim as a weapon by slamming them into another character. Both suffer 2D8 bludgeoning damage and are knocked down.
  - id: rulebook-wight
    name: Wight
    category: Bestiary
    description: Wights are the undead spirits of princes, princesses, and great warriors. They are powerful beings and have a will of their own, unlike creatures such as skeletons. However, this will is linked to a torn consciousness where hatred of the living is the dominant feature. Wights differ from ghosts in that they are corporeal, often wearing ancient armor and wielding mighty weapons and artifacts they took with them to their graves. Luckily, they are often bound to certain places, such as the burial mound where they were entombed.
    attack_dice: D6
    image: images/rulebook/wight-14.png
    image_page: 102
    statblocks:
      - fields:
          Ferocity: "2"
          Size: Normal
          Mov.: "10"
          Armor: Same as armor
          HP: "38"
          Resistance: Takes half damage from non-magical weapons, except fire which inflicts normal damage.
          Typical Gear: Morningstar, chainmail
    attacks:
      - roll: "1"
        name: Unholy Roar!
        text: Unholy Roar! The wight’s decomposed skull contorts and lets out a ghastly scream that cuts like a rusty blade through the characters’ souls. Everyone within 10 meters suffers a fear attack.
      - roll: "2"
        name: Dreadful Gaze!
        text: Dreadful Gaze! An unlucky player character stares directly into the wight’s horrible eyes as a wheezing sound is heard from the creature’s throat. The victim becomes Scared, suffers a fear attack, and gets a bane on their WIL roll.
      - roll: "3"
        name: Hand of the Dead!
        text: Hand of the Dead! The wight raises its hand and gestures at a player character within 10 meters, who is thrown 2D4 meters away and lands prone. The attack inflicts the same amount of damage and cannot be dodged.
      - roll: "4"
        name: Sweeping Attack!
        text: Sweeping Attack! With surprising speed, the wight sweeps its weapon in a deadly attack. All player characters within 2 meters suffer weapon damage. The attack can be parried.
      - roll: "5"
        name: Crippling Cold!
        text: Crippling Cold! The wight grabs an unfortunate player character who feels the chill of death spread through their body. The victim takes D6 damage (armor has no effect) and must make an EVADE roll (not an action) on their next turn in order to act at all. If the roll fails, a new attempt can be made on the next turn. The victim also becomes cold and cannot heal HP or WP until they get warm.
      - roll: "6"
        name: Power Attack!
        text: Power Attack! With creaking joints, the wight swings its weapon in a powerful attack against a character. The damage is rolled with twice the weapon’s normal number of dice, and the victim is knocked to the ground. The attack can be parried.
  - id: rulebook-vampiric-bats
    name: Vampiric Bats
    category: Bestiary
    description: There are countless species of bats in the world of Dragonbane. Some are small and virtually harmless, others are as big as winged goblins and can bite the head off a grown human with a single snap of the jaw. The feared vampire bat falls somewhere in between. They have a wingspan of one meter and a strong appetite for human blood. Vampire bats always hunt in flocks and are often found in underground burial chambers, where they feed on grave robbers and other adventurers.
    attack_dice: D6
    image: images/rulebook/vampiric-bats-15.jpg
    image_page: 103
    statblocks:
      - fields:
          Ferocity: "2"
          Size: Swarm
          Movement: "24"
          Armor: —
          HP: "18"
          Resistance: The bats attack as a swarm and therefore count as a single creature. All damage from physical weapons, even magical ones, are reduced by half (rounded up). Fire has normal effect.
    attacks:
      - roll: 1–2
        name: Swirling Horror!
        text: Swirling Horror! The bats swarm around their victims at a frantic pace. Everyone within 10 meters suffers a fear attack.
      - roll: 3–4
        name: Collective Attack!
        text: Collective Attack! The bats launch a joint assault on the player character with the highest CON. The attack inflicts 2D6 slashing damage and the victim suffers a fear attack, and the bat swarm heals the same amount of HP from drinking their victim’s blood.
      - roll: 5–6
        name: Mass Attack!
        text: Mass Attack! The bats split up to attack all characters within 10 meters. Each victim suffers D8 slashing damage and the bat swarm heals the same amount of HP from drinking their victims’ blood.
