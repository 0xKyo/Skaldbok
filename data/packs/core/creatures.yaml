        text: Battle Shout! The worg rider rallies his underlings. All remaining scouts get a boon to all attacks until the worg rider’s next turn.
      - roll: "5"
        name: Worg Bite!
        text: Worg Bite! The worg grabs a victim in its drooling maw and starts swinging them back and forth. The attack inflicts 2D10 piercing damage and the victim is hurled 2D4 meters and lands prone.
      - roll: "6"
        name: Spear Charge!
        text: Spear Charge! The worg rider tries to skewer a player character with his spear by charging straight at them. The attack inflicts 3D8 piercing damage but can be parried.
