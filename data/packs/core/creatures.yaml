  - id: bestiary-blood-demon
    name: Blood Demon
    source: bestiary
    category: Demons
    description: "This vile monstrosity goes by two names: blood demon or onaqui. I prefer the former, which refers to the creature’s thirst for blood – something that long led scholars to think of it as a kind of arch-vampire rather than a demon. The name onaqui stems from the oldest times, when the creatures served as scouts and advance units for the vast armies of the demonic realm; the name presumably alludes to the sound of their dreadful roar. Although the vampire theory has long since been disproved, there may be reason to consider the idea of a kinship between them. According to several accounts, both old and new, the blood demon does not only drink blood but feasts on the hearts of vanquished foes, preferably just as they stop beating. Could blood demons be the original source of vampirism?"
    quote: |
      “When the bodies started turning up, the village erupted into chaos. Neighbors suspected each other; several innocent people were executed, but the murders continued. Many fled. Everyone who remained was killed, one by one. Except me. I wonder why…”
      – Filimon Amsel, abbot
    random_encounter: "One night when the player characters have set up camp, they hear screaming not far from the campsite. Then they see a shadow pass across the bright moon – a huge bat-like monstrosity that clumsily disappears into the night. If the adventurers investigate what happened, they find the corpses of two hunters. Their hearts have been ripped out and their bodies drained of blood. The lack of blood on the ground leads the characters to a hair-raising conclusion: the monster that killed these unfortunate souls also drank their blood."
    adventure_seed: After an encounter with demons or demon cultists, the player characters happen to arouse the curiosity of a demon named Gahanz. She orders her servant, the blood demon Tizinican, to follow them and report on their activities and capabilities. This goes on for quite some time, and Tizinican inevitably causes some chaos and destruction along the way – not least the trail of bloodless corpses with torn-out hearts left in the characters’ wake, which soon starts attracting the attention of those around them. Once the characters realize they are being followed and become more vigilant, they may find traces of the blood demon here and there; they may even catch a glimpse of its hideous form. The adventurers must set some kind of trap to get rid of their unwanted traveling companion.
    attack_dice: D6
    image: images/bestiary/blood-demon-103.jpg
    image_page: 141
    statblocks:
      - fields:
          Ferocity: "2"
          Size: Large
          Movement: "14"
          Armor: "2"
          HP: "48"
