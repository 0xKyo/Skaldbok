    name: Quasimund’s Scum
    source: adventure
    kind: npc
    category: Outskirt
    description: Quasimund’s Scum are the dregs of Outskirt, drunken wrecks of settlers and adventurers who lost everything in their pursuit of riches. Like Quasimund they have sold their souls to Sathmog and are always willing to give their lives for the supreme darkness. They attack as a group, at least equal in number to the player characters.
