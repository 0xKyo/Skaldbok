  - id: bestiary-orc
    name: Orc
    source: bestiary
    category: Nightkin
    description: Countless battles have been fought between orcs and other kin. However, few besides yours truly will acknowledge the cause of these misfortunes. The orcs I have spoken to during my travels said they encountered arrogance and ignorance wherever they went, that they were often
    quote: |
      “Peaceful orcs? Wise orcs? Are you out of your mind!? There is nothing good, sound, or wise about orc scum. They are monsters, plain and simple!”
      – Lumert Wred, mercenary
    random_encounter: Calls for help reach the player characters. With his foot caught in a snare, the orc warrior Ogder is dangling upside down in a tree. Helplessly trapped, he curses and shouts, commanding them to free him. If the adventurers decide to help Ogder, despite his rather gruff personality, the orc mutters his thanks and warns them of a giant spider lurking nearby, before leaving them to return to his clan.
    adventure_seed: "Exhausted and bloodied, an orc staggers into the square of the village where the player characters are staying. She croaks out a few words before losing consciousness: “Messenger… friend wounded, important letter from Chieftain Grimner… in cave, half a day, west-northwest. Death… is coming…” A successful SPOT HIDDEN or HUNTING & FISHING roll can lead the adventurers to a small cave where a recently deceased orc is curled up. In their knapsack is a letter: a warning from Orc Chieftain Grimner that a troop of orcs from another clan is planning to attack the village. Can the player characters make it back in time to stop the attack? And why did Grimner want to warn the village? The only way for the characters to find out is to visit the dreaded warrior chief."
    image: images/bestiary/orc-49.jpg
    image_page: 18
    statblocks:
