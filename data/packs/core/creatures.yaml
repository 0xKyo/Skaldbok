  - id: bestiary-cat-people
    name: Cat People
    source: bestiary
    category: Rare Kin
    description: Even I do not know the exact size of the world’s cat people population, largely because they live in such seclusion and isolation. However, I am convinced that they have come here from warmer regions somewhere in the south, where their kind should be more numerous. The few I
    quote: |
      “One thing I’ve been wondering about ever since that group of cat people passed through the village the other day… well, how do they clean themselves?”
      – Stinla Humle, curious girl
    random_encounter: The howling of wolves is heard not far from the player characters. The pack sounds excited, and there is an occasional whimper of pain. If the player characters follow the noise, they find that a pack of wolves has surrounded a tree where the cat man Amiz has taken refuge. He is trying to repel the attackers with his sling. If the wolves are killed or dispersed, Amiz climbs down and thanks the player characters before continuing his journey alone. The player characters can PERSUADE him to join them.
    adventure_seed: A cat woman named Inis is held prisoner by the mage Haldur Grumble. The wizard encountered Inis as she wandered the land and lured her to his tower, where he is now trying to learn all about cat people by interrogating his prisoner through magical means. But her friend, the cat man Feliz, has finally figured out what happened to her and wants the player characters’ help to free her. Haldur will not let anyone see Inis and claims that he has imprisoned a demon, knowing full well that he cannot incarcerate another intelligent being with impunity. The only way to free Inis is to break into the tower!
