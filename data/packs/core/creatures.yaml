creatures:
  - id: rulebook-gnome
    name: Gnome
    category: Summoned creatures (Elementalism)
    description: The spell summons an earth elemental. The gnome takes the form of a humanoid of gray-brown sand or clay, and counts as a monster in combat. It follows its creator’s commands (free action) and acts independently with its own initiative, but must stay within sight of the mage.
    statblocks:
      - fields:
          Movement: "8"
          HP: 5 per power level
          Armor: "4"
          Weapons: Fists of stone. Hits automatically in melee combat (but can be dodged or parried) and inflicts D6 bludgeoning damage per power level.
          Pillar: The gnome can cast PILLAR at the same power level as its own, using the mage’s WP.
  - id: rulebook-salamander
    name: Salamander
    category: Summoned creatures (Elementalism)
    description: |
      The spell summons a fire elemental. The salamander takes the form of a lizard of fire, and counts as a monster in combat. It follows its creator’s commands
      (free action) and can act independently with its own initiative, but must stay within sight of the mage.
    statblocks:
      - fields:
          Movement: "12"
          HP: 5 per power level
          Armor: —
          Weapons: Flaming grip. Hits automatically in melee combat (but can be dodged) and inflicts D6 damage per power level. Armor has no effect.
          Fire Orb: The salamander can cast FIRE BLAST at the same power level as its own, using the mage’s WP.
          Resistance: Piercing damage is halved.
          Immunity: The salamander is immune to fire damage, including magical fire damage.
  - id: rulebook-sylph
    name: Sylph
    category: Summoned creatures (Elementalism)
    description: The spell summons a wind elemental. The sylph looks like a storm cloud in the shape of a bird. It counts as a monster in combat, follows its creator’s commands (free action), and can act independently with its own initiative, but must stay within sight of the mage.
    statblocks:
      - fields:
          Movement: "24"
          HP: 5 per power level
          Armor: —
          Weapons: Howling winds. Hits automatically in melee combat (but can be dodged). The attack hurls the victim D4 meters per power level and inflicts the same amount of bludgeoning damage.
          Gust of Wind: The sylph can cast GUST OF WIND at the same power level as its own, using the mage’s WP.
          Resistance: Piercing damage is halved.
  - id: rulebook-undine
    name: Undine
    category: Summoned creatures (Elementalism)
    description: The spell summons a water elemental. The undine looks like a tidal wave whose crest is shaped like a woman composed entirely of water. It counts as a monster in combat, follows its creator’s commands (free action), and can act independently with its own initiative, but must stay within sight of the mage.
    statblocks:
      - fields:
          Movement: "12"
          HP: 5 per power level
          Armor: —
          Weapons: Wet embrace. Hits automatically in melee combat (but can be dodged) and inflicts D6 damage per power level. Armor has no effect.
          Tidal Wave: The undine can cast TIDAL WAVE at the same power level as its own, using the mage’s WP.
          Resistance: Piercing damage is halved.
  - id: rulebook-demon
    name: Demon
    category: Bestiary
    description: |
      Demons are mysterious and terrifying creatures from the grim world beyond. Like dragons, they are sprung from ancient magic, and they are driven by the same insatiable, arrogant hunger for power that also burns in the hearts of dragons. They view dragons as mortal enemies and despise all other creatures as lesser and essentially insignificant forms of life. They have a destructive effect on the structures of the world and seek to destroy all that is fixed – from social relationships, peace treaties, and friendships, to nations, civilizations, and cosmic laws.
      Demons come in all shapes and sizes, but their appearance is always frightening. The stats below are only an example.
    attack_dice: D6
    statblocks:
      - fields:
          Ferocity: "2"
          Size: Large
          Movement: "16"
          Armor: "4"
          HP: "64"
    attacks:
      - roll: "1"
        name: Demonic Dread!
        text: Demonic Dread! The demon hisses terrifying threats in an ancient and terrible tongue. All player characters within 10 meters suffer a fear attack.
      - roll: "2"
        name: Claw Attack!
        text: Claw Attack! The demon smiles and slashes a player character with its sharp claws. The attack inflicts 2D10 slashing damage. It can be parried.
      - roll: "3"
        name: Curse!
        text: "Curse! The demon points at an unfortunate player character within 10 meters and chants an ancient curse. The attack cannot be dodged, but all curses except #6 can be lifted with DISPEL (power level 1). Roll D6: The victim vomits a frog whenever they tell a lie. Roll D4 every morning. On a 1, the effect wears off. 1 Any gold or silver the victim touches withers into dust. Roll D4 every morning. On a 1, the effect 2 wears off. The victim is blinded and acts as if in total darkness. Roll D4 every shift. On a 1, the effect wears off. 3 The victim is struck by amnesia and forgets their own name and who the other player characters are. 4 The effect must be roleplayed. Roll D4 every morning. On a 1, the victim’s memory returns. The victim turns into an animal. Roll D6. 1: cat, 2: fox, 3: goat, 4: wolf, 5: deer, 6: bear. The victim gains 5 stats as per page 99 and cannot speak. Roll D4 every shift. On a 1, the effect wears off. The victim becomes one category older, for example from Adult to Old. Their attributes and derived 6 ratings change as per the table on page 24, but skill levels do not. The effect is permanent, and the victim ages normally from their new age. A person who is already old becomes very frail and gets −2 STR and CON."
      - roll: "4"
        name: Unseen Ferocity!
        text: Unseen Ferocity! The demon points its hand at a victim within 10 meters. The victim is hurled 2D8 meters backwards with tremendous force, suffers the same amount of bludgeoning damage, and lands prone.
      - roll: "5"
        name: Scorpion Sting!
        text: Scorpion Sting! The beast raises its scorpion-like tail and delivers a swift sting to its victim. The attack inflicts D12 piercing damage, and a victim who sustains at least 1 point of damage is also injected with a paralyzing poison with potency 16. The attack can be parried.
      - roll: "6"
        name: Possessed!
        text: Possessed! The demon glares at a player character within 10 meters and takes full control of the victim’s body. The player character must make a WIL roll with a bane (not an action). If it fails, the victim must immediately make a movement and perform an action of the demon’s choice, except any action that requires spending WP. The victim also loses their next turn.
  - id: rulebook-dragon
    name: Dragon
    category: Bestiary
    description: Dragons are vicious, reptilian beasts mainly found in rugged mountainous areas, where they build their dens in deep caves or abandoned dwarven mines. They are ancient beings of power and magic who consider themselves the true masters of the world. Dragons are cunning and often frighteningly eloquent, notorious for deceiving their victims with fair words and treacherous lies. On the other hand, they are as vain as peacocks and themselves susceptible to silver-tongued flattery. Another weakness is their attraction to gold, which often causes conflicts with dwarves, humans, and others who share the draconic lust for treasure and glittering objects.
    attack_dice: D6
    image: images/rulebook/dragon-2.png
    image_page: 90
    statblocks:
      - fields:
          Ferocity: "3"
          Size: Huge
          Movement: "24"
          Armor: "6"
          HP: "84"
          Wings: The mighty wings of the dragon allow it to move freely through the air.
    attacks:
      - roll: "1"
        name: Dragon Roar!
        text: Dragon Roar! The dragon opens its mouth and lets out a chilling roar. All player characters within 20 meters suffer a fear attack, with a bane on the WIL roll.
      - roll: "2"
        name: Claw Attack!
        text: Claw Attack! The dragon sweeps its claws at two player characters, who suffer 2D10 slashing damage each.
      - roll: "3"
        name: Dragon Wind!
        text: Dragon Wind! The dragon flaps its great wings and creates a powerful gale that strikes all adventurers within 10 meters. Any loose objects and creatures of up to human size in the whirlwind are hurled 2D6 meters, take the same amount of bludgeoning damage, and land prone.
      - roll: "4"
        name: Tail Strike!
        text: Tail Strike! The dragon sweeps its spiked tail at its victims. All player characters within 6 meters suffer 2D8 bludgeoning damage and are knocked down.
      - roll: "5"
        name: Dragon Bite!
        text: Dragon Bite! The beast opens its great jaws and devours a victim with terrifying speed. The attack inflicts 4D10 slashing damage.
      - roll: "6"
        name: Fire Breath!
        text: Fire Breath! The dragon towers over the player characters in all its splendor before unleashing a devastating storm of fire from its mouth. The fire forms a cone that is 10 meters long and whose width at any given point equals the distance from the dragon’s mouth. Any player character hit by the flames suffers 3D10 damage. Armor has no effect.
  - id: rulebook-ghost
    name: Ghost
    category: Bestiary
    description: Ghosts are the restless spirits of those unable to find peace in death. They are incorporeal undead who usually manifest themselves as translucent figures, often shimmering blue with twisted facial features. They are always bound to certain places, normally linked to their physical remains or the event that caused their premature death. Ghosts almost always have a specific problem that needs to be solved for them to find eternal peace and leave the living alone. It may be a matter of revenge or a debt that must be paid; other times the ghost’s remains must be collected and given a proper burial.
    attack_dice: D6
    image: images/rulebook/ghost-3.jpg
    image_page: 91
    statblocks:
      - fields:
          Ferocity: "2"
          Size: Normal
          Movement: "12"
          Armor: —
          HP: "27"
          Immunity: Ghosts are immaterial beings and immune to all damage except magic and fire. A defeated ghost is only banished for one shift, after which it returns. The only way to banish the ghost permanently is to cast PURGE or solve whatever problem keeps it bound to the world of the living.
          Persuadable: Unlike other monsters, ghosts can usually be PERSUADED, albeit with a bane on the roll.
    attacks:
      - roll: "1"
        name: Ghost Strike!
        text: Ghost Strike! The ghost lunges at a player character within 10 meters and strikes with great force. The victim is knocked back 2D6 meters, suffers the same amount of bludgeoning damage, and lands prone.
      - roll: "2"
        name: Touch of Death!
        text: Touch of Death! The ghost sticks its translucent hand into the chest of an unfortunate player character and grasps the victim’s heart. The victim suffers 2D10 points of damage and becomes Scared. Armor has no effect.
      - roll: "3"
        name: Ghost Scream!
        text: Ghost Scream! The undead face contorts into a horrible grimace and lets out a scream that chills the souls of all adventurers within 10 meters. All of them suffer a fear attack.
      - roll: "4"
        name: Death Stare!
        text: Death Stare! The ghost towers over a player character, staring directly into their soul with its dead eyes. The victim sees their life pass before their eyes and is tormented by grotesque visions of all their dead friends and foes. The victim becomes Scared, suffers a fear attack, and gets a bane on their WIL roll.
      - roll: "5"
        name: Ghostly Embrace!
        text: Ghostly Embrace! The ghost emits an unnatural wheeze and suddenly appears right in front of an adventurer within 10 meters, wrapping them in a deadly embrace to smother their spark of life. The attack inflicts 3D6 bludgeoning damage and leaves the victim Dazed.
      - roll: "6"
        name: Cold Strike!
        text: Cold Strike! The ghost grabs a victim and lets the icy chill of death stream into their body. The player character suffers 2D8 damage and cannot heal HP or WP until they spend one shift in a warm location. Armor has no effect.
  - id: rulebook-giant
    name: Giant
    category: Bestiary
    description: Giants are colossal humanoids with a strong but mysterious connection to the very bedrock of the world. Some scholars believe that they are related to dwarves; others maintain that they are remnants of a great civilization that long ago rose against the dragons. Giants are mainly found in mountainous areas, where they live alone or in small families. They are normally quite shy and reclusive, but some are highly territorial and will attack anyone who comes too close to their caves.
    attack_dice: D6
    image: images/rulebook/giant-4.jpg
    image_page: 92
    statblocks:
      - fields:
          Ferocity: "1"
          Size: Huge
          Movement: "18"
          Armor: —
          HP: "74"
          Weapons: Giants often carry a large weapon. If
    attacks:
      - roll: "1"
        name: Crushing Blow!
        text: Crushing Blow! The giant swings its weapon over its head and bashes a player character with all its might. The attack inflicts 4D10 bludgeoning damage and the victim is knocked down.
      - roll: "2"
        name: Roar!
        text: Roar! The giant lets out a bellowing sound that raises the hairs on the adventurers’ arms. All player characters within 10 meters suffer a fear attack.
      - roll: "3"
        name: Stomp Attack!
        text: Stomp Attack! The giant takes aim and tries to stomp two player characters within 4 meters of each other. Anyone hit by the attack suffers 4D6 bludgeoning damage and is knocked down.
      - roll: "4"
        name: Sweeping Blow!
        text: Sweeping Blow! The giant sweeps its weapon at all adventurers within 10 meters. Anyone hit by the attack suffers 2D10 bludgeoning damage and is knocked down.
      - roll: "5"
        name: Forceful Throw!
        text: Forceful Throw! The giant is fed up with a character, grabs them, and tries to throw them. The attack inflicts 4D8 bludgeoning damage and the victim is hurled the same number of meters in a random direction, landing prone.
      - roll: "6"
        name: Smash Attack!
        text: Smash Attack! Crazed with rage, the giant smashes the player character with its feet, fists, and weapon in a frenzy of rapid blows. Everyone within 2 meters suffers 3D6 bludgeoning damage and is knocked down.
    abilities:
      - name: Weak Spot
        kind: ability
        text: Attacks against the weak spot on the top of a giant’s head inflict double damage. Hitting the top of the head requires either a ranged attack with a bane from an elevated position or that the attacker first climbs onto the giant. The latter requires an ACROBATICS roll with a bane. Once up there, the player character must make another ACROBATICS roll (not an action) on each turn to avoid falling off and taking 2D6 falling damage.
  - id: rulebook-giant-spider
    name: Giant Spider
    category: Bestiary
    description: Giant spiders are rapacious predators that can unfortunately be found all over the world. They are drawn to dark and damp spaces, but always on the hunt for living meat in forests and caves as well as mountains and ruined cities. Particularly sly individuals can even build their nests under popular inns or near underground libraries and treasure chambers. Ancient females can grow as large as a house, but most are roughly the size of a well-fed cow. Giant spiders are smarter than they look, and in some parts of the world, older females can attain the status of oracles or demigods.
    attack_dice: D6
    image: images/rulebook/giant-spider-5.jpg
    image_page: 93
    statblocks:
      - fields:
          Ferocity: "2"
          Size: Normal
          Movement: "24"
          Armor: —
          HP: "36"
    attacks:
      - roll: "1"
        name: Mandibles!
        text: Mandibles! The spider’s serrated mandibles swish through the air like scimitars. The attack inflicts 2D8 slashing damage.
      - roll: "2"
        name: Tearing Attack!
        text: Tearing Attack! The famished spider lunges at the player characters, frantically attacking with its multitude of hairy, barbed legs. All player characters within 2 meters suffer D8 piercing damage each.
      - roll: "3"
        name: Mesmerizing Eyes!
        text: Mesmerizing Eyes! The monstrous arachnid stares at the player characters with a terrifying multitude of eyes. All victims within 10 meters must make a WIL roll to resist fear.
      - roll: "4"
        name: Poison Sting!
        text: Poison Sting! The eight-legged horror raises its rear end and attacks a player character with a poisonous stinger that shoots out of its repulsive body. The attack inflicts D10 piercing damage, and a victim who sustains at least 1 point of damage is also injected with a paralyzing poison with potency 16. The attack can be parried.
      - roll: "5"
        name: Web Attack!
        text: Web Attack! The spider fixes its numerous eyes on the player character with the highest STR. The next moment it spits sticky spider web at the victim, who must make an EVADE roll (not an action). On failure the victim is caught in the web and unable to move. It takes a successful STR roll with a bane (action) to break free. Other can help.
      - roll: "6"
        name: Ramming Attack!
        text: Ramming Attack! With a great leap, the giant spider launches its massive body at a player character. The attack inflicts 2D6 bludgeoning damage and knocks the victim down.
  - id: rulebook-goblin
    name: Goblin
    category: Bestiary
    description: Goblins are children of the night and shadows. They are relatively small and skinny, but have disproportionately long arms and big, bulbous heads. They primarily make their living hunting, growing mushrooms, and trading with other creatures, mainly orcs and humans, but there are also warlike, aggressive clans specialized in looting and piracy. Many thieves’ guilds also have a large goblin membership. They are cunning creatures who often resort to traps, ambushes, and poisons when attacking their victims. For this reason, there are many who despise the goblins and see them as devious, dishonorable cowards.
    image: images/rulebook/goblin-6.jpg
    image_page: 94
    statblocks:
      - variant: Scout
        fields:
          Movement: "10"
          Damage Bonus: —
          HP: "9"
          Typical Armor: Leather (1)
          Skills: Awareness 10, Evade 10, Sneaking 12
          Typical Weapons: Short bow (skill level 12, damage D10), short sword (skill level 10, damage D10)
      - variant: Warrior
        fields:
          Movement: "10"
          Damage Bonus: —
          HP: "10"
          Typical Armor: Studded leather (2)
          Skills: Awareness 10, Evade 10, Sneaking 12
          Typical Weapon: Long spear (skill level 12, damage 2D8)
    abilities:
      - name: Non-Monster
        kind: ability
        text: Goblins do not count as monsters in combat, but as ordinary NPCs.
      - name: Nocturnal
        kind: ability
        text: In direct sunlight, goblins get a bane on all rolls and suffer D6 damage per stretch. A thick layer of clouds or full-cover clothing are enough to avoid the effect.
  - id: rulebook-griffon
    name: Griffon
    category: Bestiary
    description: The griffon is an aggressive predator specializing in hunting down prey in the forests of the world. Its hunting grounds extend many tens of kilometers from the tall tree or inaccessible cliff where the beast has its nest. Griffons normally live in pairs and a handful of chicks are often found in their nests, along with a plethora of items – rusted junk mixed with treasures and artifacts – left by unfortunate victims. There are tales of knights who managed to tame griffons and use them as winged mounts. However, it is an irrefutable fact that griffons like to feed on horses and donkeys, which often gets them into trouble with knights, adventurers, and other riders.
    attack_dice: D6
    image: images/rulebook/griffon-7.png
    image_page: 95
    statblocks:
      - fields:
          Ferocity: "2"
          Size: Large
          Movement: "30"
          Armor: —
          HP: "38"
          Wings: The powerful wings of the griffon allow it to move freely through the air.
    attacks:
      - roll: "1"
        name: Snapping Beak!
        text: Snapping Beak! The beast tears at a player character with its razor-sharp beak, for 2D8 piercing damage.
      - roll: "2"
        name: Rearing Strike!
        text: Rearing Strike! The griffon rears up before a player character and tries to tear them apart with D6 rapid strikes. Each attack inflicts D8 slashing damage. The attack can be dodged or parried, but only one at a time.
      - roll: "3"
        name: Sweeping Claws!
        text: Sweeping Claws! The griffon sweeps its clawed foreleg in a wide arc, attacking all player characters within 2 meters. Each victim suffers D8 slashing damage and is knocked down.
      - roll: "4"
        name: Griffon Throw!
        text: Griffon Throw! The beast grabs a player character with its beak and tosses them with a flick of the head. The attack inflicts 2D6 piercing damage. The victim is thrown an equal number of meters and lands prone.
      - roll: "5"
        name: Whirlwind!
        text: Whirlwind! The griffon uses its powerful wings to create a whirlwind that blows away all player characters within 10 meters. The victims land D6 meters away and suffers the same amount of bludgeoning damage.
      - roll: "6"
        name: High Drop!
        text: High Drop! The griffon grabs a player character in its claws and takes to the sky. Unless the victim dodges the attack, the griffon grabs them and flies 2D6+6 meters into the air. On its next turn the griffon drops the victim (instead of a new monster attack), who takes damage from the fall.
  - id: rulebook-harpy
    name: Harpy
    category: Bestiary
    description: Harpies are large, raven-like birds of prey with humanoid faces and mouths full of serrated fangs. They often seek out places like ruins and abandoned settlements where they live in colonies of different sizes. Harpies are plagued by insatiable hunger and like to supplement their daily diet with careless adventurers who stumble into their nests. They are cowardly but calculating hunters who always attack in flocks, preferably with a massive numerical advantage. The assaults often begin with the harpies
    attack_dice: D6
    image: images/rulebook/harpy-8.jpg
    image_page: 96
    statblocks:
      - fields:
          Ferocity: 1/harpy
          Size: Normal
          Movement: "24"
          Armor: —
          HP: 12/harpy
          Flock: Harpies fight together, and their monster attacks are performed by several harpies as a group. These attacks still only use up the turn in the round for one harpy. Once half the flock has been killed, the rest will flee. They return later if an opportune situation presents itself.
          Wings: Harpies attack from the air and can only be engaged with ranged weapons or long melee weapons.
    attacks:
      - roll: "1"
        name: Threatening Cackle!
        text: Threatening Cackle! The harpies shower the adventurers with terrible descriptions of what they will do to them. Everyone within 10 meters must make a WIL roll to resist fear.
      - roll: "2"
        name: Coordinated Attack!
        text: Coordinated Attack! The harpies flock together and attack the player character who wears the most metal. The attack inflicts 2D6 slashing damage. If hit, the victim is also lifted into the air and dropped from a height of D3+3 meters.
      - roll: "3"
        name: Death From Above!
        text: Death From Above! The harpies throw rocks and other junk from afar. Everyone within 10 meters suffers D6 bludgeoning damage.
      - roll: "4"
        name: Eye Gouge!
        text: Eye Gouge! The creatures target an unfortunate player character and try to tear the victim’s eyes out with their sharp claws. The attack inflicts 2D6 piercing damage and the victim is blinded and acts as if in total darkness for one stretch.
      - roll: "5"
        name: Mass Attack!
        text: Mass Attack! The harpies split up and attack a number of player characters within 10 meters equal to the number of individual harpies. Each attack inflicts D8 slashing damage.
      - roll: "6"
        name: Excrement Attack!
        text: Excrement Attack! The Harpies open their clo-acae and mouths and release a rain of vomit and excrement on the player characters. Everyone within 10 meters must choose a condition. The attack can be parried with a shield.
  - id: rulebook-manticore
    name: Manticore
    category: Bestiary
    description: The peculiar manticore is a bloodthirsty beast that spreads death and terror wherever it goes. Their origin is unknown, but some scholars believe them to be magical creatures that escaped from their dubious master or creator. Others view them as ancient hunger beasts, ruthless remnants from the dawn of time, roused from their slumber by the gods themselves. They have human-like faces, but seem incapable of human speech – probably because their maws are packed with sharp fangs. They have the body of a lion and their tail ends in a swollen lump, covered in spikes and nasty growths.
    attack_dice: D6
    image: images/rulebook/manticore-9.jpg
    image_page: 97
    statblocks:
      - fields:
          Ferocity: "2"
          Size: Large
          Movement: "16"
          Armor: —
          HP: "44"
    attacks:
      - roll: "1"
        name: Tail Strike!
        text: Tail Strike! The manticore aims a dreadful ranged attack with its tail spikes at a player character within 20 meters. The attack inflicts D12 piercing damage and injects the victim with a paralyzing poison with potency 12. The attack can be parried with a shield.
      - roll: "2"
        name: Razor Sharp Bite!
        text: Razor Sharp Bite! The manticore bites a player character with its many fangs, inflicting 3D8 slashing damage.
      - roll: "3"
        name: Claw Attack!
        text: Claw Attack! The beast runs up to a player character, knocks them down, and tears at them with its sharp claws. The attack inflicts 2D8 slashing damage, plus D6 since the victim is prone.
      - roll: "4"
        name: Sweeping Attack!
        text: Sweeping Attack! The manticore whips its tail at two player characters. Both victims suffer 2D6 slashing damage and are knocked down.
      - roll: "5"
        name: Crushing Charge!
        text: Crushing Charge! With full force, the beast charges at the player character with the highest STR within 10 meters. The victim suffers 3D6 bludgeoning damage and is knocked down.
      - roll: "6"
        name: Spike Rain!
        text: Spike Rain! The manticore fires a rain of deadly spikes from its tail. All adventurers within 10 meters suffer D10 piercing damage and are injected with a paralyzing poison with potency 12.
  - id: rulebook-minotaur
    name: Minotaur
    category: Bestiary
    description: Minotaurs are semi-intelligent and powerful beasts endowed by the gods with a bull’s head and a humanoid body. They are fearsome in battle, and bards sing songs of their incredible strength and inexhaustible fighting spirit. But minotaurs are also notorious for their inner rage which constantly threatens to break through and turn them into senseless killers. For this reason they tend to live in solitude and exile, restlessly roaming the world in search of food, gold, and glory. Sometimes they claim a small area as their own, often near a mountain pass, a ford, or a similar choke point, demanding road tolls and challenging passing travelers to duels.
    attack_dice: D6
    image: images/rulebook/minotaur-10.jpg
    image_page: 98
    statblocks:
      - fields:
          Ferocity: "2"
          Size: Large
          Movement: "16"
          Armor: —
          HP: "32"
          Typical Gear: Two-handed axe
    attacks:
      - roll: "1"
        name: Bull Fist!
        text: Bull Fist! A furry fist hits a player character with full force. The attack inflicts 2D6 bludgeoning damage and leaves the victim Dazed, even if their armor prevents any damage.
      - roll: "2"
        name: Hoof Kick!
        text: Hoof Kick! Using its powerful legs, the minotaur kicks the victim with its hooves. The force of the attack throws the victim 2D6 meters away and inflicts the same amount of bludgeoning damage. The victim lands prone.
      - roll: "3"
        name: Horn Rush!
        text: Horn Rush! The minotaur lowers its head and rushes toward two adventurers within 2 meters of each other, hoping to impale them with its sharp horns. Both victims suffer 2D8 piercing damage and are knocked down.
      - roll: "4"
        name: Cleaving Chop!
        text: Cleaving Chop! The beast swings its weapon over its head and brings it down with full force. The attack inflicts weapon damage plus an extra D10, and can be parried.
      - roll: "5"
        name: Sweeping Attack!
        text: Sweeping Attack! The minotaur roars and sweeps its weapon in a wide arc, hitting everyone within 2 meters. The attack inflicts weapon damage.
      - roll: "6"
        name: Stomping Attack!
        text: Stomping Attack! The minotaur jumps high in the air and comes crashing down on an adventurer, who suffers 2D10 bludgeoning damage and is knocked down.
  - id: rulebook-orc
    name: Orc
    category: Bestiary
    description: "Orcs are strong humanoids who live in well-organized clan societies. Some are settled, digging vast tunnel systems deep beneath the woods and mountains; others wander the vast steppes of the world as nomads. Orcs often have a formidable appearance: glowing black eyes, fangs the size of a wild beast’s tusks, and hard, vaguely camouflage-patterned skin. They are fierce warriors, widely respected for their undeniable bravery and weapon proficiency both in melee and at range. But orcs are also extremely"
    image: images/rulebook/orc-11.png
    image_page: 99
    statblocks:
      - variant: Warrior
        fields:
          Mov.: "10"
