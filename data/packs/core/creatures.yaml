      - roll: "5"
        name: Deadly Embrace!
        text: Deadly Embrace! A tangle of branches tries to squeeze the life out of a player character within 10 meters. The victim takes 2D8 bludgeoning damage and is grappled. Breaking free requires a successful STR roll with a bane (others can help) or an attack that inflicts at least 6 points of damage on the briars.
