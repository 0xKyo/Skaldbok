      - roll: "6"
        name: Long Drop!
        text: Long Drop! The hippogriff grabs a player character with its claws and leaps into the air. Unless they dodge the attack, the victim is lifted D6+6 meters into the sky. On its next turn, the hippogriff lets go (instead of making another monster attack) and the victim drops to the ground, taking damage from the fall.
  - id: bestiary-hydra
    name: Hydra
    source: bestiary
    category: Beasts
    description: Hydras live in swamps and marshes where they mostly hunt small game to survive, but they will feast on larger prey if the opportunity arises, preferably in the form of carrion. Whether hydras are related to dragons is a matter of dispute, but it makes little difference to anyone who comes face to face with this many-headed beast. The hydra’s heads are its most distinctive feature and its greatest strength. Countless fighters have succumbed to the venom-dripping jaws of a hydra, and as each severed head is replaced by two, the number of jaws soon overwhelms even the fiercest of warriors. Only through cunning, courage, and a bit of fire can the hydra be defeated!
    quote: |
      “From what I gather, it doesn’t have to be fire. You can also stop hydra heads from growing by throwing salt on the wound, or easier still: with a prayer to the forest god Ferrus.”
      – Olioniora Monkshood, leech farmer
    random_encounter: Traveling by boat through a swamp, the player characters notice ripples on the water. Suddenly a reptilian head appears a short distance from the boat. The creature watches them for a few moments before another head appears, and then a third. If the hydra is left alone, it soon vanishes below the surface without attacking. But if the player characters attack, the beast defends itself until it has lost two heads, at which point it decides to seek out easier prey.
    adventure_seed: The inhabitants of a halfling village have long been growing and harvesting mystical herbs on the edge of a swamp. A few moons ago, the farmers started disappearing without a trace, and the villagers have a clear idea why – the old troll hag Jorma who lives out in the swamp wants the herbs for herself and has placed a curse on the halflings. If the player characters seek out the forest troll, they find her hut surrounded by wolves trying to free the pup that Jorma has fallen in love with; that situation must be resolved before the player characters can talk to the clearly senile troll and rule her out as the culprit. A more thorough investigation of the area where farmers are said to have disappeared reveals traces of a monster – specifically a hydra, which must be lured out and slain to put an end to the disappearances.
    attack_dice: D6
    image: images/bestiary/hydra-82.jpg
    image_page: 93
    statblocks:
      - fields:
          Ferocity: 1/head
          Size: Large
          Movement: "8"
          Armor: "3"
          HP: 10/head
          Many-Headed: A typical hydra has D3+1 heads. Each head has 10 HP. To slay the monster, all of these must be severed or crushed. However, for each defeated head, two new ones grow out of the neck stump at the start of the next round, unless the wound is burned with fire before then, for example with a torch (counts as an attack with a club) or a spell. The player characters can realize this with a successful BEAST LORE roll.
    attacks:
      - roll: "1"
        name: Swift Bite!
        text: Swift Bite! The hydra thrusts its head forward at lightning speed and bites an opponent. The attack inflicts 2D6 slashing damage and infects the victim with a lethal poison with potency 12.
      - roll: "2"
        name: Poison Spit!
        text: Poison Spit! One of the hydra's heads gathers poisonous saliva deep in its throat and spits at an opponent within 10 meters, dealing D8 damage. If the damage exceeds the victim’s armor rating, the victim is also afflicted by a lethal poison with potency 12.
      - roll: "3"
        name: Rending Claws!
        text: Rending Claws! The monster attacks an opponent within 2 meters with its sharp claws. The victim suffers 2D6 slashing damage.
      - roll: "4"
        name: Tail Attack!
        text: Tail Attack! The hydra sweeps its thick tail at its victims. All opponents within 4 meters suffer 2D6 bludgeoning damage and are knocked down.
      - roll: "5"
        name: Crushing Slam!
        text: Crushing Slam! The monster suddenly lifts itself up on its strong legs and slams its heavy body down on all opponents within 4 meters. The victims suffer 2D6 bludgeoning damage and are knocked down.
      - roll: "6"
        name: Toxic Breath!
        text: Toxic Breath! The hydra towers over its opponents and exhales a stinking cloud of poison from one of its heads. The cloud forms a cone 6 meters long, whose width at any given point is equal to the distance from the hydra’s mouth. All victims within the cone are exposed to a lethal poison with potency 12.
  - id: bestiary-manticore
    name: Manticore
    source: bestiary
    category: Beasts
    description: "My observations and conversations seem to confirm what is written in the scroll I found in the arcane library of Fanghald (author unknown): manticores are extremely rare, and although their average lifespan is quite long (somewhere between two hundred and four hundred years), their numbers are decreasing every decade. This, of course, is of little comfort to those who find themselves in the clutches of a manticore – the beast’s insatiable hunger drives it to kill and devour everything in sight. And it will not be scared or lured away; if a manticore moves into your area, it is you who must run, or hire someone bold enough to take it on. In the latter case, be sure to word the contract so that it grants you ownership of the carcass. Mages can use its parts to create potions, enchanted weapons, and ingredients for spells – if you find the right buyer, you can even make a profit!"
    quote: |
      “Mages aren’t the only ones who have use for dead manticores. Their tail spikes can be made into armor-piercing arrowheads, their claws into easily concealed daggers, their wings into light but durable armor.”
      – Banior Hammer, weaponsmith
    random_encounter: "Each player character makes an AWARENESS roll. Those who succeed notice a swarm of spikes coming straight at them and have time to warn the others. Everyone must then roll EVADE to avoid being hit (if no one succeeds with their AWARENESS roll, everyone is automatically hit). The manticore makes one more attempt to shoot spikes at the player characters (see monster attack #6) before rising higher into the sky in search of easier prey."
    adventure_seed: "The scholar Iblit Tilbi has a theory. He argues that the manticore is a misunderstood creature and cites a number of stories by the mad poet Alasred which describe various civilizations living in prosperous harmony with the monster in question. Iblit is willing to pay well for protection from bandits and other monsters as he begins his expedition in search of irrefutable evidence. The journey takes them to a mountain range supposedly roamed by two manticores; once there, the player characters are ordered to place the bait: an enormous amount of smoked and dried meat. It is not long before first one, then a second, and finally a third manticore is seen circling in the sky. As soon as they approach the mountain of meat, Iblit starts reciting poetry in a melodic voice, and for a moment his crazy theory seems to be correct – the beasts land at the mountain of meat and begin to feast without bothering each other. But then the leader of the expedition takes a few steps forward and the beasts catch his scent: the delicious smell of fresh, warm flesh. If Iblit survives the attack, he is devastated for a day or two, until he is struck by another brilliant idea: the chimera is clearly misunderstood and can no doubt be tamed!"
    attack_dice: D6
    image: images/bestiary/manticore-83.jpg
    image_page: 95
    statblocks:
      - fields:
          Ferocity: "2"
          Size: Large
          Movement: "16"
          Armor: —
          HP: "44"
          Wings: The powerful wings of the manticore allow it to move freely through the air.
    attacks:
      - roll: "1"
        name: Tail Strike!
        text: Tail Strike! The manticore aims a dreadful ranged attack with its tail spikes at a player character within 20 meters. The attack inflicts D12 piercing damage and injects the victim with a paralyzing poison with potency 12. The attack can be parried with a shield.
      - roll: "2"
        name: Razor Sharp Bite!
        text: Razor Sharp Bite! The manticore bites a player character with its many fangs, inflicting 3D8 slashing damage.
      - roll: "3"
        name: Claw Attack!
        text: Claw Attack! The beast runs up to an opponent, knocks them down, and tears at them with its sharp claws. The attack inflicts 2D8 slashing damage, plus D6 since the victim is prone.
      - roll: "4"
        name: Sweeping Attack!
        text: Sweeping Attack! The manticore whips its tail at two opponents. Both victims suffer 2D6 slashing damage and are knocked down.
      - roll: "5"
        name: Crushing Charge!
        text: Crushing Charge! With full force, the beast charges at the player character with the highest STR within 10 meters. The victim suffers 3D6 bludgeoning damage and is knocked down.
      - roll: "6"
        name: Spike Rain!
        text: Spike Rain! The manticore fires a rain of deadly spikes from its tail. All adventurers within 10 meters suffer D10 piercing damage and are injected with a paralyzing poison with potency 12.
  - id: bestiary-medusa
    name: Medusa
    source: bestiary
    category: Beasts
    description: It is hard to stick to actual knowledge here, but my overall assessment of what I have read and heard is that the first medusa came into existence when one of the most powerful witches of the oldest times challenged the tyranny of the ruling powers. She failed and suffered a terrible revenge, by demons or dragons or both – she was cursed with a petrifying gaze, a mane of mockingly whispering serpents, useless hands of bronze, and a huge pair of bat wings. As for the other medusas, the prevailing theory seems to be that they were created by the first one because she wanted others to share the curse with. But we will never know for sure, because who would even try to approach the archmedusa for conversation…?
    quote: |
      “It makes no sense that wings would be part of a curse. Wings are a good thing! The whole theory of the medusa’s origin seems to fall apart in light of that detail.”
      – Pella Odling, thinker
    random_encounter: Nature suddenly falls silent around the adventurers – the birds stop chirping, the leaves stop rustling, the wind stops blowing. On the path ahead stands an exquisitely beautiful, incredibly lifelike statue of a deer caught in mid-stride. The medusa who petrified the deer, as punishment for its beauty and grace, has heard the player characters from afar and is hiding in the treetops next to the path. If the player characters approach the deer, she makes herself known to punish them as well.
    adventure_seed: An exceptionally skilled stone sculptor has moved into the area. Her eerily realistic statues sell for hundreds of gold coins, and everyone is amazed by the detail and perfect imperfections of her work. What nobody knows is that she has used ancient magic to trap a medusa; she keeps it in the basement of her workshop and lets it petrify fascinating people who are kidnapped by her two goons, mostly from the slums of a nearby town. The player characters are hired by a soon-to-be penniless competitor to investigate the truth behind the newcomer’s extraordinary creations. Once they uncover the truth, they must choose between slaying the medusa or setting her free. And what should they do with the sculptor and her magical knowledge?
    attack_dice: D6
    image: images/bestiary/medusa-84.jpg
    image_page: 97
    statblocks:
      - fields:
          Ferocity: "2"
          Size: Normal
          Movement: "12"
          Armor: —
          HP: "36"
          Petrifying Gaze: Anyone within 30 meters of a medusa’s terrible form must make a WIL roll every turn (not an action) to avoid eye contact. On failure, the victim turns to stone and can no longer move or perform any actions whatsoever, but also cannot take damage. A petrified victim dies after 2D6 rounds, but the petrifaction can be reversed with a successful WIL roll with a bane. While still alive, the victim may roll once per turn. The DISPEL spell (Power level 1) can also undo the petrifaction, but only if the victim is still alive. Fighting the medusa while trying to avoid eye contact makes it impossible to parry or dodge the monster’s attacks. The attacker can use a blindfold to make sure that they will not meet the medusa’s gaze but must then act as if in total darkness.
          Resistance: Takes half damage from non-magical attacks.
          Wings: The golden wings of the medusa allow it to move freely through the air.
    attacks:
      - roll: "1"
        name: Snakebite!
        text: Snakebite! The medusa’s snakes lash out at all opponents within 2 meters. The victims suffer D8 piercing damage and are injected with a lethal poison with potency 12 if the damage penetrates their armor.
      - roll: "2"
        name: Snake Tongues!
        text: Snake Tongues! The medusa’s snakes slither and writhe while whispering mocking insults from ages past. All opponents within 4 meters must make a WIL roll to resist fear.
      - roll: "3"
        name: Fists of Bronze!
        text: Fists of Bronze! The monster repeatedly strikes an opponent with her fists, inflicting 2D8 bludgeoning damage.
      - roll: "4"
        name: Up in the Air!
        text: Up in the Air! The medusa lunges at the opponent she considers the greatest threat. She lifts the victim D6+3 meters into the air before letting go, hoping that they will be crushed by the fall.
      - roll: "5"
        name: Gust of Wind!
        text: Gust of Wind! The creature conjures a powerful gust of wind. All opponents within a 10-meter-long and 10-meter-wide cone are thrown 2D4 meters backwards. They take an equal amount of bludgeoning damage and land prone.
      - roll: "6"
        name: Petrifying Gaze!
        text: Petrifying Gaze! In a hypnotically beautiful voice, the medusa persuades an opponent within 10 meters to look into her eyes. The victim must immediately make a WIL roll with a bane to avoid her petrifying gaze.
  - id: bestiary-pegasus
    name: Pegasus
    source: bestiary
    category: Beasts
    description: So we come to the pegasus. While it does not really belong with monsters and beasts, it has at least one thing in common with the other creatures in this chapter – it is the subject of countless legends, different versions of which are found in all cultures. There is little bad to say about these noble equines; they are rightly described as peaceful and shy and would never hurt a fly. No, only a demon would find the pegasi anything other than delightful, because if there is one thing they hate, it is demons and their followers. Normally, the pegasi would rather run than fight, especially from undead which they fear beyond reason, but they will fight to the death any champion of the demonic realm. Finally, I should mention that any attempt to tame a pegasus as if it were a horse or other mount is futile. You can instead try to befriend the creature; if successful, you can count on it for help, but entirely on the pegasus’ terms, almost as if it were a farm cat.
    quote: |
      “Did you know that pegasi don’t eat plants or meat? They feed through their eyes, on beauty, on things that are aesthetically pleasing. Strange, really, that they don’t flock around me…”
      – Metteo of Hagen, bard
    random_encounter: A magnificent creature appears before the player characters – a horse white as snow, with a glittering mane and a strange bundle on its back. Pawing at the ground, it looks at them with pleading eyes. It is a pegasus that has escaped from vicious monster hunters and is now seeking help to free its wings from their net. If the characters free the pegasus, it immediately takes to the sky, but it will never forget their kindness and may come back to save them from certain death at some point in the future.
    adventure_seed: The player characters hear agonized squeals and whinnies in the distance. If they investigate, they come to a clearing arranged as a place of sacrifice, with standing stones erected around a stone table, all covered with mysterious symbols. The sounds are coming from a badly injured pegasus lying on the ground near the stone table, flapping one of its wings. The strange symbols, the pegasus’ wounds, and tracks on the ground indicate that the characters have found a cult site where demon cultists have recently summoned a greater demon; the pegasus must have tried to stop the madness but failed. The cultists and the demon can probably be found somewhere near the large village center that the characters just left, but where? If they find a way to heal the pegasus’ wounds, it can surely help them identify and vanquish this evil!
    attack_dice: D6
    image: images/bestiary/pegasus-85.jpg
    image_page: 99
    statblocks:
      - fields:
          Ferocity: "2"
          Size: Large
          Movement: "30"
          Armor: —
          HP: "32"
          Peaceful: A pegasus is a very peaceful creature. It always chooses flight over fight, and only engages in combat when there is no other choice.
          Wings: The pegasus’ wings allow it to move freely through the air
    attacks:
      - roll: "1"
        name: Horse Kick!
        text: Horse Kick! The pegasus kicks back at an opponent. The victim is thrown 2D6 meters, takes an equal amount of bludgeoning damage, and lands prone.
      - roll: "2"
        name: Horse Bite!
        text: Horse Bite! The creature tries to bite an opponent, who suffers D8 bludgeoning damage and becomes Angry. A victim who is already Angry must choose another condition.
      - roll: "3"
        name: Crushing Hooves!
        text: Crushing Hooves! The pegasus rears up and strikes with its hooves at two opponents within 2 meters of each other. Each victim suffers 2D6 bludgeoning damage.
      - roll: "4"
        name: Whirlwind!
        text: Whirlwind! The pegasus uses its powerful wings to create a whirlwind that blows away all player characters within 6 meters. The victims land prone D6 meters away and suffer the same amount of bludgeoning damage.
      - roll: "5"
        name: Nosedive!
        text: Nosedive! With a few powerful wing strokes, the pegasus rises majestically into the air before diving down and swooping over its enemies at tremendous speed. All opponents within an area 4 meters wide and 30 meter long must make a WIL roll to resist fear.
      - roll: "6"
        name: Mind Strike!
        text: Mind Strike! The pegasus focuses its psychic powers in a mental attack against the opponent within 10 meters who has inflicted the most damage. The victim must roll WIL with a bane to resist fear.
  - id: bestiary-roc
    name: Roc
    source: bestiary
    category: Beasts
    description: If you come to a region devoid of farm animals, you can be pretty sure there is a roc or two nesting nearby. Trying to raise livestock under such a constant threat is a fool’s errand. As a human, halfling, or orc, you rarely need to worry about this marvelous bird of prey – you are little more than a crumb on its floor. The only exception is if you are walking around with gemmed jewelry glittering in the sun; such ornaments are like beacons in the dark for a roc. Naturally, this has caused many a fortune hunter to think it is a good idea to raid the creature’s nests, high up in the mountains or at the top of giant pine trees – a hazardous enterprise that, as far as I can tell, often results in the fortune hunter ending up as bird food.
    quote: |
      “The idea that rocs ignore normal-sized folk is nonsense. A halfling or goblin is just enough to feed a hatchling, and before long it will happily devour humans and elves alike.”
      – Arvor Elderberry, birdwatcher
    random_encounter: "Traveling through the wilderness, the player characters suddenly notice a huge bird of prey gliding across the sky. A little later a dragon sweeps by as well, looking for its prey. The characters are about to witness something few people have ever seen: a roc and a dragon fighting for their lives. Before the monsters break off the fight and flee in opposite directions, the player characters see something drop from the bird’s talons. What could it be?"
    adventure_seed: An aged knight offers the player characters a hefty sum to go out into the mountains and bring back a roc egg – it is to be a gift for his newborn grandson, who will then grow up with the chick so that in adulthood they will be virtually unstoppable together. How should the player characters deal with the two nesting rocs – by force, cunning, or stealthy maneuvers? And if they do not kill the parents, how will they make it back to the knight’s castle with the egg and their lives? Many questions must be answered if the player characters are to survive the expedition.
    attack_dice: D6
    image: images/bestiary/roc-86.jpg
    image_page: 101
    statblocks:
      - fields:
          Ferocity: "2"
          Size: Huge
          Movement: "28"
          Armor: —
          HP: "80"
          Rocks From Above: In combat, a roc usually starts by sweeping over its victims and dropping large rocks on them. Anyone within 10 meters of the creature must then succeed with an EVADE roll or take 2D6 bludgeoning damage and be knocked down by the bouncing rocks. Then the monster lands among its prone victims.
          Wings: The powerful wings of the roc allow it to move freely through the air.
    attacks:
