  - id: adventure-demonic-bats
    name: Demonic Bats
    source: adventure
    category: Outskirt
    description: Through Azrahel Koth, Leanara has gained command of a swarm of demonically controlled vampiric bats. Some are kept in a cage, but most of them are scattered in the area around Outskirt. The swarm arrives two rounds after being telepathically summoned by Leanara. For stats, see page 99 in the Rulebook.
