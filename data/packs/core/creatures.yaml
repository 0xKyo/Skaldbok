          Vulnerable: In direct sunlight, vampires take D6 damage per round and cannot perform monster attacks. A vampire who reaches zero HP because of this disintegrates.
          Escape Route: Vampires can use an action to transform into a swarm of bats that immediately escapes from combat. The escape can only be stopped by sealing the place where the fight occurs. The vampire must then wait until the next sunset before the action can be performed again.
          Immortal: A vampire that reaches zero HP falls paralyzed to the ground and dissolves into mist after D6 rounds. In mist form, the monster makes its way to its tomb where it is restored to full HP after a shift rest. The vampire can only be killed by sunlight (see above) or by driving a piercing weapon through its heart after reducing it to zero HP, before it dissolves. This requires a successful roll against the SPEARS skill.
