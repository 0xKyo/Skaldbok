      - roll: "1"
        name: Pounce!
        text: Pounce! The ferocious worg pounces on a player character and slams the victim violently to the ground. The attack inflicts 2D8 bludgeoning damage.
      - roll: "2"
        name: Swing from Above!
        text: Swing from Above! The worg leaps over a chosen player character and its rider swings his serrated scimitar from above, inflicting 3D6 slashing damage.
      - roll: "3"
