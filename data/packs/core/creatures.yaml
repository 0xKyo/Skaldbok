        text: Ix takes no damage from fire, even magical fires.
      - name: Vulnerability
        kind: ability
        text: Ix hates the cold and wet and takes double damage from spells such as FROST and TIDAL WAVE.
  - id: adventure-bone-shambler
    name: Bone Shambler
    source: adventure
    category: Road’s End Inn
    description: A damaged skeleton shambling around on broken bones. This undead monstrosity thrives in damp ruins and can silently climb up walls and hang from ceilings, where it waits to ambush its victims.
    attack_dice: D6
    statblocks:
      - fields:
          Ferocity: "1"
          Size: Normal
          Movement: "10"
          Armor: —
          HP: "12"
          Resistance: Bone shamblers only take half damage from piercing weapons.
    attacks:
      - roll: 1–3
        name: Bone Punch!
        text: Bone Punch! Amid the jumble of bones, the bone shambler catches its victim with a peach of a punch, inflicting D8 bludgeoning damage.
      - roll: 4–5
        name: Bite!
        text: Bite! Cracked yellow teeth sink into a victim's leg. The bite inflicts 2D6 slashing damage.
      - roll: "6"
        name: Guttural Roar!
        text: Guttural Roar! A terrible scream that makes floors tremble and minds shiver. All player characters within 10 meters suffer a fear attack.
  - id: adventure-stare
    name: Stare
    source: adventure
    category: Road’s End Inn
    description: The player characters can only see Stare’s recessed eyes and what might generously be called teeth. She is chained to the wall but can reach any part of the chamber.
    attack_dice: D6
    statblocks:
      - fields:
          Ferocity: No. of PCs−1 (min. 1)
          Size: Normal
          Movement: "14"
          Armor: —
          HP: "25"
          The Doll: If the doll was brought from the playroom (#6), Stare’s Ferocity increases by one.
          Immunity: All fire goes out in the room where Stare is held.
    attacks:
      - roll: "1"
        name: Toe-Breaking Kick!
        text: Toe-Breaking Kick! Stare's kick is surprisingly powerful and inflicts D8 bludgeoning damage.
      - roll: "2"
        name: Bloodshot Gaze!
        text: Bloodshot Gaze! Stare comes close and her terrible eyes force the victim to make a WIL roll with a bane to resist fear.
      - roll: "3"
        name: Scratching Claws!
        text: Scratching Claws! Stare scratches a victim with her bone-hard fingernails, inflicting 2D6 slashing damage.
      - roll: "4"
        name: Lament!
        text: Lament! Stare has passed the time in the chamber composing a terribly sad and off-key tune that is truly grating to the ear. As she sings it, all player characters must make a roll against WIL to resist fear.
      - roll: "5"
        name: Stones and Gravel!
        text: Stones and Gravel! The hag grabs a fist-ful of crumbled mortar and throws it at a player character within 10 meters who has not yet acted in the round. The victim loses their next turn. The attack can be parried with a shield.
      - roll: "6"
        name: Illusory Precipice!
        text: Illusory Precipice! All player characters within 10 meters of Stare think they are standing on the edge of a high cliff and can see the smashed bodies of old people below. The player characters must roll against WIL to see through the illusion. Those who fail fall unusually hard to the ground, suffering D6 bludgeoning damage and losing their next turn if they have not already acted in the round. The attack cannot be dodged.
  - id: adventure-witch-hound
    name: Witch Hound
    source: adventure
    category: Road’s End Inn
    description: These frothing beasts, with yellow bloodshot eyes, will not stop until their victim is torn to pieces. They are Stare’s old dogs, which she could not be without even after her death.
    attack_dice: D6
    image: images/adventure/witch-hound-176.jpg
    image_page: 103
    statblocks:
      - fields:
          Ferocity: "2"
          Size: Small
          Movement: "18"
          Armor: "2"
          HP: "14"
    attacks:
      - roll: 1–2
        name: Bite!
        text: Bite! The dog sinks its teeth into an arm or a leg, inflicting 2D10 piercing damage.
      - roll: 3–4
        name: Claws!
        text: Claws! With claws as sharp as knives, the dog lacerates the victim’s skin and inflicts 2D8 piercing damage. The attack cannot be dodged.
      - roll: "5"
        name: Push!
        text: Push! The dog suddenly leaps forward. The victim does not take damage but falls to the ground and drops their weapon.
      - roll: "6"
        name: Frenzied Onslaught!
        text: Frenzied Onslaught! The dog makes both a bite and a claw attack against two different player characters. But in its frenzy, the beast loses its next action.
  - id: adventure-verkon-s-ghost
    name: Verkon’s Ghost
    source: adventure
    category: The Isle of Mist
    description: The demon worshiper Verkon served Sathmog back when he ruled the Misty Vale, but lost his life in a ritual gone awry. His restless spirit attacks whoever takes the medallion from his earthly remains. He is a shimmering blue shadow of his living self, robed, with staring eyes and the black mark of Sathmog burned into his forehead. Verkon hisses “All power to Sathmog, our three-tongued liberator” to the player characters, but it takes a successful LANGUAGES roll to understand what he is saying. He is a ghost with stats as per page 96 in the Rulebook. Verkon will leave the player characters alone if they drop his medallion.
    stats_ref: He is a ghost with stats as per page 96 in the Rulebook.
  - id: adventure-the-demon-akrae
    name: The Demon Akrae
    source: adventure
    category: The Isle of Mist
    description: Akrae looks human, but with the head and claws of a crab. He lets out a gurgling sound and reeks of rotten seaweed. Akrae is bound to the stone with the pentagram and cannot leave.
    attack_dice: D6
    statblocks:
      - fields:
          Ferocity: No. of PCs−1 (min. 1)
          Size: Large
          Movement: "12"
          Armor: "6"
          HP: "48"
    attacks:
      - roll: "1"
        name: Claw Grab!
        text: Claw Grab! The demon grabs a player character with its claw and squeezes them, inflicting 2D8 slashing damage. Akrae then hurls the victim D6 meters into the water.
      - roll: "2"
        name: Salt Spew!
        text: Salt Spew! A player character within 4 meters who has not yet acted in the round is hit by a jet of stinking goo and loses their turn in the round.
      - roll: "3"
        name: Chilling Roar!
        text: Chilling Roar! A demonic roar forces everyone within 10 meters to succeed with a WIL roll or suffer a fear attack.
      - roll: "4"
        name: Arm Pinch!
        text: Arm Pinch! The demon almost pinches a player character’s arm off with its claw. The attack inflicts 2D8 slashing damage but can be parried. If you are using the rules for severe injuries, the victim also suffers a broken arm if they take at least one point of damage.
      - roll: "5"
        name: Cascade!
        text: Cascade! The demon whips up a magical waterspout that hits all player characters within 6 meters and flings them into the freezing water (unless they dodge the attack).
      - roll: "6"
        name: Head Bite!
        text: Head Bite! The demon bites a player character in the head, inflicting 3D8 slashing damage. The attack can be parried.
  - id: adventure-okvid-the-troll
    name: Okvid the Troll
    source: adventure
    category: The Isle of Mist
    description: |
      Okvid is a grumpy old troll who serves as caretaker of the caves under an agreement with Azrahel Koth. As payment, he is allowed to keep all the treasures he picks up from fallen adventurers. Okvid’s regenerative ability allows him to live in the corrosive mist. His voice rumbles like a rockslide, and his stench makes the eyes water. Okvid has stats as a troll on page 97 in the Rulebook, with one addition:
      Anyone who succeeds with a HEALING roll realizes that the troll suffers from a terrible toothache. It takes a successful PERSUASION or BLUFFING roll to get the troll to accept an operation. Pulling the aching tooth requires another HEALING roll – on failure, the troll attacks. If the operation succeeds, Okvid allows the player character to pass. He also offers them some rotting food.
    stats_ref: |
      Okvid has stats as a troll on page 97 in the Rulebook, with one addition:
      Anyone who succeeds with a HEALING roll realizes that the troll suffers from a terrible toothache.
    image: images/adventure/okvid-the-troll-180.jpg
    image_page: 109
  - id: adventure-undead-guards
    name: Undead Guards
    source: adventure
    kind: npc
    category: The Isle of Mist
    description: Eight hundred years ago, the Dragon Emperor had a band of warriors locked in Azrahel Koth’s crypt to guard the demon sorcerer until the end of time. Their lives were extended through necromantic spells, but these did not stop the warriors’ physical and mental decay. Now the once-great warriors have been reduced to walking skeletons with grinning skulls. Azrahel Koth has taken control of their weakened minds and turned them into obedient puppets. The player characters can run into these undead warriors as a random event and in Azrahel Koth’s mausoleum (#20). You can also have a patrol show up if the player characters make a lot of noise or whenever you need to give them an additional challenge. The guards are moving all around the cave complex. Clever player characters can SNEAK after a patrol to figure out how to get past the labyrinth’s many traps. This requires a successful roll per room.
    statblocks:
      - fields:
          Movement: "8"
          Damage Bonus: STR +D4
          Armor: Chainmail (4)
          HP: "14"
          Skills: Awareness 8, Brawling 12, Evade 6
          Weapons: Broadsword (skill level 14, damage 2D6)
          Resistance: Takes half damage from piercing attacks (rounded up).
          Immunity: The guards are immune to fear and PERSUASION.
  - id: adventure-undead
    name: Undead
    source: adventure
    kind: npc
    category: The Isle of Mist
  - id: adventure-khaa-the-fire-demon
    name: Khaa the Fire Demon
    source: adventure
    category: The Isle of Mist
    description: Khaa was summoned by Azrahel Koth to guard his crypt, but proved to be something of a disappointment as the demon was more interested in discussing the mysteries of existence than fighting. Khaa appears as a humanoid seemingly made of fire, always sizzling, crackling, and smoldering, even while standing still. Its voice hisses like steam escaping wet wood on a large fire.
    attack_dice: D6
    statblocks:
      - fields:
          Ferocity: No. of PCs−1 (min. 1)
          Size: Normal
          Movement: "12"
          Armor: —
          HP: "48"
    attacks:
      - roll: "1"
        name: Searing Roar!
        text: Searing Roar! The demon lets out a searing roar at a player character within 10 meters. The attack inflicts D8 damage, and the victim must make a roll against WIL to resist fear. Armor has no effect.
      - roll: "2"
        name: Smoldering Claws!
        text: Smoldering Claws! The demon claws at a player character in two separate attacks, each inflicting D10 slashing damage. The attacks can be parried.
      - roll: "3"
        name: Lava Beam!
        text: Lava Beam! Khaa aims a concentrated beam of fire at a player character within 20 meters, inflicting 2D8 damage. The attack can be parried with a shield.
      - roll: "4"
        name: Firewave!
        text: Firewave! A wave of fire erupts from the demon, inflicting D8 damage on everyone within 10 meters.
      - roll: "5"
        name: Burning Fetters!
        text: Burning Fetters! The demon casts fire that binds and burns a player character. The victim immediately takes D8 damage and then an additional D8 damage per turn until they break free, which requires a STR roll (an action). A fettered victim can neither move nor perform actions that require body movement, except trying to break free.
      - roll: "6"
        name: Infernal Embrace!
        text: Infernal Embrace! The demon embraces a player character. The heat is so intense that the victim suffers 3D8 damage. Armor has no effect.
    abilities:
      - name: Resistance
        kind: ability
        text: Takes half damage from piercing and bludgeoning attacks.
      - name: Immunity
        kind: ability
        text: Khaa is completely immune to all kinds of fire, including magical ones. Instead, Khaa heals as many HP as the damage from a fire attack.
  - id: adventure-skeletons-2
    name: Skeletons
    source: adventure
    kind: npc
    category: The Isle of Mist
    description: |
      If the trap is triggered, secret doors open in the walls and twice as many skeletons as there are player characters step out into the corridor. They attack immediately and have stats as Skeleton Warriors on page 95 in the Rulebook. The corridor is only wide enough for two skeletons (and player characters) to fight shoulder to shoulder; the others end up behind them.
      12) or pushed open by making a STR roll with bane or casting the PILLAR spell. Otherwise, it is raised automatically after a shift, when a patrol of undead guards, as many as the player characters, comes to check the trap.
    stats_ref: They attack immediately and have stats as Skeleton Warriors on page 95 in the Rulebook.
  - id: adventure-vampire-bats
    name: Vampire Bats
    source: adventure
    category: The Isle of Mist
    description: This swarm has stats as per page 99 in the Rulebook. They act on the same turn as Azrahel
    stats_ref: This swarm has stats as per page 99 in the Rulebook.
  - id: adventure-azrahel-koth
    name: Azrahel Koth
    source: adventure
    category: The Isle of Mist
    description: The demon sorcerer Azrahel Koth is Sathmog’s greatest servant in the Misty Vale, resurrected by his master to spread the demon cult throughout the world.
    attack_dice: D8
    statblocks:
      - fields:
          Ferocity: No. of PCs
          Size: Normal
          Movement: "12"
          Armor: —
          HP: "64"
          Bound to the Labyrinth: Azrahel Koth is bound to the labyrinth as long as he does not carry Um-Durman.
          Resistance: Azrahel Koth takes half damage from all non-magical weapons. Only magic and magical weapons deal full damage against him.
          Teleportation: When fighting anywhere outside the Mausoleum (#20), Azrahel Koth can use an action to
    attacks:
      - roll: "1"
        name: Clawed Hand!
        text: Clawed Hand! Azrahel Koth tears at a player character with his clawed hand and inflicts 2D6 slashing damage. The attack can be parried.
      - roll: "2"
        name: Malediction!
        text: Malediction! Azrahel Koth showers a player character with demonic curses. The victim must make a WIL roll with a bane to resist fear.
      - roll: "3"
        name: Deathly Cold!
        text: Deathly Cold! Azrahel Koth emits an icy chill. All player characters within 10 meters lose D6 HP and D6 WP (armor has no effect) and become cold – they cannot heal HP or WP naturally until they get warm again. In addition, all victims are frozen and unable to move or perform actions (not even reactions). On each turn the victims can make a STR roll (not an action) to break free.
      - roll: "4"
        name: Life Drain!
        text: Life Drain! Azrahel Koth stares at a player character within 10 meters with his glowing eyes, inflicting D10 damage (armor has no effect) and healing himself by the same amount. The attack cannot be dodged. A player character carrying Um-Durman is immune to this attack.
      - roll: "5"
        name: The Black Flames of Sathmog!
        text: The Black Flames of Sathmog! Azrahel Koth opens the door to Sathmog’s realm, and black fire fills the room. All player characters within 10 meters suffer D8 damage and must make a roll against WIL to resist fear.
      - roll: "6"
        name: Dominating Gaze!
        text: Dominating Gaze! Azrahel Koth fixes his eyes on a player character, who must make a roll against WIL (not an action). On failure, the victim must immediately perform an attack against another player character and loses their turn in the round (unless they already had it). The attack cannot be dodged, but a player character wearing Um-Durman is immune.
      - roll: 7–8
        name: Fight for Um-Durman!
        text: Fight for Um-Durman! If Azrahel Koth does not have Um-Durman, he storms up to whoever carries the sword and tries to tear the weapon from the player character’s hands. The victim must make a SWORDS roll with a bane (not an action) – on failure, Azrahel Koth takes the sword! The attack cannot be dodged. If Um-Durman is on the ground, Azrahel Koth simply picks it up. If Azrahel Koth gets hold of Um-Durman, he can be disarmed with a successful roll for any weapon skill, with a bane. Attack with Um-Durman! If Azrahel Koth already has Um-Durman in his hand, he attacks a player character with the sword instead. The attack inflicts 3D10 slashing damage but can be parried.
    abilities:
      - name: Regeneration
        kind: ability
        text: Inside his mausoleum, Azrahel Koth heals all damage in one stretch.
      - name: Um-Durman
        kind: ability
        text: Azrahel Koth dies if an attack with the sword Um-Durman reduces him to zero HP. His body collapses inwards like an empty bellows until only a shriveled husk remains. If reduced to zero HP by any other weapon, he wakes up with full HP after one stretch. A killing blow can be delivered with Um-Durman even if he is brought down by other damage. Note that Azrahel Koth is not a demon himself, so he is not affected by Um-Durman’s special effect against dragons and demons. However, the sword does count as a magical weapon.
