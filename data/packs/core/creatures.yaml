      - roll: "6"
        name: Power Attack!
        text: Power Attack! With creaking joints, the wight swings its weapon in a powerful attack against an opponent. The damage is rolled with twice the weapon’s normal number of dice, and the victim is knocked to the ground. The attack can be parried.
  - id: bestiary-will-o-the-wisp
    name: Will-o’-the-Wisp
    source: bestiary
    category: Undead
    description: I have always wondered why this ghostly being was named will-o’-the-wisp – it sounds so delightfully pleasant, when in fact they are anything but. These damned entities appear to be the echoes of truly vile creatures who in life enjoyed tormenting others until they met their well-deserved demise in some marshland. Reanimated in spectral form, the cruelty is all that remains of their nature. As wraiths carrying beckoning lights, they continue to torment those passing through their swamps, possibly in the vain hope that the victims’ terror will alleviate their own suffering. Will-o’-the-wisps are mainly feared for their ability to lure people off their paths, causing them to fall into sinkholes or drown in bogs. But they take equal pleasure in simply scaring people out of their wits.
    quote: |
      “Have you heard of Altfon’s Lantern? Nobody knows where it is, but it consists of a trapped will-o’-the-wisp who, besides providing light, hisses spitefully if it notices a spelling error. Pretty useful, eh?”
      – Sipero Skald, dramatist
    random_encounter: On their way through the wilderness, the player characters see a light in the distance and hear a whispering voice calling to them. The voice promises to lead them to a lost treasure if they simply follow the light through the forest, across the marsh, down to the lake. The will-o’-the-wisp does everything it can to lure the adventurers to the place where it once met its end, to feast on their terror and despair as they drown.
    adventure_seed: Merchants and their wares have mysteriously disappeared on the trade route between two major villages. A few survivors tell of strange, dancing lights promising riches beyond imagining, but remember little else. Investigations can reveal that these are will-o’-the-wisps, probably created from one of the fortune-hunting groups that recently perished in a ruin-strewn wetland. But which of the three failed expeditions is it? And where in the vast swamp are their corpses? The player characters must find the place where the vilest members of the expedition died and give their bodies a dignified burial.
    attack_dice: D6
    image: images/bestiary/will-o-the-wisp-97.jpg
    image_page: 126
    statblocks:
      - fields:
          Ferocity: "2"
          Size: Small
          Movement: "16"
          Armor: —
          HP: "12"
          Immunity: Will-o’-the-wisps are immaterial beings and immune to all damage except magic and fire.
          Restless: A defeated will-o’-the-wisp is only banished for D6 days, after which it returns. The only way to banish it permanently is to cast PURGE or find its remains and give them a dignified burial.
    attacks:
      - roll: "1"
        name: Sinkhole!
        text: Sinkhole! A bottomless hole filled with swamp water and moss opens under an opponent within 10 meters. The victim must immediately roll SWIMMING with a bane to avoid drowning as per page 53 of the Rulebook, and a new roll (not an action) is required each turn. Climbing out of the sinkhole requires a successful ACROBATICS roll with a bane. Others can help.
      - roll: "2"
        name: Nightmares!
        text: Nightmares! The will-o’-the-wisp shows all enemies within 10 meters nightmarish flashes of its mortal death. All victims become Disheartened. Those who are already Disheartened must choose another condition.
      - roll: "3"
        name: Spectral Headbutt!
        text: Spectral Headbutt! The undead horror channels its psychic powers and headbutts an opponent. Despite the creature’s lack of a physical form, the victim takes 2D4 bludgeoning damage and falls to the ground.
      - roll: "4"
        name: Blinding Light!
        text: Blinding Light! The will-o’-the-wisp’s eye sock-ets light up with unholy fire. All creatures within 10 meters must roll EVADE to avert their gaze. Those who fail (or do not roll) are blinded and act as if in total darkness for one round.
      - roll: "5"
        name: Death Rattle!
        text: Death Rattle! Unholy winds carrying wails of torment and cries for salvation sweep over the creature’s opponents. Everyone within 10 meters suffers a fear attack.
      - roll: "6"
        name: Control!
        text: Control! The will-o’-the-wisp takes control of an opponent within 10 meters if the victim fails a WIL roll. The controlled victim must immediately perform a movement and an action of the GM’s choice, except for actions that require WP. The victim also loses their next turn, if it has not already passed.
  - id: bestiary-hatchling-dragon
    name: Hatchling Dragon
    source: bestiary
    category: Dragons
    description: A dragon’s egg is as hard as rock and looks more like a boulder than an egg, although its scaly surface reveals what is inside the shell. Once strong enough, the dragon spawn breaks free and immediately begins to explore the world, watched over by its mother or father – adult dragons who only leave their offspring’s side to search for food. As a hatchling, the dragon is not very intimidating. It cannot fly and has not yet developed the ability to breathe fire. On the other hand, the puffs of smoke coming out of its mouth can be quite dangerous, as they are highly toxic and may paralyze creatures that come too close – an effective defense mechanism that often keeps the hatchling alive until it has grown into a young dragon, ready to leave the nest.
    quote: |
      “I almost got killed because of a dragon egg. I found it in the woods and sold it to Monty, but he must have botched the incubation, because… well, out came a huge baby bird and bit off his ankle…”
      – Sulimar Mox, farmhand
    random_encounter: In a cave deep underground, the player characters find the shell of a broken dragon egg. A successful BEAST LORE or BUSHCRAFT roll reveals that the egg has been there for years. There are no signs of where the hatchling might have gone, but there is a risk that two or more dragons may be lurking nearby.
    adventure_seed: "The nobleman Wilfrid Otterdale dreams of owning a dragon, and no one has been able to convince him that it is an exceptionally bad idea. Now Otterdale has decided to fund and lead an expedition into the northernmost mountains, where dragons are reliably reported to exist. The goal: to steal a dragon egg. It will be a grand expedition, and the nobleman searches high and low for adventurers willing to risk their lives for a large sum of money. The player characters form one of several hunting parties and must use all their knowledge and skills to locate a dragon’s nest, find an egg, steal it, and transport it to Otterdale’s expedition. Then they must of course survive the journey back to the castle, possibly with a couple of angry dragon parents at their heels."
    attack_dice: D6
    image: images/bestiary/hatchling-dragon-98.jpg
