        text: Troll Throw! The troll lifts an enemy over its head and tosses the victim like a rag doll 2D8 meters in a random direction, inflicting an equal amount of bludgeoning damage. The victim lands prone.
  - id: bestiary-forest-troll
    name: Forest Troll
    source: bestiary
    category: Trolls
    description: Forest trolls really are incredibly stupid. Not like animals or their hunger-driven cousins the cave trolls; after several attempts to converse with them, I would describe them more as defiant children – they think themselves clever and all-knowing and get extremely annoyed if the conversation reveals that they actually have the intellectual agility of a dung beetle. The difference is that defiant children, even if they should want to, rarely have the strength to rip your head off. Forest trolls are usually content to hunt for prey in their woods, but if the pickings are slim, they do not hesitate to target livestock pens and pastures. Nevertheless, I have come across several cases where villages have managed to maintain a fragile peace with forest trolls in their vicinity by offering them regular gifts of ale, prey, and cattle.
    quote: |
      “Imagine mixing fish guts with butter, stomach acid, pine needles, and various forest herbs. Then you leave the mixture out in the summer sun for a week. There you have it, troll odor!”
      – Elori Heia, experimental alchemist
    random_encounter: A herd of goats rushes past the player characters in a panic. A moment later two forest trolls come stumbling along, clearly intent on a filling meal. If the characters let them pass, they will continue their hunt, but if they are stopped, the trolls get angry, shouting and growling at the characters to leave them alone. Unless the forest trolls are appeased with food or gold, they soon become furious and decide that the characters will have to do for supper.
    adventure_seed: A group of forest trolls has ambushed a squad of soldiers transporting a priceless crown to the summer residence of a noble family. The crown and a number of other gold items are now in the hands of the trolls, and the player characters are hired to retrieve them. But when they find the trolls, it turns out that the crown has been given to Hackla, the local troll shaman, who proudly wears it between her horns. To further complicate matters, the shaman has enlisted a group of forest trolls to raid the noble family’s summer castle. Will the characters manage to steal back the crown and/or deter Hackla from her plans?
    attack_dice: D6
    image: images/bestiary/forest-troll-67.jpg
    image_page: 59
    statblocks:
      - fields:
          Ferocity: "2"
          Size: Large
          Movement: "12"
          Armor: —
          HP: "44"
          Impulsive: Forest trolls are impatient and rarely think before they act. In combat they draw an extra initiative card at the beginning of each round and keep the two lowest. They never wait or dodge.
          Greedy: Forest trolls love collecting anything that glitters. Their lairs are filled with gold, silver, copper, amber, and gems of all kinds. The more treasures it hoards, the more status a forest troll enjoys among its kin. This also means that a forest troll may fall victim to its own greed and be induced to spare an opponent if gold is offered in exchange (BARTERING roll).
          Sensitive to Sunlight: When in direct sunlight, forest trolls suffer D6 damage per round, and cannot regenerate. A troll that reaches zero HP because of this is turned to stone. Dense foliage, a thick layer of clouds or full-cover clothing are enough to avoid the effect.
          Regeneration: A forest troll automatically heals D6 HP per turn in combat, unless it has reached zero HP.
          Illusion: In a forest, the forest troll can blend in with its surroundings at any time, making it invisible as long as it stays still. To anyone looking at the hidden troll, it appears as a large moss-covered rock or a fallen tree trunk.
          Overwhelming Stench: Forest trolls reek of musty old forest and damp, rotten wood. This is one of the best ways to detect them, but also means that anyone who comes within 10 meters of a forest troll must make a CON roll (not an action) to avoid being Dazed.
