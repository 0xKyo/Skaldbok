      - roll: "3"
        name: Venomous Claws!
        text: Venomous Claws! The monster lunges at an opponent within 10 meters, knocking them down and raking them with its sharp, venomous claws. The attack inflicts 2D6 slashing damage. A victim who takes damage is also injected with a paralyzing poison with potency 12.
      - roll: "4"
        name: Deafening Scream!
        text: Deafening Scream! The blood demon screams at its opponents at a pitch so high it is barely audi-ble, but strong enough to burst their eardrums. The attack affects everyone within a 10-meter cone. The victims take 2D8 damage (armor has no effect) and become Dazed.
      - roll: "5"
        name: Long Drop!
        text: Long Drop! The onaqui grabs a victim with its claws and leaps into the air. Unless they dodge, the victim is lifted D6+3 meters into the sky. On its next turn, the demon lets go (instead of another monster attack) and the victim drops to the ground, taking damage from the fall.
      - roll: "6"
        name: Boiling Blood!
