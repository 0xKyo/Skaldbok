      - roll: "6"
        name: High Drop!
        text: High Drop! The giant bird grabs an enemy with its talons and flies D6+6 meters into the air before dropping the unfortunate victim. The victim takes D8 slashing damage from the talons and additional bludgeoning damage from the fall.
  - id: bestiary-sea-serpent
    name: Sea Serpent
    source: bestiary
    category: Beasts
    description: Sea serpents are primitive but long-lived predators found in freshwater, primarily in lakes and rivers, but there have been reports of occasional sightings in other habitats such as moats and flooded mines. Indeed, they may even be found in deep wells, where they have waited for potential prey for hundreds of years, buried in mud and increasingly hungry. Some sea serpents do not get much bigger than a good-sized eel or pike, while others grow so huge that they can crush boats and drawbridges with their writhing bodies. The larger specimens are revered as gods by certain lizard people clans, who sacrifice both prisoners and their own offspring to these ever-hungry beasts.
    quote: |
      “There are only two ways to catch a sea serpent. One, bait a sharpened anchor with a live pig. Two, get swallowed and go berserk in its belly. I’ve tried both with great success!”
      – Arghas Beorn, kingfisher
    random_encounter: The player characters’ boat heads out into a large lake. The water is nice and calm with not a ripple to be seen. Suddenly the boat rocks as a dark shape passes underneath. A sea serpent has developed an appetite for adventurers and tries to overturn the boat to fill its empty belly.
    adventure_seed: When a sea serpent is spotted in a small lake, the inhabitants of a prosperous lakeside village announce a contest. Hunters and fishermen from near and far gather in the village and head out on the lake; whoever catches the beast wins the title of Kingfisher as well as a handsome reward. Spirits are high and the festivities attract many adventurers wanting to try their luck by participating in the hunt or betting on the contest. There are as many approaches to catching the monster as there are contestants, and the stakes get even higher when the sea serpent turns out to be a particularly enormous specimen. Only the most resourceful adventurers could hope to catch such a beast. Can the player characters resist the challenge?
    attack_dice: D6
    image: images/bestiary/sea-serpent-87.jpg
    image_page: 103
    statblocks:
      - fields:
          Ferocity: "2"
          Size: Normal/Large/Huge
          Mov.: "18"
          Armor: 1/3/5
          HP: 40/56/72
          A Taste for Blood: If an attack aimed at a sea serpent’s tail (made with a bane) draws blood (inflicts at least one point of slashing or piercing damage), roll D6 whenever the sea serpent attacks. Results 4–6 mean that the beast attacks itself instead of an enemy. The player characters can become aware of this weakness with a successful BEAST LORE roll.
          Varying Size: Sea serpents vary in size which affects their stats and the damage of monster attacks.
    attacks:
      - roll: "1"
        name: Tail Swipe!
        text: Tail Swipe! The sea serpent swipes its tail at an opponent within 10 meters. The attack inflicts 2D6/2D8/2D10 bludgeoning damage and knocks the victim down.
      - roll: "2"
        name: Devour!
        text: Devour! The beast swallows the opponent with the highest STR, inflicting 2D4/2D6/2D8 damage. The player character can keep attacking the sea serpent from within, where it has no armor. But for each round spent in the beast’s belly, the victim suffers D6 damage on their turn (armor has no effect). The victim gets out once the monster is dead.
      - roll: "3"
        name: Ferocious Bite!
        text: Ferocious Bite! The sea serpent bites a player character with its razor-sharp teeth. The attack inflicts 2D6/2D8/2D10 slashing damage.
      - roll: "4"
        name: Drowning!
        text: Drowning! The sea serpent pulls an opponent into the deep and the victim immediately begins to drown as per page 53 in the Rulebook. The player character cannot move or perform actions that require movement, except trying to break free, which takes a STR roll with a bane. Others can help.
      - roll: "5"
        name: Crushing Blow!
        text: Crushing Blow! The beast rises high above the water and drops its heavy body on up to two player characters within 2/4/6 meters of each other. Both victims suffer 2D4/2D6/2D8 bludgeoning damage and are knocked down.
      - roll: "6"
        name: Constriction!
        text: Constriction! The beast wraps its tail around an opponent within 10 meters and tries to squeeze the life out of them. The attack inflicts 2D4/2D6/2D8 bludgeoning damage and an equal amount of damage whenever it is the victim’s turn. The victim cannot move or perform actions that require movement, except trying to break free, which takes a STR roll with a bane. Others can help.
  - id: bestiary-werewolf
    name: Werewolf
    source: bestiary
    category: Beasts
    description: By day they look like anyone else, like you or me or your neighbor. But when night falls and the moon rises, the werewolf goes on the hunt, blinded by rage and bloodlust. In the moonlight, the creature changes drastically in body and mind – into a great wolf walking upright, with enormous claws, fanged jaws, and an unquenchable thirst for blood. In monster form, the werewolf loses all control over its actions, and when morning dawns it wakes up with no memory of the evil it committed. However, some legends tell of werewolves who can control their own transformation and who do not suffer any memory loss. If that is true, these individuals must have the darkest of souls, for how else could they live with all the suffering and death they cause?
    quote: |
      “Why are there only werewolves? There should be wererats, weresharks, wereseals, werebirds… Wait… swan maidens… Swan maidens are kind of like werewolves. But the other way around. Right?”
      – Dagofin Ankingham, confused
    random_encounter: Traveling through the wilderness, the player characters encounter a deeply exhausted adventurer. She does not remember how she got there and asks them for help before passing out. When night falls and the moon rises over their camp, the adventurer turns into a werewolf with no memory of who the player characters are and how helpful they have been. Mad with hunger, the beast pounces on them!
    adventure_seed: A series of brutal attacks plague the residents of a large village, a hub for traveling merchants from near and far. As tensions rise and accusations fly, the player characters are enlisted by an elderly couple to clear the name of their wrongly accused son. The only clues are the bloody victims left on the village’s cobbled streets – some dead, some unconsciousness but alive. One of the latter mutters in his sleep about “glowing eyes” and “monstrous jaws”. Then the full moon rises, and it becomes clear that a werewolf has come to the village to create a new pack for itself. How many of the infected, unconscious people will wake up in the light of the full moon as something… changed?
    attack_dice: D6
    image: images/bestiary/werewolf-88.jpg
    image_page: 105
    statblocks:
      - fields:
          Ferocity: "2"
          Size: Normal
          Movement: "16"
          Armor: —
          HP: "32"
          Shapeshifter: When touched by moonlight, a werewolf shifts into wolf form. At sunrise it changes back. If it is killed, the werewolf resumes its original form.
          Lycanthropy: The werewolf’s curse can be transmitted to other creatures. Anyone who takes at least one point of damage from a werewolf’s bite is afflicted with a paralyzing poison with potency 9. A victim who suffers the full effect of the poison also contracts lycanthropy and turns into a werewolf in the light of the next full moon. Elves and wolfkin are immune to lycanthropy. An infected player character who shifts into wolf form becomes a monster under the GM’s control. The victim can be cured by eating wolfsbane before their first transformation. However, this cure is in itself risky as the plant is a lethal poison with potency 9. There are also said to be powerful magical rituals that can cure lycanthropy.
          Resistance: Werewolves take half damage from non-magical weapons, except fire and silver which inflict normal damage.
          Hates Silver: Werewolves hate silver, which stinks and burns their keen senses. In wolf form, they cannot touch silver and always try to get away from places where there are large quantities of silver. In normal form they avoid contact with silver as much as possible.
    attacks:
      - roll: "1"
        name: Furious Howl!
        text: Furious Howl! The werewolf raises its head to the sky and howls loudly. Everyone within 20 meters must make a WIL roll to resist fear. If the monster is outdoors, the howl also summons D3 wolves who arrive after D3 rounds to fight along-side the werewolf.
      - roll: "2"
        name: Rending Claws!
        text: Rending Claws! The monster attacks everyone within 2 meters with its sharp claws. The victims suffer 2D6 slashing damage.
      - roll: "3"
        name: Drooling Jaws!
        text: Drooling Jaws! The monster sinks its fangs deep into an opponent’s flesh. The victim suffers 2D10 piercing damage and risks being infected with the creature's lycanthropy. The attack can be parried.
      - roll: "4"
        name: Surprise Attack!
        text: Surprise Attack! The werewolf gathers its supernatural strength, hurls itself at the enemy within 10 meters who has the lowest HP, and rakes its claws across their body. The victim takes 2D8 slashing damage and must make a WIL roll with a bane to resist fear.
      - roll: "5"
        name: Forceful Throw!
        text: Forceful Throw! The monster grabs an opponent and lifts them over its head, before throwing the victim 2D8 meters with tremendous force. The victim takes the same amount of bludgeoning damage, becomes Dazed, and lands prone.
      - roll: "6"
        name: Berserker!
        text: Berserker! The werewolf loses control of its rage and goes berserk. With claws and fangs, the monster kicks and tears at all opponents within 4 meters. The victims take 2D10 slashing damage and must roll WIL to resist fear. After the rampage, the werewolf becomes exhausted and cannot make any attacks in the next round (or this round, if the monster has a turn left). During this time a player character can PERSUADE the werewolf to calm down. On success, the beast flees the scene.
  - id: bestiary-worg
    name: Worg
    source: bestiary
    category: Beasts
    description: Worgs are larger than ordinary wolves and far more dangerous. With their glowing red eyes, they can see perfectly in the dark. But not only that – worgs also have the uncanny ability to spot camouflaged and otherwise concealed, even invisible, creatures by detecting their body heat. And yet their greatest weapon is their cunning. Among other things, they have a fully developed language based on howls and guttural yaps which allows them to communicate complex messages over long distances – for instance about approaching adventurers, heavily loaded trade caravans, and other potential prey. Worgs usually attack in packs, in a coordinated and disciplined manner, but outcasts may target armed people on their own when they are desperate.
    quote: |
      “Worgs are smarter than countryfolk! Mark my words, within a generation or two they’ll dominate everything except cities and larger settlements. Good thing, too!”
      – Ana Bluemoon, respectable lady
    random_encounter: A starving worg who has lost its pack targets the player characters’ mounts, or the adventurers themselves if they are on foot. It tracks them through the forest and uses all its abilities to take them down one by one in a macabre game of cat and mouse
    adventure_seed: A wolfkin tribe has a new enemy. A pack of worgs has moved into their forest and now an intense war for territory rages between them. The leader of the worgs, widely known as One-Eye, is a cunning veteran with experience from previous conflicts with humans, dwarves, and wolfkin, and he is using all his knowledge to push the enemy back. The wolfkin leader Griff soon realizes they cannot withstand the worgs’ onslaught on their own and sends his youngest daughter Lupa for help. Exhausted, she eventually finds the player characters and begs them to come to her people’s aid – something that will ultimately require them to track down and kill One-Eye.
    attack_dice: D6
    image: images/bestiary/worg-89.jpg
    image_page: 108
    statblocks:
      - fields:
          Ferocity: "1"
          Size: Normal
          Movement: "20"
          Armor: —
          HP: "18"
          Heat Vision: Worgs can see the heat signature of other creatures. This means that all SNEAKING rolls to hide from or sneak past worgs are made with a bane.
    attacks:
      - roll: "1"
        name: Ravenous Howl!
        text: Ravenous Howl! The worg raises its head to the sky and lets out a famished howl. Everyone within 10 meters must make a WIL roll to resist fear.
      - roll: "2"
        name: Stinking Snort!
        text: Stinking Snort! The worg snorts out a stinking cloud of slime and rotting meat at all opponents within 2 meters. The victims become Disheartened. Anyone who is already Disheartened must choose another condition.
      - roll: "3"
        name: Worg Bite!
        text: Worg Bite! The worg opens its drooling jaws and delivers a furious bite to an opponent. The attack inflicts 2D6 piercing damage and a victim who takes damage is also exposed to a disease with virulence 12.
      - roll: "4"
        name: Charge!
        text: Charge! The beast charges an opponent at full speed. The attack inflicts D6 bludgeoning damage and knocks the victim down. If the attack is not dodged, the worg immediately bites the victim in a second attack that deals 2D8 piercing damage. The second attack can be parried. The attacks must be dodged/parried separately.
      - roll: "5"
