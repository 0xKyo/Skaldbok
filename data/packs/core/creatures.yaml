  - id: bestiary-mummy
    name: Mummy
    source: bestiary
    category: Undead
    description: In the oldest times, it was customary in certain regions to embalm the dead. Not just anyone, of course – only the bodies of deceased rulers, fallen heroes, and high-born nobles were treated with alchemy and magic; furthermore, their internal organs were removed and preserved in vessels filled with vinegar and mystical herbs. Because of this process – complemented by demonic rituals, according to some – the dead soon rose again. Wearing only their burial shrouds, they guard the crypts in which they were buried, filled with treasures brought back from the realm of the dead. If their tombs are desecrated, they may cast powerful curses on the intruders, curses that can bring down even the strongest warriors and the mightiest of mages.
    quote: |
      “They embalmed not only people, but beasts and monsters as well. I know for a fact that one of the imperial dragons was mummified. Let’s hope it doesn’t break free…”
      – Gralt of Fairflank, learned nobleman
    random_encounter: The adventurers have made camp under a moonlit sky. As they get ready to sleep, they hear shuffling sounds from the surrounding wilderness. To their horror, they see a figure wrapped in rags coming towards them with dragging feet. The mummy has been freed from its sarcophagus by some now deceased adventurers and burns with vengeance against anyone who gets in its way. It will not stop until the player characters are dead or it is put to eternal rest.
    adventure_seed: "A mysterious antiques dealer from a faraway land has pitched his tent in the town square. No one has yet been allowed to enter, but everyone has received the same invitation: at the next sunrise, an auction will be held where the highest bidder will have the opportunity to acquire “magical secrets and objects”. But in the morning the auctioneer is found dead with a blackened tongue, clearly strangled to death. And the tent is empty... The hunt for the perpetrator and (not least) the dead man’s stolen items can begin! What has happened is that the mummy inside a sarcophagus that was included in the auction has awakened. It killed the scoundrel who desecrated its tomb, took the rest of the items, and shuffled down into the catacombs under the local temple. Perhaps someone saw it shuffling through town? Perhaps that person is hiding somewhere, trembling with fear?"
