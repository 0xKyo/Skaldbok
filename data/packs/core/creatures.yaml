        text: Deadly Embrace! The beast wraps itself around an opponent and tries to squeeze the life out of them. The attack inflicts 2D8 bludgeoning damage and the same amount whenever it is the victim’s turn. The victim cannot move or perform actions that require movement, except trying to break free, which requires a STR roll with a bane. Others can help.
