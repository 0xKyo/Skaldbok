      - roll: "5"
        name: Golden Spit!
        text: Golden Spit! The cave troll clears its throat and spits a gold coin hard at an opponent within 6 meters. The attack inflicts D10 bludgeoning damage, and the victim suffers a condition of their choice and becomes one gold coin richer.
      - roll: "6"
