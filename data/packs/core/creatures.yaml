        text: Confusing Dance! The four-legged ant creature scurries in circles around an opponent. Round and round it dances, and the victim must make a WIL roll with a bane (not an action) to avoid being Dazed.
      - roll: "6"
        name: Healing Kiss!
        text: Healing Kiss! The ant-creature uses its mandibles to clean the wounds of one of its family members participating in the fight. The wounded ant creature recovers up to D8 HP.
  - id: bestiary-beetle-kin
    name: Beetle Kin
    source: bestiary
    category: Insectoids
    description: Those who venture underground in search of gold and other riches may have the misfortune of ending up in a beetle hole. These dug, carved-out burrows are home to the beetle kin, enigmatic creatures as big as humans and as armored as knights. They usually live in small groups, about a dozen individuals gathered around an authoritarian leader. The digging of burrows and tunnels is the main cause of conflict between them and other digging creatures, especially dwarven miners. The beetle kin are also formidable warriors, as demonstrated when the group we were following suddenly burrowed their way into a small gnome mine. But as far as I can tell, they prefer not to fight; they are almost always outnumbered and would rather find another dwelling than challenge a stronger opponent. Finally, it should be mentioned that beetle kin can occasionally be encountered above ground, usually as mercenaries or exotic bodyguards at the residences of wealthy nobles or mages.
    quote: |
      “Demonic vermin, that’s what they are – fleas from some ancient demon prince’s neck hair! Okay, the shells of beetle kin would probably make good shields, but other than that: vermin!”
      – Traut Thornman, ore magnate
    random_encounter: It begins as a barely noticeable subsidence in the ground where the player characters are walking, on the surface or underground. It takes a successful SPOT HIDDEN roll to notice the subsidence in time to warn the others before the ground gives way in an area 10 meters in diameter. Everyone in the affected area must make an EVADE roll to avoid it. Those who fail plummet four meters into a newly dug egg chamber; moments later, as many beetle kin as there are player characters come rushing to protect their family’s future.
    adventure_seed: A group of dwarven miners needs the player characters’ help. The dwarves have dug deep in search of iron and silver, but now their mine is haunted. Miners have vanished without a trace deep down in the tunnels, and the survivors want help banishing the ghost they are sure is responsible for the disappearances. It is not a ghost, of course, but a group of beetle kin whose homes are threatened by the dwarves. They are trying to eliminate the threat by picking off the miners one by one, but can be convinced to leave them alone, as long as the dwarves promise not to encroach on the beetle kin’s domain.
    attack_dice: D6
    image: images/bestiary/beetle-kin-64.jpg
