      - roll: "6"
        name: Death Shake!
        text: Death Shake! The beast leaps at an opponent and bites hold of them. It then shakes the victim ferociously before throwing them away. The attack inflicts 2D10 piercing damage and the victim is thrown 2D4 meters, landing prone.
  - id: bestiary-ghost
    name: Ghost
    source: bestiary
    category: Undead
    description: The term “ghost” is here used to refer to spirits that for one reason or another have not found peace in death. Some linger because they refuse to abandon a loved one; some because they seek justice or revenge for what they perceived as a shameful death; some because they possess knowledge or information that must be passed on. Either way, it never ends well. The ghost may have memories of the time before its death, but in spirit form its mind becomes confused and its purpose unclear. This is probably why ghosts are almost always characterized by severe mood swings and fits of anger – the inability to think and act with clarity frustrates them to the point of rage, and sometimes beyond. Indeed, it takes both courage and patience to try to help a ghost, or even to understand how it can be helped. Sometimes the attempt claims the helper’s life.
    quote: |
      “My last words are a promise and a threat: you think you’ll get rid of me by this unjust execution, but I swear by my beating heart that I shall not leave this world until you are all dead. Every last one of you. EVERY LAST ONE!”
      – Istmer the Butcher, condemned
    random_encounter: The player characters arrive at a deep gorge or ravine. At its bottom flows a raging river and the only way across seems to be a rickety rope bridge. In the middle of the bridge stands an elderly gentleman; he warns them that the bridge is dangerous and suggests that they instead head down into the ravine and search for a crossing. The gentleman is the ghost of an adventurer who fell to his death from the bridge, and who is now bound to warn others of the same fate. The man’s body can be found in the water at the bottom of the ravine; if it is buried, the ghost will be at peace.
    adventure_seed: Willerby is haunted! Restless spirits roam the streets with no apparent purpose or destination. They cannot be communicated with and no one knows what caused them to manifest in the world of the living. After various investigations, it becomes clear that an adventurer named Bolta disappeared without a trace on the night the hauntings started – maybe that has something to do with it? Yes, that is it! Beneath the village are a series of ancient catacombs that can now only be accessed through the well in the village square. Player characters who climb down there find a crack that leads into the catacombs. After some searching, they find the burial chamber where Bolta lies dead on the ground, killed by a simple trap. On the floor in front of her is an open book on necromancy, surrounded by a ghostly glow. It is this energy that is summoning the ghosts, and if the book is closed, everything will return to normal. But as soon as anyone goes near it, Bolta’s ghost rises from her lifeless body, ready to do everything in its power to defend its beloved treasure.
