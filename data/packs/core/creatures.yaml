        text: Entangling Roots! With a gesture, the troll calls forth roots from the ground that snare a player character within 10 meters. The victim becomes unable to move or perform actions that require movement. Breaking free requires a successful STR roll (counts as an action). Others can help.
      - roll: "4"
        name: Memory Lapse!
        text: Memory Lapse! The mountain troll draws a strange rune in the air. All enemies within 20 meters and in line of sight must make a WIL roll to look away from the rune – on failure, they forget what they were going to do and lose their turn in the round (if it has not already passed).
      - roll: "5"
        name: Terrifying Visions!
        text: Terrifying Visions! The troll digs into his pocket and takes out a fistful of mushroom powder. With a powerful exhalation, the creature blows the powder at a player character, who must make a WIL roll with a boon to resist fear.
      - roll: "6"
        name: Sweeping Blow!
        text: Sweeping Blow! The mountain troll sweeps its staff in a circle. All enemies within 2 meters suffer 2D6 bludgeoning damage and are knocked down.
  - id: bestiary-forest-giant
    name: Forest Giant
    source: bestiary
    category: Giants
    description: Smaller than others of its kin, forest giants are easily mistaken for trolls as they roam our coniferous forests. They are the easiest giants to communicate with, possibly because of their relatively modest size, but that does not mean they have much patience for conversation. The handful that I have tried to speak with all started darting their eyes around before I had even finished a sentence; a couple of them started staring at Kvalka (who naturally loved the attention and did everything to earn it), while others were distracted by a butterfly, a hopping hare, or a newly blossomed flower. Forest giants seem obsessed with experiencing nature – breathing it, watching it, feeling it – and do not care about much else. Well, except of course for anyone who degrades and destroys their beloved environment. Such people are shown no mercy.
    quote: |
      “Twice I’ve seen forest giants and forest trolls fighting each other, and I’m obviously rooting for the giants. But there’s a problem: how can you tell who is who?!”
      – Maltos Angel, ranger
    random_encounter: Walking through the forest, the player characters come upon a deep pit where a wolf is trapped. It whimpers pitifully, but also growls at anyone who comes close. If the adventurers rescue the wolf, a forest giant emerges from the forest and thanks them, before calling the wolf and disappearing among the trees. If the player characters do anything to hurt the wolf, the forest giant interrupts them, ready to rumble unless they leave immediately.
    adventure_seed: A flock of small birds appear and prompt the player characters to follow them. They lead the adventurers to a cave deep in an age-old forest, where the forest giant Umrum lies injured on a bed of brushwood and leaves. She is looked after by the small animals of the forest, who watch the player characters cautiously as they enter the cave. Umrum explains that she needs their help to stop a wicked demon that has occupied the forest’s ancient wellspring and whose mere presence is poisoning the water – its goal is apparently to kill all living things. The forest giant confronted the demon but was no match for its magical powers and the undead under its command.
    attack_dice: D6
