    casting_time: Action
    range: Touch
    duration: Stretch
    description: "The spell enchants a weapon so that result 1–2 counts as a Dragon roll when attacking and parrying with it. The weapon also counts as magical. Each power level increases the chance of rolling a Dragon by 1. In other words: 1–3 at power Level 2 and 1–4 at power level 3."
  - id: mental-strike
