format: 1
spells:
  - id: birdsong
    name: Birdsong
    source: rulebook
    school: Animism
    trick: true
    description: You are surrounded by lovely birdsong for one stretch of time. The birds give you a boon to AWARENESS. This trick only works outdoors.
  - id: clean
    name: Clean
    source: rulebook
    school: Animism
    trick: true
    description: The room you are in is cleaned. All dust and dirt disappear, and the room is put in order.
  - id: cook-food
    name: Cook Food
    source: rulebook
    school: Animism
    trick: true
    description: You automatically succeed at cooking food without a BUSHCRAFT roll, and it happens instantly (one action).
  - id: floral-trail
    name: Floral Trail
    source: rulebook
    school: Animism
    trick: true
    description: Beautiful flowers sprout where you walk. The flowers wither after a shift.
  - id: hairstyle
    name: Hairstyle
    source: rulebook
    school: Animism
    trick: true
    description: You change the color, length, and style of your hair as you see fit. In some situations this can give you a boon to BLUFFING and PERSUASION rolls.
  - id: animal-whisperer
    name: Animal Whisperer
    source: rulebook
    school: Animism
    trick: false
    rank: "1"
    prerequisite: Animism
    requirement: Word
    casting_time: Stretch
    range: 2 meters
    duration: Instant
    description: This spell lets you talk to a bird or mammal. You can ask a number of questions equal to the power level. Animals can tell you what they have seen, heard, or smelled – but they do not perceive the world as humanoids do, and their answers are hard to interpret. The main advantage is that they never lie.
  - id: banish
    name: Banish
    source: rulebook
    school: Animism
    trick: false
    rank: "1"
    prerequisite: Animism
    requirement: Word, gesture, focus (holy symbol)
    casting_time: Action
    range: 10 meters
    duration: Instant
    description: Demons and undead rising from their graves are a violation of the natural order and must be stopped. This spell inflicts 2D8 damage on such a being. Each additional power level increases the damage by D8. Armor and natural armor have no effect, and the spell cannot be dodged or parried.
  - id: ensnaring-roots
    name: Ensnaring Roots
    source: rulebook
    school: Animism
    trick: false
    rank: "1"
    prerequisite: Animism
    requirement: Gesture, ingredient (branches or roots nearby)
    casting_time: Action
    range: 10 meters
    duration: Shift
    description: The victim is ensnared by roots and branches and is unable to move. Breaking free requires an EVADE roll – with a boon at power level 1, normally at power level 2, and with a bane at power level 3. Each attempt counts as an action in combat. Only one attempt is allowed per round, but others can help. The spell does not work on monsters.
  - id: lightning-flash
    name: Lightning Flash
    source: rulebook
    school: Animism
    trick: false
    rank: "1"
    prerequisite: Animism
    requirement: Gesture
    casting_time: Action
    range: 30 meters
    duration: Instant
    description: You call down a flash of lightning from the sky. If the spell is cast successfully, the target takes 2D6 damage. The lightning flash continues to another random target within 2 meters of the target, inflicting 2D4 damage. Each power level beyond the first increases the number of dice rolled for damage by one (e.g., 3D6 and 3D4 respectively at power level 2). Metal armor has no effect but the spell can be dodged or parried as a ranged attack, and if this is successfully done, no further target is hit. Indoors, the WP cost to cast the spell is doubled.
  - id: treat-wound
    name: Treat Wound
    source: rulebook
    school: Animism
    trick: false
    rank: "1"
    prerequisite: Animism
    requirement: Word
    casting_time: Action
    range: Touch
    duration: Instant
    description: You heal a living creature for 2D6 HP. You can use the spell on yourself. For each power level beyond the first, the spell heals an additional D6 HP.
  - id: engulfing-forest
    name: Engulfing Forest
    source: rulebook
    school: Animism
    trick: false
    rank: "2"
    prerequisite: ENSNARING ROOTS
    requirement: Gesture, ingredient (branches or roots nearby)
    casting_time: Action
    range: 10 meters (sphere)
    duration: Shift
    description: You call upon the spirits of the forest who quickly make thickets of thorns and roots shoot up from the ground in the area of effect. The area counts as rough terrain, and everyone except yourself (not monsters) who is in the area of effect when you cast the spell is ensnared by roots and branches, unable to move. Breaking free requires an EVADE roll – with a boon at power level 1, normally at power level 2, and with a bane at power level 3. Each attempt counts as an action in combat. Only one attempt is allowed per round. Other people who are not ensnared can help.
  - id: heal-wound
    name: Heal Wound
    source: rulebook
    school: Animism
    trick: false
    rank: "2"
    prerequisite: TREAT WOUND
    requirement: Word
    casting_time: Action
    range: Touch
    duration: Instant
    description: You heal a living creature for 2D8 HP and one non-permanent severe injury. You can use the spell on yourself. For each power level beyond the first, the spell heals an additional D8 HP.
  - id: lightning-bolt
    name: Lightning Bolt
    source: rulebook
    school: Animism
    trick: false
    rank: "2"
    prerequisite: LIGHTNING FLASH
    requirement: Gesture
    casting_time: Action
    range: 40 meters
    duration: Instant
    description: You call down a great bolt of lightning on a target, who suffers 2D8 damage. The bolt continues to another random target within 2 meters of the target, inflicting 2D6 damage, and then to a third target within 2 meters, who suffers 2D4 damage. Each power level beyond the first increases the number of dice rolled for damage by one. Metal armor has no effect but the spell can be dodged or parried as a ranged attack, and if this is successfully done, no further target is hit. Indoors, the WP cost to cast the spell is doubled.
  - id: purge
    name: Purge
    source: rulebook
    school: Animism
    trick: false
    rank: "2"
    prerequisite: BANISH
    requirement: Word, gesture, focus (holy symbol)
    casting_time: Action
    range: 10 meters
    duration: Instant
    description: You exorcise a demon or undead, inflicting 2D10 damage on the unnatural creature. Each power level increases the damage by D10. Armor and natural armor have no effect, and the spell cannot be dodged or parried.
  - id: sleep
    name: Sleep
    source: rulebook
    school: Animism
    trick: false
    rank: "2"
    prerequisite: TREAT WOUND
    requirement: Word
    casting_time: Action
    range: Touch
    duration: Instant
    description: The target of the spell must succeed with a WIL roll or fall into a deep sleep for one stretch. NPCs roll against their maximum WP if this is listed, reduced by 2 for each level of the Focused heroic ability. If WP is not listed, NPCs roll against 10. If the roll succeeds, the victim still gets Dazed. The victim rolls with a boon at power level 1, normally at power level 2, and with a bane at power level 3. A sleeping person is very difficult to wake, but wakes up upon taking damage. The spell can only be used on the living and has no effect on monsters.
  - id: restoration
    name: Restoration
    source: rulebook
    school: Animism
    trick: false
    rank: "3"
    prerequisite: HEAL WOUND
    requirement: Word
    casting_time: Action
    range: Touch
    duration: Instant
    description: You heal a living creature for 2D10 HP and any one severe injury. You can use the spell on yourself. For each power level beyond the first, the spell heals an additional D10 HP.
  - id: resurrection
    name: Resurrection
    source: rulebook
    school: Animism
    trick: false
    rank: "3"
    prerequisite: HEAL WOUND
    requirement: Word, gesture, ingredient (corpse)
    casting_time: Shift
    range: Touch
    duration: Permanent
    description: You can channel nature’s forces to resurrect a dead person – not as undead, but truly alive. This costs the mage one point of WIL permamently (and reduces maximum WP by one). The more time that has passed since the target died, the more difficult it is. Within the same shift requires power level 1, within a day requires power level 2, and within a week requires power level 3. If over a week has passed, the body is too decomposed to be RESURRECTED. Only one attempt can be made – if it fails, the victim is permanently dead. A person brought back to life loses D3 skill levels in all CHA-based skills (to a minimum of 3).
  - id: thunderbolt
    name: Thunderbolt
    source: rulebook
    school: Animism
    trick: false
    rank: "3"
    prerequisite: LIGHTNING BOLT
    requirement: Gesture
    casting_time: Action
    range: 50 meters
    duration: Instant
    description: You call down a mighty thunderstroke on a target, who suffers 2D10 damage. The thunderstroke continues to up to three random targets within 2 meters of each other. The damage is 2D8 for the second target, 2D6 for the third, and 2D4 for the fourth. Each power level beyond the first increases the number of dice rolled for damage by one. Metal armor has no effect but the spell can be dodged or parried as a ranged attack, and if this is successfully done, no further target is hit. Indoors, the WP cost to cast the spell is doubled.
  - id: heat-chill
    name: Heat/Chill
    source: rulebook
    school: Elementalism
    trick: true
    description: The area within 10 meters of you becomes pleasantly warm or cold. The effect protects against cold for one shift of time.
  - id: ignite
    name: Ignite
    source: rulebook
    school: Elementalism
    trick: true
    description: You light or extinguish a candle, torch, or lantern within 10 meters.
  - id: puff-of-smoke
    name: Puff of Smoke
    source: rulebook
    school: Elementalism
    trick: true
    description: An impressive puff of smoke erupts in front of you. Very popular for dramatic entrances, and can give you a boon to SNEAKING in certain situations as determined by the GM.
  - id: fireball
    name: Fireball
    source: rulebook
    school: Elementalism
    trick: false
    rank: "1"
    prerequisite: Elementalism
    requirement: Word, gesture
    casting_time: Action
    range: 20 meters
    duration: Instant
    description: The spell sends a fireball from your hand or focus at the target. The fireball can be dodged or parried as a ranged attack. The fireball inflicts 2D6 damage on a hit and sets fire to flammable objects. Each power level beyond the first increases the damage by D6 or creates another fireball that hits another target within range.
  - id: frost
    name: Frost
    source: rulebook
    school: Elementalism
    trick: false
    rank: "1"
    prerequisite: Elementalism
    requirement: Word, gesture
    casting_time: Action
    range: 4 meters (sphere)
    duration: Stretch
    description: You drastically lower the temperature around you. All natural fires in the area of effect are extinguished and all living creatures lose D6 HP and D6 WP when the spell is cast, and become cold as per the rules on page 54 – they cannot heal HP or WP until they get warm. Humanoids (not monsters) in the area of effect when the spell is cast are also frozen in place and can neither move nor perform actions (not even reactions). On each turn, a frozen victim can make a STR roll (not an action) to break free. Each additional power level increases the range by 4 meters. Any water in the area of effect immediately freezes. In a river this creates an ice floe that you can walk on or use as a raft.
  - id: gust-of-wind
    name: Gust of Wind
    source: rulebook
    school: Elementalism
    trick: false
    rank: "1"
    prerequisite: Elementalism
    requirement: Word, gesture
    casting_time: Action
    range: 10 meters (cone)
    duration: Instant
    description: The spell summons a great gust of wind. All untethered objects and creatures up to human size in the area of effect are pushed 2D4 meter away from you and suffer the same amount of bludgeoning damage. Against a swarm the spell deals 2D6 damage. Each additional power level increases the number of dice by one. The spell has no effect on monsters that are Large or Huge.
  - id: pillar
    name: Pillar
    source: rulebook
    school: Elementalism
    trick: false
    rank: "1"
    prerequisite: Elementalism
    requirement: Word, gesture
    casting_time: Action
    range: 10 meters
    duration: Shift
    description: The spell raises a pillar, three meters high and one meter wide, from the ground or a stone floor. If someone is standing in that spot, the victim must make an ACROBATICS roll (not an action) to avoid falling off the pillar. If the pillar is created under a low ceiling and the roll fails, the victim takes 2D6 bludgeoning damage instead. For each additional power level, the height of the pillar increases by three meters, which can mean falling damage to anyone who falls off.
  - id: shatter
    name: Shatter
    source: rulebook
    school: Elementalism
    trick: false
    rank: "1"
    prerequisite: Elementalism
    requirement: Word
    casting_time: Action
    range: Touch
    duration: Instant
    description: By breaking the invisible bond that holds physical matter together, you can shatter physical objects. With this spell you inflict 2D10 damage on an inanimate and non-magical item. Any armor rating has no effect. Each power level beyond the first increases the damage by D10.
  - id: fire-blast
    name: Fire Blast
    source: rulebook
    school: Elementalism
    trick: false
    rank: "2"
    prerequisite: FIREBALL
    requirement: Word, gesture
    casting_time: Action
    range: 30 meters
    duration: Instant
    description: The spell sends a large fire blast from your hand or focus at the target. The fire blast can be dodged or parried as a ranged attack. The fire blast inflicts 2D8 damage on a hit and sets fire to flammable objects. Each power level beyond the first increases the damage by D8 or creates another blast that hits another target within range.
  - id: stone-shield
    name: Stone Shield
    source: rulebook
    school: Elementalism
    trick: false
    rank: "2"
    prerequisite: PILLAR
    requirement: Gesture, ingredient (pebbles)
    casting_time: Reaction
    range: Personal
    duration: Instant
    description: You instantly summon a shield of stone that decreases the damage of an incoming attack by 2D6. Each additional power level decreases the damage by another D6. You can cast the spell after the roll to hit, but before rolling damage. The spell can be combined with armor.
  - id: stonewall
    name: Stonewall
    source: rulebook
    school: Elementalism
    trick: false
    rank: "2"
    prerequisite: PILLAR
    requirement: Word, gesture
    casting_time: Action
    range: 10 meters
    duration: Shift
    description: The spell raises a wall from the ground or a stone floor – one meter thick, two meters high, and three meters wide. Each additional power level creates another section of the same size. If someone is standing in that spot, the victim must make an ACROBATICS roll (not an action) to avoid falling off. If the wall is created under a low ceiling and the roll fails, the victim takes 2D6 bludgeoning damage instead.
  - id: tidal-wave
    name: Tidal Wave
    source: rulebook
    school: Elementalism
    trick: false
    rank: "2"
    prerequisite: FROST
    requirement: Word, gesture, ingredient (water source)
    casting_time: Action
    range: 20 meters (cone)
    duration: Instant
    description: You summon a great wave from a water source within range. The area of effect starts at the source, not at yourself. All untethered objects and creatures in the area of effect are pushed 2D6 meters away from the water source and suffer the same amount of bludgeoning damage. Each additional power level increases the number of dice by one.
  - id: whirlwind
    name: Whirlwind
    source: rulebook
    school: Elementalism
    trick: false
    rank: "2"
    prerequisite: GUST OF WIND
    requirement: Word, gesture
    casting_time: Action
    range: 4 meters (sphere)
    duration: Instant
    description: The spell creates a mighty whirlwind around the mage. All untethered objects and creatures up to human size in the area of effect are hurled 2D4 meters away, suffer the same amount of bludgeoning damage, and land prone. Each additional power level increases the range by 4 meters and inflicts another D4 damage. If you take a bane on the roll, you can let one person in range be hurled to another spot of your choice within the spell’s range. You decide whether that person takes damage and whether they land prone.
  - id: firebird
    name: Firebird
    source: rulebook
    school: Elementalism
    trick: false
    rank: "3"
    prerequisite: FIRE BLAST
    requirement: Word, gesture
    casting_time: Action
    range: 40 meters
    duration: Instant
    description: The spell sends a terrifying bird of fire from your hand or focus at the target. The attack can be dodged or parried as a ranged attack. The firebird inflicts 2D10 damage on a hit and sets fire to flammable objects. Each power level beyond the first increases the damage by D10 or creates another firebird that hits another target in range.
  - id: firestorm
    name: Firestorm
    source: rulebook
    school: Elementalism
    trick: false
    rank: "3"
    prerequisite: FIRE BLAST and WHIRLWIND
    requirement: Word, gesture
    casting_time: Action
    range: 4 meters (sphere)
    duration: Instant
    description: The spell creates a whirling storm of fire around you. All targets in range suffer 2D6 damage. Each additional power level increases the range by 4 meters and inflicts another D6 damage.
  - id: gnome
    name: Gnome
    source: rulebook
    school: Elementalism
    trick: false
    rank: "3"
    prerequisite: STONEWALL
    requirement: Word, gesture, ingredient (stone or soil)
    casting_time: Stretch
    range: 4 meters
    duration: Stretch
    description: |
      The spell summons an earth elemental. The gnome takes the form of a humanoid of gray-brown sand or clay, and counts as a monster in combat. It follows its creator’s commands (free action) and acts independently with its own initiative, but must stay within sight of the mage.
      GNOME
      Movement: 8 HP: 5 per power level
      Armor: 4
      Weapons: Fists of stone. Hits automatically in melee combat (but can be dodged or parried) and inflicts D6 bludgeoning damage per power level.
      Pillar: The gnome can cast PILLAR at the same power level as its own, using the mage’s WP.
  - id: salamander
    name: Salamander
    source: rulebook
    school: Elementalism
    trick: false
    rank: "3"
    prerequisite: FIRE BLAST
    requirement: Word, gesture, ingredient (open fire)
    casting_time: Stretch
    range: 4 meters
    duration: Stretch
    description: |
      The spell summons a fire elemental. The salamander takes the form of a lizard of fire, and counts as a monster in combat. It follows its creator’s commands
      (free action) and can act independently with its own initiative, but must stay within sight of the mage.
      SALAMANDER
      Movement: 12 HP: 5 per power level
      Armor: —
      Weapons: Flaming grip. Hits automatically in melee combat (but can be dodged) and inflicts D6 damage per power level. Armor has no effect.
      Fire Orb: The salamander can cast FIRE BLAST at the same power level as its own, using the mage’s WP.
      Resistance: Piercing damage is halved.
      Immunity: The salamander is immune to fire damage, including magical fire damage.
  - id: sylph
    name: Sylph
    source: rulebook
    school: Elementalism
    trick: false
    rank: "3"
    prerequisite: WHIRLWIND
    requirement: Word, gesture
    casting_time: Stretch
    range: 4 meters
    duration: Stretch
    description: |
      The spell summons a wind elemental. The sylph looks like a storm cloud in the shape of a bird. It counts as a monster in combat, follows its creator’s commands (free action), and can act independently with its own initiative, but must stay within sight of the mage.
      SYLPH
      Movement: 24 HP: 5 per power level
      Armor: —
      Weapons: Howling winds. Hits automatically in melee combat (but can be dodged). The attack hurls the victim D4 meters per power level and inflicts the same amount of bludgeoning damage.
      Gust of Wind: The sylph can cast GUST OF WIND at the same power level as its own, using the mage’s WP.
      Resistance: Piercing damage is halved.
  - id: undine
    name: Undine
    source: rulebook
    school: Elementalism
    trick: false
    rank: "3"
    prerequisite: TIDAL WAVE
    requirement: Word, gesture, ingredient (water)
    casting_time: Stretch
    range: 4 meters
    duration: Stretch
    description: |
      The spell summons a water elemental. The undine looks like a tidal wave whose crest is shaped like a woman composed entirely of water. It counts as a monster in combat, follows its creator’s commands (free action), and can act independently with its own initiative, but must stay within sight of the mage.
      UNDINE
      Movement: 12 HP: 5 per power level
      Armor: —
      Weapons: Wet embrace. Hits automatically in melee combat (but can be dodged) and inflicts D6 damage per power level. Armor has no effect.
      Tidal Wave: The undine can cast TIDAL WAVE at the same power level as its own, using the mage’s WP.
      Resistance: Piercing damage is halved.
  - id: fetch
    name: Fetch
    source: rulebook
    school: General Magic
    trick: true
    description: You make a loose object (no heavier than weight 1) within 10 meters float to you.
  - id: flick
    name: Flick
    source: rulebook
    school: General Magic
    trick: true
    description: You give an object or creature within 10 meters a magical flick. The “attack” inflicts 1 point of damage and can, for example, shatter glass.
  - id: light
    name: Light
    source: rulebook
    school: General Magic
    trick: true
    description: You create a bright light that shines from a focus of your choice. It illuminates a 10-meter radius area around your focus and lasts for one shift of time. The light goes out if you reach zero HP.
  - id: open-close
    name: Open/Close
    source: rulebook
    school: General Magic
    trick: true
    description: You open or close an unlocked door within 10 meters that you can see.
  - id: repair-clothes
    name: Repair Clothes
    source: rulebook
    school: General Magic
    trick: true
    description: Clothes belonging to you or someone else within 10 meters are instantly repaired and cleaned.
  - id: sense-magic
    name: Sense Magic
    source: rulebook
    school: General Magic
    trick: true
    description: You can sense whether the place you are in, or an item you are holding, is affected by magic – and if so, what kind of magic.
  - id: dispel
    name: Dispel
    source: rulebook
    school: General Magic
    trick: false
    rank: "1"
    prerequisite: Any School of Magic
    requirement: Word, gesture
    casting_time: Action
    range: 10 meters
    duration: Instant
    description: You cancel an ongoing spell of lower or equal power level. DISPEL can also be used to end other magical effects, if the adventure or GM allows it.
  - id: protector
    name: Protector
    source: rulebook
    school: General Magic
    trick: false
    rank: "1"
    prerequisite: Any School of Magic
    requirement: Gesture, ingredient (something to draw with)
    casting_time: Action
    range: Touch
    duration: Shift
    description: You protect a person or place (no larger than a human) from magic. You can cast the spell on yourself. The power level of all spells cast at the person or place is reduced by the power level in PROTECTOR. You can also use the spell to protect against magical attacks from monsters. In that case, each power level reduces the number of dice rolled for damage by 1.
  - id: magic-shield
    name: Magic Shield
    source: rulebook
    school: General Magic
    trick: false
    rank: "2"
    prerequisite: PROTECTOR or DISPEL
    requirement: Gesture
    casting_time: Reaction
    range: 10 meters
    duration: Instant
    description: You interfere with a spell cast by another mage. This spell is a reaction and breaks the initiative order of combat, but does not replace your action in the round. You cast it after your opponent’s roll to succeed, but before any roll for damage or other effect. If it succeeds, the power level of your opponent’s spell decreases by the power level of your MAGIC SHIELD. If the result is zero or less, your opponent’s spell has no effect at all. You can also use the spell to stop magical attacks from monsters. In that case, each power level reduces the number of dice rolled for damage by 1.
  - id: transfer
    name: Transfer
    source: rulebook
    school: General Magic
    trick: false
    rank: "3"
    prerequisite: MAGIC SHIELD
    requirement: Gesture
    casting_time: Action
    range: Touch
    duration: Instant
    description: You can steal WP from other humanoid creatures or transfer your WP to someone else. You can take or give a number of WP up to twice cost for casting the spell – i.e. four at power level 1, eight a power level 2, and twelve at level 3. The WP used to cast the spell are lost in the transfer. You can never exceed your maximum WP or go below zero, and the same goes for your subject. If they refuse the transfer, you get a bane to your roll.
  - id: charge
    name: Charge
    source: rulebook
    school: General Magic
    trick: false
    rank: "4"
    prerequisite: TRANSFER
    requirement: Word, gesture
    casting_time: Stretch
    range: Touch
    duration: Shift
    description: You transfer your WP to an inanimate object of your choice, which acts as a battery. Each power level lets you transfer up to 10 WP. Anyone in contact with the object can then use its WP instead of their own. After one shift of time, the charged WP dissipate, unless combined with PERMANENCE. CHARGE can also be combined with MAGIC SEAL (see above).
  - id: magic-seal
    name: Magic Seal
    source: rulebook
    school: General Magic
    trick: false
    rank: "4"
    prerequisite: TRANSFER
    requirement: Word, gesture
    casting_time: Shift
    range: Touch
    duration: Permanent
    description: You bind a spell to an inanimate object of your choice. The power level of MAGIC SEAL determines the power level of the bound spell. Binding a magic trick requires power level 1. When casting MAGIC SEAL you also decide how the bound spell is activated. When that happens, the spell uses WP from the person activating it. If this person cannot or will not spend their WP, the spell is not activated. MAGIC SEAL can be combined with CHARGE to give the object its own WP to use. The two rituals must then be performed consecutively. Activating a bound spell dissolves the MAGIC SEAL, unless the MAGIC SEAL is combined with PERMANENCE (below).
  - id: permanence
    name: Permanence
    source: rulebook
    school: General Magic
    trick: false
    rank: "5"
    prerequisite: MAGIC SEAL
    requirement: Word, gesture
    casting_time: Shift
    range: Touch
    duration: Permanent
    description: This ritual is combined with another spell and makes it permanent. This costs the mage one point of WIL permanently (and reduces maximum WP by one). The power level of PERMANENCE must be equal to that of the spell being made permanent. PERMANENCE cannot be added to spells with instant duration. If PERMANENCE is combined with MAGIC SEAL, the latter becomes permanent and the bound spell can be activated any number of times.
  - id: lock-unlock
    name: Lock/Unlock
    source: rulebook
    school: Mentalism
    trick: true
    description: Your touch locks or unlocks a non-magical lock.
  - id: magic-stool
    name: Magic Stool
    source: rulebook
    school: Mentalism
    trick: true
    description: You create a round surface, roughly half a meter in diameter and height, which you can sit on or put things on. The effect lasts until you leave.
  - id: slow-fall
    name: Slow Fall
    source: rulebook
    school: Mentalism
    trick: true
    description: You slow your fall and land as light as a feather, no matter the height.
  - id: farsight
    name: Farsight
    source: rulebook
    school: Mentalism
    trick: false
    rank: "1"
    prerequisite: Mentalism
    requirement: Word, gesture
    casting_time: Action
    range: 1 kilometer
    duration: Concentration
    description: The spell lets you see and hear what is happening in a place up to one kilometer away, as if you were there in person. You must either have the place in sight or have visited it previously. Each additional power level increases the range tenfold – 10 kilometers at power level 2 and 100 kilometers at power level 3. The spell cannot be used to peer into other dimensions.
