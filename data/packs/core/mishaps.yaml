format: 1
entities:
  - id: mishaps-1
    name: Fog
    kind: mishap
    category: Mishaps
    legacy_key: "#72"
    roll: "1"
    description: The player characters are caught unawares by a thick fog. The distance covered this shift is reduced by half.
  - id: mishaps-2
    name: Blocking Terrain
    kind: mishap
    category: Mishaps
    roll: "2"
    description: The way ahead is blocked by rocks, fallen trees, thick shrubs, or flooding. Each player character must make an ACROBATICS roll to keep moving forward. Anyone who succeeds can help the others. A player character who fails makes no progress this shift.
  - id: mishaps-3
    name: Torn Clothes
    kind: mishap
    category: Mishaps
    roll: "3"
    description: The pathfinder leads the group into a thorny thicket, rocky ravine, or swampy marsh. The clothes of a random player character are damaged and now count as rags.
  - id: mishaps-4
    name: Lost
    kind: mishap
    category: Mishaps
    roll: "4"
    description: The player characters realize that they are walking in circles and do not make any progress on the map this shift. The pathfinder must also make a BUSHCRAFT roll to find the right way again. Others cannot help.
  - id: mishaps-5
    name: Dropped Item
    kind: mishap
    category: Mishaps
    roll: "5"
    description: A random player character drops or breaks an item of your choice.
  - id: mishaps-6
    name: Mosquito Swarm
    kind: mishap
    category: Mishaps
    roll: "6"
    description: A large swarm of mosquitoes or gnats attacks the group, driving everyone crazy with their biting and buzzing. All player characters without a cloak become Angry.
  - id: mishaps-7
    name: Sprained Ankle
    kind: mishap
    category: Mishaps
    roll: "7"
    description: A random player character falls or missteps and suffers D6 damage. Armor has no effect but boots reduce the damage by two.
  - id: mishaps-8
    name: Downpour
    kind: mishap
    category: Mishaps
    roll: "8"
    description: A massive rainfall or blizzard (depending on the season) catches the group unawares. All player characters without a cloak must roll to withstand the cold (page 54). They must also seek shelter until the storm passes and cannot make any progress on the map this shift.
  - id: mishaps-9
    name: Wasps
    kind: mishap
    category: Mishaps
    roll: "9"
    description: The pathfinder steps right into a nest of wasps. A swarm of angry wasps attacks the entire group. All player characters must make an EVADE roll, and those who fail suffer D6 damage and a condition of their choice.
  - id: mishaps-10
    name: Landslide
    kind: mishap
    category: Mishaps
    roll: "10"
    description: The player characters are walking in rough terrain when the ground suddenly gives way under their feet. Everyone must make an EVADE roll – anyone who fails suffers D10 damage.
  - id: mishaps-11
    name: Savage Animal
    kind: mishap
    category: Mishaps
    roll: "11"
    description: A wolf, bear, or other savage animal feels threatened and attacks the adventurers. Choose an animal from the table on page 99.
  - id: mishaps-12
    name: Quicksand
    kind: mishap
    category: Mishaps
    roll: "12"
    description: The ground collapses! Each player character must make a BUSHCRAFT roll. Anyone who fails suffers a condition and must roll again. A character who already has all conditions and fails the roll is swallowed by the quicksand and disappears for good. Whoever is free can help those who are stuck.
